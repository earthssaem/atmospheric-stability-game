<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뭉게의 하늘 여행 — 대기 안정도와 강수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!-- 설명·수치·버튼·그래프용 읽기 쉬운 글꼴 (못 불러오면 기기 기본 글꼴) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ============ 공통 디자인 규칙: 따뜻하고 차분한 이야기책 ============ */
  :root {
    --bg:#FFF8EF; --ink:#59483F; --sub:#78675B; --line:#E6D3BF; --card:rgba(255,252,247,.96); --soft:#FFF3E6;
    --pri:#F3B589; --priInk:#45301F; --mint:#A9D7BC; --mintInk:#22503A;
    --T:#C76D48; --Tt:#A9532F; --Td:#4E73A8; --Env:#4F6370;   /* 기온 · 기온 글자 · 이슬점 · 주변 공기 기온 */
    --r:16px; --rs:12px; --bw:2px; --shadow:0 2px 10px rgba(120,90,60,.12);
    --f-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --f-deco:'Jua','Pretendard Variable',Pretendard,sans-serif;   /* 제목·이름·짧은 감정 표현만 */
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:var(--bg);
    font-family:var(--f-ui); color:var(--ink); font-size:18px;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
  }
  #stage { position:fixed; inset:0; overflow:hidden; }
  #game { display:block; width:100%; height:100%; touch-action:pinch-zoom; }   /* 한 손가락 = 뭉게 끌기, 두 손가락 = 브라우저 확대 */
  .deco { font-family:var(--f-deco); font-weight:normal; letter-spacing:.3px; }
  b { font-weight:700; }

  /* ============ 상단: 장면 이름 · 여행 위치 · 보조 조작 ============ */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:50; }
  .hudCard { background:var(--card); border:var(--bw) solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); }
  a#progress { position:absolute; top:10px; left:12px; padding:6px 14px; display:block; color:inherit; text-decoration:none;
    pointer-events:auto; cursor:pointer; max-width:calc(100% - 210px); }
  a#progress:focus-visible { outline:3px solid var(--pri); outline-offset:2px; }
  @media (hover:hover) { a#progress:hover { border-color:var(--pri); } }
  #chapterName { font-size:16px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #chapterName::before { content:'🏠 '; font-size:13px; }
  #progressDots { display:flex; gap:6px; margin-top:4px; }
  .pdot { width:10px; height:10px; border-radius:50%; background:#EFE2D3; border:1.5px solid #D9C4AE; }
  .pdot.done { background:var(--mint); border-color:#86BE9E; }
  .pdot.cur { background:var(--pri); border-color:#D99364; transform:scale(1.25); }
  #tools { position:absolute; top:10px; right:12px; display:flex; gap:8px; pointer-events:auto; }
  #tools button { width:48px; height:48px; border-radius:var(--r); background:var(--card); border:var(--bw) solid var(--line);
    box-shadow:var(--shadow); font-size:21px; cursor:pointer; }
  #tools button:focus-visible { outline:3px solid var(--pri); }
  /* 관찰값: 고정된 영역 (위치를 자주 바꾸지 않음) */
  #meters { position:absolute; top:68px; right:12px; padding:6px 12px; display:flex; flex-wrap:wrap; gap:4px 14px; justify-content:flex-end; max-width:min(420px,60vw); }
  .meter { text-align:center; min-width:62px; }
  .meter .lab { font-size:13px; color:var(--sub); }
  .meter .val { font-size:22px; font-weight:700; line-height:1.1; color:var(--ink); font-variant-numeric:tabular-nums; }
  .meter .val small { font-size:13px; font-weight:500; }
  #mT .val { color:var(--Tt); } #mTd .val { color:var(--Td); } #mRH .val { color:#3F6E58; }
  #mRH.off { display:none; }
  #airState { width:100%; text-align:right; font-size:13px; color:var(--sub); }
  #airState.sat { color:var(--Td); font-weight:600; }

  /* 토스트: 작게, 장면을 가리지 않게 */
  #toast { position:absolute; top:76px; left:50%; transform:translate(-50%,0); z-index:60; max-width:min(560px,80%);
    background:var(--card); border:var(--bw) solid var(--line); color:var(--ink); padding:8px 18px; border-radius:var(--r);
    font-size:16px; opacity:0; pointer-events:none; transition:opacity .25s; text-align:center; box-shadow:var(--shadow); }
  #toast.show { opacity:1; }
  #toast.good { border-color:var(--mint); }

  /* ============ 하단: 대사 ============ */
  #dialogWrap { position:absolute; inset:0; z-index:70; display:none; }
  #dialogWrap.on { display:block; }
  #dialogBox { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); width:min(900px, calc(100% - 24px)); min-height:96px;
    background:var(--card); border:var(--bw) solid var(--line); border-radius:var(--r); box-shadow:var(--shadow);
    display:flex; align-items:center; gap:12px; padding:18px 18px 14px 12px; }
  #dFace { width:64px; height:64px; flex:none; }
  #dFace svg { width:100%; height:100%; }
  #dName { position:absolute; top:-14px; left:20px; background:var(--soft); border:var(--bw) solid var(--line); border-radius:var(--rs);
    padding:1px 12px; font-size:16px; color:var(--ink); font-family:var(--f-deco); }
  #dText { font-size:clamp(18px, 2.3vh, 23px); line-height:1.6; color:var(--ink); }
  #dText b { color:#8C4A2C; }
  #dText .kw { color:var(--Td); font-weight:700; }
  #dBody { flex:1; }
  #dNext { position:absolute; right:16px; bottom:6px; font-size:13px; color:var(--sub); }
  #dPrev, #dMore { position:absolute; top:-14px; font-family:var(--f-ui); font-size:13px; border-radius:var(--rs); cursor:pointer;
    padding:2px 10px; border:var(--bw) solid var(--line); background:var(--soft); color:var(--sub); }
  #dPrev { right:150px; } #dMore { right:16px; display:none; }
  #dPrev:disabled { opacity:.4; cursor:default; }
  #dMoreText { display:none; margin-top:6px; padding:6px 10px; border-radius:var(--rs); background:#F2F6FB; color:#3D5A86; font-size:16px; line-height:1.55; }
  #dMoreText.on { display:block; }
  #dialogBox.station #dName { background:#EAF1FA; color:#3D5A86; }

  /* ============ 패널 (예측·관찰·기록·처음 화면) ============ */
  #overlay { position:absolute; inset:0; z-index:80; display:none; align-items:center; justify-content:center; padding:10px; }
  #overlay.on { display:flex; }
  .panel { background:var(--card); border:var(--bw) solid var(--line); border-radius:20px; box-shadow:0 6px 24px rgba(120,90,60,.16);
    padding:22px 26px; text-align:center; max-width:min(860px, 100%); max-height:100%; overflow:auto; touch-action:pan-y pinch-zoom;
    -webkit-user-select:text; user-select:text; }
  .panel h1 { font-family:var(--f-deco); font-weight:normal; font-size:clamp(30px,6vh,44px); color:#B0582F; }
  .panel h2 { font-family:var(--f-deco); font-weight:normal; font-size:clamp(22px,4vh,30px); color:#9A5634; margin-bottom:8px; }
  .panel h3 { font-size:17px; color:var(--ink); }
  .panel p { font-size:clamp(16px,2.3vh,20px); color:var(--sub); line-height:1.6; }
  .panel.top { align-self:flex-start; margin-top:72px; }
  .panel.wide { max-width:min(1040px,100%); }
  .btn { font-family:var(--f-ui); font-weight:700; font-size:clamp(17px,2.4vh,21px); color:var(--priInk); cursor:pointer;
    background:var(--pri); border:var(--bw) solid #DE9A6C; border-radius:var(--rs); padding:11px 24px; margin:8px 5px 0;
    min-height:48px; box-shadow:0 2px 0 rgba(160,100,60,.25); }
  .btn:focus-visible { outline:3px solid #8C4A2C; outline-offset:2px; }
  .btn:active { transform:translateY(2px); box-shadow:none; }
  .btn.sub { background:#FFFDF9; border-color:var(--line); color:var(--ink); font-weight:600; box-shadow:none; }
  .btn.mint { background:var(--mint); border-color:#86BE9E; color:var(--mintInk); }
  .btn:disabled { opacity:.45; cursor:default; }
  .titleSub { font-size:clamp(15px,2.4vh,19px); color:var(--sub); margin:2px 0 8px; }
  .panel footer { margin-top:12px; font-size:13px; color:var(--sub); text-align:center; }
  footer .hub{color:inherit;font-weight:500;white-space:nowrap;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px}
  footer .hub:hover{color:var(--ink);text-decoration-color:currentColor}
  .q { font-size:clamp(18px,2.8vh,26px) !important; color:var(--ink) !important; margin:6px 0 4px; line-height:1.5; }
  .tag { display:inline-block; font-size:14px; color:var(--sub); background:var(--soft); border-radius:var(--rs); padding:2px 12px; margin-bottom:4px; }
  .opts { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .opts .btn { min-width:160px; margin:0; position:relative; }
  .opts .btn .k { position:absolute; left:8px; top:3px; font-size:12px; opacity:.55; }
  .fb { margin:12px auto 0; max-width:720px; padding:10px 16px; border-radius:var(--rs); text-align:left; font-size:clamp(16px,2.3vh,20px); line-height:1.6; }
  .fb.ok { background:#EAF6EF; color:#22503A; }
  .fb.no, .fb.info { background:#F2F6FB; color:#3D5A86; }
  .row2 { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .obsT { border-collapse:separate; border-spacing:0; margin:8px auto; font-size:clamp(16px,2.4vh,22px);
    border:1.5px solid var(--line); border-radius:var(--rs); overflow:hidden; background:#FFFDF9; }
  .obsT th, .obsT td { padding:5px 14px; border-bottom:1px solid #F0E3D4; }
  .obsT th { background:var(--soft); color:var(--sub); font-weight:600; }
  .obsT td { color:var(--ink); font-variant-numeric:tabular-nums; text-align:center; }
  .obsT td.T { color:var(--Tt); font-weight:700; } .obsT td.Td { color:var(--Td); font-weight:700; } .obsT td.E { color:var(--Env); font-weight:700; }
  .obsT td.hi { background:#FFF4DA; }
  .bg { width:min(720px,56vw,90vh); height:auto; display:block; }
  .bgWrap { display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .bgSide { width:min(300px,24vw); }
  .pickInfo { min-height:24px; margin-top:6px; font-size:16px; color:var(--ink); }
  .recList { text-align:left; max-height:40vh; overflow:auto; margin:8px auto; max-width:760px; padding:0; }
  .recList li { list-style:none; padding:6px 10px; border-bottom:1px solid #F0E3D4; font-size:16px; color:var(--ink); line-height:1.5; }
  .recList li button { font-family:var(--f-ui); font-size:14px; border-radius:10px; border:1.5px solid var(--line); background:#FFFDF9; color:var(--sub); padding:2px 8px; margin-left:6px; cursor:pointer; }
  .sumTag { font-size:12px; color:var(--sub); border:1px solid var(--line); border-radius:8px; padding:0 6px; margin-left:4px; }
  .recNew { display:inline-block; margin:4px; padding:4px 12px; border-radius:var(--rs); background:var(--soft); color:var(--ink); font-size:15px; }
  .chList { display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; margin-top:8px; }
  .chList h3 { color:#9A5634; margin:4px 0; }
  .chList button { display:block; width:100%; text-align:left; font-family:var(--f-ui); font-size:16px; margin:4px 0; min-height:44px;
    padding:6px 12px; border-radius:var(--rs); border:1.5px solid var(--line); background:#FFFDF9; color:var(--ink); cursor:pointer; }
  .chList button small { color:var(--sub); }
  .startBtns { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:520px; margin:10px auto 0; }
  .startBtns .btn { margin:0; }
  .saveNote { font-size:14px !important; margin-top:10px; }
  .resT { width:100%; border-collapse:collapse; font-size:15px; text-align:left; margin-top:6px; }
  .resT th, .resT td { border-bottom:1px solid #F0E3D4; padding:6px 8px; vertical-align:top; color:var(--ink); }
  .resT th { color:var(--sub); font-weight:600; background:var(--soft); }
  .resT .revised { color:#22503A; }
  .resT button { font-family:var(--f-ui); font-size:13px; border-radius:10px; border:1.5px solid var(--line); background:#FFFDF9; cursor:pointer; padding:2px 6px; }
  .stepper { display:inline-flex; align-items:center; gap:4px; margin:0 4px; }
  .stepper button { font-family:var(--f-ui); width:40px; height:40px; border-radius:10px; border:1.5px solid var(--line); background:#FFFDF9; cursor:pointer; font-size:18px; color:var(--ink); }
  .stepper .val { min-width:46px; text-align:center; font-size:20px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
  .lock { display:inline-block; font-size:14px; color:var(--sub); background:#F3EEE8; border-radius:10px; padding:2px 8px; margin:2px; }
  .lock::before { content:'🔒 '; }
  .cmpTbl { border-collapse:collapse; margin:6px auto; font-size:clamp(14px,2.2vh,19px); }
  .cmpTbl th, .cmpTbl td { border:1px solid var(--line); padding:5px 10px; text-align:center; color:var(--ink); font-variant-numeric:tabular-nums; }
  .cmpTbl th { background:var(--soft); color:var(--sub); font-weight:600; }
  .termRow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .termCard { background:#F2F6FB; border-radius:var(--rs); padding:6px 12px; text-align:left; font-size:15px; color:#3D5A86; max-width:320px; line-height:1.5; }
  .termCard b { color:#2E4A72; }
  .setRow { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 4px; border-bottom:1px solid #F0E3D4; text-align:left; font-size:17px; }
  .setRow .seg { display:flex; gap:4px; }
  .setRow .seg button { font-family:var(--f-ui); font-size:15px; min-height:40px; padding:4px 12px; border-radius:10px; border:1.5px solid var(--line); background:#FFFDF9; color:var(--ink); cursor:pointer; }
  .setRow .seg button.on { background:var(--mint); border-color:#86BE9E; color:var(--mintInk); font-weight:700; }

  /* ============ 하단: 장면 안의 짧은 안내 · 주요 조작 (한 가지 행동이 먼저 읽히게) ============ */
  #actBar { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:57; display:none; width:max-content;
    background:var(--card); border:var(--bw) solid var(--line); border-radius:var(--r); padding:10px 16px; box-shadow:var(--shadow);
    max-width:min(640px, calc(100% - 24px)); text-align:center; pointer-events:auto; }
  #actBar.on { display:block; }
  #actBar .msg { font-size:clamp(17px,2.3vh,21px); color:var(--ink); line-height:1.5; }
  #actBar .btn { margin:8px 4px 0; padding:9px 20px; }
  #actBar .obsT { font-size:clamp(15px,2.1vh,19px); margin:4px auto; }
  #actBar .obsT th, #actBar .obsT td { padding:3px 12px; }
  #actBar .fb { font-size:clamp(15px,2.1vh,18px); margin-top:6px; padding:6px 12px; }
  #actBar p { font-size:clamp(15px,2.1vh,18px); color:var(--sub); margin:2px 0; }
  .hold { touch-action:none; }

  /* 실험 패널 */
  #simPanel, #labPanel { position:absolute; left:12px; bottom:12px; z-index:55; pointer-events:auto; display:none;
    background:var(--card); border:var(--bw) solid var(--line); border-radius:var(--r); padding:10px 16px; width:min(540px, calc(100% - 24px));
    box-shadow:var(--shadow); max-height:calc(100% - 140px); overflow:auto; }
  #simPanel.on, #labPanel.on { display:block; }
  #simPanel .row, #labPanel .row { display:flex; align-items:center; gap:8px; margin:6px 0; flex-wrap:wrap; font-size:16px; }
  #simPanel label, #labPanel label { font-size:15px; color:var(--sub); min-width:78px; }
  #simPanel input[type=range], #labPanel input[type=range] { flex:1; min-width:120px; accent-color:#D98F5C; height:32px; }
  #simPanel .row b, #labPanel .row b { color:var(--ink); }

  /* ============ 발자국 그래프 (펼쳐 보기) ============ */
  #miniGraph { position:absolute; right:12px; bottom:12px; z-index:48; pointer-events:none; width:min(270px, 30vw); padding:8px 8px 6px;
    background:var(--card); border:var(--bw) solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); display:none; }
  #miniGraph.on { display:block; }
  #mgTitle { font-size:13px; font-weight:600; color:var(--sub); text-align:center; margin-bottom:2px; }
  #mgFold { position:absolute; top:-6px; right:-6px; width:40px; height:40px; border-radius:var(--rs); background:var(--card);
    border:var(--bw) solid var(--line); color:var(--sub); font-size:16px; pointer-events:auto; cursor:pointer; }
  #miniGraph.folded { width:auto; padding:8px 44px 8px 12px; }
  #miniGraph.folded #mgSvg { display:none; }
  #miniGraph.folded #mgTitle { margin:0; }
  #mgSvg { width:100%; height:auto; display:block; font-family:var(--f-ui); }
  .mgAxis { stroke:#CDB9A3; stroke-width:1.6; }
  .mgGrid { stroke:#F0E3D4; stroke-width:1; }
  .mgLab { font-size:10px; fill:var(--sub); }
  #mgUpT { stroke:var(--T); stroke-width:3; fill:none; stroke-linecap:round; }
  #mgDnT { stroke:var(--T); stroke-width:3; fill:none; stroke-dasharray:9 5; }                    /* 내려올 때: 긴 점선 */
  #mgUpTd, #mgDnTd { stroke:var(--Td); stroke-width:2.6; fill:none; stroke-dasharray:1 5; stroke-linecap:round; } /* 이슬점: 점 */
  .mgSum { stroke:#C7BBAE; stroke-width:2; fill:none; stroke-dasharray:2 4; stroke-linecap:round; }
  #mgCur { stroke:#B9A898; stroke-width:1; stroke-dasharray:3 3; }
  #mgDotT { fill:var(--T); stroke:#FFF; stroke-width:1.5; }
  #mgDotTd { fill:var(--Td); stroke:#FFF; stroke-width:1.5; }
  #mgSpark { font-size:13px; }

  /* 여정 지도 (관찰 기록에서) */
  #mapSvg { width:min(780px, 100%); height:auto; display:block; margin:4px auto; font-family:var(--f-ui); }
  .mapLabel { font-size:13px; fill:var(--ink); }
  .mapLabelBig { font-size:15px; fill:#9A5634; }
  .mapRow { display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .mapRow #mapSvg { width:min(430px, 100%); }
  .jgSvg { width:min(320px, 100%); height:auto; display:block; font-family:var(--f-ui); }
  .trailCap { display:inline-block; margin-top:8px; padding:6px 16px; border-radius:var(--rs); background:var(--soft); color:var(--ink) !important; font-size:17px !important; }

  /* 세로 화면: 막지 않고 작게 안내 */
  #rotateHint { position:absolute; left:50%; transform:translateX(-50%); top:118px; z-index:85; display:none; pointer-events:auto;
    background:var(--card); border:var(--bw) solid var(--line); border-radius:var(--rs); padding:4px 10px; font-size:13px; color:var(--sub); }
  #rotateHint button { border:none; background:none; font-size:14px; color:var(--sub); margin-left:6px; cursor:pointer; }


  /* ============ v2.1 추가: 관찰값 · 그래프 머리 · 관찰 기록 창 · 비교 ============ */
  #mEnv .val { color:var(--Env); } .meter.off { display:none; }
  #mgHead { display:flex; align-items:center; gap:6px; margin-bottom:2px; pointer-events:auto; }
  #mgHead #mgTitle { flex:1; margin:0; text-align:left; }
  #mgHead button { font-family:var(--f-ui); font-size:13px; min-height:34px; padding:2px 10px; border-radius:10px; border:1.5px solid var(--line); background:#FFFDF9; color:var(--ink); cursor:pointer; }
  #miniGraph { top:150px; bottom:auto; pointer-events:auto; }
  #miniGraph.folded { width:auto; padding:6px 8px; }
  #miniGraph.folded #mgLegend, #miniGraph.folded #mgSvg { display:none; }
  #mgFold { position:static; width:auto; height:auto; }
  #mgLcl text { font-size:10px; }
  #mgDotTd { fill:none; stroke:var(--Td); stroke-width:2.5; }
  #mgDotT { fill:var(--T); stroke:#FFF; stroke-width:1.5; }

<script>
'use strict';
/* ============================================================
   「뭉게의 하늘 여행」 — 대기 안정도와 강수 스토리 어드벤처
   ------------------------------------------------------------
   ★ 교사용 난이도 조정: 아래 TUNING 객체의 숫자만 바꾸면 됩니다.
   ★ 과학 수치(감률·응결 고도 공식)는 PHYSICS 블록에 있으며
     교과서 값이므로 변경하지 마세요.
   ============================================================ */
const TUNING = {
  grabRadius: 120,           // 뭉게를 잡을 수 있는 반경(px) — 넉넉하게
  mungge: {
    baseR: 46,               // 지표(0 km)에서의 몸 반지름 기준(px) — 화면 크기에 따라 0.6~1.2배
    exaggerate: 8,           // 모식 표현: 실제 부피 변화(2 km에서 약 1.2배)를 이 배수만큼 과장. 반지름 = (보이는 부피)의 세제곱근
  },
  move: {
    riseKmPerSec: 0.32,      // [조금 더 올라가기]를 누르고 있을 때 오르내리는 빠르기(km/s, 게임 속 단위)
    tapStepKm: 0.15,         // 버튼을 톡 누르거나 Enter·Space를 누르면 저절로 이만큼 이동
    dragKmPerSec: 0.6,       // 뭉게를 끌 때 따라오는 최대 빠르기 (급하게 끌어도 부드럽게)
  },
  p2: {                      // 2부: 놓아준 뒤의 운동 (화면 연출용 계수 — 판정은 같은 높이의 두 기온 비교로)
    buoyAccel: 0.9,          // 부력 가속 계수 (km/s² per ℃)
    damping: 0.9,            // 속도 감쇠
    watchSec: 4.2,           // 놓은 뒤 관찰 시간(초)
  },
};

/* ============================================================
   PHYSICS — 순수 계산 함수 (교과서 값. tests/physics.test.mjs 가 검증)
   ============================================================ */
// ==PHYSICS-START==
const RATE = {
  DRY: 10,   // 건조 단열 감률 ℃/km (불포화 공기 상승 -10, 하강 +10)
  DEW: 2,    // 불포화 공기 이슬점 감률 ℃/km
  WET: 5,    // 습윤 단열 감률 ℃/km (포화 공기: 기온·이슬점 모두)
};
const SCENARIO = {
  T0: 20,    // 출발(영동 해안) 기온 ℃
  Td0: 12,   // 출발 이슬점 ℃
  TOP: 2.0,  // 태백산맥 높이 km
};
// 상승 응결 고도 H(km) = ⅛(T - Td)
function lclHeight(T, Td) { return (T - Td) / 8; }
// 지표 (T0, Td0)의 공기가 h(km)까지 '상승'했을 때의 상태
function riseState(T0, Td0, h) {
  const H = lclHeight(T0, Td0);
  if (h < H) {
    return { T: T0 - RATE.DRY * h, Td: Td0 - RATE.DEW * h, saturated: false, H };
  }
  const Tc = T0 - RATE.DRY * H;            // 응결 고도의 기온(=이슬점)
  const v = Tc - RATE.WET * (h - H);       // 그 위로는 습윤 단열
  return { T: v, Td: v, saturated: true, H };
}
// 산꼭대기(hTop, 기온 Ttop, 이슬점 TdTop)에서 h(km)까지 '하강'(불포화)한 상태
function descendFrom(Ttop, TdTop, hTop, h) {
  const dh = hTop - h;
  return { T: Ttop + RATE.DRY * dh, Td: TdTop + RATE.DEW * dh, saturated: false };
}
// 환경 기온 감률 γ(℃/km)에 따른 대기 안정도
function stability(gamma) {
  if (gamma < RATE.WET) return 'stable';        // γ < 5 절대 안정
  if (gamma > RATE.DRY) return 'unstable';      // γ > 10 절대 불안정
  return 'conditional';                          // 5~10 조건부 불안정
}
// 지표 기온 T0, 감률 γ일 때 고도 h의 환경(주위) 기온
function envTemp(T0, gamma, h) { return T0 - gamma * h; }
// 상대 습도(%) = 현재 수증기압 / 포화 수증기압 × 100  (교과서 정의)
// 현재 수증기압 = 이슬점에서의 포화 수증기압. 포화 수증기압은 마그누스 근사식(℃ → hPa)
function satVapor(t) { return 6.112 * Math.exp(17.67 * t / (t + 243.5)); }
function relHumidity(T, Td) { return Math.min(100, 100 * satVapor(Td) / satVapor(T)); }
// 푄 한 번 왕복: 지표 (T0, Td0) 공기가 높이 M(km) 산을 넘을 때.
// 응결 고도 H < M 이면 H~M 구간에서 구름·비(습윤 단열) → 반대편 지표에 더 뜨겁고 건조하게 도착.
// H ≥ M 이면 구름이 안 생겨 오르내림이 대칭 → 도착 = 출발 (푄 없음).
function foehnTrip(T0, Td0, M) {
  const H = lclHeight(T0, Td0);
  const top = riseState(T0, Td0, M);
  const arr = descendFrom(top.T, top.Td, M, 0);
  return { H, M, cloud: H < M, topT: top.T, topTd: top.Td, arrT: arr.T, arrTd: arr.Td, dT: arr.T - T0 };
}
// 자유 대류 고도(km): 이 높이 위로 올려 주면 뭉게가 주위보다 따뜻해져 스스로 상승.
// γ > 10 → 0(지표부터), γ ≤ 5 → null(어디서도 불가), 5 < γ ≤ 10 → 응결 고도 위에서 5H/(γ−5)
function lfcHeight(T0, Td0, gamma) {
  if (gamma > RATE.DRY) return 0;
  if (gamma <= RATE.WET) return null;
  const H = lclHeight(T0, Td0);
  return Math.max(H, (RATE.WET * H) / (gamma - RATE.WET));
}
// 상승 발자국 이론 경로: 도달 최고 고도 maxAlt까지의 (온도, 높이) 꼭짓점 목록.
// 기온선은 응결 고도에서 -10 → -5 로 꺾이고, 이슬점선은 그 위에서 기온선과 합체한다.
function trailUpPoints(T0, Td0, maxAlt) {
  const H = lclHeight(T0, Td0);
  const m = Math.max(0, maxAlt);
  const T = [[T0, 0]], Td = [[Td0, 0]];
  if (m <= H) {
    if (m > 0) { T.push([T0 - RATE.DRY * m, m]); Td.push([Td0 - RATE.DEW * m, m]); }
  } else {
    const Tc = T0 - RATE.DRY * H;
    const top = Tc - RATE.WET * (m - H);
    T.push([Tc, H], [top, m]);
    Td.push([Tc, H], [top, m]); // 응결 후 이슬점 = 기온 (합체)
  }
  return { T, Td };
}
// 하강 발자국 이론 경로: 정상(hTop)에서 내려온 최저 고도 minAlt까지
function trailDownPoints(Ttop, TdTop, hTop, minAlt) {
  const m = Math.min(hTop, Math.max(0, minAlt));
  return {
    T: [[Ttop, hTop], [Ttop + RATE.DRY * (hTop - m), m]],
    Td: [[TdTop, hTop], [TdTop + RATE.DEW * (hTop - m), m]],
  };
}
// 기압(hPa): 단순 지수 모형 p = p0 · e^(−h / 8.4)   (h: km, 규모 높이 약 8.4 km)
const P0 = 1013;
function pressureAt(h) { return P0 * Math.exp(-h / 8.4); }
// 같은 공기 덩어리의 부피 비(출발 대비) V/V0 = (T/T0) · (p0/p)  — 절대 온도. 크기 '모식 표현'의 근거
function volumeRatio(T0, T, h) { return ((T + 273.15) / (T0 + 273.15)) * (P0 / pressureAt(h)); }
// 처음 품은 수증기 중 물방울이 된 비율(0~1). 포화 전에는 0, 포화 뒤에는 포화 혼합비(∝ e(T)/p)가 줄어든 만큼
function condensedFrac(T0, Td0, h) {
  const H = lclHeight(T0, Td0);
  if (h <= H) return 0;
  const w0 = satVapor(riseState(T0, Td0, H).T) / pressureAt(H);
  const w = satVapor(riseState(T0, Td0, h).T) / pressureAt(h);
  return Math.max(0, 1 - w / w0);
}
// ==PHYSICS-END==

/* ============================================================
   유틸
   ============================================================ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
const fmt2 = v => (Math.round(v * 100) / 100).toFixed(2);
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);

// 시나리오에서 계산되는 정상·도착 상태 (숫자를 코드 곳곳에 박지 않도록 한 곳에서 계산)
const SUMMIT = riseState(SCENARIO.T0, SCENARIO.Td0, SCENARIO.TOP);            // 정상 2.0 km: 5℃ / 5℃
const ARRIVAL = descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, 0);            // 영서 지표: 25℃ / 9℃

// 주소 옵션: ?ch=N → 처음 화면에 'N장부터 시작' 버튼 (교사용 차시 분할), ?part=2 → 2부부터, ?debug=1 → 장면 상태 표시
const PARAMS = new URLSearchParams(location.search);
const DEBUG = PARAMS.has('debug');

// 손그림 느낌 blob 경로 (seed 기반 일그러짐 + 느린 숨쉬기)
function blobPath(ctx, cx, cy, r, seed, t, amp = 0.10, pts = 9) {
  ctx.beginPath();
  const nodes = [];
  for (let i = 0; i < pts; i++) {
    const a = (i / pts) * TAU;
    const w = 1 + amp * Math.sin(seed * 3.1 + i * 2.7) + 0.035 * Math.sin(t * 1.4 + i * 1.9 + seed);
    nodes.push({ x: cx + Math.cos(a) * r * w, y: cy + Math.sin(a) * r * w });
  }
  const mid = (a, b) => [(a.x + b.x) / 2, (a.y + b.y) / 2];
  ctx.moveTo(...mid(nodes[0], nodes[1]));
  for (let i = 1; i <= pts; i++) {
    const p = nodes[i % pts], nx = nodes[(i + 1) % pts];
    ctx.quadraticCurveTo(p.x, p.y, ...mid(p, nx));
  }
  ctx.closePath();
}
// 구형 태블릿 브라우저 대비 roundRect 폴리필
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y); this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r); this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h); this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r); this.arcTo(x, y, x + r, y, r);
    return this;
  };
}

/* ============================================================
   사운드 — Web Audio API 로 전부 생성 (음원 파일 없음)
   ============================================================ */
const AudioSys = {
  ctx: null, master: null, muted: false,
  bgmName: null, bgmTimer: null, nextBeat: 0, beatIdx: 0, beatSec: 0.6,
  bgmStartTime: 0,

  ensure() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.85;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended' && !this.holds) this.ctx.resume();
  },
  // 소리가 없을 때(AudioContext 미생성)도 일시 정지할 수 있는 시계
  now() { return this.ctx ? this.ctx.currentTime : (performance.now() - this.frozenMs - (this.holds ? performance.now() - this.freezeAt : 0)) / 1000; },
  // 일시 정지(확인 창·관찰 기록 창·다른 탭): 오디오 시계와 배경음을 함께 멈춤
  holds: 0, freezeAt: 0, frozenMs: 0,
  freeze() {
    if (this.holds++ > 0) return;
    this.freezeAt = performance.now();
    if (this.ctx && this.ctx.state === 'running') this.ctx.suspend();
  },
  unfreeze() {
    if (this.holds === 0 || --this.holds > 0) return;
    this.frozenMs += performance.now() - this.freezeAt;
    if (this.ctx) this.ctx.resume();
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.now(), 0.05);
  },
  tone(f, t0, dur, { type = 'sine', g = 0.15, f2 = null, attack = 0.01 } = {}) {
    if (!this.ctx) return null;
    const o = this.ctx.createOscillator(), gn = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(g, t0 + attack);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
    return gn;
  },
  noiseBuf: null,
  noise(t0, dur, g = 0.1, hp = 3000) {
    if (!this.ctx) return null;
    if (!this.noiseBuf) {
      const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.5, this.ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    }
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const gn = this.ctx.createGain();
    gn.gain.setValueAtTime(g, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(gn); gn.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.05);
    return gn;
  },

  /* --- 효과음 --- */
  sTick() { this.tone(1250, this.now(), 0.03, { type: 'square', g: 0.022 }); },
  sSparkle() { const t = this.now(); this.tone(880, t, 0.12, { g: 0.1 }); this.tone(1320, t + 0.07, 0.18, { g: 0.09 }); this.tone(1760, t + 0.14, 0.25, { g: 0.07 }); },
  sPop() { this.tone(520, this.now(), 0.1, { type: 'triangle', g: 0.12, f2: 780 }); },
  sCondense() { const t = this.now(); [523, 659, 784, 1047].forEach((f, i) => this.tone(f, t + i * 0.09, 0.35, { g: 0.1 })); this.noise(t, 0.5, 0.03, 6000); },
  sClear() { const t = this.now(); [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, t + i * 0.11, 0.4, { type: 'triangle', g: 0.12 })); },
  sBadge() { const t = this.now(); this.tone(660, t, 0.12, { g: 0.1 }); this.tone(990, t + 0.1, 0.2, { g: 0.1 }); },
  sThud() { const t = this.now(); this.tone(90, t, 0.3, { type: 'sine', g: 0.2, f2: 50 }); this.noise(t, 0.15, 0.08, 800); },
  sWhoosh() { this.noise(this.now(), 0.4, 0.05, 1500); },

  /* --- BGM: 챕터별 앰비언트 루프 --- */
  PATTERNS: {
    sea:  { bpm: 56,  fn(b, t, A) { // 느린 파도 패드
      if (b % 4 === 0) { const root = (b % 8 === 0) ? 261.6 : 220;
        [1, 1.5, 2].forEach(m => A.tone(root * m, t, 3.4, { g: 0.045, attack: 0.9 })); }
      if (b % 8 === 4) A.noise(t, 2.2, 0.012, 900);
    }},
    rise: { bpm: 92,  fn(b, t, A) { // 가벼운 아르페지오
      const seq = [523, 659, 784, 880, 784, 659]; A.tone(seq[b % 6], t, 0.5, { type: 'triangle', g: 0.05 });
      if (b % 4 === 0) A.tone(131, t, 1.8, { g: 0.05, attack: 0.4 });
    }},
    mtn:  { bpm: 84,  fn(b, t, A) { // 산: 조금 장엄한 저음 + 종소리
      if (b % 4 === 0) { const root = (b % 8 === 0) ? 174.6 : 196;
        A.tone(root, t, 2.6, { g: 0.055, attack: 0.5 }); A.tone(root * 1.5, t, 2.6, { g: 0.035, attack: 0.5 }); }
      if (b % 2 === 1) A.tone(1047, t, 0.4, { g: 0.028 });
    }},
    warm: { bpm: 60,  fn(b, t, A) { // 따뜻한 화음
      if (b % 4 === 0) { const ch = (b % 8 === 0) ? [261.6, 329.6, 392, 493.9] : [349.2, 440, 523.3, 659.3];
        ch.forEach(f => A.tone(f, t, 3.6, { g: 0.038, attack: 0.8 })); }
    }},
  },
  startBgm(name, anchor) {
    this.stopBgm();
    if (!this.ctx) return 0;
    const p = this.PATTERNS[name]; if (!p) return 0;
    this.bgmName = name;
    this.beatSec = 60 / p.bpm;
    this.beatIdx = 0;
    this.bgmStartTime = anchor ? Math.max(anchor, this.now() + 0.05) : this.now() + 0.15;
    this.nextBeat = this.bgmStartTime;
    this.bgmTimer = setInterval(() => {
      const ahead = this.now() + 0.3;
      while (this.nextBeat < ahead) {
        p.fn.call(p, this.beatIdx, this.nextBeat, this);
        this.beatIdx++; this.nextBeat += this.beatSec;
      }
    }, 60);
    return this.bgmStartTime;
  },
  stopBgm() {
    if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; }
    this.bgmName = null;
  },
};
</script>
<script>
'use strict';
/* ============================================================
   전역 상태 · 이 기기에 저장 (진행 장면·관찰 기록·예상·설정만 — 개인정보 없음, 서버 전송 없음)

const SAVE_KEY = 'mungge-sky-journey';

  rec: newRecord(),

function newRecord() {

}
// 지연 실행: 그 사이 장이 바뀌었으면 실행하지 않음
function later(fn, ms) {
  const id = S.runId;
  return setTimeout(() => { if (S.runId === id) fn(); }, ms);
}
// 이 기기의 브라우저 저장 공간(localStorage). 쓸 수 없는 환경이면 저장 없이 그대로 진행
const Store = {
  ok: false,
  init() {
    try { const k = SAVE_KEY + '-check'; localStorage.setItem(k, '1'); localStorage.removeItem(k); this.ok = true; } catch (e) { this.ok = false; }
  },
  load() {
    if (!this.ok) return null;
    try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return d && d.v === 1 ? d : null; } catch (e) { return null; }
  },
  save() {
    if (!this.ok) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, chapter: S.chapter, started: S.started, rec: S.rec, set: S.set, trail: Trail.dump() }));
    } catch (e) { /* 저장 공간이 없으면 저장하지 않고 계속 */ }
  },
  clear() {
    if (!this.ok) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 무시 */ }
  },
};

/* ============================================================
   캔버스 — 장면은 매 프레임 시뮬레이션 상태에서 위치를 다시 계산(창 크기가 바뀌어도 튀지 않음)
   ============================================================ */
const cv = $('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
// 장면이 쓰는 세로 범위: 위(장 이름·관찰값)와 아래(대사·조작 막대)를 비워 둠
function sceneBand() {
  const narrow = W < 720;
  const top = narrow ? 146 : 80;
  const bot = H - (narrow ? 176 : 146);
  return { top, bot: Math.max(top + 220, bot), narrow };
}
// 캔버스 글꼴 (설명·수치는 Pretendard, 짧은 감정 표현만 Jua)
const F_UI = "'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
const F_DECO = "Jua, " + F_UI;
const font = (px, w = 500) => `${w} ${px}px ${F_UI}`;
const COL = { ink: '#59483F', sub: '#78675B', T: '#C76D48', Td: '#4E73A8', Env: '#4F6370', line: '#E6D3BF', card: 'rgba(255,252,247,.94)' };

/* ============================================================
   관찰값 (고정된 영역) — 상대 습도는 1부에서만, 2부는 주위 기온
   ============================================================ */
const meterCache = {};
function setVal(id, html) {
  if (meterCache[id] === html) return;   // 매 프레임 호출 — 바뀐 값만 갱신
  meterCache[id] = html;
  $(id).querySelector('.val').innerHTML = html;
}
function setLab(id, txt) {
  const k = id + ':lab';
  if (meterCache[k] === txt) return;
  meterCache[k] = txt;
  $(id).querySelector('.lab').textContent = txt;
}
function setMeters(h, T, Td, env) {
  const p2 = env != null;
  setVal('mAlt', `${fmt2(h)}<small> km</small>`);
  setLab('mT', p2 ? '뭉게 기온' : '기온');

  if (p2) setVal('mEnv', `${fmt1(env)}<small> ℃</small>`);
  else setVal('mRH', `${Math.round(relHumidity(T, Td))}<small> %</small>`);
  const sat = T - Td < 0.05;

  if (meterCache.air !== txt) {
    meterCache.air = txt;
    $('airState').textContent = txt;
    $('airState').classList.toggle('sat', sat);
  }
}

let toastTimer = null;
function toast(msg, good = false, ms = 1900) {
  const el = $('toast');
  el.innerHTML = msg; el.classList.toggle('good', good); el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function showOverlay(html) { const o = $('overlay'); o.innerHTML = html; o.classList.add('on'); }
function hideOverlay() { const o = $('overlay'); o.classList.remove('on'); o.innerHTML = ''; }

/* ============================================================
   뭉게 얼굴 (대화창 아이콘) — 반투명한 공기 덩어리
   ============================================================ */
function faceSVG(face = 'normal') {

  const eyeDot = r => `<circle cx="-10" cy="-4" r="${r}" fill="#59483F"/><circle cx="10" cy="-4" r="${r}" fill="#59483F"/>`;
  const F = {
    normal: [eyeDot(2.8), 'M-7 8 Q0 13 7 8', ''],
    happy: [eyeArc, 'M-8 6 Q0 16 8 6', ''],

// 영서 관측소 아이콘 (대화창)
const STATION_ICON = `<svg viewBox="-40 -40 80 80" aria-hidden="true"><rect x="-26" y="-6" width="52" height="34" rx="8" fill="#EAF1FA" stroke="#8FB0D2" stroke-width="3"/>
  <path d="M0 -6 L0 -26" stroke="#6F8FBF" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="-28" r="4" fill="#F3B589"/>
  <path d="M-12 -30 q12 -12 24 0" stroke="#8FB0D2" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="-14" y="4" width="10" height="10" rx="2" fill="#8FB0D2"/><rect x="4" y="4" width="10" height="10" rx="2" fill="#8FB0D2"/></svg>`;

/* ============================================================
   대화 — 탭하면 문장 전체 → 다시 탭하면 다음 (자동으로 넘어가지 않음)
   설정: 대사 표시 보통 · 빠르게 · 바로 표시
   ============================================================ */
const Dialog = {
  lines: [], idx: 0, charIdx: 0, typing: false, timer: null, onDone: null,
  log: [],            // 이 장에서 본 대사 (📒 관찰 기록에서 다시 읽기)
  run(lines, onDone) {
