    S.dialogActive = true;
    M.held = false; activePointer = null;
    stopHold();
    $('dialogWrap').classList.add('on');
    this.showLine();
  },
  showLine(instant) {
    const L = this.lines[this.idx];
    const st = L.who === 'station';
    $('dName').textContent = st ? '영서 관측소' : '뭉게';
    $('dialogBox').classList.toggle('station', st);
    $('dFace').innerHTML = st ? STATION_ICON : faceSVG(L.face || 'normal');
    if (!st) M.talkFace = L.face || 'normal';
    $('dPrev').disabled = this.idx === 0;
    const extra = L.replay ? '설명 다시 보기 ▸' : L.more ? '더 알아보기 ▸' : '';
    $('dMore').style.display = extra ? 'block' : 'none';
    $('dMore').textContent = extra;
    $('dMoreText').classList.remove('on');
    $('dMoreText').innerHTML = L.more || '';
    if (!L._logged) { L._logged = true; this.log.push({ who: st ? '영서 관측소' : '뭉게', text: L.text }); }
    const el = $('dText');
    clearInterval(this.timer);
    const step = S.set.typing === 'off' ? 0 : S.set.typing === 'fast' ? 8 : 24;
    if (instant || !step) { this.typing = false; el.innerHTML = L.text; $('dNext').style.visibility = 'visible'; return; }
    el.innerHTML = '';
    this.typing = true; this.charIdx = 0;
    $('dNext').style.visibility = 'hidden';
    const plain = L.text, n = this.stripLen(plain);
    this.timer = setInterval(() => {
      this.charIdx += S.set.typing === 'fast' ? 2 : 1;
      el.innerHTML = this.slice(plain, this.charIdx);
      if (this.charIdx % 4 === 0) AudioSys.sTick();
      if (this.charIdx >= n) this.finishLine();
    }, step);
  },
  stripLen(html) { return html.replace(/<[^>]*>/g, '').length; },
  slice(html, n) {   // 태그를 보존하며 앞 n글자만
    let out = '', cnt = 0, i = 0;
    while (i < html.length && cnt < n) {
      if (html[i] === '<') { const j = html.indexOf('>', i); out += html.slice(i, j + 1); i = j + 1; }
      else { out += html[i]; i++; cnt++; }
    }
    const close = tag => { const o = (out.match(new RegExp(`<${tag}[ >]`, 'g')) || []).length - (out.match(new RegExp(`</${tag}>`, 'g')) || []).length; for (let k = 0; k < o; k++) out += `</${tag}>`; };
    close('b'); close('span'); close('small');
    return out;
  },
  finishLine() {
    clearInterval(this.timer);
    this.typing = false;
    $('dText').innerHTML = this.lines[this.idx].text;
    $('dNext').style.visibility = 'visible';
  },
  tap() {
    if (!S.dialogActive) return;
    if (this.typing) { this.finishLine(); return; }
    this.idx++;
    if (this.idx < this.lines.length) { AudioSys.sPop(); this.showLine(); }
    else this.close();
  },
  back() { if (S.dialogActive && this.idx > 0) { this.idx--; this.showLine(true); } },
  toggleMore() {
    const L = this.lines[this.idx];
    if (L.replay) {   // 앞에서 본 긴 설명을 이 자리에 다시 펼침
      const add = L.replay; L.replay = null;
      this.lines.splice(this.idx + 1, 0, ...add.map(l => ({ ...l })));
      this.finishLine(); this.tap();
      return;
    }
    const m = $('dMoreText'); m.classList.toggle('on');
    $('dMore').textContent = m.classList.contains('on') ? '접기 ▾' : '더 알아보기 ▸';
  },
  close() {
    clearInterval(this.timer);
    $('dialogWrap').classList.remove('on');
    S.dialogActive = false;
    M.talkFace = null;
    const cb = this.onDone; this.onDone = null;
    if (cb) cb();
  },
  abort() {   // 콜백 없이 강제 종료 (장 전환 시)
    clearInterval(this.timer);
    $('dialogWrap').classList.remove('on');
    S.dialogActive = false;
    this.onDone = null;
    M.talkFace = null;
  },
};
$('dialogWrap').addEventListener('pointerdown', e => { e.stopPropagation(); Dialog.tap(); });
$('dPrev').addEventListener('pointerdown', e => { e.stopPropagation(); Dialog.back(); });
$('dMore').addEventListener('pointerdown', e => { e.stopPropagation(); Dialog.toggleMore(); });

/* ============================================================
   시뮬레이션 상태 — 관찰값·그래프·뭉게 크기·물방울·들여다보기 창이 모두 이 한 상태에서 나옴
   ============================================================ */
const Sim = { h: 0, T: SCENARIO.T0, Td: SCENARIO.Td0, T0: SCENARIO.T0, sat: false, cond: 0, rainOut: 0, cu: 0, env: null, phase: 'up', vol: 1 };
// 모식 표현: 실제 부피 변화(2 km에서 약 1.2배)를 TUNING.mungge.exaggerate 배 과장한 '보이는 부피'의 세제곱근 = 반지름 배율
function shownScale(vol) { return Math.cbrt(Math.max(0.2, 1 + TUNING.mungge.exaggerate * (vol - 1))); }
// 응결한 몫을 그림 단위로: 포화되는 순간 1, 정상(응결 비율 약 0.2)에서 4
function cuOf(cond) { return 1 + Math.round(3 * clamp(cond / 0.2, 0, 1)); }
function simSet(o) {
  Object.assign(Sim, o);
  Sim.sat = Sim.T - Sim.Td < 0.05;
  Sim.vol = volumeRatio(Sim.T0, Sim.T, Sim.h);
  M.s = shownScale(Sim.vol);
  // 몸 안 물방울: 실제로 포화(기온 = 이슬점)일 때만, 강수로 빠져나간 몫만큼 줄어듦
  M.drops = Sim.sat && Sim.phase !== 'down' ? Math.round((3 + 11 * clamp(Sim.cond / 0.2, 0, 1)) * (1 - Sim.rainOut)) : 0;
  setMeters(Sim.h, Sim.T, Sim.Td, Sim.env);
}

/* ============================================================
   뭉게 (캔버스) — 반투명한 공기 덩어리. 높이에 따라 몸만 커지고 작아짐(얼굴·글자는 그대로)
   ============================================================ */
const M = {
  x: 0, y: 0, r0: 44, s: 1, visible: true, held: false,
  talkFace: null, face: 'normal', faceT: 0, blink: 0,
  drops: 0,        // 몸 안 물방울 수 (simSet)
  ring: 0,         // '처음 크기' 점선 윤곽이 남은 시간(초) — 처음 오를 때 한 번
  get r() { return this.r0 * this.s; },
  setFace(f, dur = 1.6) { this.face = f; this.faceT = dur; },
  baseFace() { return Sim.T <= 7 ? 'cold' : Sim.T >= 24 ? 'hot' : 'normal'; },
  tick(dt) {
    if (this.faceT > 0) this.faceT -= dt;
    this.blink -= dt;
    if (this.blink < -3.4) this.blink = 0.13;
    if (this.ring > 0) this.ring -= dt;
  },
  curFace() { return this.talkFace || (this.faceT > 0 ? this.face : this.baseFace()); },
  draw(c, t) {
    if (!this.visible) return;
    const r = this.r, still = S.set.reduce;
    const x = this.x, y = this.y + (still ? 0 : Math.sin(t * 1.7) * 2.2);
    this.drawBody(c, t, x, y, r, still);
    // '처음 크기' 점선 윤곽 (한 번 보여 주고 사라짐) — 몸 위에 겹쳐 그려 비교가 잘 보이게
    if (this.ring > 0) {
      const a = clamp(this.ring / 1.5, 0, 1);
      c.save(); c.globalAlpha = a; c.setLineDash([7, 6]); c.lineWidth = 2.5; c.strokeStyle = '#59483F';
      c.beginPath(); c.arc(x, y, this.r0, 0, TAU); c.stroke(); c.setLineDash([]);
      c.font = font(15, 600); c.fillStyle = '#59483F'; c.textAlign = 'right';
      c.fillText('처음 크기', x - this.r0 - 8 - (r - this.r0), y + 5); c.textAlign = 'left';
      c.restore();
    }
    this.drawFace(c, x, y);
  },
  drawBody(c, t, x, y, r, still) {
    c.save(); c.translate(x, y);
    // 몸: 반투명. 테두리 색은 기온에 따라 차가운 파랑 ↔ 따뜻한 주황
    const w = clamp((Sim.T - 5) / 20, 0, 1);
    const edge = `rgb(${Math.round(lerp(110, 214, w))},${Math.round(lerp(150, 140, w))},${Math.round(lerp(200, 100, w))})`;
    blobPath(c, 0, 0, r, 3, still ? 0 : t, 0.045, 10);
    const g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.08, 0, 0, r);
    g.addColorStop(0, 'rgba(255,255,255,.66)'); g.addColorStop(1, 'rgba(214,230,244,.34)');
    c.fillStyle = g; c.fill();
    c.lineWidth = 3; c.strokeStyle = edge; c.stroke();
    // 안쪽 물방울 + 그 물방울이 모여 보이는 구름 (공기가 구름이 '된' 것이 아니라 공기 안에 물방울이 생김)
    if (this.drops > 0) {
      c.save(); blobPath(c, 0, 0, r - 2, 3, still ? 0 : t, 0.045, 10); c.clip();
      const k = clamp(this.drops / 14, 0, 1);
      c.fillStyle = `rgba(255,255,255,${0.22 + 0.3 * k})`;
      [[-0.55, 0.45, 0.42], [0.55, 0.45, 0.42], [0, 0.72, 0.4], [-0.7, -0.2, 0.3], [0.7, -0.2, 0.3]].forEach(([dx, dy, rr], i) => {
        if (i < 1 + Math.round(4 * k)) { blobPath(c, dx * r, dy * r, rr * r, 11 + i, still ? 0 : t, 0.1, 8); c.fill(); }
      });
      // 물방울: 얼굴을 가리지 않게 몸 둘레 쪽에 (간격은 몸 크기를 따라 넓어지고, 물방울 크기는 그대로)
      for (let i = 0; i < this.drops; i++) {
        const a = i * 2.39996 + 0.4, rr = r * (0.6 + 0.24 * ((i * 7) % 5) / 4);
        drawDrop(c, Math.cos(a) * rr, Math.sin(a) * rr * 0.92 + (still ? 0 : Math.sin(t * 2 + i) * 1.2), 3.6);
      }
      c.restore();
    }
    c.restore();
  },
  // 얼굴 — 화면 크기에 맞춘 고정 크기 (몸이 커져도 얼굴은 커지지 않음)
  drawFace(c, x, y) {
    c.save(); c.translate(x, y);
    const fs = clamp(this.r0 / 44, 0.75, 1.2), face = this.curFace();
    c.scale(fs, fs);
    c.fillStyle = '#59483F'; c.strokeStyle = '#59483F'; c.lineWidth = 3; c.lineCap = 'round';
    const ex = 13, ey = -5;
    const arcEye = face === 'happy' || face === 'proud';
    if (this.blink > 0 || arcEye) {
      [-ex, ex].forEach(px => { c.beginPath(); c.moveTo(px - 5.5, ey + 1); c.quadraticCurveTo(px, ey - (arcEye ? 7 : 1), px + 5.5, ey + 1); c.stroke(); });
    } else {
      const er = face === 'surprised' ? 4.4 : 3.3;
      c.beginPath(); c.arc(-ex, ey, er, 0, TAU); c.arc(ex, ey, er, 0, TAU); c.fill();
    }
    c.fillStyle = face === 'hot' ? 'rgba(236,140,110,.7)' : 'rgba(245,194,184,.85)';
    c.beginPath(); c.arc(-24, 6, 5.5, 0, TAU); c.arc(24, 6, 5.5, 0, TAU); c.fill();
    c.beginPath();
    const my = 12;
    if (arcEye) { c.moveTo(-8, my - 3); c.quadraticCurveTo(0, my + 8, 8, my - 3); }
    else if (face === 'surprised') { c.arc(0, my, 4.5, 0, TAU); }
    else if (face === 'cold') { c.moveTo(-7, my); c.quadraticCurveTo(-3.5, my - 3, 0, my); c.quadraticCurveTo(3.5, my + 3, 7, my); }
    else if (face === 'think') { c.moveTo(-6, my + 1); c.lineTo(6, my); }
    else { c.moveTo(-7, my - 2); c.quadraticCurveTo(0, my + 4, 7, my - 2); }
    c.stroke();
    if (face === 'hot') { c.fillStyle = '#7FB0E0'; c.beginPath(); c.moveTo(30, -16); c.quadraticCurveTo(36, -6, 30, -2); c.quadraticCurveTo(24, -6, 30, -16); c.fill(); }
    c.restore();
  },
};
// 물방울 하나 (크기 고정 — 공기 알갱이와 구별되는 파란 물방울)
function drawDrop(c, x, y, r) {
  c.beginPath();
  c.moveTo(x, y - r * 1.6);
  c.quadraticCurveTo(x + r, y - r * 0.2, x + r, y + r * 0.3);
  c.arc(x, y + r * 0.3, r, 0, Math.PI);
  c.quadraticCurveTo(x - r, y - r * 0.2, x, y - r * 1.6);
  c.closePath();
  c.fillStyle = '#4E73A8'; c.fill();
  c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,.9)'; c.stroke();
}

/* ---------- 뭉게의 짧은 반응 말풍선 (진행을 막지 않음) ---------- */
const Bubble = {
  text: '', t: 0,
  show(text, sec = 2.8) { this.text = text; this.t = sec; },
  clear() { this.t = 0; },
  tick(dt) { if (this.t > 0) this.t -= dt; },
  draw(c) {
    if (this.t <= 0 || S.dialogActive || !M.visible) return;
    c.save(); c.font = font(17, 600);
    const tw = Math.min(c.measureText(this.text).width, W - 60), bw = tw + 28, bh = 40;
    let bx = M.x + M.r * 0.55, by = M.y - M.r - bh - 14;
    bx = clamp(bx, 12, W - bw - 12); by = Math.max(sceneBand().top - 4, by);
    c.globalAlpha = clamp(this.t / 0.4, 0, 1);
    c.fillStyle = COL.card; c.strokeStyle = COL.line; c.lineWidth = 2;
    c.beginPath(); c.roundRect(bx, by, bw, bh, 14); c.fill(); c.stroke();
    c.fillStyle = COL.ink; c.textBaseline = 'middle'; c.fillText(this.text, bx + 14, by + bh / 2, tw);
    c.restore();
  },
};

/* ---------- 속 들여다보기 (모식도): 알갱이 수는 그대로, 간격만 달라짐 ---------- */
const Peek = {
  on: false, AIR: 22, VAP: 10,
  pts: Array.from({ length: 40 }, (_, i) => { const a = i * 2.39996, rr = Math.sqrt((i + 0.5) / 40); return [Math.cos(a) * rr, Math.sin(a) * rr]; }),
  toggle(v) { this.on = v == null ? !this.on : v; const b = $('peekBtn'); if (b) b.textContent = this.on ? '🔍 들여다보기 닫기' : '🔍 속 들여다보기'; },
  draw(c, t) {
    if (!this.on) return;
    const band = sceneBand(), nar = band.narrow, bw = nar ? 172 : 214, bh = nar ? 246 : 254, bx = nar ? W - bw - 8 : 12, by = nar ? band.top + 40 : band.top;
    c.save();
    c.fillStyle = '#FFFCF7'; c.strokeStyle = COL.line; c.lineWidth = 2;
    c.beginPath(); c.roundRect(bx, by, bw, bh, 16); c.fill(); c.stroke();
    c.fillStyle = COL.ink; c.font = font(15, 700); c.fillText(nar ? '속 들여다보기 (모식도)' : '뭉게 속 들여다보기 (모식도)', bx + 12, by + 24);
    const cx = bx + bw / 2, cy = by + 112, R = 70 * M.s / 1.6;
    c.setLineDash([5, 4]); c.strokeStyle = '#8FB0D2'; c.lineWidth = 2;
    c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke(); c.setLineDash([]);
    // 공기 알갱이 (수 고정, 간격 = 몸 크기에 비례, 알갱이 크기는 그대로)
    c.fillStyle = '#8C7B6E';
    for (let i = 0; i < this.AIR; i++) { const p = this.pts[i]; c.beginPath(); c.arc(cx + p[0] * R * 0.88, cy + p[1] * R * 0.88, 2.6, 0, TAU); c.fill(); }
    // 수증기: 응결한 몫(물방울 하나 = 수증기 둘)만큼 줄어듦. 비로 빠져나간 몫은 돌아오지 않음
    const nVap = Math.max(0, this.VAP - 2 * Sim.cu);
    c.strokeStyle = '#4E73A8'; c.lineWidth = 1.6;
    for (let i = 0; i < nVap; i++) { const p = this.pts[this.AIR + i]; c.beginPath(); c.arc(cx + p[0] * R * 0.8, cy + p[1] * R * 0.8, 2.6, 0, TAU); c.stroke(); }
    // 물방울: 강수(rainOut)가 진행되면 자라서 아래로 떨어져 나감
    for (let i = 0; i < Sim.cu; i++) {
      const p = this.pts[34 + i], grow = 1 + 1.1 * clamp(Sim.rainOut * 2, 0, 1);
      const fall = clamp((Sim.rainOut - 0.35 - i * 0.08) / 0.4, 0, 1);
      if (fall >= 1) continue;
      c.globalAlpha = 1 - fall;
      drawDrop(c, cx + p[0] * R * 0.6, cy + p[1] * R * 0.6 + fall * (R + 40), 4 * grow);
      c.globalAlpha = 1;
    }
    // 범례 (색만이 아니라 모양으로도 구별)
    let ly = by + 200;
    c.font = font(13, 500); c.fillStyle = COL.ink;
    c.fillStyle = '#8C7B6E'; c.beginPath(); c.arc(bx + 20, ly - 4, 3, 0, TAU); c.fill();
    c.fillStyle = COL.ink; c.fillText('공기 알갱이', bx + 28, ly);
    c.strokeStyle = '#4E73A8'; c.beginPath(); c.arc(bx + 106, ly - 4, 3, 0, TAU); c.stroke();
    c.fillText('수증기', bx + 114, ly);
    ly += 20; drawDrop(c, bx + 20, ly - 3, 3.2); c.fillStyle = COL.ink; c.fillText('물방울 (수증기가 모인 것)', bx + 28, ly);
    c.fillStyle = COL.sub;
    if (nar) { ly += 20; c.fillText('알갱이 수는 그대로,', bx + 12, ly); ly += 17; c.fillText('간격만 달라져요', bx + 12, ly); }
    else { ly += 20; c.fillText('알갱이 수는 그대로, 간격만 달라져요', bx + 12, ly); }
    c.restore();
  },
};

/* ---------- 반짝임 (움직임 줄이기에서는 생략) ---------- */
const particles = [];
function spawnParticles(x, y, n, colors, spd = 130, life = 0.8, grav = 60) {
  if (S.set.reduce) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = spd * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: life * (0.6 + Math.random() * 0.6), max: life,
      c: colors[i % colors.length], r: 3 + Math.random() * 3, grav });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt;
  }
}
function drawParticles(c) {
  particles.forEach(p => { c.globalAlpha = Math.max(0, p.life / p.max); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill(); });
  c.globalAlpha = 1;
}

/* ============================================================
   발자국 기록 (높이–온도) — 직접 관측한 구간과 '앞선 여정 요약'을 구별
   ============================================================ */
const Trail = {
  maxUpAlt: 0, minDownAlt: SCENARIO.TOP, downStarted: false, condensed: false, collapsed: null,
  sumUp: 0, sumDown: false,
  up(h) {
    this.maxUpAlt = Math.max(this.maxUpAlt, clamp(h, 0, SCENARIO.TOP));
    if (this.maxUpAlt >= lclHeight(SCENARIO.T0, SCENARIO.Td0) - 1e-6) this.condensed = true;
  },
  down(h) { this.downStarted = true; this.minDownAlt = Math.min(this.minDownAlt, clamp(h, 0, SCENARIO.TOP)); },
  reset() { this.maxUpAlt = 0; this.minDownAlt = SCENARIO.TOP; this.downStarted = false; this.condensed = false; this.sumUp = 0; this.sumDown = false; },
  dump() { return { maxUpAlt: this.maxUpAlt, minDownAlt: this.minDownAlt, downStarted: this.downStarted, condensed: this.condensed, collapsed: this.collapsed, sumUp: this.sumUp, sumDown: this.sumDown }; },
  restore(d) { if (d && typeof d === 'object') ['maxUpAlt', 'minDownAlt', 'downStarted', 'condensed', 'collapsed', 'sumUp', 'sumDown'].forEach(k => { if (k in d) this[k] = d[k]; }); },
};
function upSeg(a, b) {
  const H0 = lclHeight(SCENARIO.T0, SCENARIO.Td0), hs = [a];
  if (a < H0 && b > H0) hs.push(H0);
  hs.push(b);
  return { T: hs.map(h => [riseState(SCENARIO.T0, SCENARIO.Td0, h).T, h]), Td: hs.map(h => [riseState(SCENARIO.T0, SCENARIO.Td0, h).Td, h]) };
}
function downSeg(b) {
  const hs = [SCENARIO.TOP, b];
  return { T: hs.map(h => [descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, h).T, h]), Td: hs.map(h => [descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, h).Td, h]) };
}

/* ============================================================
   발자국 그래프 (오른쪽) — 축 고정 0~30℃ / 0~2 km. 현재 점 · 현재 높이 안내선 · 구름 시작 표시
   기온: 오를 때 실선 / 내려올 때 긴 점선, 이슬점: 점선(위에 겹쳐 그려 가려지지 않게)
   ============================================================ */
const MiniGraph = {
  L: 40, R: 240, T: 14, B: 186, lastKey: '',
  X(t) { return this.L + (t / 30) * (this.R - this.L); },
  Y(h) { return this.B - (h / 2) * (this.B - this.T); },
  d(pts) { return pts.length > 1 ? pts.map((p, i) => (i ? 'L' : 'M') + this.X(p[0]).toFixed(1) + ' ' + this.Y(p[1]).toFixed(1)).join(' ') : ''; },
  build() {
    let g = '';
    for (let t = 0; t <= 30; t += 10)
      g += `<line class="mgGrid" x1="${this.X(t)}" y1="${this.T}" x2="${this.X(t)}" y2="${this.B}"/>
            <text class="mgLab" x="${this.X(t)}" y="${this.B + 15}" text-anchor="middle">${t}℃</text>`;
    for (let h = 0; h <= 2; h += 0.5)
      g += `<line class="mgGrid" x1="${this.L}" y1="${this.Y(h)}" x2="${this.R}" y2="${this.Y(h)}"/>` +
        (h % 1 === 0 ? `<text class="mgLab" x="${this.L - 5}" y="${this.Y(h) + 4}" text-anchor="end">${h}km</text>` : '');
    g += `<line class="mgAxis" x1="${this.L}" y1="${this.T - 4}" x2="${this.L}" y2="${this.B}"/>
          <line class="mgAxis" x1="${this.L}" y1="${this.B}" x2="${this.R + 4}" y2="${this.B}"/>`;
    $('mgStatic').innerHTML = g;
    $('mgFold').addEventListener('click', e => { e.stopPropagation(); Trail.collapsed = !Trail.collapsed; this.applyFold(); Store.save(); });
    $('mgBig').addEventListener('click', e => { e.stopPropagation(); showLog('graph'); });
    if (Trail.collapsed == null) Trail.collapsed = W < 720;
    this.applyFold();
  },
  applyFold() {
    $('miniGraph').classList.toggle('folded', !!Trail.collapsed);
    $('mgFold').textContent = Trail.collapsed ? '펼치기 ▸' : '접기 ▾';
    $('mgFold').setAttribute('aria-expanded', String(!Trail.collapsed));
  },
  setVisible(on) {
    $('miniGraph').classList.toggle('on', on);
    if (on) { this.lastKey = ''; this.updatePaths(); }
  },
  updatePaths() {
    const key = `${Trail.maxUpAlt.toFixed(3)}|${Trail.minDownAlt.toFixed(3)}|${Trail.downStarted}|${Trail.condensed}|${Trail.sumUp}|${Trail.sumDown}`;
    if (key === this.lastKey) return;
    this.lastKey = key;
    const su = Trail.sumUp > 0 ? upSeg(0, Trail.sumUp) : null, sd = Trail.sumDown ? downSeg(0) : null;
    $('mgSumT').setAttribute('d', (su ? this.d(su.T) : '') + (sd ? ' ' + this.d(sd.T) : ''));
    $('mgSumTd').setAttribute('d', (su ? this.d(su.Td) : '') + (sd ? ' ' + this.d(sd.Td) : ''));
    const a = Math.min(Trail.sumUp, Trail.maxUpAlt), up = Trail.maxUpAlt > a + 1e-6 ? upSeg(a, Trail.maxUpAlt) : null;
    $('mgUpT').setAttribute('d', up ? this.d(up.T) : '');
    $('mgUpTd').setAttribute('d', up ? this.d(up.Td) : '');
    if (Trail.downStarted && !Trail.sumDown && Trail.minDownAlt < SCENARIO.TOP - 1e-6) {
      const dn = downSeg(Trail.minDownAlt);
      $('mgDnT').setAttribute('d', this.d(dn.T)); $('mgDnTd').setAttribute('d', this.d(dn.Td));
    } else { $('mgDnT').setAttribute('d', ''); $('mgDnTd').setAttribute('d', ''); }
    // 구름이 생기기 시작한 높이 — 직접 도달했거나 요약으로 받은 뒤에만 표시(예상 전에 답을 보여 주지 않음)
    const H0 = lclHeight(SCENARIO.T0, SCENARIO.Td0);
    $('mgLcl').innerHTML = Trail.condensed
      ? `<line x1="${this.L}" y1="${this.Y(H0)}" x2="${this.R}" y2="${this.Y(H0)}" stroke="#8FB0D2" stroke-width="1.6" stroke-dasharray="4 4"/>
         <text class="mgLab" x="${this.R - 2}" y="${this.Y(H0) - 5}" text-anchor="end" fill="#3D5A86">구름 시작 ${H0} km</text>
         <circle cx="${this.X(riseState(SCENARIO.T0, SCENARIO.Td0, H0).T)}" cy="${this.Y(H0)}" r="7" fill="none" stroke="#4E73A8" stroke-width="2"/>` : '';
  },
  // 현재 점 · 현재 높이 안내선 — 뭉게의 상태(Sim)를 그대로 따라감
  tick(h, phase) {
    h = clamp(h, 0, SCENARIO.TOP);
    const st = phase === 'down' ? descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, h) : riseState(SCENARIO.T0, SCENARIO.Td0, h);
    const y = this.Y(h).toFixed(1);
    $('mgCur').setAttribute('y1', y); $('mgCur').setAttribute('y2', y);
    $('mgDotT').setAttribute('cx', this.X(clamp(st.T, 0, 30)).toFixed(1)); $('mgDotT').setAttribute('cy', y);
    $('mgDotTd').setAttribute('cx', this.X(clamp(st.Td, 0, 30)).toFixed(1)); $('mgDotTd').setAttribute('cy', y);
    this.updatePaths();
  },
};

/* ============================================================
   입력 — 뭉게를 끄는 곳은 캔버스뿐(한 손가락), 그 밖의 곳은 보통 스크롤·확대
   ============================================================ */
let activePointer = null;
cv.addEventListener('pointerdown', e => {
  AudioSys.ensure();
  if (S.paused || S.dialogActive) return;
  activePointer = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  if (scene && scene.pd) scene.pd(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointer || S.paused || S.dialogActive) return;
  if (scene && scene.pm) scene.pm(e.clientX, e.clientY);
});
function endPointer(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  if (scene && scene.pu) scene.pu(e.clientX, e.clientY);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
document.addEventListener('contextmenu', e => { if (e.target === cv) e.preventDefault(); });

// 누르고 있는 동안 움직이는 버튼 ([조금 더 올라가기] 등). 톡 누르면 조금 저절로, 키보드 Enter·Space도 한 걸음
const Hold = { on: false, down: 0, ctl: null, cur: null };
function bindHold(id, ctl, key) {
  const el = $(id); if (!el) return;
  const start = () => { if (Hold.on) return; AudioSys.ensure(); Hold.on = true; Hold.down = performance.now(); Hold.ctl = ctl; el.classList.add('down'); ctl.start(); };
  const end = () => { if (!Hold.on || Hold.ctl !== ctl) return; Hold.on = false; el.classList.remove('down'); ctl.stop(performance.now() - Hold.down < 280); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); start(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, end));
  el.addEventListener('click', e => { e.stopPropagation(); if (e.detail === 0 && !Hold.on) { ctl.start(); ctl.stop(true); } });
  Hold.cur = { id, key, start, end };
}
function stopHold() {
  if (Hold.on && Hold.ctl) { Hold.on = false; const c = Hold.ctl; c.stop(false); }
  document.querySelectorAll('.btn.hold.down').forEach(b => b.classList.remove('down'));
}

/* ============================================================
   배경 그리기 도우미
   ============================================================ */
function skyGrad(c, top, bottom) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function drawSun(c, x, y, r, t) {
  c.fillStyle = 'rgba(255,226,170,.85)';
  blobPath(c, x, y, r, 21, S.set.reduce ? 0 : t, 0.04, 10); c.fill();
  c.fillStyle = 'rgba(255,240,205,.45)';
  blobPath(c, x, y, r * 1.45, 22, S.set.reduce ? 0 : t, 0.05, 10); c.fill();
}
function drawCloudBlob(c, x, y, s, seed, t, alpha = 0.9) {
  c.save(); c.globalAlpha = alpha; c.fillStyle = '#FFFFFF';
  [[0, 0, 1], [-0.9, 0.15, 0.7], [0.9, 0.15, 0.72], [-0.4, -0.35, 0.65], [0.45, -0.32, 0.6]].forEach(([dx, dy, rr], i) => {
    blobPath(c, x + dx * s, y + dy * s, s * rr, seed + i * 3, S.set.reduce ? 0 : t, 0.1, 8); c.fill();
  });
  c.restore();
}
// 왼쪽 높이 눈금
function drawRuler(c, kmToY, maxKm) {
  c.save(); c.strokeStyle = 'rgba(89,72,63,.28)'; c.fillStyle = COL.sub; c.lineWidth = 1.5; c.font = font(14, 600); c.textAlign = 'left';
  for (let h = 0; h <= maxKm + 1e-9; h += 0.5) {
    const y = kmToY(h);
    c.beginPath(); c.moveTo(8, y); c.lineTo(h % 1 === 0 ? 30 : 20, y); c.stroke();
    if (h % 1 === 0) c.fillText(`${h.toFixed(1)} km`, 34, y + 5);
  }
  c.restore();
}
function hLine(c, y, x0, x1, color, dash = [10, 8], w = 2) {
  c.save(); c.strokeStyle = color; c.setLineDash(dash); c.lineWidth = w;
  c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke(); c.restore();
}
function tag(c, text, x, y, o = {}) {   // 둥근 글상자 (글자 크기 고정)
  c.save(); c.font = font(o.px || 15, o.w || 600);
  const tw = c.measureText(text).width, bw = tw + 18, bh = (o.px || 15) + 12;
  const bx = o.align === 'right' ? x - bw : o.align === 'center' ? x - bw / 2 : x;
  c.fillStyle = o.bg || 'rgba(255,252,247,.9)'; c.strokeStyle = o.border || COL.line; c.lineWidth = 1.5;
  c.beginPath(); c.roundRect(bx, y - bh / 2, bw, bh, 10); c.fill(); c.stroke();
  c.fillStyle = o.color || COL.ink; c.textBaseline = 'middle'; c.fillText(text, bx + 9, y + 1);
  c.restore();
  return { x: bx, w: bw };
}
</script>

<script>
'use strict';
/* ============================================================
   「뭉게의 하늘 여행」 v2.1 — 이야기 중심 흐름
   이야기 상황 → 짧은 조작 → 눈에 보이는 변화 → 뭉게의 반응 → 필요한 설명 → 다음 이야기
   질문은 결정적인 순간에만: ① 기온 = 이슬점 직전 ② 같은 높이로 내려가기 전 ③ 2부에서 놓아주기 전
   1부 · 산을 건너는 뭉게  : 산을 넘은 뒤 왜 더 따뜻하고 건조해졌을까?
   2부 · 놓아주면 어디로 갈까? : 같은 공기를 올렸다 놓았는데 왜 다르게 움직일까?
   ============================================================ */
const H0 = lclHeight(SCENARIO.T0, SCENARIO.Td0);    // 기본 조건의 상승 응결 고도 = 1.0 km

/* ---------- 장 목록 (주소 ?ch=N 의 번호 그대로: 1~7 = 1부, 8~12 = 2부) ---------- */
const CHS = [
  { part: 1, name: '출발 · 바람이 밀어 올려요',   goal: '처음 올라갈 때 몸이 커지고 식는 것 보기' },
  { part: 1, name: '구름이 시작되는 곳',          goal: '기온과 이슬점이 같아지는 높이' },
  { part: 1, name: '구름 속으로 · 정상까지',       goal: '구름 속에서 천천히 식는 까닭' },
  { part: 1, name: '구름 속 들여다보기',          goal: '물방울이 자라 비가 되어 떨어짐' },
  { part: 1, name: '산 너머로 내려가기',          goal: '내려가면 작아지고 따뜻해짐' },
  { part: 1, name: '도착 · 처음과 비교',          goal: '출발과 도착을 나란히 비교' },
  { part: 1, name: '관측소 보고',                goal: '구간별 변화 정리 (그림 Ⅲ-13)' },
  { part: 1, name: '다른 조건의 여행',            goal: '조건을 바꿔 자유롭게 비교 (선택)' },
  { part: 2, name: '대기 A · 올렸다 놓으면?',     goal: '같은 높이의 두 기온 비교' },
  { part: 2, name: '대기 C · 같은 높이, 다른 결과', goal: '주위 기온 분포가 다를 때' },
  { part: 2, name: '대기 B · 두 높이에서',        goal: '구름이 생기는 높이와 스스로 오르는 높이' },
  { part: 2, name: '이름 붙이기와 구름',          goal: '대기 안정도와 구름 모양' },
  { part: 2, name: '새로운 하늘 · 대기 D',        goal: '새 조건에서 움직임 예상' },
];
const PART = {
  1: { first: 0, last: 7, title: '1부 · 산을 건너는 뭉게', q: '산을 넘은 뒤 왜 더 따뜻하고 건조해졌을까?' },
  2: { first: 8, last: 12, title: '2부 · 놓아주면 어디로 갈까?', q: '같은 공기를 올렸다 놓았는데 왜 다르게 움직일까?' },
};
const partOf = ch => CHS[ch].part;
const chTitle = ch => `${partOf(ch)}부 · ${CHS[ch].name}`;
const nf = v => { const r = Math.round(v * 10) / 10; return Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(1); };
const kf = v => { const r = Math.round(v * 100) / 100; return Math.abs(r * 10 - Math.round(r * 10)) < 1e-9 ? r.toFixed(1) : r.toFixed(2); };

function renderProgress() {
  const p = partOf(S.chapter), P = PART[p];
  let dots = '';
  for (let i = P.first; i <= P.last; i++)
    dots += `<div class="pdot ${S.rec.done[i] ? 'done' : ''} ${i === S.chapter ? 'cur' : ''}"></div>`;
  $('progressDots').innerHTML = dots;
  $('chapterName').textContent = `${p}부 · ${CHS[S.chapter].name}`;
  $('progress').setAttribute('aria-label', `처음 화면으로 (지금: ${chTitle(S.chapter)})`);
  document.body.classList.toggle('playing', S.screen === 'play');
}

/* ============================================================
   화면 도우미
   ============================================================ */
let scene = null;
function setScene(s) {
  if (scene && scene.exit) scene.exit();
  scene = s;
  if (s.enter) s.enter();
  if (s.update) s.update(0);
}
// 아래쪽 행동 막대: 짧은 안내 + 주요 버튼 (한 가지 행동이 먼저 보이게)
function setAct(html) {
  const b = $('actBar');
  Hold.cur = null;
  if (!html) { b.classList.remove('on'); b.innerHTML = ''; return; }
  b.innerHTML = html; b.classList.add('on');
  const f = b.querySelector('.btn:not(.sub)') || b.querySelector('.btn');
  if (f) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }, 30);
}
function panel(html, cls = '') {
  S.paused = true;
  showOverlay(`<div class="panel ${cls}" role="dialog">${html}</div>`);
  const f = document.querySelector('#overlay [data-focus]') || document.querySelector('#overlay .btn:not([disabled])');
  if (f) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }, 30);
}
function closePanel() { hideOverlay(); S.paused = false; }
function onClick(id, fn) {
  const el = $(id);
  if (el) el.addEventListener('click', e => { e.stopPropagation(); AudioSys.ensure(); fn(e); });
}

/* ============================================================
   흐름 도우미 (Promise) — 장이 바뀌면(runId) 이전 흐름은 멈춤
   ============================================================ */
function guard(p) { const id = S.runId; return p.then(v => (S.runId === id ? v : new Promise(() => {}))); }
const say = lines => guard(new Promise(res => Dialog.run(lines, res)));
let actWait = null;
function waitAct(name) { return guard(new Promise(res => { actWait = { name, res }; })); }
function actDone(name, data) { if (actWait && actWait.name === name) { const w = actWait; actWait = null; w.res(data); } }
function waitClick(id) { return guard(new Promise(res => onClick(id, () => res()))); }
// 긴 설명은 처음 한 번만. 다시 오면 한 줄 요약 + [설명 다시 보기]
function explain(key, lines, recap) {
  if (S.rec.seen[key]) return say([{ face: lines[0].face, who: lines[0].who, text: `${recap} <span class="again">앞에서 본 설명</span>`, replay: lines }]);
  S.rec.seen[key] = true; Store.save();
  return say(lines);
}
// 누르고 있기 조작 막대 (ctl: J 또는 Sky — u, uMax, drive, target)
function holdAct(label, msg, ctl, key = 'ArrowUp') {
  setAct(`<div class="msg">${msg}</div><button class="btn hold" id="holdBtn">${label}</button>`);
  bindHold('holdBtn', {
    start() { ctl.drive = 1; },
    stop(tap) { ctl.drive = 0; ctl.target = tap ? Math.min(ctl.uMax, ctl.u + TUNING.move.tapStepKm) : ctl.u; },
  }, key);
}
// 다음 이야기로 (짧은 전환 — 지도 막간 없이)
function nextStory(o = {}) {
  return guard(new Promise(res => {
    S.rec.done[S.chapter] = true; renderProgress(); Store.save();
    setAct(`${o.msg ? `<div class="msg">${o.msg}</div>` : ''}<div class="row2">
      ${o.peek ? `<button class="btn sub" id="peekBtn">${Peek.on ? '🔍 들여다보기 닫기' : '🔍 속 들여다보기'}</button>` : ''}
      ${o.graph ? '<button class="btn sub" id="bigBtn">📈 그래프 크게 보기</button>' : ''}
      <button class="btn" id="nextBtn">${o.label || '다음 이야기 ➜'}</button></div>`);
    onClick('peekBtn', () => Peek.toggle());
    onClick('bigBtn', () => showLog('graph'));
    onClick('nextBtn', () => { AudioSys.sPop(); setAct(null); res(); });
  })).then(() => { if (o.to !== false) startChapter(o.to != null ? o.to : S.chapter + 1); });
}

/* ---------- 관찰 기록 ---------- */
function addObs(id, label, h, T, Td, note = '', summary = false) {
  const o = { id, ch: S.chapter, label, h, T, Td, rh: relHumidity(T, Td), note, summary };
  const i = S.rec.obs.findIndex(x => x.id === id);
  if (i >= 0) { if (!S.rec.obs[i].summary && summary) return; S.rec.obs[i] = o; } else S.rec.obs.push(o);
  if (!summary) S.newObs.push(o);
}
// 1부 관찰 기록 지점 (값은 PHYSICS 계산에서)
const OBS = {
  start:  { n: 1, label: '출발 · 영동 바다 위', h: 0,   up: true,  note: '기온이 이슬점보다 높은 불포화 상태' },
  h05:    { n: 2, label: '처음 올라간 곳',      h: 0.5, up: true,  note: '몸이 커지고 기온이 5℃ 내려감 (이슬점은 1℃)' },
  lcl:    { n: 3, label: '응결 시작',          h: H0,  up: true,  note: '기온 = 이슬점 → 몸 안에 물방울이 생김' },
  top:    { n: 4, label: '산 정상',            h: 2,   up: true,  note: '구름 속에서는 1 km에 5℃씩 천천히 식음' },
  rain:   { n: 5, label: '영동 쪽 비탈에 비',   h: 2,   up: true,  note: '물방울이 자라 비로 떨어짐 → 함께 넘어가는 수증기 감소' },
  d1:     { n: 6, label: '내려가는 중',         h: 1,   up: false, note: '같은 높이인데 올라올 때(10℃)보다 따뜻함' },
  arrive: { n: 7, label: '하강 후 도착 · 영서',  h: 0,   up: false, note: '출발보다 5℃ 따뜻하고 이슬점은 3℃ 낮음' },
};
const obsState = id => { const o = OBS[id]; return o.up ? riseState(SCENARIO.T0, SCENARIO.Td0, o.h) : descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, o.h); };
function record(id) {
  const o = OBS[id], st = obsState(id);
  addObs(id, `${o.label} ${kf(o.h)} km`, o.h, st.T, st.Td, o.note);
  toast(`📒 관찰 기록에 남겼어요 · ${o.label}`, true, 1800);
  Store.save();
}
// 중간 장부터 시작: 앞 장의 기록은 '앞선 여정 요약' (직접 관측한 것처럼 표시하지 않음)
function prefillSummary(ch) {
  if (partOf(ch) === 2) {
    const add = (k, h, g) => { if (!S.rec.p2[k]) { const Tp = riseState(20, 12, h).T, Te = envTemp(20, g, h); S.rec.p2[k] = { h, Tp, Te, out: Tp > Te ? 'rise' : 'return', summary: true }; } };
    if (ch >= 9) add('A', 0.5, AIR.A);
    if (ch >= 10) add('C', 0.5, AIR.C);
    if (ch >= 11) { add('B1', 1, AIR.B); add('B2', 2, AIR.B); }
    return;
  }
  const add = id => { const o = OBS[id], st = obsState(id); addObs(id, `${o.label} ${kf(o.h)} km`, o.h, st.T, st.Td, o.note, true); };
  if (ch >= 1) { add('start'); add('h05'); if (Trail.maxUpAlt < 0.5) Trail.sumUp = Math.max(Trail.sumUp, 0.5); }
  if (ch >= 2) { add('lcl'); if (!S.rec.segs.up1) S.rec.segs.up1 = 'summary'; if (Trail.maxUpAlt < H0) Trail.sumUp = Math.max(Trail.sumUp, H0); Trail.condensed = true; }
  if (ch >= 3) { add('top'); if (!S.rec.segs.up2) S.rec.segs.up2 = 'summary'; if (Trail.maxUpAlt < 2) Trail.sumUp = 2; }
  if (ch >= 4) add('rain');
  if (ch >= 5) { add('d1'); add('arrive'); if (!S.rec.segs.down) { S.rec.segs.down = 'summary'; if (!Trail.downStarted || Trail.minDownAlt > 0) Trail.sumDown = true; } }
}

/* ---------- 예상 (결정적인 순간에만 · 틀려도 감점 없음 · 막지 않는 피드백) ---------- */
function predict(key, P) {
  return guard(new Promise(res => {
    panel(`<span class="tag">잠깐, 먼저 예상해 볼까?</span><p class="q">${P.q}</p>
      ${P.hint ? `<p class="hint">${P.hint}</p>` : ''}
      <div class="opts">${P.opts.map((o, i) => `<button class="btn sub" data-key="${i + 1}" data-i="${i}"><span class="k">${i + 1}</span>${o}</button>`).join('')}</div>
      <p class="note">틀려도 괜찮아요. 직접 보고 확인할 거예요.</p>`, 'top');
    document.querySelectorAll('#overlay .opts .btn').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation(); AudioSys.ensure(); AudioSys.sPop();
      const i = Number(b.dataset.i);
      S.rec.pred[key] = { ch: S.chapter, q: P.short, pick: i, text: P.opts[i], ok: i === P.ans, real: P.real };
      Store.save();
      closePanel(); toast('좋아, 직접 확인해 보자!', true, 1400); res(i);
    }));
  }));
}
// 관찰한 뒤, 예상과 관찰을 잇는 한 줄 (막지 않음)
function predLine(key, P) {
  const r = S.rec.pred[key];
  if (!r) return null;
  return r.ok ? { face: 'happy', text: `내 예상(${r.text})과 같았어! ${P.okFb || ''}` } : { face: 'think', text: P.fb[r.pick] };
}

/* ============================================================
   1부 여행 장면 — 영동 바다 → 산비탈 → 정상 → 영서 들판 (하나로 이어진 길)
   u: 0~2 = 오르기(높이 = u), 2~4 = 내려가기(높이 = 4 − u). 위치·크기·관찰값은 모두 u에서 계산
   ============================================================ */
const CU_TOP = cuOf(condensedFrac(SCENARIO.T0, SCENARIO.Td0, SCENARIO.TOP));
const J = {
  u: 0, target: 0, uMin: 0, uMax: 0, stops: [], cues: [], drive: 0, dragging: false, active: false,
  rainOut: 0, raining: false, rain: [], rainAcc: 0, camX: null, flash: 0,
  xAt(u) { return u <= 2 ? 3.6 * Math.pow(u / 2, 0.8) : 3.6 + 3.2 * Math.pow((u - 2) / 2, 0.8); },
  hAt(u) { return u <= 2 ? u : 4 - u; },
  pathH(x) {
    if (x <= 0) return 0;
    if (x <= 3.6) return 2 * Math.pow(x / 3.6, 1.25);
    if (x <= 6.8) return 2 - 2 * Math.pow((x - 3.6) / 3.2, 1.25);
    return 0;
  },
  stateAt(u) {
    const h = this.hAt(u);
    const s = u <= 2 ? riseState(SCENARIO.T0, SCENARIO.Td0, h) : descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, h);
    return { h, T: s.T, Td: s.Td };
  },
  geo() {
    const b = sceneBand();
    const k = clamp((b.bot - b.top) / 2.6 / 230, 0.62, 1.2), r0 = TUNING.mungge.baseR * k;
    const y0 = b.bot - r0 * 1.2, pxY = (y0 - b.top - r0 * 1.5) / 2;
    const pxX = Math.max(W / 5.2, pxY * 1.05);
    return { ...b, r0, y0, pxY, pxX, clr: (r0 * 1.08) / pxY, fx: b.narrow ? (Peek.on ? 0.3 : 0.5) : 0.36 };
  },
  ground(x, g) { return Math.max(-g.clr, this.pathH(x) - g.clr); },
  enter() { this.camX = null; this.rain = []; this.drive = 0; this.dragging = false; this.flash = 0; },
  place(u, rainOut = 0) {
    Object.assign(this, { u, target: u, uMin: u, uMax: u, rainOut, raining: false, stops: [], cues: [], active: false, drive: 0, dragging: false });
    this.camX = null;
    this.sync(this.geo(), 0);   // 대사가 먼저 나와도 관찰값·뭉게 위치가 이 장의 출발 상태로
  },
  allow(uMax, stops, cues) { this.uMin = this.u; this.uMax = uMax; this.stops = stops.slice(); this.cues = (cues || []).map(c => ({ ...c })); this.target = this.u; this.active = true; },
  startRain() { this.raining = true; },
  sx(x, g) { return (x - this.camX) * g.pxX; },
  update(dt) {
    const g = this.geo();
    // 이동: 누르고 있기 → 앞으로, 톡 → 조금 저절로, 끌기 → 손가락 높이까지. 길을 벗어나거나 실패하는 일 없음
    if (this.active) {
      if (this.drive) this.target = this.uMax;
      const dir = Math.sign(this.target - this.u);
      if (dir) {
        const v = (this.dragging ? TUNING.move.dragKmPerSec : TUNING.move.riseKmPerSec) * dt;
        let nu = Math.abs(this.target - this.u) <= v ? this.target : this.u + dir * v;
        nu = clamp(nu, this.uMin, this.uMax);
        const st = this.stops.find(s => (dir > 0 ? s > this.u + 1e-9 && s <= nu + 1e-9 : s < this.u - 1e-9 && s >= nu - 1e-9));
        if (st != null) {   // 관찰 지점: 지나치지 않고 정확히 그 높이에 멈춤 (설명 수치 = 실제 상태)
          nu = st; this.stops = this.stops.filter(s => s !== st);
          this.drive = 0; this.target = st; this.dragging = false; M.held = false; stopHold();
          this.u = nu; this.sync(g, dt);
          actDone('stop', st);
          return;
        }
        this.u = nu;
      }
      this.cues.forEach(c => { if (!c.done && this.u >= c.u - 1e-9) { c.done = true; if (c.fn) c.fn(); if (c.text) Bubble.show(c.text); } });
    }
    // 강수: 물방울이 자라 떨어져 나감 (3장)
    if (this.raining) {
      this.rainOut = Math.min(1, this.rainOut + dt / 5);
      if (this.rainOut >= 1) { this.raining = false; actDone('rained'); }
    }
    this.sync(g, dt);
  },
  sync(g, dt) {
    const st = this.stateAt(this.u), h = st.h, down = this.u > 2 + 1e-9;
    if (this.active) { if (this.uMax > 2 + 1e-9) Trail.down(h); else Trail.up(h); }
    const cond = condensedFrac(SCENARIO.T0, SCENARIO.Td0, Math.min(h, SCENARIO.TOP) * (down ? 0 : 1) + (down ? SCENARIO.TOP : 0));
    const sat = st.T - st.Td < 0.05, ro = down ? 1 : this.rainOut;
    simSet({ h, T: st.T, Td: st.Td, T0: SCENARIO.T0, cond, rainOut: ro, cu: down || ro > 0 ? CU_TOP : sat ? cuOf(cond) : 0, env: null, phase: down ? 'down' : 'up' });
    MiniGraph.tick(h, down ? 'down' : 'up');
    const x = this.xAt(this.u);
    const camMax = Math.max(-1.6, 9.4 - W / g.pxX), want = clamp(x - g.fx * W / g.pxX, -1.6, camMax);
    if (this.camX == null || S.set.reduce) this.camX = want; else this.camX += (want - this.camX) * Math.min(1, dt * 4);
    M.r0 = g.r0; M.x = this.sx(x, g); M.y = g.y0 - h * g.pxY;
    // 빗줄기 (월드 좌표): 강수 중에는 뭉게와 영동 쪽 비탈 구름에서, 그 뒤에는 비탈 구름에서 약하게
    const rate = this.raining ? 34 : this.rainOut >= 1 ? 7 : 0;
    if (rate && dt > 0) {
      this.rainAcc += dt * rate;
      while (this.rainAcc >= 1) {
        this.rainAcc -= 1;
        if (this.raining && Math.random() < 0.4 && !down) this.rain.push({ x: x + (Math.random() - 0.5) * 0.3, h: h - (M.r * 0.5) / g.pxY, v: 1 + Math.random() * 0.4 });
        else { const uu = H0 + 0.1 + Math.random() * (1.85 - H0); this.rain.push({ x: this.xAt(uu) + (Math.random() - 0.5) * 0.2, h: this.hAt(uu) - 0.06, v: 0.8 + Math.random() * 0.4 }); }
      }
    }
    for (let i = this.rain.length - 1; i >= 0; i--) {
      const d = this.rain[i]; d.h -= d.v * dt; d.x -= 0.1 * dt;
      if (d.h <= this.ground(d.x, g) + g.clr * 0.2) this.rain.splice(i, 1);
    }
    if (this.flash > 0) this.flash -= dt;
  },
  pd(x, y) {
    if (!this.active) return;
    if (Math.hypot(x - M.x, y - M.y) < Math.max(TUNING.grabRadius, M.r + 30)) { this.dragging = true; M.held = true; this.dragTo(y); }
  },
  pm(x, y) { if (this.dragging) this.dragTo(y); },
  pu() { if (this.dragging) { this.dragging = false; M.held = false; this.target = this.u; } },
  dragTo(y) {
    const g = this.geo(), h = clamp((g.y0 - y) / g.pxY, 0, 2);
    this.target = clamp(this.uMax > 2 + 1e-9 ? 4 - h : h, this.uMin, this.uMax);
  },
  draw(c, t) {
    const g = this.geo(), Y = h => g.y0 - h * g.pxY;
    skyGrad(c, '#CFE4F3', '#FBF3E6');
    drawSun(c, W * 0.86, g.top + 40, 30, t);
    // 먼 산 (아주 연하게)
    c.fillStyle = 'rgba(160,190,175,.16)';
    c.beginPath(); c.moveTo(0, H);
    for (let sx = 0; sx <= W + 30; sx += 30) { const xk = this.camX * 0.35 + sx / g.pxX; c.lineTo(sx, Y(0.55 + 0.35 * Math.sin(xk * 1.3) + 0.2 * Math.sin(xk * 2.9)) - 10); }
    c.lineTo(W, H); c.closePath(); c.fill();
    // 높이 안내선
    for (let h = 0.5; h <= 2.0 + 1e-9; h += 0.5) hLine(c, Y(h), 0, W, 'rgba(89,72,63,.10)', [], 1);
    const showH = Trail.condensed || this.u >= H0 - 1e-6;
    if (showH) {
      hLine(c, Y(H0), 0, W, 'rgba(78,115,168,.65)', [10, 8], 2);
      if (g.narrow) tag(c, `구름 시작 ${kf(H0)} km`, W - 8, Y(H0) - 16, { align: 'right', color: '#3D5A86', px: 13 });
      else tag(c, `${kf(H0)} km · 구름이 생기기 시작하는 높이`, 96, Y(H0) - 18, { color: '#3D5A86', px: 14 });
    }
    // 지형: 바다 · 산 · 들판
    const gx0 = this.camX - 0.3, gx1 = this.camX + W / g.pxX + 0.3;
    c.fillStyle = '#BFDDEE'; c.fillRect(0, Y(-g.clr), Math.max(0, this.sx(0.2, g)), H);
    const lx0 = Math.max(gx0, -0.05);
    c.beginPath(); c.moveTo(this.sx(lx0, g), H);
    for (let xk = lx0; xk <= gx1; xk += 0.05) {
      const gh = (this.ground(xk - 0.12, g) + this.ground(xk, g) * 2 + this.ground(xk + 0.12, g)) / 4;
      c.lineTo(this.sx(xk, g), Y(gh));
    }
    c.lineTo(this.sx(gx1, g), H); c.closePath();
    c.fillStyle = '#CFE5D2'; c.fill(); c.strokeStyle = '#9DC4A8'; c.lineWidth = 3; c.stroke();
    c.fillStyle = '#F2E6CC'; c.fillRect(this.sx(6.9, g), Y(-g.clr) + 2, W, H);
    c.fillStyle = '#9DC4A8';
    for (let i = 0; i < 16; i++) {
      const xk = 0.5 + i * 0.4; if (xk > 6.6) break;
      const p = this.sx(xk, g), gy = Y(this.ground(xk, g)); if (p < -20 || p > W + 20) continue;
      c.beginPath(); c.moveTo(p, gy - 20); c.lineTo(p - 9, gy + 3); c.lineTo(p + 9, gy + 3); c.closePath(); c.fill();
    }
    // 바람길 (점선)
    c.save(); c.setLineDash([3, 10]); c.lineCap = 'round'; c.strokeStyle = 'rgba(199,109,72,.45)'; c.lineWidth = 3; c.beginPath();
    for (let u = 0; u <= 4.0001; u += 0.05) { const p = this.sx(this.xAt(u), g), y = Y(this.hAt(u)); u ? c.lineTo(p, y) : c.moveTo(p, y); }
    c.stroke(); c.restore();
    // 정상 깃발 + 산 높이
    const fx = this.sx(3.6, g);
    if (fx > -80 && fx < W + 80) {
      const px = fx + Math.max(80, g.r0 * 2.2), gy = Y(this.ground(3.6 + (px - fx) / g.pxX, g) - 0.02);
      hLine(c, Y(2), fx - 90, px + 150, 'rgba(140,106,85,.45)', [6, 6], 1.5);
      c.strokeStyle = '#8C6A55'; c.lineWidth = 4; c.beginPath(); c.moveTo(px, gy); c.lineTo(px, Y(2) - 4); c.stroke();
      c.fillStyle = '#E88A6E'; c.beginPath(); c.moveTo(px, Y(2) - 4); c.lineTo(px + 34, Y(2) + 6); c.lineTo(px, Y(2) + 16); c.closePath(); c.fill();
      tag(c, '산 높이 2.0 km', px + 10, Y(2) + 34, { px: 14 });
    }
    // 장소 이름
    const lab = (xk, text, col) => { const p = this.sx(xk, g); if (p > -120 && p < W + 120) tag(c, text, p, Y(-g.clr) + 22, { align: 'center', px: 14, color: col }); };
    lab(-0.8, '영동 · 동해 바다', '#3D5A86'); lab(7.9, '영서 관측소', '#9A5634');
    const stx = this.sx(7.9, g);
    if (stx > -60 && stx < W + 60) {
      const gy = Y(-g.clr);
      c.fillStyle = '#EAF1FA'; c.strokeStyle = '#8FB0D2'; c.lineWidth = 2.5;
      c.beginPath(); c.roundRect(stx - 24, gy - 34, 48, 32, 6); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(stx, gy - 34); c.lineTo(stx, gy - 54); c.stroke();
      c.fillStyle = '#F3B589'; c.beginPath(); c.arc(stx, gy - 56, 4, 0, TAU); c.fill();
    }
    // 영동 쪽 비탈의 구름 (3장 강수부터 — 뭉게 뒤로 계속 밀려 올라온 공기에도 물방울이 생김)
    if (this.raining || this.rainOut > 0) {
      for (let uu = H0 + 0.05; uu <= 1.95; uu += 0.13) {
        const p = this.sx(this.xAt(uu), g); if (p < -60 || p > W + 60) continue;
        drawCloudBlob(c, p, Y(this.hAt(uu) - 0.04), g.r0 * 0.42, Math.round(uu * 37), t, 0.5);
      }
    }
    // 빗줄기
    c.strokeStyle = 'rgba(78,115,168,.7)'; c.lineWidth = 2.2; c.lineCap = 'round';
    this.rain.forEach(d => { const p = this.sx(d.x, g), y = Y(d.h); c.beginPath(); c.moveTo(p, y); c.lineTo(p - 2, y + 12); c.stroke(); });
    drawRuler(c, Y, 2);
    if (this.flash > 0) {   // 응결 순간: 뭉게 둘레가 잠깐 빛남
      c.save(); c.strokeStyle = `rgba(78,115,168,${clamp(this.flash / 2.5, 0, 1) * 0.7})`; c.lineWidth = 5;
      c.beginPath(); c.arc(M.x, M.y, M.r + 14 + (S.set.reduce ? 0 : (2.5 - this.flash) * 8), 0, TAU); c.stroke(); c.restore();
    }
    M.draw(c, t);
    Bubble.draw(c);
    if (Peek.on) Peek.draw(c, t);
    else { c.save(); c.font = font(13, 500); c.fillStyle = COL.sub; c.fillText(g.narrow ? '※ 크기 변화는 모식 표현' : '뭉게의 크기 변화는 이해를 돕기 위한 모식 표현이에요', 14, g.top + 2); c.restore(); }
  },
};

/* ============================================================
   2부 장면 — 같은 출발 조건의 뭉게를 손으로 들어 올렸다가(외부 작용) 놓아줌
   판정 = 놓은 높이에서 '같은 높이의 두 기온' 비교 (화면 위쪽 도달은 판정에 쓰지 않음)
   ============================================================ */
const AIR = { A: 4, B: 8, C: 12 };   // 주위 기온 감률(℃/km) — 이름은 관찰 뒤에 붙임
const Sky = {
  T0: 20, Td0: 12, gamma: 8, name: 'A', u: 0, target: 0, uMin: 0, uMax: 0, drive: 0, dragging: false,
  mode: 'idle', v: 0, watchT: 0, outcome: '', over: false, nRel: 0, banner: 0,
  setup(o) { Object.assign(this, { T0: 20, Td0: 12, gamma: 8, name: 'A' }, o); this.banner = 4.5; },
  enter() { this.reset(); },
  reset() { Object.assign(this, { u: 0, target: 0, v: 0, mode: 'idle', over: false, drive: 0, dragging: false }); },
  Tp(h) { return riseState(this.T0, this.Td0, h).T; },     // 같은 높이에서 뭉게(공기 덩어리) 기온
  Te(h) { return envTemp(this.T0, this.gamma, h); },        // 같은 높이에서 주위 기온
  geo() {
    const b = sceneBand();
    if (!b.narrow) b.top = Math.max(b.top, 168);   // 오른쪽 위 관찰값 아래에서 주위 기온 기둥 시작
    const k = clamp((b.bot - b.top) / 3.4 / 230, 0.6, 1.1), r0 = TUNING.mungge.baseR * k;
    const y0 = b.bot - r0 * 1.2, pxY = (y0 - b.top - r0 * 1.2) / 3;
    const colW = b.narrow ? 116 : 150, colX = W - 14 - colW;
    const px = b.narrow ? Math.max(W * 0.33, r0 * 1.7 + 64) : clamp(W * 0.36, 230, colX - 260);
    return { ...b, r0, y0, pxY, px, colX, colW };
  },
  startLift(h) { this.reset(); this.uMin = 0; this.uMax = h; this.mode = 'lift'; },
  holdAt(h) { this.reset(); this.u = this.target = h; this.mode = 'hold'; },
  release() {
    this.mode = 'release'; this.v = 0; this.watchT = 0;
    const b = this.Tp(this.u) - this.Te(this.u);
    this.outcome = b > 0.05 ? 'rise' : b < -0.05 ? 'return' : 'stay';
  },
  update(dt) {
    const g = this.geo();
    if (this.mode === 'lift') {
      if (this.drive) this.target = this.uMax;
      const dir = Math.sign(this.target - this.u);
      if (dir) {
        const v = (this.dragging ? TUNING.move.dragKmPerSec : TUNING.move.riseKmPerSec) * dt;
        this.u = clamp(Math.abs(this.target - this.u) <= v ? this.target : this.u + dir * v, 0, this.uMax);
      }
      if (this.u >= this.uMax - 1e-9) {
        this.u = this.uMax; this.mode = 'hold'; this.drive = 0; this.dragging = false; M.held = false; stopHold();
        this.sync(g); actDone('lifted'); return;
      }
    } else if (this.mode === 'release') {
      const b = this.Tp(this.u) - this.Te(this.u);
      this.v = clamp(this.v + (TUNING.p2.buoyAccel * b - TUNING.p2.damping * this.v) * dt, -1.2, 1.2);   // 화면 연출용 속도 상한
      this.u = Math.max(0, this.u + this.v * dt);
      if (this.u === 0 && this.v < 0) this.v = 0;
      if (this.u > 3.1) { this.u = 3.1; this.over = true; }   // 화면 범위를 넘으면 '위로 계속'으로만 표시
      this.watchT += dt;
      const settled = this.u < 0.002 && Math.abs(this.v) < 0.02;
      if (this.watchT >= TUNING.p2.watchSec || (settled && this.watchT > 1.0)) { this.mode = 'done'; this.nRel++; actDone('released', this.outcome); }
    }
    if (this.banner > 0) this.banner -= dt;
    this.sync(g);
    const el = $('relStat'); if (el) { const s = this.status(); if (el.textContent !== s) el.textContent = s; }
  },
  sync(g) {
    const h = Math.min(this.u, 3.1), st = riseState(this.T0, this.Td0, h), cond = condensedFrac(this.T0, this.Td0, h);
    simSet({ h, T: st.T, Td: st.Td, T0: this.T0, cond, rainOut: 0, cu: st.saturated ? cuOf(cond) : 0, env: this.Te(h), phase: 'up' });
    M.r0 = g.r0; M.x = g.px; M.y = g.y0 - Math.min(this.u, 3.0) * g.pxY;
    M.visible = !this.over;
  },
  // 움직이는 방향과 '뜨려는/가라앉으려는 경향'을 구별해서 표시
  status() {
    if (this.mode === 'lift') return '손이 들어 올리는 중 (외부 작용)';
    if (this.mode === 'hold') return '손으로 잡고 있어요';
    if (this.mode === 'release' || this.mode === 'done') {
      const b = this.Tp(this.u) - this.Te(this.u), v = this.v;
      if (this.over) return '↑ 화면 위로 계속 올라가요 — 지금도 주위보다 따뜻해요';
      if (this.u < 0.002 && Math.abs(v) < 0.03) return '↓ 지표로 돌아왔어요';
      if (v > 0.03) return b >= 0 ? '↑ 올라가는 중 — 주위보다 따뜻해요' : '↑ 아직 올라가지만 느려지는 중 — 지금은 주위보다 차가워요';
      if (v < -0.03) return b <= 0 ? '↓ 내려가는 중 — 주위보다 차가워요' : '↓ 아직 내려가지만 느려지는 중 — 지금은 주위보다 따뜻해요';
      return '거의 멈췄어요';
    }
    return '';
  },
  pd(x, y) { if (this.mode === 'lift' && Math.hypot(x - M.x, y - M.y) < Math.max(TUNING.grabRadius, M.r + 30)) { this.dragging = true; M.held = true; this.dragTo(y); } },
  pm(x, y) { if (this.dragging) this.dragTo(y); },
  pu() { if (this.dragging) { this.dragging = false; M.held = false; this.target = this.u; } },
  dragTo(y) { const g = this.geo(); this.target = clamp((g.y0 - y) / g.pxY, 0, this.uMax); },
  draw(c, t) {
    const g = this.geo(), Y = h => g.y0 - h * g.pxY;
    skyGrad(c, '#D3E3F1', '#F8F1E4');
    c.fillStyle = '#D8E8D2'; c.fillRect(0, Y(0) + g.r0 * 1.05, W, H);
    for (let h = 0.5; h <= 3 + 1e-9; h += 0.5) hLine(c, Y(h), 0, g.colX - 8, 'rgba(89,72,63,.10)', [], 1);
    drawRuler(c, Y, 3);
    const Hc = lclHeight(this.T0, this.Td0);
    hLine(c, Y(Hc), 0, g.colX - 8, 'rgba(78,115,168,.6)', [10, 8], 2);
    tag(c, `${kf(Hc)} km · 구름이 생기기 시작하는 높이`, 96, Y(Hc) - 18, { px: 13, color: '#3D5A86' });
    if (this.mode === 'lift') {
      hLine(c, Y(this.uMax), 0, g.colX - 8, 'rgba(199,109,72,.75)', [12, 9], 2.5);
      tag(c, `${kf(this.uMax)} km까지 들어 올리기`, g.px + g.r0 * 1.6 + 10, Y(this.uMax) - 18, { px: 14, color: '#A9532F' });
    }
    // 주위 기온 (높이별) — 오른쪽 기둥
    c.save(); c.font = font(13, 700); c.fillStyle = COL.Env; c.textAlign = 'center';
    c.fillText(`대기 ${this.name}의 주위 기온`, g.colX + g.colW / 2, Y(3) - 24); c.restore();
    for (let h = 0; h <= 3 + 1e-9; h += 0.5) {
      const y = Y(h);
      c.fillStyle = 'rgba(255,252,247,.82)'; c.strokeStyle = 'rgba(79,99,112,.35)'; c.lineWidth = 1.2;
      c.beginPath(); c.roundRect(g.colX, y - 13, g.colW, 26, 9); c.fill(); c.stroke();
      c.font = font(14, 600); c.fillStyle = COL.Env; c.textAlign = 'right'; c.textBaseline = 'middle';
      c.fillText(`주위 ${nf(this.Te(h))}℃`, g.colX + g.colW - 10, y + 1); c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    }
    // 같은 높이의 두 기온 — 뭉게에서 주위 기둥까지 이어 비교
    if (this.mode !== 'idle' && !this.over) {
      const y = M.y, Tp = this.Tp(this.u), Te = this.Te(this.u);
      hLine(c, y, M.x + M.r + 6, g.colX - 4, 'rgba(79,99,112,.55)', [4, 5], 2);
      tag(c, `뭉게 ${nf(Tp)}℃`, M.x + M.r + 12, y - 16, { px: 15, color: COL.T, border: '#E8B9A2' });
      tag(c, g.narrow ? `주위 ${nf(Te)}℃` : `같은 높이의 주위 ${nf(Te)}℃`, g.colX + g.colW, y, { px: 15, align: 'right', color: '#FFFFFF', bg: COL.Env, border: COL.Env });
      // 경향 화살표: 같은 높이에서 주위보다 따뜻하면 위로, 차가우면 아래로 향하는 힘
      if (this.mode === 'hold' || this.mode === 'release' || this.mode === 'done') {
        const up = Tp > Te + 0.05, dn = Tp < Te - 0.05, ax = M.x - M.r - 22;
        if ((up || dn) && ax > 70) {
          c.save(); c.strokeStyle = COL.ink; c.fillStyle = COL.ink; c.lineWidth = 3;
          const y1 = y + (up ? 18 : -18), y2 = y + (up ? -18 : 18);
          c.beginPath(); c.moveTo(ax, y1); c.lineTo(ax, y2); c.stroke();
          c.beginPath(); c.moveTo(ax - 7, y2 + (up ? 8 : -8)); c.lineTo(ax, y2); c.lineTo(ax + 7, y2 + (up ? 8 : -8)); c.stroke();
          c.font = font(12, 600); c.textAlign = 'center'; c.fillText(up ? '뜨려는 힘' : '가라앉으려는 힘', ax, y2 + (up ? -8 : 18)); c.restore();
        }
      }
    }
    // 손(외부 작용)
    if ((this.mode === 'lift' || this.mode === 'hold') && M.visible) {
      const hx = M.x, hy = M.y - M.r - 6;
      c.save(); c.fillStyle = '#F6D5BE'; c.strokeStyle = '#B98A6E'; c.lineWidth = 2;
      c.beginPath(); c.roundRect(hx - 15, hy - 18, 30, 20, 8); c.fill(); c.stroke();
      for (let i = 0; i < 4; i++) { c.beginPath(); c.roundRect(hx - 15 + i * 7.6, hy - 32, 6.4, 18, 3); c.fill(); c.stroke(); }
      c.restore();
      tag(c, '손으로 잡는 중', hx + 22, hy - 22, { px: 13 });
    }
    if (this.over) {
      c.save(); c.strokeStyle = COL.T; c.lineWidth = 5; const ay = Y(2.9) + (S.set.reduce ? 0 : Math.sin(t * 6) * 4);
      c.beginPath(); c.moveTo(g.px, ay + 40); c.lineTo(g.px, ay); c.moveTo(g.px - 12, ay + 14); c.lineTo(g.px, ay); c.lineTo(g.px + 12, ay + 14); c.stroke(); c.restore();
      tag(c, '화면 위로 계속 올라가요', g.px + 20, ay + 20, { px: 14, color: '#A9532F' });
    }
    c.save(); c.font = font(13, 600); c.fillStyle = COL.sub;
    c.fillText(`출발 조건: 지표 ${nf(this.T0)}℃ · 이슬점 ${nf(this.Td0)}℃ · 대기 ${this.name}`, 14, Y(0) + g.r0 * 1.05 + 22); c.restore();
    if (this.banner > 0) {
      c.save(); c.globalAlpha = clamp(this.banner / 0.6, 0, 1);
      if (g.narrow) tag(c, `새 조건 · ${nf(this.T0)}℃ · 이슬점 ${nf(this.Td0)}℃ · 대기 ${this.name}`, 10, Y(2.6), { px: 14, bg: '#FFF4DA', border: '#E9C98F' });
      else tag(c, `새로운 출발 조건 — 지표 ${nf(this.T0)}℃ · 이슬점 ${nf(this.Td0)}℃ · 대기 ${this.name}`, (g.px + g.colX) / 2, Y(2.6), { px: 16, align: 'center', bg: '#FFF4DA', border: '#E9C98F' });
      c.restore();
    }
    M.draw(c, t);
    Bubble.draw(c);
    if (Peek.on) Peek.draw(c, t);
  },
};

/* ---------- 2부 흐름 도우미 ---------- */
function newConditions() { Sky.banner = 4.5; toast(`새로운 출발 조건 · 지표 ${nf(Sky.T0)}℃ · 이슬점 ${nf(Sky.Td0)}℃ · 대기 ${Sky.name}`, true, 3200); }
async function liftTo(h) {
  Sky.startLift(h);
  holdAct('⬆ 조금 더 올라가기', `뭉게를 <b>${kf(h)} km</b>까지 들어 올려 줘 <small>— 지금은 손(외부 작용)이 올리는 중</small>`, Sky);
  await waitAct('lifted');
  setAct(null); AudioSys.sBadge();
}
async function letGo(h) {
  const Tp = Sky.Tp(h), Te = Sky.Te(h);
  setAct(`<div class="msg">같은 높이 <b>${kf(h)} km</b> — 뭉게 <b class="tT">${nf(Tp)}℃</b> · 주위 <b class="tE">${nf(Te)}℃</b></div><button class="btn mint" id="relBtn">🖐 놓아주기</button>`);
  await waitClick('relBtn');
  setAct('<div class="msg" id="relStat">손을 놓았어요</div>');
  Sky.release();
  const out = await waitAct('released');
  setAct(null);
  return out;
}
function reactLines(h, out) {
  const Tp = Sky.Tp(h), Te = Sky.Te(h), sat = riseState(Sky.T0, Sky.Td0, h).saturated;
  const cmp = `${kf(h)} km에서 나는 ${nf(Tp)}℃, 같은 높이의 주위 공기는 ${nf(Te)}℃였어.`;
  if (out === 'return') return [
    { face: 'surprised', text: h <= 0.5 ? '방금 출발했는데 벌써 돌아왔네.' : sat ? '물방울이 생겼는데도 돌아왔어.' : '다시 내려왔어.' },
    { face: 'normal', text: `${cmp} 주위보다 차가운 공기는 밀도가 커서 아래로 돌아와.` },
  ];
  if (out === 'rise') return [
    { face: 'surprised', text: '어, 손을 놓았는데도 계속 올라가!' },
    { face: 'normal', text: `${cmp} 주위보다 따뜻한 공기는 밀도가 작아서 위로 올라가.` },
  ];
  return [{ face: 'think', text: `${cmp} 두 기온이 같아서 거의 그 자리에 머물러.` }];
}
// 들어 올리기 → 같은 높이 비교 → (예상) → 놓아주기 → 관찰 → 반응
async function liftTrial(key, h) {
  await liftTo(h);
  const Tp = Sky.Tp(h), Te = Sky.Te(h), sat = riseState(Sky.T0, Sky.Td0, h).saturated;
  const exp = Tp - Te > 0.05 ? 'rise' : Tp - Te < -0.05 ? 'return' : 'stay';
  await say([{ face: 'normal', text: `${kf(h)} km에서 잡고 있어. 나는 <b>${nf(Tp)}℃</b>, 같은 높이의 주위 공기는 <b>${nf(Te)}℃</b>야.${sat ? ' 내 안에는 물방울이 생겼어.' : ''}` }]);
  const cmp = `${kf(h)} km에서 뭉게는 ${nf(Tp)}℃, 주위는 ${nf(Te)}℃였어.`;
  const PP = {
    q: `같은 높이 <b>${kf(h)} km</b> — 뭉게 <b class="tT">${nf(Tp)}℃</b> · 주위 <b class="tE">${nf(Te)}℃</b><br>손을 놓으면 뭉게는 어떻게 움직일까?`, short: `대기 ${Sky.name} · ${kf(h)} km에서 놓으면`,
    opts: ['위로 계속 올라간다', '그 자리에 머문다', '아래로 돌아온다'], ans: exp === 'rise' ? 0 : exp === 'return' ? 2 : 1,
    real: exp === 'rise' ? '위로 계속 올라감' : exp === 'return' ? '아래로 돌아옴' : '머묾',
    okFb: '같은 높이의 두 기온을 비교해서 맞혔어.',
    fb: [`위로 올라갈 거라고 예상했구나. ${cmp} 같은 높이에서 어느 쪽이 더 따뜻했는지 다시 보자.`,
      `그 자리에 머물 거라고 예상했구나. ${cmp} 두 기온이 같지 않았지.`,
      `아래로 돌아올 거라고 예상했구나. ${cmp} 주위보다 따뜻한 공기는 어떻게 움직였지?`],
  };
  await predict(key, PP);
  const out = await letGo(h);
  await say([...reactLines(h, out), predLine(key, PP)]);
  return { h, Tp, Te, out };
}
// 같은 조건으로 다시 해 보기 (진행 조건 아님) → 다음 이야기
async function trialMenu(hs, next) {
  for (;;) {
    setAct(`<div class="msg">같은 조건으로 다시 해 봐도 좋아요</div><div class="row2">
      ${hs.map((h, i) => `<button class="btn sub" data-h="${i}" id="again${i}">↺ ${kf(h)} km에서 다시</button>`).join('')}
      <button class="btn" id="nextBtn">다음 이야기 ➜</button></div>`);
    const pick = await guard(new Promise(res => {
      hs.forEach((h, i) => onClick(`again${i}`, () => res(h)));
      onClick('nextBtn', () => res('next'));
    }));
    if (pick === 'next') break;
    await liftTo(pick);
    const out = await letGo(pick);
    Bubble.show(out === 'rise' ? '역시 계속 올라가!' : out === 'return' ? '이번에도 돌아왔어.' : '거의 그대로야.', 2.4);
  }
  setAct(null);
  S.rec.done[S.chapter] = true; Store.save();
  if (next === 'end') showResults(2); else startChapter(next);
}

// 7장: 다른 조건의 여행 — 출발 기온 20℃ 고정, 이슬점·산 높이를 바꿔 자유롭게 비교 (목표 과제 없음)
const LabScene = {
  Td0: SCENARIO.Td0, Mkm: SCENARIO.TOP, u: -1, result: null,
  geom() {
    const b = sceneBand(), gy = b.bot - 6, top = b.top + 70;
    const x0 = b.narrow ? 70 : Math.max(W * 0.45, 570), x1 = W - 64;
    return { gy, x0, xp: lerp(x0, x1, 0.48), x1, ky: h => gy - h * (gy - top) / 3.2, narrow: b.narrow, top: b.top };
  },
  slope(s) { const g = this.geom(); return s <= 1 ? { x: lerp(g.x0, g.xp, s), h: this.Mkm * s } : { x: lerp(g.xp, g.x1, s - 1), h: this.Mkm * (2 - s) }; },
  trip() { return foehnTrip(SCENARIO.T0, this.Td0, this.Mkm); },
  stateAt(s) { const p = this.slope(s), f = this.trip(); return s <= 1 ? riseState(SCENARIO.T0, this.Td0, p.h) : descendFrom(f.topT, f.topTd, this.Mkm, p.h); },
  enter() { M.visible = true; this.u = -1; this.result = null; },
  setCond(Td, Mk) { this.Td0 = Td; this.Mkm = Mk; this.u = -1; this.result = null; },
  send() { this.result = null; this.u = 0; AudioSys.sWhoosh(); return waitAct('labDone'); },
  update(dt) {
    const g = this.geom();
    let s = 0;
    if (this.u >= 0) {
      this.u = Math.min(1, this.u + dt / (S.set.reduce ? 1.2 : 3.6)); s = this.u * 2;
      if (this.u >= 1) { this.u = -1; s = 2; this.result = this.trip(); actDone('labDone', this.result); }
    } else if (this.result) s = 2;
    const p = this.slope(s), st = this.stateAt(s), cond = s <= 1 ? condensedFrac(SCENARIO.T0, this.Td0, p.h) : 0;
    simSet({ h: p.h, T: st.T, Td: st.Td, T0: SCENARIO.T0, cond, rainOut: 0, cu: 0, env: null, phase: s <= 1 ? 'up' : 'down' });
    M.r0 = TUNING.mungge.baseR * 0.62; M.x = p.x; M.y = g.ky(p.h) - M.r0 * 1.1;
  },
  draw(c, t) {
    const g = this.geom(), f = this.trip();
    skyGrad(c, '#CFE4F3', '#FBF3E6');
    c.fillStyle = '#BFDDEE'; c.fillRect(0, g.gy, g.x0, H - g.gy);
    c.fillStyle = '#F2E6CC'; c.fillRect(g.x0, g.gy, W - g.x0, H - g.gy);
    c.save(); c.strokeStyle = 'rgba(89,72,63,.3)'; c.fillStyle = COL.sub; c.font = font(13, 600); c.lineWidth = 1.5; c.textAlign = 'right';
    for (let h = 0; h <= 3; h += 1) { const y = g.ky(h); c.beginPath(); c.moveTo(g.x0 - 30, y); c.lineTo(g.x0 - 12, y); c.stroke(); c.fillText(`${h} km`, g.x0 - 34, y + 5); }
    c.restore();
    const pk = g.ky(this.Mkm);
    c.fillStyle = '#CFE5D2'; c.strokeStyle = '#9DC4A8'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(g.x0 - 10, g.gy); c.lineTo(g.xp - 16, pk + 10); c.quadraticCurveTo(g.xp, pk - 6, g.xp + 16, pk + 10); c.lineTo(g.x1 + 10, g.gy); c.closePath(); c.fill(); c.stroke();
    tag(c, `산 ${fmt1(this.Mkm)} km`, g.xp, pk - 48, { px: 14, align: 'center' });
    const yH = g.ky(f.H);
    hLine(c, yH, g.x0 - 40, W, 'rgba(78,115,168,.75)', [8, 7], 2);
    tag(c, `상승 응결 고도 H = ${fmt2(f.H)} km`, g.x1, yH - 16, { px: 13, align: 'right', color: '#3D5A86' });
    if (f.cloud) {
      const s0 = f.H / this.Mkm;
      for (let k = 0; k <= 4; k++) {
        const sp = this.slope(lerp(s0, 1, k / 4) * 0.96 + 0.02), y = g.ky(sp.h) - 22;
        c.strokeStyle = 'rgba(78,115,168,.6)'; c.lineWidth = 2; c.lineCap = 'round';
        for (let j = 0; j < 3; j++) { const rx = sp.x - 16 + j * 14, ry = y + 16 + ((S.set.reduce ? 6 : t * 90) + j * 13 + k * 7) % 20; c.beginPath(); c.moveTo(rx, ry); c.lineTo(rx - 2, ry + 8); c.stroke(); }
        drawCloudBlob(c, sp.x, y, 17, 3 + k * 4, t, 0.92);
      }
    } else if (Math.abs(f.H - this.Mkm) < 1e-6) drawCloudBlob(c, g.xp, pk - 20, 11, 9, t, 0.85);
    if (this.result || this.u >= 0) {
      const sEnd = this.result ? 2 : this.u * 2, sH = f.cloud ? f.H / this.Mkm : 1;
      const seg = (a, b, col, dash) => {
        if (sEnd <= a) return;
        c.save(); c.strokeStyle = col; c.lineWidth = 4; c.lineCap = 'round'; c.setLineDash(dash || []); c.beginPath();
        for (let k = 0; k <= 20; k++) { const sp = this.slope(lerp(a, Math.min(b, sEnd), k / 20)), y = g.ky(sp.h) - 6; k ? c.lineTo(sp.x, y) : c.moveTo(sp.x, y); }
        c.stroke(); c.restore();
      };
      seg(0, sH, COL.T); seg(sH, 1, '#E9A47E'); seg(1, 2, COL.T, [10, 6]);
    }
    if (!g.narrow) {
      tag(c, `영동 출발: 기온 20℃ · 이슬점 ${this.Td0}℃`, g.x0, g.top + 100, { px: 15, color: '#3D5A86' });
      tag(c, this.result ? `영서 도착: 기온 ${nf(f.arrT)}℃ · 이슬점 ${nf(f.arrTd)}℃` : '영서 도착: 기온 ?℃', g.x1 + 40, g.top + 140, { px: 15, align: 'right', color: '#9A5634' });
    }
    M.draw(c, t);
  },
};
function labPanel(html) { const p = $('labPanel'); p.innerHTML = html; p.classList.add('on'); }
function labRow(r) {

function labTable(rows) {

}
function labFree() {
  return guard(new Promise(res => {
    let Td = LabScene.Td0, Mk = LabScene.Mkm, busy = false;
    const PRESET = [['이슬점 8℃', 8, null], ['이슬점 16℃', 16, null], ['산 0.8 km', null, 0.8], ['산 1.0 km', null, 1.0], ['산 2.5 km', null, 2.5]];
    const render = () => {
      const runs = S.rec.lab.slice(-5);
      labPanel(`<div class="row"><b>다른 조건의 여행</b><span class="lock">출발 기온 20℃</span></div>
        <div class="row presets">${PRESET.map((p, i) => `<button data-p="${i}">${p[0]}</button>`).join('')}</div>
        <div class="row"><label for="lTd">출발 이슬점</label><input type="range" id="lTd" min="4" max="19" step="1" value="${Td}"><b id="lTdV">${Td}℃</b></div>
        <div class="row"><label for="lM">산 높이</label><input type="range" id="lM" min="0.5" max="3" step="0.1" value="${Mk}"><b id="lMV">${kf(Mk)} km</b></div>
        <div class="row"><button class="btn mint" id="labGo">보내기 ▶</button><button class="btn sub" id="labEnd">1부 마치기</button></div>
        ${runs.length ? `<div class="labTbl">${labTable(runs.map(labRow))}</div>` : '<p class="note">한 가지 조건만 바꿔 여러 번 보내 보고 결과를 비교해 봐요.</p>'}`);
      $('lTd').addEventListener('input', e => { Td = Number(e.target.value); $('lTdV').textContent = `${Td}℃`; LabScene.setCond(Td, Mk); });
      $('lM').addEventListener('input', e => { Mk = Math.round(Number(e.target.value) * 10) / 10; $('lMV').textContent = `${kf(Mk)} km`; LabScene.setCond(Td, Mk); });
      document.querySelectorAll('#labPanel [data-p]').forEach(b => b.addEventListener('click', e => {

/* ============================================================
   그래프 (관찰 기록·비교에서 크게)
   ============================================================ */
function trailSeries() {
  const out = [], SUM = { color: '#BDB2A6', dash: '2 6', w: 3, sum: true };
  if (Trail.sumUp > 0) { const u = upSeg(0, Trail.sumUp); out.push({ ...SUM, pts: u.T }, { ...SUM, pts: u.Td }); }
  if (Trail.sumDown) { const d = downSeg(0); out.push({ ...SUM, pts: d.T }, { ...SUM, pts: d.Td }); }
  const a = Math.min(Trail.sumUp, Trail.maxUpAlt);
  const up = Trail.maxUpAlt > a + 1e-6 ? upSeg(a, Trail.maxUpAlt) : null;
  const dn = Trail.downStarted && !Trail.sumDown && Trail.minDownAlt < SCENARIO.TOP - 1e-6 ? downSeg(Trail.minDownAlt) : null;
  if (up) out.push({ pts: up.T, color: COL.T, w: 4 });
  if (dn) out.push({ pts: dn.T, color: COL.T, w: 4, dash: '12 7' });
  if (up) out.push({ pts: up.Td, color: COL.Td, w: 3.5, dash: '1 7', cap: 'round' });
  if (dn) out.push({ pts: dn.Td, color: COL.Td, w: 3.5, dash: '1 7', cap: 'round' });
  return out;
}
const LEG_TRAIL = [[COL.T, '', '기온 (오를 때)'], [COL.T, '12 7', '기온 (내려올 때)'], [COL.Td, '1 7', '이슬점'], ['#BDB2A6', '2 6', '앞선 여정 요약']];
function bigGraph(o = {}) {
  const tMin = o.tMin ?? 0, tMax = o.tMax ?? 30, hMax = o.hMax ?? 2.2;
  const L = 70, R = 540, T = 20, B = 318;
  const X = t => L + (t - tMin) / (tMax - tMin) * (R - L), Y = h => B - h / hMax * (B - T);
  const P = pts => pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  let g = '';
  for (let t = Math.ceil(tMin / 5) * 5; t <= tMax + 1e-9; t += 5)
    g += `<line x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${B}" stroke="#F0E3D4"/>` + (t % 10 === 0 ? `<text x="${X(t)}" y="${B + 22}" text-anchor="middle" font-size="15" fill="#78675B">${t}℃</text>` : '');
  for (let h = 0; h <= hMax + 1e-9; h += 0.5)
    g += `<line x1="${L}" y1="${Y(h)}" x2="${R}" y2="${Y(h)}" stroke="#F0E3D4"/><text x="${L - 8}" y="${Y(h) + 5}" text-anchor="end" font-size="15" fill="#78675B">${h.toFixed(1)} km</text>`;
  g += `<line x1="${L}" y1="${T - 6}" x2="${L}" y2="${B}" stroke="#C9B49A" stroke-width="2"/><line x1="${L}" y1="${B}" x2="${R + 6}" y2="${B}" stroke="#C9B49A" stroke-width="2"/>`;
  (o.guides || []).forEach(gd => {
    g += `<line x1="${L}" y1="${Y(gd.h)}" x2="${R}" y2="${Y(gd.h)}" stroke="${gd.color || '#8FB0D2'}" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="${R - 4}" y="${Y(gd.h) - 6}" text-anchor="end" font-size="14" fill="${gd.color || '#3D5A86'}">${gd.label}</text>`;
  });
  (o.series || trailSeries()).forEach(sr => {
    g += `<path d="${P(sr.pts)}" fill="none" stroke="${sr.color}" stroke-width="${sr.w || 4}" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''} stroke-linecap="${sr.cap || 'round'}"/>`;
  });
  (o.marks || []).forEach(m => {
    g += `<circle cx="${X(m.a[0])}" cy="${Y(m.a[1])}" r="5" fill="${m.color || COL.ink}"/>`
      + (m.label ? `<text x="${X(m.a[0]) + (m.dx ?? 8)}" y="${Y(m.a[1]) + (m.dy ?? -8)}" font-size="14" fill="${m.color || COL.ink}" text-anchor="${m.anchor || 'start'}">${m.label}</text>` : '');
  });
  (o.pins || []).forEach(p => {
    g += `<g class="pin${p.sel ? ' sel' : ''}${p.sum ? ' sum' : ''}" data-id="${p.id}" tabindex="0" role="button" aria-label="${p.aria}">

const CH_START_U = [0, 0.5, H0, 2, 2, 4, 4, 4];
function trailAtChapterStart(ch) {
  if (partOf(ch) !== 1) return;
  const u = CH_START_U[ch], up = Math.min(u, 2);
  if (Trail.maxUpAlt > up) Trail.maxUpAlt = up;
  Trail.condensed = Trail.maxUpAlt >= H0 - 1e-6 || Trail.sumUp >= H0;
  if (ch <= 4 && !Trail.sumDown) { Trail.downStarted = false; Trail.minDownAlt = SCENARIO.TOP; }
  MiniGraph.lastKey = '';
}
function startChapter(i) {
  S.runId++;

  if (g < 5) return '절대 안정';
  if (g === 5) return '경계(5): 포화 공기에 대해 중립';
  if (g < 10) return '조건부 불안정';
  if (g === 10) return '경계(10): 불포화 공기에 대해 중립';
  return '절대 불안정';
}
function freeSky() {
  S.runId++; S.screen = 'play'; S.chapter = 12; S.paused = false; Dialog.abort(); actWait = null;
  hideOverlay(); setAct(null); MiniGraph.setVisible(false); $('labPanel').classList.remove('on');
  renderProgress();
  AudioSys.startBgm('sea');
  let g = 8, h = 2.0;
  Sky.setup({ gamma: g, name: 'X' }); Sky.banner = 0; setScene(Sky);
  const sp = $('simPanel');
  const render = msg => {
    const lfc = lfcHeight(20, 12, g);
    sp.innerHTML = `<div class="row"><b>2부 자유 실험</b><span class="lock">출발 20℃ · 이슬점 12℃</span></div>
      <div class="row"><label for="fsG">주위 기온 감률</label><input type="range" id="fsG" min="3" max="12" step="0.5" value="${g}"><b>${nf(g)}℃/km</b></div>
      <div class="row">이름: <b>${stabName(g)}</b></div>
      <div class="row note">${lfc === null ? '어느 높이에서도 주위보다 따뜻해지지 않아요' : lfc === 0 ? '지표 근처부터 주위보다 따뜻해져요' : `약 ${kf(lfc)} km부터 주위보다 따뜻해져요 (구름은 ${kf(H0)} km부터)`}</div>
      <div class="row"><label>놓을 높이</label><span class="stepper"><button id="fsDn" aria-label="높이 낮추기">−</button><span class="val">${kf(h)}</span><button id="fsUp" aria-label="높이 높이기">+</button></span>km
        <button class="btn mint" id="fsGo">올려서 놓기 ▶</button></div>
      <div id="fsMsg" class="row">${msg || ''}</div>
      <div class="row"><button class="btn sub" id="fsEnd">자유 실험 마치기</button></div>`;
    sp.classList.add('on');
    $('fsG').addEventListener('input', e => { g = Number(e.target.value); Sky.gamma = g; Sky.reset(); render(); });
    onClick('fsDn', () => { h = Math.max(0.25, Math.round((h - 0.25) * 100) / 100); render(); });
    onClick('fsUp', () => { h = Math.min(3, Math.round((h + 0.25) * 100) / 100); render(); });
    onClick('fsGo', () => {
      Sky.gamma = g; Sky.holdAt(h); Sky.release();
      const Tp = Sky.Tp(h), Te = Sky.Te(h), o = Sky.outcome;
      render(`${kf(h)} km: 뭉게 ${nf(Tp)}℃ · 주위 ${nf(Te)}℃ → <b>${o === 'rise' ? '계속 올라가요' : o === 'return' ? '아래로 돌아와요' : '그 자리에 머물러요'}</b>`);
    });
    onClick('fsEnd', () => { sp.classList.remove('on'); showResults(2); });
  };
  render();
}

/* ============================================================
   부팅 · 키보드 · 메인 루프
   ============================================================ */
$('muteBtn').addEventListener('click', () => { AudioSys.ensure(); S.set.sound = !S.set.sound; applySettings(); Store.save(); });
$('setBtn').addEventListener('click', e => { e.preventDefault(); if (Sheet.open) closeSheet(); else showSettings(); });
$('progress').addEventListener('click', e => { e.preventDefault(); askGoHome(); });
$('logBtn').addEventListener('click', e => { e.preventDefault(); if (Sheet.open) closeSheet(); else if (S.screen === 'play') showLog(); else showResults(null); });
$('rotateClose').addEventListener('click', e => { e.stopPropagation(); $('rotateHint').classList.remove('show'); });
document.addEventListener('keydown', e => {
  if (Sheet.open) { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } return; }
  if (S.dialogActive) {                      // 대사: Enter·Space·→ 다음, ← 앞 대사
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); Dialog.tap(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); Dialog.back(); }
    return;
  }
  if ($('overlay').classList.contains('on')) {  // 선택지: 숫자 키
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9) { const b = document.querySelector(`#overlay [data-key="${n}"]`); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
    return;
  }
  // 누르고 있기 조작: ↑ 올라가기 · ↓ 내려가기
  const hc = Hold.cur;
  if (hc && e.key === hc.key && $(hc.id)) { e.preventDefault(); if (!e.repeat) hc.start(); }
});
document.addEventListener('keyup', e => { const hc = Hold.cur; if (hc && e.key === hc.key) hc.end(); });

// 다른 탭으로 가면 시간·소리를 멈춤
let hiddenHold = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !hiddenHold) { hiddenHold = true; stopHold(); AudioSys.freeze(); }
  else if (!document.hidden && hiddenHold) { hiddenHold = false; AudioSys.unfreeze(); lastFrame = performance.now(); }
});
// 세로 화면: 막지 않고 작은 안내만 (한 번 닫으면 다시 뜨지 않음)
if (window.matchMedia && window.matchMedia('(orientation: portrait) and (max-width: 900px)').matches) $('rotateHint').classList.add('show');

let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (hiddenHold) { requestAnimationFrame(loop); return; }
  S.time += dt;
  ctx.clearRect(0, 0, W, H);
  if (scene) {
    if (!S.paused && !S.dialogActive && scene.update) scene.update(dt);
    scene.draw(ctx, S.time);
  }
  if (!S.paused) { M.tick(dt); Bubble.tick(dt); }
  updateParticles(dt);
  drawParticles(ctx);
  if (DEBUG) {
    ctx.save(); ctx.font = font(12, 500); ctx.fillStyle = 'rgba(89,72,63,.85)';
    ctx.fillText(`h ${Sim.h.toFixed(3)} km · T ${Sim.T.toFixed(2)} · Td ${Sim.Td.toFixed(2)} · 부피비 ${Sim.vol.toFixed(3)} · 반지름 ×${M.s.toFixed(3)} · 물방울 ${M.drops} · cu ${Sim.cu}`, 12, H - 8);
    ctx.restore();
  }
  requestAnimationFrame(loop);
}

// 부팅: 저장된 진행 상황 불러오기 → 처음 화면
Store.init();
(() => {
  const d = Store.load();
  if (!d) return;
  try {
    const base = newRecord();
    S.rec = Object.assign(base, d.rec || {});
    S.set = Object.assign(S.set, d.set || {});
    S.started = !!d.started;
    S.chapter = clamp(Number(d.chapter) || 0, 0, CHS.length - 1);
    Trail.restore(d.trail);
  } catch (e) { S.rec = newRecord(); }
})();
resize();
applySettings();
MiniGraph.build();
showTitle();
requestAnimationFrame(loop);
</script>
