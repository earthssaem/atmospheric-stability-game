/* ============================================================
   보너스(8) — 하늘의 성격: 대기 안정도 자유 실험 (교과서 다음 차시 p.95~96)
   ============================================================ */
const Ch8Scene = {
  map: null, gamma: 8, simV: 0, h: 0, pokeIdx: 0, verdict: '',
  settled: true, cloudGrow: 0, stratus: 0,
  enter() {
    this.map = vertMap(2.3);
    M.visible = true; M.coat = false; M.baseFace = 'normal';
    M.place(W * 0.46, this.map.kmToY(0.02));
    this.simV = 0; this.h = 0.02; this.verdict = ''; this.settled = true;
    this.cloudGrow = 0; this.stratus = 0;
    this.readout();
  },
  resize(oldW) {
    refitVert(this, 2.3, oldW);
    if (oldW > 0 && !M.held) { M.y = M.ty = this.map.kmToY(this.h); } // 시뮬레이션 고도(this.h)에 맞춰 다시 놓기
  },
  alt() { return clamp(this.map.yToKm(M.y), 0, 2.3); },
  stabLabel() {
    const s = stability(this.gamma);
    return s === 'stable' ? '절대 안정 (γ < 5)' : s === 'unstable' ? '절대 불안정 (γ > 10)' : '조건부 불안정 (5 ≤ γ ≤ 10)';
  },
  readout(extra) {
    $('gammaVal').textContent = `${fmt1(this.gamma)} ℃/km`;
    $('stabRead').innerHTML = `<b>${this.stabLabel()}</b>${extra ? '<br>' + extra : '<br>뭉게를 찔러 올리거나 끌어올려 보세요!'}`;
  },
  poke() {
    AudioSys.sWhoosh();
    const p = TUNING.ch7.pokePowers;
    this.simV += p[this.pokeIdx % p.length];
    this.pokeIdx++;
    this.settled = false; this.verdict = ''; this.cloudGrow = 0; this.stratus = 0;
    M.setFace('surprised', 0.8);
  },
  setGamma(g) {
    this.gamma = g;
    $('gammaSlider').value = g;
    this.verdict = ''; this.cloudGrow = 0; this.stratus = 0;
    document.querySelectorAll('#simPanel .chip').forEach(ch => ch.classList.toggle('sel', Number(ch.dataset.g) === g));
    this.readout();
  },
  update(dt) {
    if (M.held) this.h = this.alt(); // 드래그 중엔 손 위치가 곧 고도
    const h = this.h;
    const st = riseState(SCENARIO.T0, SCENARIO.Td0, h);
    setMeters(h, st.T, st.Td);
    M.coat = st.saturated;
    M.altKm = h; // 시뮬레이터에서도 팽창/압축
    if (!this.settled && !M.held) M.breathFace();
    if (M.held) { this.simV = 0; this.settled = false; this.verdict = ''; this.cloudGrow = 0; this.stratus = 0; }
    else if (!this.settled) {
      const Tp = st.T, Te = envTemp(SCENARIO.T0, this.gamma, h);
      this.simV += TUNING.ch7.buoyAccel * (Tp - Te) * dt * 3;
      this.simV *= (1 - 0.45 * dt);
      let nh = h + this.simV * dt;
      if (nh <= 0) {
        nh = 0;
        if (Math.abs(this.simV) < 0.08) {
          this.simV = 0; this.settled = true;
          if (!this.verdict) {
            this.verdict = 'stable';
            this.stratus = 0.01;
            AudioSys.sPop();
            if (stability(this.gamma) === 'conditional') {
              const lfc = lfcHeight(SCENARIO.T0, SCENARIO.Td0, this.gamma);
              this.readout(lfc <= 2.2
                ? `제자리로 돌아왔어요 — 이 높이에선 <b>안정</b>하게 행동해요. 손으로 <b>${fmt1(lfc)} km</b> 위까지 끌어올렸다 놓아 보세요!`
                : '제자리로 돌아왔어요 — 이 γ에선 <b>2 km 안에서</b> 스스로 오를 만큼 따뜻해지지 않아요. γ를 더 키워 보세요!');
            } else {
              this.readout('제자리로 돌아왔어요 → <b>안정</b>! 산 등에 밀려 억지로 올라가면 응결 고도 위에 넓게 퍼지는 <b>층운형</b> 구름이 생겨요');
            }
            M.setFace('normal', 2);
          }
        } else this.simV = -this.simV * 0.35;
      }
      if (nh >= 2.25) {
        nh = 2.25;
        if (!this.verdict) {
          this.verdict = 'unstable'; this.cloudGrow = 0.01;
          AudioSys.sSparkle();
          this.readout('계속 솟아올라요 → <b>불안정</b>! 하늘이 부글부글 (뭉게뭉게 <b>적운형</b> 구름 ⛈)');
          M.setFace('happy', 2);
        }
        this.simV = 0;
      }
      this.h = nh;
      M.ty = this.map.kmToY(nh);
      // 상승 중 되돌아옴 감지 도움말 — 자유 대류 고도(LFC)는 γ에 따라 계산
      if (!this.verdict && this.simV < -0.05 && h > 0.3 && stability(this.gamma) === 'conditional') {
        const lfc = lfcHeight(SCENARIO.T0, SCENARIO.Td0, this.gamma);
        this.readout(lfc <= 2.2
          ? `살짝 밀면 돌아오네…? 뭉게를 <b>손으로 ${fmt1(lfc)} km 위까지 끌어올렸다 놓아</b> 보자! (구름 옷을 입으면 달라질지도?)`
          : '살짝 밀면 돌아오네…? 이 γ에선 꽤 높이 올려야 해. <b>γ를 키우고</b> 끌어올렸다 놓아 보자!');
      }
    }
    M.update(dt, 0, this.map.pxPerKm);
    if (this.cloudGrow > 0) this.cloudGrow = Math.min(1, this.cloudGrow + dt * 0.7);
    if (this.stratus > 0) this.stratus = Math.min(1, this.stratus + dt * 0.7);
  },
  pd(x, y) { if (tryGrab(x, y)) { this.simV = 0; } },
  pm(x, y) { dragTo(x, y, 60, W - 60, 60, this.map.groundY - 6); },
  pu() {
    if (M.held) {
      M.held = false; this.h = clamp(this.map.yToKm(M.ty), 0, 2.25);
      this.settled = false; this.verdict = ''; this.simV = 0; this.cloudGrow = 0; this.stratus = 0;
    }
  },
  draw(c, t) {
    // 감률에 따라 하늘 분위기 변화
    const s = stability(this.gamma);
    skyGrad(c, s === 'unstable' ? '#B8C8E8' : s === 'stable' ? '#CFE4EE' : '#C2D8EC', '#F5EFE2');
    c.fillStyle = '#D8E8D2'; c.fillRect(0, this.map.groundY, W, H - this.map.groundY);
    drawAltRuler(c, this.map.kmToY, 2, [{ h: 1.0, label: '응결 고도 1.0 km', color: 'rgba(120,150,220,.8)' }]);
    // 환경 기온 표(오른쪽)
    c.font = '16px Jua'; c.textAlign = 'right';
    for (let h = 0; h <= 2; h += 0.5) {
      const Te = envTemp(SCENARIO.T0, this.gamma, h);
      const Tp = riseState(SCENARIO.T0, SCENARIO.Td0, h).T;
      const y = this.map.kmToY(h);
      c.fillStyle = '#8B6F5C';
      c.fillText(`주위 ${fmt1(Te)}℃`, W - 26, y - 4);
      c.fillStyle = Tp > Te ? '#D97F62' : '#6E86B8';
      c.fillText(`뭉게 ${fmt1(Tp)}℃ ${Tp > Te ? '▲' : Tp < Te ? '▼' : '―'}`, W - 26, y + 16);
    }
    c.textAlign = 'left';
    // 결과 구름 — 구름은 응결 고도(H) 위에서만 생김. 층운형은 H 바로 위에 얇고 넓게 깔림
    if (this.stratus > 0) {
      const H0 = lclHeight(SCENARIO.T0, SCENARIO.Td0);
      c.save(); c.globalAlpha = this.stratus * 0.85;
      c.fillStyle = '#EDF2F5'; c.strokeStyle = '#D5E0E8'; c.lineWidth = 3;
      const baseY = this.map.kmToY(H0) - 4;              // 응결 고도선 바로 위에서부터 쌓음
      for (let i = 0; i < 3; i++) {
        const y = baseY - 20 - i * 16;
        c.beginPath(); c.roundRect(W * 0.18 + i * 24, y, W * 0.5 - i * 48, 20, 12); c.fill(); c.stroke();
      }
      c.restore();
    }
    if (this.cloudGrow > 0) {
      const g = this.cloudGrow;
      c.save(); c.globalAlpha = Math.min(0.9, g);
      for (let i = 0; i < 5; i++) {
        const hh = 1.0 + (1.2 * g) * (i / 4);
        drawCloudBlob(c, M.x + Math.sin(i * 2.4) * 46 * g, this.map.kmToY(hh), 26 + 14 * g, i * 5 + 2, t, 0.9);
      }
      c.restore();
    }
    M.draw(c, t);
  },
};
const ch8 = {
  start(skip) {
    AudioSys.startBgm('sea');
    setScene(Ch8Scene);
    const begin = () => {
      $('simPanel').classList.add('on');
      Ch8Scene.setGamma(8);
      toast('γ 슬라이더를 바꾸고, 뭉게를 쿡! 찔러 보세요', true, 3000);
    };
    if (skip) { begin(); return; }
    Dialog.run([
      { face: 'happy', text: '보너스 실험! 다음 시간에 배울 <span class="kw">대기 안정도</span>를 미리 맛보자. 하늘에도 <b>성격</b>이 있대!' },
      { face: 'normal', text: '주위 공기의 기온이 높이에 따라 얼마나 빨리 식는지 — <span class="kw">기온 감률 γ</span>가 하늘의 성격을 정해.' },
      { face: 'surprised', text: '나를 <b>쿡 찔러 올렸을 때</b>, 주위보다 따뜻하면 <b>둥실 계속 상승</b>! 차가우면 <b>제자리로 폴짝</b> 돌아와.' },
      { face: 'happy', text: '왼쪽 아래 실험판으로 γ를 바꿔 가며 마음껏 실험해 봐! 끝나면 <b>보너스 끝내기</b>를 눌러 줘.' },
    ], begin);
  },
};

/* ============================================================
   최종 화면
   ============================================================ */
function showEnding() {
  const fromBonus = S.chapter === 8;
  $('simPanel').classList.remove('on'); $('labPanel').classList.remove('on');
  S.paused = true;
  AudioSys.startBgm('warm'); AudioSys.sClear();
  const heartsHtml = Array.from({ length: TUNING.hearts }, (_, i) =>
    `<span style="font-size:30px">${i < S.hearts ? '❤️' : '🤍'}</span>`).join('');
  showOverlay(`
    <div class="panel">
      <p class="titleSub">🎓 여정 완주 증서</p>
      <h1 style="font-size:clamp(26px,5vh,38px)">뭉게와 함께 하늘을 건넜습니다!</h1>
      <div style="width:110px;margin:6px auto">${faceSVG('proud')}</div>
      <p>동해 바다(20℃, 상대 습도 60%) → 상승 응결 고도 1.0 km → 태백산맥 정상 2.0 km(5℃) → 영서 지방(25℃, 36%)<br>
      <b>단열 변화 · 건조/습윤 단열 감률 · 이슬점 감률 · 상승 응결 고도 · 응결열 · 푄(높새바람)</b>${fromBonus ? ' · <b>대기 안정도(보너스)</b>' : ''}까지 모두 통과!</p>
      <p style="margin-top:8px">남은 하트 ${heartsHtml} <b>${S.hearts}개</b> — 잘했어요, 최고의 바람 안내자!</p>
      <div>
        <button class="btn sub" id="backSimBtn">🔬 실험 더 하기</button>
        ${fromBonus ? '' : '<button class="btn mint" id="bonusBtn">⛅ 보너스: 대기 안정도 (다음 차시)</button>'}
        <button class="btn" id="toTitleBtn">처음 화면으로</button>
      </div>
      ${FOOTER_HTML}
    </div>`);
  $('backSimBtn').addEventListener('pointerdown', e => {
    e.stopPropagation(); hideOverlay(); S.paused = false;
    $(fromBonus ? 'simPanel' : 'labPanel').classList.add('on');
  });
  if (!fromBonus) $('bonusBtn').addEventListener('pointerdown', e => {
    e.stopPropagation(); AudioSys.sPop(); startChapter(8);
  });
  $('toTitleBtn').addEventListener('pointerdown', e => {
    e.stopPropagation(); showTitle();
  });
}

/* ============================================================
   챕터 배열 · 부팅
   ============================================================ */
const CHAPTERS = [ch0, ch1, ch2, ch3, ch4, ch5, ch6, ch7, ch8];

// 7장 패널 이벤트
$('gammaSlider').addEventListener('input', e => {
  Ch8Scene.gamma = Number(e.target.value);
  document.querySelectorAll('#simPanel .chip').forEach(ch => ch.classList.remove('sel'));
  Ch8Scene.verdict = ''; Ch8Scene.cloudGrow = 0; Ch8Scene.stratus = 0;
  Ch8Scene.readout();
});
document.querySelectorAll('#simPanel .chip').forEach(ch =>
  ch.addEventListener('pointerdown', () => { AudioSys.sPop(); Ch8Scene.setGamma(Number(ch.dataset.g)); }));
$('pokeBtn').addEventListener('pointerdown', () => Ch8Scene.poke());
$('simEndBtn').addEventListener('pointerdown', () => showEnding());
// 7장 푄 실험실 패널
$('labTd').addEventListener('input', e => Ch7Scene.setCond(Number(e.target.value), null));
$('labM').addEventListener('input', e => Ch7Scene.setCond(null, Math.round(Number(e.target.value) * 10) / 10));
$('labMinus').addEventListener('pointerdown', () => { AudioSys.sTick(); Ch7Scene.setGuess(Ch7Scene.guess - 1); });
$('labPlus').addEventListener('pointerdown', () => { AudioSys.sTick(); Ch7Scene.setGuess(Ch7Scene.guess + 1); });
$('labGo').addEventListener('pointerdown', () => Ch7Scene.send());
$('labEndBtn').addEventListener('pointerdown', () => showEnding());
$('muteBtn').addEventListener('pointerdown', () => {
  AudioSys.ensure();
  AudioSys.setMuted(!AudioSys.muted);
  $('muteBtn').textContent = AudioSys.muted ? '🔇' : '🔊';
});

// 세로 화면(회전 안내가 덮고 있을 때)에는 게임을 멈춤 — 안 보이는 동안 하트가 깎이거나 리듬 노트가 지나가지 않게
const portraitMQ = window.matchMedia('(orientation: portrait)');
let rotateHold = false;
function syncRotateHold() {
  if (portraitMQ.matches && !rotateHold) { rotateHold = true; AudioSys.freeze(); }
  else if (!portraitMQ.matches && rotateHold) { rotateHold = false; AudioSys.unfreeze(); }
}
if (portraitMQ.addEventListener) portraitMQ.addEventListener('change', syncRotateHold);
else if (portraitMQ.addListener) portraitMQ.addListener(syncRotateHold); // 구형 Safari

// 메인 루프
let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (rotateHold) { requestAnimationFrame(loop); return; } // 세로 화면: 시간도 멈춤
  S.time += dt;
  ctx.clearRect(0, 0, W, H);
  if (scene) {
    if (!S.paused && !S.dialogActive && scene.update) scene.update(dt);
    scene.draw(ctx, S.time);
  }
  updateParticles(dt);
  drawParticles(ctx);
  requestAnimationFrame(loop);
}

syncRotateHold();
resize();
renderHearts(); renderProgress();
MiniGraph.build();
showTitle();
requestAnimationFrame(loop);
</script>
