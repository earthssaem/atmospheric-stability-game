<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>뭉게의 하늘 여행 — 대기 안정도와 강수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* ============ 기본 ============ */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#FFF8EF;
    font-family:'Jua','Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    touch-action:none; overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
    color:#6B564C;
  }
  #stage { position:fixed; inset:0; overflow:hidden; }
  #game { display:block; width:100%; height:100%; touch-action:none; }
  #stage.shake { animation:shakeAnim .45s; }
  @keyframes shakeAnim {
    0%,100%{transform:translate(0,0)} 15%{transform:translate(-9px,4px)}
    30%{transform:translate(8px,-5px)} 45%{transform:translate(-6px,-3px)}
    60%{transform:translate(6px,4px)} 75%{transform:translate(-4px,2px)} 90%{transform:translate(3px,-2px)}
  }
  /* 은은한 종이 질감 (feTurbulence 노이즈 타일) */
  #grain {
    position:absolute; inset:0; pointer-events:none; z-index:40; opacity:.07;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ============ HUD ============ */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:50; }
  .hudCard {
    background:rgba(255,251,243,.88); border:3px solid #E9CDB4; border-radius:20px;
    box-shadow:0 3px 0 rgba(214,178,148,.35);
  }
  #hearts { position:absolute; top:10px; left:12px; padding:7px 12px; display:none; gap:5px; align-items:center; }
  #hearts.on { display:flex; }   /* 하트는 막간 놀이(리듬)에서만 */
  #partTag { position:absolute; top:12px; left:12px; padding:6px 14px; font-size:15px; color:#8A6A52;
    background:rgba(255,251,243,.9); border:3px solid #E9CDB4; border-radius:18px; display:none; }
  #partTag.on { display:block; }
  #logBtn { position:absolute; top:70px; right:12px; width:52px; height:52px; border-radius:18px;
    background:rgba(255,251,243,.9); border:3px solid #E9CDB4; box-shadow:0 3px 0 rgba(214,178,148,.35);
    font-size:22px; pointer-events:auto; cursor:pointer; }
  #hearts svg { width:26px; height:24px; }
  #progress { position:absolute; top:10px; left:50%; transform:translateX(-50%); padding:7px 16px; text-align:center; }
  /* 진행 표시(맨 위 가운데)를 누르면 처음 화면으로 — 플레이 중엔 확인 창을 먼저 띄움 */
  a#progress { display:block; color:inherit; text-decoration:none; pointer-events:auto; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  a#progress:active { transform:translateX(-50%) translateY(2px); box-shadow:none; }
  @media (hover:hover) { a#progress:hover { border-color:#E8A66F; } a#progress:hover #chapterName { color:#D9784F; } }
  a#progress:focus-visible { outline:3px solid #F0A97E; outline-offset:2px; }
  #chapterName::before { content:'🏠'; font-size:11px; margin-right:4px; opacity:.7; }
  #progressDots { display:flex; gap:7px; justify-content:center; }
  .pdot { width:11px; height:11px; border-radius:50%; background:#EBD9C6; border:2px solid #DCC0A6; transition:all .3s; }
  .pdot.done { background:#B7E3C8; border-color:#8FCBA8; }
  .pdot.cur { background:#FBC9A8; border-color:#F0A97E; transform:scale(1.3); }
  #chapterName { font-size:13px; margin-top:3px; color:#9A7E6E; letter-spacing:.5px; }
  #meters { position:absolute; top:10px; right:74px; padding:6px 14px; display:flex; gap:14px; }
  .meter { text-align:center; min-width:64px; }
  .meter .lab { font-size:12px; color:#A98D77; }
  .meter .val { font-size:22px; line-height:1.05; color:#5F4B41; font-variant-numeric:tabular-nums; }
  .meter .val small { font-size:13px; }
  #mTd .val { color:#6E86B8; }
  #mRH .val { color:#5E9C8A; }
  /* 공기 상태 칩 (교과서 그림 Ⅲ-13의 '공기 상태': 불포화 / 포화) */
  #airState { position:absolute; top:76px; right:74px; padding:3px 12px; font-size:13px; color:#8A6A52;
    border-width:2.5px; border-radius:14px; }
  #airState.sat { background:rgba(234,244,255,.94); border-color:#AFCBE8; color:#4E6E9C; }
  #mT .val { color:#D97F62; }
  #muteBtn {
    position:absolute; top:10px; right:12px; width:52px; height:52px; border-radius:18px;
    background:rgba(255,251,243,.9); border:3px solid #E9CDB4; box-shadow:0 3px 0 rgba(214,178,148,.35);
    font-size:24px; pointer-events:auto; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #muteBtn:active { transform:translateY(2px); box-shadow:none; }

  /* ============ 토스트 / 배지 ============ */
  #toast {
    position:absolute; top:20%; left:50%; transform:translate(-50%,0) scale(.8); z-index:60;
    background:rgba(255,247,236,.96); border:3px solid #F1B9A3; color:#C96A4E;
    padding:12px 26px; border-radius:24px; font-size:22px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; text-align:center; box-shadow:0 4px 0 rgba(214,150,128,.3);
    max-width:82%;
  }
  #toast.show { opacity:1; transform:translate(-50%,0) scale(1); }
  #toast.good { border-color:#9FD6B4; color:#4E9A6E; box-shadow:0 4px 0 rgba(140,196,164,.35); }

  /* ============ 대화창 ============ */
  #dialogWrap { position:absolute; inset:0; z-index:70; display:none; }
  #dialogWrap.on { display:block; }
  #dialogBox {
    position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
    width:min(960px, 92%); min-height:104px;
    background:rgba(255,252,246,.97); border:4px solid #E4C3A6; border-radius:28px;
    box-shadow:0 5px 0 rgba(210,172,140,.35);
    display:flex; align-items:center; gap:14px; padding:14px 20px 14px 14px;
  }
  #dFace { width:76px; height:76px; flex:none; }
  #dFace svg { width:100%; height:100%; }
  #dName { position:absolute; top:-16px; left:26px; background:#FBD3AE; border:3px solid #E8B488;
    border-radius:14px; padding:2px 14px; font-size:15px; color:#8A5F3E; }
  #dText { font-size:clamp(17px, 2.6vh, 27px); line-height:1.5; color:#5F4B41; flex:1; }
  #dText b { color:#D9784F; }
  #dText .kw { color:#5D7FB8; }
  #dNext { position:absolute; right:20px; bottom:8px; font-size:15px; color:#D9A87F; animation:bob 1s infinite; }
  #dBody { flex:1; }
  #dPrev, #dMore { position:absolute; top:-16px; font-family:inherit; font-size:13px; border-radius:12px; cursor:pointer;
    padding:2px 10px; border:2.5px solid #E4C3A6; background:#FFF6EA; color:#8A6A52; }
  #dPrev { right:140px; } #dMore { right:16px; display:none; }
  #dPrev:disabled { opacity:.35; cursor:default; }
  #dMoreText { display:none; margin-top:6px; padding:6px 10px; border-radius:12px; background:#F3F8FF; color:#4E6E9C;
    font-size:clamp(14px,2.2vh,17px); line-height:1.45; }
  #dMoreText.on { display:block; }
  #dialogBox.station { border-color:#AFC8E8; background:rgba(244,249,255,.97); }
  #dialogBox.station #dName { background:#D8E7FA; border-color:#9FBCE3; color:#3F5F94; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }

  /* ============ 오버레이 (타이틀·지도·재도전·엔딩) ============ */
  #overlay { position:absolute; inset:0; z-index:80; display:none; align-items:center; justify-content:center; }
  #overlay.on { display:flex; }
  .panel {
    background:rgba(255,251,243,.97); border:4px solid #E4C3A6; border-radius:32px;
    box-shadow:0 6px 0 rgba(210,172,140,.35); padding:26px 34px; text-align:center;
    max-width:min(860px, 94%); max-height:92%; overflow:hidden auto; touch-action:pan-y;
  }
  .panel h1 { font-size:clamp(30px,6vh,46px); color:#D9784F; letter-spacing:1px; }
  .panel h2 { font-size:clamp(22px,4.4vh,30px); color:#C96A4E; margin-bottom:8px; }
  .panel p  { font-size:clamp(15px,2.6vh,19px); color:#8A7263; line-height:1.55; }
  .btn {
    font-family:inherit; font-size:clamp(18px,3vh,23px); color:#7C5A3E; cursor:pointer;
    background:linear-gradient(#FFE3C2,#FBD0A5); border:3px solid #E8B488; border-radius:22px;
    padding:12px 34px; margin:8px 6px 0; box-shadow:0 4px 0 rgba(214,158,110,.5);
  }
  .btn:active { transform:translateY(3px); box-shadow:none; }
  .btn.sub { background:linear-gradient(#EAF3FF,#D8E7FA); border-color:#AFC8E8; color:#57729B; box-shadow:0 4px 0 rgba(150,178,215,.5); }
  .btn.mint { background:linear-gradient(#E2F7E9,#C8EDD6); border-color:#96D2AE; color:#3E8A62; box-shadow:0 4px 0 rgba(130,190,155,.5); }
  .btn:disabled { opacity:.42; box-shadow:none; cursor:default; }
  .titleSub { font-size:clamp(16px,2.8vh,20px); color:#9A7E6E; margin:4px 0 12px; }
  .panel footer { margin-top:12px; font-size:12px; color:#B49A85; text-align:center; }
  footer .hub{color:inherit;font-weight:500;white-space:nowrap;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px}
  footer .hub:hover{color:#6B564C;text-decoration-color:currentColor}
  #titleArt { width:min(300px,38vh); height:auto; margin:6px auto; display:block; }

  /* 여정 지도 */
  #mapSvg { width:min(780px, 88vw); height:auto; display:block; margin:4px auto; }
  .mapLabel { font-size:13.5px; fill:#7A6152; }
  .mapLabelBig { font-size:15px; fill:#C96A4E; }

  /* 6장: 비교 카드 & 그래프 */
  .cmpRow { display:flex; gap:16px; justify-content:center; margin:10px 0 4px; flex-wrap:wrap; }
  .cmpCard { border-radius:22px; padding:12px 20px; min-width:200px; border:3px solid; }
  .cmpCard h3 { font-size:19px; margin-bottom:4px; }
  .cmpCard .big { font-size:32px; font-variant-numeric:tabular-nums; }
  .cmpCard.cool { background:#EAF4FF; border-color:#AFCBE8; color:#4E6E9C; }
  .cmpCard.hot  { background:#FFEDE2; border-color:#F0B597; color:#C9603C; }
  #graphCv { background:#FFFDF8; border:3px solid #EAD3BC; border-radius:18px; margin-top:8px;
    width:min(720px, 86vw, 81vh); height:auto; display:block; margin-left:auto; margin-right:auto; }

  /* 7장 시뮬레이터 패널 */
  #simPanel {
    position:absolute; left:12px; bottom:12px; z-index:55; pointer-events:auto;
    background:rgba(255,251,243,.94); border:3px solid #E4C3A6; border-radius:24px;
    padding:12px 18px; width:min(400px, 44vw); box-shadow:0 4px 0 rgba(210,172,140,.3);
    display:none;
  }
  #simPanel.on { display:block; }
  #simPanel .row { display:flex; align-items:center; gap:10px; margin:6px 0; flex-wrap:wrap; }
  #simPanel label { font-size:16px; color:#8A6A52; }
  #gammaVal { font-size:22px; color:#D9784F; min-width:96px; font-variant-numeric:tabular-nums; }
  #gammaSlider { flex:1; min-width:120px; accent-color:#F0A97E; height:34px; }
  .chip { font-family:inherit; font-size:15px; border-radius:14px; border:2px solid #CBB49B; background:#FFF3E4;
    color:#8A6A52; padding:5px 12px; cursor:pointer; }
  .chip.sel { background:#FBD0A5; border-color:#E8A66F; color:#7C4E28; }
  #pokeBtn { font-size:19px; }
  #stabRead { font-size:17px; color:#57729B; line-height:1.4; min-height:44px; }

  /* 7장 푄 실험실 패널 */
  #labPanel {
    position:absolute; left:12px; bottom:12px; z-index:55; pointer-events:auto;
    background:rgba(255,251,243,.95); border:3px solid #E4C3A6; border-radius:24px;
    padding:10px 16px; width:min(380px, 40vw); box-shadow:0 4px 0 rgba(210,172,140,.3); display:none;
  }
  #labPanel.on { display:block; }
  #labPanel .row { display:flex; align-items:center; gap:8px; margin:5px 0; flex-wrap:wrap; }
  #labPanel label { font-size:15px; color:#8A6A52; min-width:76px; }
  #labPanel input[type=range] { flex:1; min-width:110px; accent-color:#F0A97E; height:30px; }
  #labPanel .v { font-size:19px; color:#D9784F; min-width:58px; text-align:right; font-variant-numeric:tabular-nums; }
  #labGuess { font-size:22px; color:#C96A4E; min-width:56px; text-align:center; font-variant-numeric:tabular-nums; }
  #labRead { font-size:15px; color:#57729B; line-height:1.4; min-height:42px; margin:4px 0; }
  #labMissions { font-size:14px; color:#8A6A52; line-height:1.55; border-top:2px dashed #EAD3BC; padding-top:4px; }
  #labMissions .ok { color:#3E8A62; }

  /* 예측 질문 (먼저 예측 → 플레이로 확인) */
  .predQ { font-size:clamp(17px,3vh,22px) !important; color:#5F4B41 !important; margin:6px 0 4px; }
  .predOpts { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .predOpts .btn { min-width:150px; }

  /* 교과서 용어 카드 · 예측 확인 (여정 지도) */
  .termRow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .termCard { background:#F3F8FF; border:2px solid #BFD3EE; border-radius:14px; padding:5px 12px; text-align:left;
    font-size:14px; color:#57729B; max-width:300px; line-height:1.4; }
  .termCard b { color:#3F5F94; font-size:15px; }
  .termCard b::before { content:'📘 '; }
  .predRes { display:inline-block; margin-top:8px; padding:4px 14px; border-radius:14px; background:#FFF8E6;
    border:2px solid #F0D9A4; color:#8A6A2E; font-size:15px; }

  /* 6장 그림 Ⅲ-13 표 채우기 */
  .f13 { border-collapse:separate; border-spacing:4px; margin:6px auto 2px; font-size:clamp(13px,2.1vh,15px); }
  .f13 th { color:#8A6A52; font-weight:normal; padding:2px 6px; }
  .f13 th small { color:#B49A85; }
  .f13 td.rowh { color:#8A6A52; text-align:right; padding-right:6px; white-space:nowrap; }
  .f13cell { font-family:inherit; font-size:inherit; min-width:128px; height:clamp(30px,5vh,38px); border-radius:12px;
    border:2.5px dashed #D9C2A8; background:#FFFDF8; color:#5F4B41; cursor:pointer; }
  .f13cell.sel { border-color:#F0A97E; background:#FFF1E2; }
  .f13cell.done { border:2.5px solid #96D2AE; background:#E8F7EE; color:#2F7A52; cursor:default; }
  .f13cell.bad { animation:shakeAnim .4s; border-color:#F0A08C; }
  .f13bank { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:8px auto 0; max-width:760px; }
  .f13chip { font-family:inherit; font-size:clamp(13px,2.1vh,15px); border-radius:12px; border:2px solid #CBB49B;
    background:#FFF3E4; color:#7C5A3E; padding:5px 11px; cursor:pointer; }
  .f13chip.sel { background:#FBD0A5; border-color:#E8A66F; transform:translateY(-2px); }
  .f13chip.used { visibility:hidden; }
  .f13hint { min-height:24px; color:#C96A4E !important; font-size:15px !important; margin-top:6px; }

  /* ============ v2 학습 흐름 UI ============ */
  .panel.top { align-self:flex-start; margin-top:84px; }
  .panel.wide { max-width:min(1040px,97%); }
  .panel .q { font-size:clamp(17px,3vh,28px); color:#5F4B41; margin:6px 0 4px; line-height:1.5; }
  .panel .tag { display:inline-block; font-size:14px; color:#8A6A52; background:#FFF1E2; border:2px solid #F0CBA4;
    border-radius:12px; padding:2px 12px; margin-bottom:4px; }
  .opts { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .opts .btn { min-width:150px; margin:0; position:relative; }
  .opts .btn .k { position:absolute; left:8px; top:4px; font-size:12px; opacity:.55; }
  .opts .btn.picked { outline:3px solid #F0A97E; }
  .fb { margin:12px auto 0; max-width:720px; padding:10px 16px; border-radius:16px; text-align:left;
    font-size:clamp(15px,2.5vh,22px); line-height:1.55; }
  .fb.ok { background:#E8F7EE; border:2.5px solid #96D2AE; color:#2F6E4C; }
  .fb.no { background:#FFF4E6; border:2.5px solid #F0C894; color:#7A5530; }
  .fb.info { background:#F3F8FF; border:2.5px solid #BFD3EE; color:#3F5F94; }
  .fb b { color:inherit; }
  .row2 { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
  .obsT { border-collapse:separate; border-spacing:0; margin:8px auto; font-size:clamp(16px,2.7vh,26px);
    border:2.5px solid #EAD3BC; border-radius:14px; overflow:hidden; background:#FFFDF8; }
  .obsT th, .obsT td { padding:6px 16px; border-bottom:1.5px solid #F1E2D0; }
  .obsT th { background:#FFF3E4; color:#8A6A52; font-weight:normal; }
  .obsT td { color:#5F4B41; font-variant-numeric:tabular-nums; text-align:center; }
  .obsT td.T { color:#D9784F; } .obsT td.Td { color:#5D7FB8; } .obsT td.hi { background:#FFF6D6; font-weight:bold; }
  .obsT td.sum { color:#A9988A; font-style:italic; }
  .bg { width:min(760px,56vw,92vh); height:auto; display:block; }
  .bgWrap { display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .bgSide { width:min(320px,24vw); }
  .pickInfo { font-size:clamp(15px,2.4vh,22px) !important; }
  .bg .cand { cursor:pointer; }
  .bg .cand:focus { outline:none; }
  .pickList { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .pickList button { font-family:inherit; font-size:14px; border-radius:12px; border:2px solid #CBB49B; background:#FFF3E4;
    color:#7C5A3E; padding:4px 10px; cursor:pointer; }
  .pickList button.sel { background:#FBD0A5; border-color:#E8A66F; }
  .pickInfo { min-height:26px; margin-top:6px; font-size:16px; color:#5F4B41; }
  #actBar { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:57; display:none; width:max-content;
    background:rgba(255,251,243,.96); border:3px solid #E4C3A6; border-radius:22px; padding:10px 16px;
    box-shadow:0 4px 0 rgba(210,172,140,.3); max-width:min(600px,58vw); text-align:center; pointer-events:auto; }
  #actBar.on { display:block; }
  #actBar .msg { font-size:clamp(15px,2.6vh,25px); color:#5F4B41; line-height:1.45; }
  #actBar .btn { margin:6px 4px 0; padding:8px 20px; font-size:clamp(16px,2.6vh,20px); }
  #actBar .chip { font-size:16px; padding:6px 14px; }
  #actBar .obsT { font-size:clamp(14px,2.3vh,23px); margin:4px auto; }
  #actBar .obsT th, #actBar .obsT td { padding:3px 12px; }
  #actBar .fb { font-size:clamp(14px,2.2vh,21px); margin-top:6px; padding:6px 12px; }
  #actBar p { font-size:clamp(14px,2.3vh,22px); color:#8A7263; margin:2px 0; }
  #actBar .tag { display:inline-block; font-size:13px; color:#8A6A52; background:#FFF1E2; border:2px solid #F0CBA4; border-radius:12px; padding:1px 10px; }
  #moveBtns { position:absolute; left:14px; bottom:14px; z-index:56; display:none; pointer-events:auto;
    width:156px; height:156px; }
  #moveBtns.on { display:block; }
  #moveBtns button { position:absolute; width:52px; height:52px; border-radius:16px; font-size:20px; cursor:pointer;
    background:rgba(255,251,243,.92); border:3px solid #E4C3A6; color:#8A6A52; touch-action:none; }
  #moveBtns button:active, #moveBtns button.down { background:#FBD0A5; }
  #moveBtns button[data-dy="-1"] { left:52px; top:0; } #moveBtns button[data-dy="1"] { left:52px; top:104px; }
  #moveBtns button[data-dx="-1"] { left:0; top:52px; } #moveBtns button[data-dx="1"] { left:104px; top:52px; }

<script>
'use strict';
/* ============================================================
   「뭉게의 하늘 여행」 — 대기 안정도와 강수 스토리 어드벤처
   ------------------------------------------------------------
   ★ 교사용 난이도 조정: 아래 TUNING 객체의 숫자만 바꾸면 됩니다.
   ★ 과학 수치(감률·응결 고도 공식)는 PHYSICS 블록에 있으며
     교과서 값이므로 변경하지 마세요.
   ============================================================ */
const TUNING = {
  hearts: 5,                 // 막간 놀이(빗방울 박자 연주)의 하트 수 — 본편 진행·학습 평가에는 쓰지 않음
  dragFollow: 7.5,           // 드래그 따라오는 속도(클수록 민첩)
  grabRadius: 120,           // 뭉게를 잡을 수 있는 반경(px) — 넉넉하게
  mungge: {
    baseR: 44,               // 지표(0km)에서의 몸 반지름(px)
    growPerKm: 0.175,        // 단열 팽창: 1km 오를 때마다 커지는 비율 (2km에서 1.35배)
    squashK: 0.07,           // 상승/하강 속도에 따른 늘어남·눌림 정도
    puffSpeed: 0.3,          // 이 속도(km/s) 이상 상승 시 '부풀어오른' 표정
    squishSpeed: 0.3,        // 이 속도(km/s) 이상 하강 시 '꾹 눌린' 표정
  },
  move: {
    maxKmPerSec: 0.55,       // 이동 속도 보조: 드래그가 급해도 이 속도(km/s, 게임 속 단위)를 넘지 않게
    btnKmPerSec: 0.35,       // ▲▼◀▶ 버튼·화살표 키로 움직일 때 속도
  },
  slope: {
    bandHalfKm: 0.16,        // 3장 바람길 반폭(km). 벗어나면 감점 없이 부드럽게 바람길로 되돌림
    returnRate: 3.5,         // 바람길로 되돌리는 세기
  },
  descent: {
    sinkKmPerSec: 0.3,       // 손을 떼면 저절로 천천히 내려감
    driftKmPerSec: 0.18,     // 손을 떼면 바람 따라 영서 쪽으로 이동
  },
  ch4: {                     // 막간 놀이: 내리는 빗방울의 박자를 따라 연주하기 (선택)
    bpm: 105,                // 리듬 BGM 템포
    totalNotes: 20,
    needHits: 14,            // '멋진 연주' 기준 (본편 진행과 무관)
    hitWindowMs: 170,        // 판정 창(±ms)
    missesPerHeart: 2,       // miss 2회마다 하트 -1 (막간 놀이 안에서만)
    emptyTapMiss: true,      // 빗방울이 없을 때 누른 탭(마구 두드리기)도 miss 로 셈. false 면 감점 없음
    fallSec: 1.7,            // 노트 낙하 시간(초)
    countInBeats: 4,         // 카운트인 박 수 (4·3·2·1)
    audioOffset: 0,          // 오디오 지연 보정(초). 태블릿 소리가 늦으면 +0.05~0.15
    // 리듬 패턴: 카운트인 이후 각 노트가 떨어지는 박 오프셋 (0.5 = 반박자).
    pattern: [0, 2, 4, 5, 6, 8, 9.5, 10, 12, 13, 14, 16, 17.5, 18, 20, 21, 22, 24, 25.5, 26],
  },
  p2: {                      // 2부: 놓아준 뒤의 운동 (화면 연출용 계수 — 판정은 같은 높이의 두 기온 비교로)
    buoyAccel: 0.9,          // 부력 가속 계수 (km/s² per ℃)
    damping: 0.9,            // 속도 감쇠
    watchSec: 4.2,           // 놓은 뒤 관찰 시간(초)
  },
};

/* ============================================================
   PHYSICS — 순수 계산 함수 (교과서 값. tests/physics.test.mjs 가 검증)
   ============================================================ */
// ==PHYSICS-START==
const RATE = {
  DRY: 10,   // 건조 단열 감률 ℃/km (불포화 공기 상승 -10, 하강 +10)
  DEW: 2,    // 불포화 공기 이슬점 감률 ℃/km
  WET: 5,    // 습윤 단열 감률 ℃/km (포화 공기: 기온·이슬점 모두)
};
const SCENARIO = {
  T0: 20,    // 출발(영동 해안) 기온 ℃
  Td0: 12,   // 출발 이슬점 ℃
  TOP: 2.0,  // 태백산맥 높이 km
};
// 상승 응결 고도 H(km) = ⅛(T - Td)
function lclHeight(T, Td) { return (T - Td) / 8; }
// 지표 (T0, Td0)의 공기가 h(km)까지 '상승'했을 때의 상태
function riseState(T0, Td0, h) {
  const H = lclHeight(T0, Td0);
  if (h < H) {
    return { T: T0 - RATE.DRY * h, Td: Td0 - RATE.DEW * h, saturated: false, H };
  }
  const Tc = T0 - RATE.DRY * H;            // 응결 고도의 기온(=이슬점)
  const v = Tc - RATE.WET * (h - H);       // 그 위로는 습윤 단열
  return { T: v, Td: v, saturated: true, H };
}
// 산꼭대기(hTop, 기온 Ttop, 이슬점 TdTop)에서 h(km)까지 '하강'(불포화)한 상태
function descendFrom(Ttop, TdTop, hTop, h) {
  const dh = hTop - h;
  return { T: Ttop + RATE.DRY * dh, Td: TdTop + RATE.DEW * dh, saturated: false };
}
// 환경 기온 감률 γ(℃/km)에 따른 대기 안정도
function stability(gamma) {
  if (gamma < RATE.WET) return 'stable';        // γ < 5 절대 안정
  if (gamma > RATE.DRY) return 'unstable';      // γ > 10 절대 불안정
  return 'conditional';                          // 5~10 조건부 불안정
}
// 지표 기온 T0, 감률 γ일 때 고도 h의 환경(주위) 기온
function envTemp(T0, gamma, h) { return T0 - gamma * h; }
// 상대 습도(%) = 현재 수증기압 / 포화 수증기압 × 100  (교과서 정의)
// 현재 수증기압 = 이슬점에서의 포화 수증기압. 포화 수증기압은 마그누스 근사식(℃ → hPa)
function satVapor(t) { return 6.112 * Math.exp(17.67 * t / (t + 243.5)); }
function relHumidity(T, Td) { return Math.min(100, 100 * satVapor(Td) / satVapor(T)); }
// 푄 한 번 왕복: 지표 (T0, Td0) 공기가 높이 M(km) 산을 넘을 때.
// 응결 고도 H < M 이면 H~M 구간에서 구름·비(습윤 단열) → 반대편 지표에 더 뜨겁고 건조하게 도착.
// H ≥ M 이면 구름이 안 생겨 오르내림이 대칭 → 도착 = 출발 (푄 없음).
function foehnTrip(T0, Td0, M) {
  const H = lclHeight(T0, Td0);
  const top = riseState(T0, Td0, M);
  const arr = descendFrom(top.T, top.Td, M, 0);
  return { H, M, cloud: H < M, topT: top.T, topTd: top.Td, arrT: arr.T, arrTd: arr.Td, dT: arr.T - T0 };
}
// 자유 대류 고도(km): 이 높이 위로 올려 주면 뭉게가 주위보다 따뜻해져 스스로 상승.
// γ > 10 → 0(지표부터), γ ≤ 5 → null(어디서도 불가), 5 < γ ≤ 10 → 응결 고도 위에서 5H/(γ−5)
function lfcHeight(T0, Td0, gamma) {
  if (gamma > RATE.DRY) return 0;
  if (gamma <= RATE.WET) return null;
  const H = lclHeight(T0, Td0);
  return Math.max(H, (RATE.WET * H) / (gamma - RATE.WET));
}
// 상승 발자국 이론 경로: 도달 최고 고도 maxAlt까지의 (온도, 높이) 꼭짓점 목록.
// 기온선은 응결 고도에서 -10 → -5 로 꺾이고, 이슬점선은 그 위에서 기온선과 합체한다.
function trailUpPoints(T0, Td0, maxAlt) {
  const H = lclHeight(T0, Td0);
  const m = Math.max(0, maxAlt);
  const T = [[T0, 0]], Td = [[Td0, 0]];
  if (m <= H) {
    if (m > 0) { T.push([T0 - RATE.DRY * m, m]); Td.push([Td0 - RATE.DEW * m, m]); }
  } else {
    const Tc = T0 - RATE.DRY * H;
    const top = Tc - RATE.WET * (m - H);
    T.push([Tc, H], [top, m]);
    Td.push([Tc, H], [top, m]); // 응결 후 이슬점 = 기온 (합체)
  }
  return { T, Td };
}
// 하강 발자국 이론 경로: 정상(hTop)에서 내려온 최저 고도 minAlt까지
function trailDownPoints(Ttop, TdTop, hTop, minAlt) {
  const m = Math.min(hTop, Math.max(0, minAlt));
  return {
    T: [[Ttop, hTop], [Ttop + RATE.DRY * (hTop - m), m]],
    Td: [[TdTop, hTop], [TdTop + RATE.DEW * (hTop - m), m]],
  };
}
// ==PHYSICS-END==

/* ============================================================
   유틸
   ============================================================ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
const fmt2 = v => (Math.round(v * 100) / 100).toFixed(2);
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);

// 시나리오에서 계산되는 정상·도착 상태 (숫자를 코드 곳곳에 박지 않도록 한 곳에서 계산)
const SUMMIT = riseState(SCENARIO.T0, SCENARIO.Td0, SCENARIO.TOP);            // 정상 2.0 km: 5℃ / 5℃
const ARRIVAL = descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, 0);            // 영서 지표: 25℃ / 9℃

// 주소 옵션: ?ch=N → 처음 화면에 'N장부터 시작' 버튼 (교사용 차시 분할), ?debug=1 → 4장 박자 동기 로그
const PARAMS = new URLSearchParams(location.search);
const DEBUG = PARAMS.has('debug');

// 손그림 느낌 blob 경로 (seed 기반 일그러짐 + 느린 숨쉬기)
function blobPath(ctx, cx, cy, r, seed, t, amp = 0.10, pts = 9) {
  ctx.beginPath();
  const nodes = [];
  for (let i = 0; i < pts; i++) {
    const a = (i / pts) * TAU;
    const w = 1 + amp * Math.sin(seed * 3.1 + i * 2.7) + 0.035 * Math.sin(t * 1.4 + i * 1.9 + seed);
    nodes.push({ x: cx + Math.cos(a) * r * w, y: cy + Math.sin(a) * r * w });
  }
  const mid = (a, b) => [(a.x + b.x) / 2, (a.y + b.y) / 2];
  ctx.moveTo(...mid(nodes[0], nodes[1]));
  for (let i = 1; i <= pts; i++) {
    const p = nodes[i % pts], nx = nodes[(i + 1) % pts];
    ctx.quadraticCurveTo(p.x, p.y, ...mid(p, nx));
  }
  ctx.closePath();
}
// 구형 태블릿 브라우저 대비 roundRect 폴리필
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y); this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r); this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h); this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r); this.arcTo(x, y, x + r, y, r);
    return this;
  };
}

/* ============================================================
   사운드 — Web Audio API 로 전부 생성 (음원 파일 없음)
   ============================================================ */
const AudioSys = {
  ctx: null, master: null, muted: false,
  bgmName: null, bgmTimer: null, nextBeat: 0, beatIdx: 0, beatSec: 0.6,
  bgmStartTime: 0,

  ensure() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.85;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended' && !this.holds) this.ctx.resume();
  },
  // 소리가 없을 때(AudioContext 미생성)도 일시 정지할 수 있는 시계
  now() { return this.ctx ? this.ctx.currentTime : (performance.now() - this.frozenMs - (this.holds ? performance.now() - this.freezeAt : 0)) / 1000; },
  // 일시 정지(처음 화면 확인 창·세로 화면 안내): 오디오 시계를 멈춰 4장 리듬 노트·예약된 '쿵'이 함께 멈추게
  holds: 0, freezeAt: 0, frozenMs: 0,
  freeze() {
    if (this.holds++ > 0) return;
    this.freezeAt = performance.now();
    if (this.ctx && this.ctx.state === 'running') this.ctx.suspend();
  },
  unfreeze() {
    if (this.holds === 0 || --this.holds > 0) return;
    this.frozenMs += performance.now() - this.freezeAt;
    if (this.ctx) this.ctx.resume();
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.now(), 0.05);
  },
  tone(f, t0, dur, { type = 'sine', g = 0.15, f2 = null, attack = 0.01 } = {}) {
    if (!this.ctx) return null;
    const o = this.ctx.createOscillator(), gn = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(g, t0 + attack);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
    return gn;
  },
  noiseBuf: null,
  noise(t0, dur, g = 0.1, hp = 3000) {
    if (!this.ctx) return null;
    if (!this.noiseBuf) {
      const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.5, this.ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    }
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const gn = this.ctx.createGain();
    gn.gain.setValueAtTime(g, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(gn); gn.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.05);
    return gn;
  },

  /* --- 효과음 --- */
  sTick() { this.tone(1250, this.now(), 0.03, { type: 'square', g: 0.022 }); },
  sSparkle() { const t = this.now(); this.tone(880, t, 0.12, { g: 0.1 }); this.tone(1320, t + 0.07, 0.18, { g: 0.09 }); this.tone(1760, t + 0.14, 0.25, { g: 0.07 }); },
  sPop() { this.tone(520, this.now(), 0.1, { type: 'triangle', g: 0.12, f2: 780 }); },
  sHit() { const t = this.now(); this.tone(988, t, 0.09, { type: 'triangle', g: 0.14 }); this.noise(t, 0.08, 0.05, 5000); },
  sMiss() { this.tone(180, this.now(), 0.25, { type: 'sawtooth', g: 0.07, f2: 110 }); },
  sHeart() { const t = this.now(); this.tone(392, t, 0.16, { type: 'triangle', g: 0.13 }); this.tone(311, t + 0.14, 0.3, { type: 'triangle', g: 0.13 }); },
  sCondense() { const t = this.now(); [523, 659, 784, 1047].forEach((f, i) => this.tone(f, t + i * 0.09, 0.35, { g: 0.1 })); this.noise(t, 0.5, 0.03, 6000); },
  sClear() { const t = this.now(); [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, t + i * 0.11, 0.4, { type: 'triangle', g: 0.12 })); },
  sBadge() { const t = this.now(); this.tone(660, t, 0.12, { g: 0.1 }); this.tone(990, t + 0.1, 0.2, { g: 0.1 }); },
  sThud() { const t = this.now(); this.tone(90, t, 0.3, { type: 'sine', g: 0.2, f2: 50 }); this.noise(t, 0.15, 0.08, 800); },
  sWhoosh() { this.noise(this.now(), 0.4, 0.05, 1500); },

  /* --- BGM: 챕터별 앰비언트 루프 --- */
  PATTERNS: {
    sea:  { bpm: 56,  fn(b, t, A) { // 느린 파도 패드
      if (b % 4 === 0) { const root = (b % 8 === 0) ? 261.6 : 220;
        [1, 1.5, 2].forEach(m => A.tone(root * m, t, 3.4, { g: 0.045, attack: 0.9 })); }
      if (b % 8 === 4) A.noise(t, 2.2, 0.012, 900);
    }},
    rise: { bpm: 92,  fn(b, t, A) { // 가벼운 아르페지오
      const seq = [523, 659, 784, 880, 784, 659]; A.tone(seq[b % 6], t, 0.5, { type: 'triangle', g: 0.05 });
      if (b % 4 === 0) A.tone(131, t, 1.8, { g: 0.05, attack: 0.4 });
    }},
    mtn:  { bpm: 84,  fn(b, t, A) { // 산: 조금 장엄한 저음 + 종소리
      if (b % 4 === 0) { const root = (b % 8 === 0) ? 174.6 : 196;
        A.tone(root, t, 2.6, { g: 0.055, attack: 0.5 }); A.tone(root * 1.5, t, 2.6, { g: 0.035, attack: 0.5 }); }
      if (b % 2 === 1) A.tone(1047, t, 0.4, { g: 0.028 });
    }},
    rain: { bpm: TUNING.ch4.bpm, fn(b, t, A) { // 리듬 장 그루브 (킥은 노트 시각에 별도 예약 — 눈·귀 일치)
      A.noise(t + 0.5 * (60 / this.bpm), 0.05, 0.03, 7000);                          // hat(뒷박)
      if (b % 4 === 2) A.noise(t, 0.09, 0.05, 3000);                                 // snare
      const bass = [110, 110, 98, 87][Math.floor(b / 4) % 4];
      if (b % 2 === 0) A.tone(bass, t, 0.4, { type: 'triangle', g: 0.07 });
    }},
    warm: { bpm: 60,  fn(b, t, A) { // 따뜻한 화음
      if (b % 4 === 0) { const ch = (b % 8 === 0) ? [261.6, 329.6, 392, 493.9] : [349.2, 440, 523.3, 659.3];
        ch.forEach(f => A.tone(f, t, 3.6, { g: 0.038, attack: 0.8 })); }
    }},
  },
  // 노트 시각과 정확히 일치하는 킥(쿵) / 카운트인 틱 — 절대 시각 t에 미리 예약.
  // 예약한 소리는 sched 에 모아 두었다가, 재도전·장 이동 때 cancelScheduled() 로 한꺼번에 끈다
  // (안 끄면 이전 판의 '쿵'이 새 판 박자와 어긋나게 계속 울림).
  sched: [],
  keep(t, ...gains) { gains.forEach(gn => { if (gn) this.sched.push({ t, gn }); }); },
  kickAt(t) { this.keep(t, this.tone(200, t, 0.13, { type: 'sine', g: 0.22, f2: 52 }), this.noise(t, 0.045, 0.05, 1400)); },
  tickAt(t, accent = false) { this.keep(t, this.tone(accent ? 1320 : 880, t, 0.06, { type: 'square', g: 0.07 })); },
  pendingCount() { const now = this.now(); return this.sched.filter(s => s.t > now).length; },
  cancelScheduled() {
    this.sched.forEach(s => { try { s.gn.disconnect(); } catch (e) { /* 이미 끝난 소리 */ } });
    this.sched = [];
  },
  startBgm(name, anchor) {
    this.stopBgm();
    if (!this.ctx) return 0;
    const p = this.PATTERNS[name]; if (!p) return 0;
    this.bgmName = name;
    this.beatSec = 60 / p.bpm;
    this.beatIdx = 0;
    // anchor 를 주면 박 0 이 정확히 그 시각에서 출발 (4장 리듬 동기용)
    this.bgmStartTime = anchor ? Math.max(anchor, this.now() + 0.05) : this.now() + 0.15;
    this.nextBeat = this.bgmStartTime;
    this.bgmTimer = setInterval(() => {
      const ahead = this.now() + 0.3;
      while (this.nextBeat < ahead) {
        p.fn.call(p, this.beatIdx, this.nextBeat, this);
        this.beatIdx++; this.nextBeat += this.beatSec;
      }
    }, 60);
    return this.bgmStartTime;
  },
  stopBgm() {
    if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; }
    this.bgmName = null;
  },
};
</script>
<script>
'use strict';
/* ============================================================
   전역 상태 (메모리 전용 — 새로고침하면 초기화, 저장소 사용 안 함)
   ============================================================ */
const S = {
  screen: 'title',        // title | play
  chapter: 0,
  hearts: TUNING.hearts,  // 막간 놀이(리듬)에서만 사용 — 학습 성취와 무관
  started: false,         // 이어하기 활성화 여부
  dialogActive: false,
  paused: false,          // 오버레이 표시 중 게임 정지
  time: 0,
  runId: 0,               // 장 시작·처음 화면 이동마다 +1 → 이전 장에서 걸어 둔 지연 콜백·흐름 무효화
  rec: newRecord(),       // 학습 기록 (메모리에만 — 새로고침하면 사라짐, 저장·전송 안 함)
};
// 학습 기록: 예측·관측·판단(첫 선택과 최종)·표시한 높이·구간 기록·실험 결과
function newRecord() {
  return {
    obs: [],        // 관측 기록 [{ id, ch, label, h, T, Td, rh, note, summary }]
    pred: {},       // 예측 { key: { ch, q, pick, text, ok, revised } }
    judge: {},      // 판단 { key: { ch, q, first, firstText, firstOk, final, finalText, tries, help } }
    marks: {},      // 학생이 표시한 값 (예: 응결 예상 높이)
    segs: {},       // 그림 Ⅲ-13 구간 기록 { up1 | up2 | down : 'observed' | 'summary' }
    done: {},       // 마친 장
    lab: { stage: 0, runs: [], goodConds: [] },
    p2: {},         // 2부 실험 결과
  };
}
// 지연 실행: 그 사이 장이 바뀌거나 처음 화면으로 갔으면 실행하지 않음
function later(fn, ms) {
  const id = S.runId;
  return setTimeout(() => { if (S.runId === id) fn(); }, ms);
}

/* ============================================================
   캔버스
   ============================================================ */
const cv = $('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  const oldW = W, oldH = H;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 화면 크기가 바뀌어도(분할 화면·회전) 뭉게의 고도가 튀지 않도록 각 씬이 위치를 다시 맞춤
  if (scene && scene.resize) scene.resize(oldW, oldH);
}
// 세로 높이 눈금(vertMap)을 쓰는 씬: 크기 변경 전 고도를 기억했다가 새 눈금에 다시 놓기
function refitVert(sc, maxKm, oldW) {
  const had = sc.map && oldW > 0;
  const h = had ? sc.map.yToKm(M.y) : 0, ht = had ? sc.map.yToKm(M.ty) : 0;
  sc.map = vertMap(maxKm);
  if (!had) return;
  const fx = W / oldW;
  M.x *= fx; M.tx *= fx;
  M.y = sc.map.kmToY(h); M.ty = sc.map.kmToY(ht);
}
// 옆으로 움직이는 씬(3·5장): 세계 좌표(km)를 기억했다가 새 배율에서 같은 지점에 다시 놓기
function refitWorld(sc, camYFrac) {
  const ok = sc.pxX > 0;
  const mw = ok ? sc.mWorld() : null;
  const dx = M.tx - M.x, dy = M.ty - M.y;
  sc.pxX = W / 2.2; sc.pxY = H / 1.55;
  if (!ok) { sc.clampCam(); return; }
  sc.camX = mw.x * sc.pxX - W * 0.42;
  sc.camY = (sc.worldTopKm - mw.h) * sc.pxY - H * camYFrac;
  sc.clampCam();
  const p = sc.w2s(mw.x, mw.h);
  M.x = p.x; M.y = p.y; M.tx = p.x + dx; M.ty = p.y + dy;
}
window.addEventListener('resize', resize);

/* ============================================================
   HUD
   ============================================================ */
function renderHearts() {
  const full = `<svg viewBox="0 0 24 22"><path d="M12 20 C5 14 1.5 10.5 1.5 6.8 1.5 3.9 3.8 1.8 6.5 1.8 8.7 1.8 10.8 3.2 12 5.2 13.2 3.2 15.3 1.8 17.5 1.8 20.2 1.8 22.5 3.9 22.5 6.8 22.5 10.5 19 14 12 20Z" fill="#F58C8C" stroke="#D96A6A" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  const empty = full.replace('#F58C8C', '#EEE0D2').replace('#D96A6A', '#D8C4B0');
  $('hearts').innerHTML = Array.from({ length: TUNING.hearts }, (_, i) => i < S.hearts ? full : empty).join('');
}
const meterCache = {};
function setVal(id, html) {
  if (meterCache[id] === html) return;          // 매 프레임 호출되므로 바뀐 값만 DOM 갱신
  meterCache[id] = html;
  $(id).querySelector('.val').innerHTML = html;
}
// 계기판: 고도·기온·이슬점·상대 습도 + 공기 상태(불포화/포화)
function setMeters(alt, T, Td) {
  setVal('mAlt', `${fmt2(alt)}<small> km</small>`);
  setVal('mT', `${fmt1(T)}<small> ℃</small>`);
  setVal('mTd', `${fmt1(Td)}<small> ℃</small>`);
  const rh = relHumidity(T, Td);
  setVal('mRH', `${Math.round(rh)}<small> %</small>`);
  const sat = T - Td < 0.05;
  const txt = sat ? '포화 상태 ☁ (상대 습도 100%)' : '불포화 상태';
  if (meterCache.air !== txt) {
    meterCache.air = txt;
    $('airState').textContent = txt;
    $('airState').classList.toggle('sat', sat);
  }
}

let toastTimer = null;
function toast(msg, good = false, ms = 1900) {
  const el = $('toast');
  el.innerHTML = msg; el.classList.toggle('good', good); el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function shake() {
  const st = $('stage');
  st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
}

/* ============================================================
   오버레이
   ============================================================ */
function showOverlay(html) { const o = $('overlay'); o.innerHTML = html; o.classList.add('on'); }
function hideOverlay() { const o = $('overlay'); o.classList.remove('on'); o.innerHTML = ''; }

/* ============================================================
   뭉게 표정 SVG (대화창용 미니 아이콘)
   ============================================================ */
function faceSVG(face) {
  const F = {
    normal: { eye: 'dot', mouth: 'M-7 8 Q0 13 7 8', extra: '' },
    happy:  { eye: 'arc', mouth: 'M-8 6 Q0 16 8 6', extra: '' },
    cold:   { eye: 'dot', mouth: 'M-6 10 Q-3 8 0 10 Q3 12 6 10', tint: '#D6E6F7',
              extra: '<text x="22" y="-12" font-size="13">❄</text>' },
    surprised: { eye: 'big', mouth: 'M0 9 m-4 0 a4 4.6 0 1 0 8 0 a4 4.6 0 1 0 -8 0', extra: '<text x="20" y="-14" font-size="14">!</text>' },
    hurt:   { eye: 'x', mouth: 'M-6 11 Q0 7 6 11', extra: '' },
    hot:    { eye: 'dot', mouth: 'M-6 8 Q0 13 6 8', tint: '#FBDCCB',
              extra: '<path d="M24 -6 q3 5 0 9" stroke="#7FB6E8" stroke-width="2.5" fill="none" stroke-linecap="round"/>' },
    proud:  { eye: 'arc', mouth: 'M-8 6 Q0 15 8 6', extra: '<text x="-34" y="-14" font-size="13">✨</text>' },
    cloud:  { eye: 'arc', mouth: 'M-8 6 Q0 15 8 6', white: true, extra: '' },
    puff:   { eye: 'dot', mouth: 'M0 9 m-3.5 0 a3.5 3.5 0 1 0 7 0 a3.5 3.5 0 1 0 -7 0',
              extra: '<path d="M-33 -4 q-5 6 0 12 M33 -4 q5 6 0 12" stroke="#96B4DC" stroke-width="2.5" fill="none" stroke-linecap="round"/>' },
    squish: { eye: 'squish', mouth: 'M-6 10 L-2 7 L2 11 L6 8',
              extra: '<path d="M-38 -4 l6 6 -6 6 M38 -4 l-6 6 6 6" stroke="#DC9678" stroke-width="2.5" fill="none" stroke-linecap="round"/>' },
  }[face] || {};
  const body = F.tint || (F.white ? '#FFFFFF' : '#FFF7EA');
  const eyes = F.eye === 'arc'
    ? '<path d="M-14 -4 q4 -5 8 0 M6 -4 q4 -5 8 0" stroke="#5B4A44" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
    : F.eye === 'big'
    ? '<circle cx="-10" cy="-4" r="3.6" fill="#5B4A44"/><circle cx="10" cy="-4" r="3.6" fill="#5B4A44"/>'
    : F.eye === 'x'
    ? '<path d="M-13 -7 l6 6 M-7 -7 l-6 6 M7 -7 l6 6 M13 -7 l-6 6" stroke="#5B4A44" stroke-width="2.4" stroke-linecap="round"/>'
    : F.eye === 'squish'
    ? '<path d="M-15 -8 l8 4 -8 4 M15 -8 l-8 4 8 4" stroke="#5B4A44" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<circle cx="-10" cy="-4" r="2.8" fill="#5B4A44"/><circle cx="10" cy="-4" r="2.8" fill="#5B4A44"/>';
  return `<svg viewBox="-40 -40 80 80">
    <path d="M-28 8 Q-32 -12 -14 -18 Q-8 -32 8 -28 Q26 -32 28 -12 Q34 4 22 14 Q12 26 -6 22 Q-24 24 -28 8 Z"
      fill="${body}" stroke="#E3C6A8" stroke-width="3" stroke-linejoin="round"/>
    ${eyes}
    <circle cx="-19" cy="4" r="4.5" fill="#F9C6C0" opacity=".85"/>
    <circle cx="19" cy="4" r="4.5" fill="#F9C6C0" opacity=".85"/>
    <path d="${F.mouth}" stroke="#5B4A44" stroke-width="2.4" fill="${F.eye === 'big' ? '#5B4A44' : 'none'}" stroke-linecap="round"/>
    ${F.extra || ''}
  </svg>`;
}

/* ============================================================
   대화 시스템 (타이핑 효과, 탭 → 전체 표시 → 다음)
   ============================================================ */
// 영서 관측소 아이콘 (대화창)
const STATION_ICON = `<svg viewBox="-40 -40 80 80"><rect x="-26" y="-6" width="52" height="34" rx="8" fill="#EAF3FF" stroke="#9FBCE3" stroke-width="3"/>
  <path d="M0 -6 L0 -26" stroke="#7F9FD0" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="-28" r="4" fill="#F0A97E"/>
  <path d="M-12 -30 q12 -12 24 0 M-18 -34 q18 -18 36 0" stroke="#9FBCE3" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="-14" y="4" width="10" height="10" rx="2" fill="#9FBCE3"/><rect x="4" y="4" width="10" height="10" rx="2" fill="#9FBCE3"/></svg>`;
const Dialog = {
  lines: [], idx: 0, charIdx: 0, typing: false, timer: null, onDone: null,
  log: [],            // 이 장에서 본 대사 (📒 기록에서 다시 읽기)
  run(lines, onDone) {
    this.lines = lines; this.idx = 0; this.onDone = onDone;
    S.dialogActive = true;
    M.held = false; activePointer = null;
    if (typeof Ctrl !== 'undefined') { Ctrl.held.clear(); ctrlSync(); }
    $('dialogWrap').classList.add('on');
    this.showLine();
  },
  showLine(instant) {
    const L = this.lines[this.idx];
    const st = L.who === 'station';
    $('dName').textContent = st ? '📡 영서 관측소' : '뭉게';
    $('dialogBox').classList.toggle('station', st);
    $('dFace').innerHTML = st ? STATION_ICON : faceSVG(L.face || 'normal');
    if (!st && L.face) M.setFace(L.face, 9999);
    $('dPrev').disabled = this.idx === 0;
    $('dMore').style.display = L.more ? 'block' : 'none';
    $('dMore').textContent = '더 알아보기 ▸';
    $('dMoreText').classList.remove('on');
    $('dMoreText').innerHTML = L.more || '';
    if (!L._logged) { L._logged = true; this.log.push({ who: st ? '영서 관측소' : '뭉게', text: L.text }); }
    const el = $('dText');
    clearInterval(this.timer);
    if (instant) { this.typing = false; el.innerHTML = L.text; $('dNext').style.visibility = 'visible'; return; }
    el.innerHTML = '';
    this.typing = true; this.charIdx = 0;
    $('dNext').style.visibility = 'hidden';
    // HTML 태그(<b> 등)를 지원하기 위해 전체를 넣고 글자 수로 잘라 보여줌
    const plain = L.text;
    this.timer = setInterval(() => {
      this.charIdx++;
      const done = this.charIdx >= this.stripLen(plain);
      el.innerHTML = this.slice(plain, this.charIdx);
      if (this.charIdx % 3 === 0) AudioSys.sTick();
      if (done) this.finishLine();
    }, 26);
  },
  stripLen(html) { return html.replace(/<[^>]*>/g, '').length; },
  slice(html, n) { // 태그를 보존하며 앞 n글자만
    let out = '', cnt = 0, i = 0;
    while (i < html.length && cnt < n) {
      if (html[i] === '<') { const j = html.indexOf('>', i); out += html.slice(i, j + 1); i = j + 1; }
      else { out += html[i]; i++; cnt++; }
    }
    // 열린 태그 닫기 (b, span 만 사용)
    const opens = (out.match(/<b>/g) || []).length - (out.match(/<\/b>/g) || []).length;
    for (let k = 0; k < opens; k++) out += '</b>';
    const so = (out.match(/<span[^>]*>/g) || []).length - (out.match(/<\/span>/g) || []).length;
    for (let k = 0; k < so; k++) out += '</span>';
    return out;
  },
  finishLine() {
    clearInterval(this.timer);
    this.typing = false;
    $('dText').innerHTML = this.lines[this.idx].text;
    $('dNext').style.visibility = 'visible';
  },
  tap() {
    if (!S.dialogActive) return;
    if (this.typing) { this.finishLine(); return; }
    this.idx++;
    if (this.idx < this.lines.length) { AudioSys.sPop(); this.showLine(); }
    else this.close();
  },
  back() { if (S.dialogActive && this.idx > 0) { this.idx--; this.showLine(true); } },
  toggleMore() {
    const m = $('dMoreText'); m.classList.toggle('on');
    $('dMore').textContent = m.classList.contains('on') ? '접기 ▾' : '더 알아보기 ▸';
  },
  close() {
    clearInterval(this.timer);
    $('dialogWrap').classList.remove('on');
    S.dialogActive = false;
    M.faceTimer = 0; M.face = M.baseFace; // 대화용 표정 해제 → 그 장의 기본 표정으로
    const cb = this.onDone; this.onDone = null;
    if (cb) cb();
  },
  abort() { // 콜백 없이 강제 종료 (챕터 전환 시 안전장치)
    clearInterval(this.timer);
    $('dialogWrap').classList.remove('on');
    S.dialogActive = false;
    this.onDone = null;
    M.faceTimer = 0; M.face = M.baseFace;
  },
};
$('dialogWrap').addEventListener('pointerdown', e => { e.stopPropagation(); Dialog.tap(); });
$('dPrev').addEventListener('pointerdown', e => { e.stopPropagation(); Dialog.back(); });
$('dMore').addEventListener('pointerdown', e => { e.stopPropagation(); Dialog.toggleMore(); });

/* ============================================================
   뭉게 캐릭터 (캔버스)
   ============================================================ */
const M = {
  x: 0, y: 0, tx: 0, ty: 0, r: TUNING.mungge.baseR,
  held: false, grabDX: 0, grabDY: 0,
  vxKm: 0, vyKm: 0,          // km/s (이번 프레임 순간 속도)
  vxS: 0, vyS: 0,            // km/s (스무딩한 속도 — 급강하·착지 판정과 표정에 사용)
  face: 'normal', faceTimer: 0, baseFace: 'normal',
  coat: false,               // 구름 옷 (2장 이후)
  visible: true, blink: 0,
  altKm: 0,                  // 현재 고도 — 단열 팽창/압축 크기 연출용 (씬에서 매 프레임 설정)
  droplets: 0,               // 공기 안에 생긴 작은 물방울(0~1) — 포화(기온 = 이슬점)일 때만
  maxStep: 0,                // 이동 속도 보조(px/s, 0이면 제한 없음)
  squash: 0,                 // 상승=늘어남(+) / 하강=눌림(−) 스무딩 값
  place(x, y) { this.x = this.tx = x; this.y = this.ty = y; this.vxKm = this.vyKm = this.vxS = this.vyS = 0; },
  setFace(f, dur = 1.2) { this.face = f; this.faceTimer = dur; },
  // 빠르게 오르내릴 때 팽창/압축 표정 (아픔 등 다른 임시 표정은 방해하지 않음)
  breathFace() {
    if (this.faceTimer > 0) return;
    const mg = TUNING.mungge;
    if (this.vyS > mg.puffSpeed) this.setFace('puff', 0.4);
    else if (this.vyS < -mg.squishSpeed) this.setFace('squish', 0.4);
  },
  update(dt, pxPerKmX, pxPerKmY) {
    const px = this.x, py = this.y;
    const k = Math.min(1, dt * TUNING.dragFollow);
    this.x += (this.tx - this.x) * k;
    this.y += (this.ty - this.y) * k;
    // 급격한 드래그 보조: 한 프레임 이동 거리를 제한 (씬이 maxStep(px/s)을 정함)
    if (this.maxStep > 0 && dt > 0) {
      const ddx = this.x - px, ddy = this.y - py, dd = Math.hypot(ddx, ddy), lim = this.maxStep * dt;
      if (dd > lim) { this.x = px + ddx * lim / dd; this.y = py + ddy * lim / dd; }
    }
    if (dt > 0) {
      this.vxKm = pxPerKmX ? (this.x - px) / pxPerKmX / dt : 0;
      this.vyKm = pxPerKmY ? -(this.y - py) / pxPerKmY / dt : 0; // 위가 +
    }
    const ks = Math.min(1, dt * 9);
    this.vyS = lerp(this.vyS, this.vyKm, ks);
    this.vxS = lerp(this.vxS, this.vxKm, ks);
    // 단열 팽창/압축: 고도가 높을수록 기압이 낮아 몸이 커진다
    const mg = TUNING.mungge;
    const rTarget = mg.baseR * (1 + mg.growPerKm * clamp(this.altKm, 0, SCENARIO.TOP + 0.5));
    this.r += (rTarget - this.r) * Math.min(1, dt * 3);
    // 상승 중 살짝 늘어나고, 하강 중 꾹 눌리는 스쿼시
    const sqTarget = clamp(this.vyS * mg.squashK, -0.12, 0.12);
    this.squash += (sqTarget - this.squash) * Math.min(1, dt * 6);
    if (this.faceTimer > 0) { this.faceTimer -= dt; if (this.faceTimer <= 0) this.face = this.baseFace; }
    this.blink -= dt;
    if (this.blink < -3.2 + Math.sin(this.x * 0.13) * 0.8) this.blink = 0.13;
  },
  draw(c, t) {
    if (!this.visible) return;
    const { x, y, r } = this;
    const shiver = this.face === 'cold' ? Math.sin(t * 34) * 2.2 : 0;
    c.save();
    c.translate(x + shiver, y + Math.sin(t * 1.7) * 3);
    // 팽창(상승)=세로로 늘어남 / 압축(하강)=납작하게 눌림
    c.scale(1 - this.squash * 0.7, 1 + this.squash);

    // 구름 옷: 몸 아래·옆의 하얀 뭉게 방울들
    if (this.coat) {
      c.fillStyle = '#FFFFFF'; c.strokeStyle = '#DCE8F4'; c.lineWidth = 3;
      [[-r * 0.85, r * 0.35, r * 0.52], [r * 0.85, r * 0.35, r * 0.52], [0, r * 0.62, r * 0.6],
       [-r * 0.45, r * 0.58, r * 0.45], [r * 0.45, r * 0.58, r * 0.45]].forEach(([dx, dy, rr], i) => {
        blobPath(c, dx, dy, rr, i + 7, t, 0.12, 8); c.fill(); c.stroke();
      });
    }
    // 몸통
    const bodyFill = this.face === 'cold' ? '#E4EEF9' : this.face === 'hot' ? '#FBE0CE' : (this.coat ? '#FFFFFF' : '#FFF7EA');
    c.fillStyle = bodyFill; c.strokeStyle = this.coat ? '#D8E4F0' : '#EDD3B4'; c.lineWidth = 4;
    blobPath(c, 0, 0, r, 3, t, 0.09, 9);
    c.fill(); c.stroke();
    // 공기 안의 작은 물방울 (응결) — 공기 전체가 구름으로 '변하는' 게 아니라, 안에 물방울이 생겨 구름이 보임
    if (this.droplets > 0) {
      const n = Math.round(14 * clamp(this.droplets, 0, 1));
      for (let i = 0; i < n; i++) {
        const a = i * 2.39996 + 0.5, rr = r * (0.25 + 0.55 * ((i * 37) % 11) / 11);
        const dx = Math.cos(a) * rr, dy = Math.sin(a) * rr * 0.8 + Math.sin(t * 2 + i) * 1.5;
        c.fillStyle = 'rgba(120,170,225,.55)';
        c.beginPath(); c.arc(dx, dy, 2.2 + (i % 3) * 0.9, 0, TAU); c.fill();
      }
    }

    // 눈
    c.fillStyle = '#5B4A44'; c.strokeStyle = '#5B4A44'; c.lineWidth = 3; c.lineCap = 'round';
    const ex = r * 0.34, ey = -r * 0.12;
    const happyEye = this.face === 'happy' || this.face === 'proud';
    if (this.blink > 0 || happyEye) {
      c.beginPath(); c.moveTo(-ex - 6, ey + 1); c.quadraticCurveTo(-ex, ey - (happyEye ? 7 : 1), -ex + 6, ey + 1); c.stroke();
      c.beginPath(); c.moveTo(ex - 6, ey + 1); c.quadraticCurveTo(ex, ey - (happyEye ? 7 : 1), ex + 6, ey + 1); c.stroke();
    } else if (this.face === 'hurt') {
      c.beginPath();
      c.moveTo(-ex - 5, ey - 5); c.lineTo(-ex + 5, ey + 5); c.moveTo(-ex + 5, ey - 5); c.lineTo(-ex - 5, ey + 5);
      c.moveTo(ex - 5, ey - 5); c.lineTo(ex + 5, ey + 5); c.moveTo(ex + 5, ey - 5); c.lineTo(ex - 5, ey + 5);
      c.stroke();
    } else if (this.face === 'squish') {
      // 꾹 눌린 눈: > <
      c.beginPath();
      c.moveTo(-ex - 6, ey - 5); c.lineTo(-ex + 4, ey); c.lineTo(-ex - 6, ey + 5);
      c.moveTo(ex + 6, ey - 5); c.lineTo(ex - 4, ey); c.lineTo(ex + 6, ey + 5);
      c.stroke();
    } else {
      const big = this.face === 'surprised' ? 4.6 : 3.4;
      c.beginPath(); c.arc(-ex, ey, big, 0, TAU); c.arc(ex, ey, big, 0, TAU); c.fill();
    }
    // 볼터치 (부풀 때는 볼이 빵빵하게)
    const cheekR = this.face === 'puff' ? r * 0.2 : r * 0.14;
    c.fillStyle = this.face === 'hot' ? 'rgba(244,140,110,.75)' : 'rgba(249,198,192,.85)';
    c.beginPath(); c.arc(-r * 0.62, r * 0.13, cheekR, 0, TAU); c.arc(r * 0.62, r * 0.13, cheekR, 0, TAU); c.fill();
    // 입
    c.strokeStyle = '#5B4A44'; c.lineWidth = 3; c.beginPath();
    const my = r * 0.3;
    if (this.face === 'happy' || this.face === 'proud') { c.moveTo(-9, my - 4); c.quadraticCurveTo(0, my + 8, 9, my - 4); }
    else if (this.face === 'surprised') { c.arc(0, my, 5, 0, TAU); }
    else if (this.face === 'puff') { c.arc(0, my, 4, 0, TAU); } // 후우~ 부푸는 입
    else if (this.face === 'squish') { c.moveTo(-7, my + 1); c.lineTo(-2, my - 2); c.lineTo(2, my + 2); c.lineTo(7, my - 1); } // 꾹 다문 지그재그
    else if (this.face === 'hurt') { c.moveTo(-8, my + 3); c.quadraticCurveTo(0, my - 4, 8, my + 3); }
    else if (this.face === 'cold') { c.moveTo(-7, my); c.quadraticCurveTo(-3.5, my - 3, 0, my); c.quadraticCurveTo(3.5, my + 3, 7, my); }
    else { c.moveTo(-7, my - 2); c.quadraticCurveTo(0, my + 4, 7, my - 2); }
    c.stroke();
    // 부가 효과
    if (this.face === 'cold') {
      c.fillStyle = '#9CC4E8'; c.font = '16px Jua';
      c.fillText('❄', r * 0.9, -r * 0.7); c.fillText('❄', -r * 1.15, -r * 0.4);
    }
    if (this.face === 'hot') {
      c.strokeStyle = '#7FB6E8'; c.lineWidth = 3.2; c.beginPath();
      c.moveTo(r * 0.82, -r * 0.62); c.quadraticCurveTo(r * 0.95, -r * 0.42, r * 0.8, -r * 0.28); c.stroke();
    }
    if (this.face === 'proud') {
      c.fillStyle = '#F5C86E'; c.font = '15px Jua';
      c.fillText('✨', -r * 1.25, -r * 0.65); c.fillText('✨', r * 0.85, -r * 0.85);
    }
    // 팽창: 몸 옆에 바깥으로 퍼지는 (( )) 선 / 압축: 안쪽으로 미는 » « 선
    if (this.face === 'puff') {
      c.strokeStyle = 'rgba(150,180,220,.75)'; c.lineWidth = 2.6; c.lineCap = 'round';
      c.beginPath();
      c.moveTo(-r * 1.2, -r * 0.28); c.quadraticCurveTo(-r * 1.38, 0, -r * 1.2, r * 0.28);
      c.moveTo(-r * 1.42, -r * 0.2); c.quadraticCurveTo(-r * 1.58, 0, -r * 1.42, r * 0.2);
      c.moveTo(r * 1.2, -r * 0.28); c.quadraticCurveTo(r * 1.38, 0, r * 1.2, r * 0.28);
      c.moveTo(r * 1.42, -r * 0.2); c.quadraticCurveTo(r * 1.58, 0, r * 1.42, r * 0.2);
      c.stroke();
    }
    if (this.face === 'squish') {
      c.strokeStyle = 'rgba(220,150,120,.8)'; c.lineWidth = 2.6; c.lineCap = 'round';
      c.beginPath();
      c.moveTo(-r * 1.5, -r * 0.22); c.lineTo(-r * 1.28, 0); c.lineTo(-r * 1.5, r * 0.22);
      c.moveTo(-r * 1.72, -r * 0.16); c.lineTo(-r * 1.54, 0); c.lineTo(-r * 1.72, r * 0.16);
      c.moveTo(r * 1.5, -r * 0.22); c.lineTo(r * 1.28, 0); c.lineTo(r * 1.5, r * 0.22);
      c.moveTo(r * 1.72, -r * 0.16); c.lineTo(r * 1.54, 0); c.lineTo(r * 1.72, r * 0.16);
      c.stroke();
    }
    c.restore();
  },
};

/* ============================================================
   파티클
   ============================================================ */
const particles = [];
function spawnParticles(x, y, n, colors, spd = 130, life = 0.8, grav = 60) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = spd * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: life * (0.6 + Math.random() * 0.6), max: life,
      c: colors[i % colors.length], r: 3 + Math.random() * 4, grav });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt;
  }
}
function drawParticles(c) {
  particles.forEach(p => {
    c.globalAlpha = Math.max(0, p.life / p.max);
    c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill();
  });
  c.globalAlpha = 1;
}

/* ============================================================
   발자국 기록 (전역 — 챕터 재시작·이동에도 유지, 학습 기록)
   ============================================================ */
const Trail = {
  maxUpAlt: 0,        // 직접 관측하며 올라간 최고 고도
  minDownAlt: SCENARIO.TOP, // 하강 구간에서 내려온 최저 고도
  downStarted: false,
  condensed: false,   // 응결 지점(기온 = 이슬점) 도달 여부 → ✨ 마커
  collapsed: false,   // 미니 그래프 접힘 (챕터 넘어가도 유지)
  sumUp: 0,           // 0 ~ sumUp km 상승 구간은 '앞선 여정 요약'(이 학생이 직접 관측하지 않음)
  sumDown: false,     // 하강 구간 전체가 요약인지
  up(h) {
    this.maxUpAlt = Math.max(this.maxUpAlt, clamp(h, 0, SCENARIO.TOP));
    if (this.maxUpAlt >= lclHeight(SCENARIO.T0, SCENARIO.Td0) - 1e-6) this.condensed = true;
  },
  down(h) { this.downStarted = true; this.minDownAlt = Math.min(this.minDownAlt, clamp(h, 0, SCENARIO.TOP)); },
  reset() {
    this.maxUpAlt = 0; this.minDownAlt = SCENARIO.TOP; this.downStarted = false; this.condensed = false;
    this.sumUp = 0; this.sumDown = false;
  },
};
// 상승 경로의 a~b km 구간 꼭짓점 (응결 고도에서 꺾임)
function upSeg(a, b) {
  const H0 = lclHeight(SCENARIO.T0, SCENARIO.Td0), hs = [a];
  if (a < H0 && b > H0) hs.push(H0);
  hs.push(b);
  return { T: hs.map(h => [riseState(SCENARIO.T0, SCENARIO.Td0, h).T, h]), Td: hs.map(h => [riseState(SCENARIO.T0, SCENARIO.Td0, h).Td, h]) };
}
// 하강 경로의 정상(2 km) ~ b km 구간
function downSeg(b) {
  const hs = [SCENARIO.TOP, b];
  return { T: hs.map(h => [descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, h).T, h]), Td: hs.map(h => [descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, h).Td, h]) };
}

/* ============================================================
   상시 미니 그래프 (우하단) — 축 고정 0~30℃ / 0~2km
   매 프레임 d 속성·점 좌표만 갱신 (전체 재생성 없음)
   ============================================================ */
const MiniGraph = {
  L: 38, R: 240, T: 16, B: 186, lastKey: '',
  X(t) { return this.L + (t / 30) * (this.R - this.L); },
  Y(h) { return this.B - (h / 2) * (this.B - this.T); },
  d(pts) { return pts.length > 1 ? pts.map((p, i) => (i ? 'L' : 'M') + this.X(p[0]).toFixed(1) + ' ' + this.Y(p[1]).toFixed(1)).join(' ') : ''; },
  build() {
    let g = '';
    for (let t = 0; t <= 30; t += 10)
      g += `<line class="mgGrid" x1="${this.X(t)}" y1="${this.T}" x2="${this.X(t)}" y2="${this.B}"/>
            <text class="mgLab" x="${this.X(t)}" y="${this.B + 13}" text-anchor="middle">${t}℃</text>`;
    for (let h = 0; h <= 2; h += 0.5)
      g += `<line class="mgGrid" x1="${this.L}" y1="${this.Y(h)}" x2="${this.R}" y2="${this.Y(h)}"/>` +
        (h % 1 === 0 ? `<text class="mgLab" x="${this.L - 5}" y="${this.Y(h) + 3.5}" text-anchor="end">${h}km</text>` : '');
    g += `<line x1="${this.L}" y1="${this.Y(1)}" x2="${this.R}" y2="${this.Y(1)}" stroke="#9FB4DC" stroke-width="1.6" stroke-dasharray="4 4" opacity=".8"/>
          <text class="mgLab" x="${this.R - 2}" y="${this.Y(1) - 4}" text-anchor="end" fill="#7F95C4">H=1.0km</text>
          <line class="mgAxis" x1="${this.L}" y1="${this.T - 4}" x2="${this.L}" y2="${this.B}"/>
          <line class="mgAxis" x1="${this.L}" y1="${this.B}" x2="${this.R + 4}" y2="${this.B}"/>`;
    $('mgStatic').innerHTML = g;
    const sp = $('mgSpark');
    sp.setAttribute('x', this.X(10) - 6); sp.setAttribute('y', this.Y(1) - 7);
    $('mgFold').addEventListener('pointerdown', e => {
      e.stopPropagation();
      Trail.collapsed = !Trail.collapsed;
      this.applyFold();
      AudioSys.sPop();
    });
    this.applyFold();
  },
  applyFold() {
    $('miniGraph').classList.toggle('folded', Trail.collapsed);
    $('mgFold').textContent = Trail.collapsed ? '▸' : '▾';
  },
  setVisible(on) {
    $('miniGraph').classList.toggle('on', on);
    if (on) { this.lastKey = ''; this.updatePaths(); }
  },
  updatePaths() {
    const key = `${Trail.maxUpAlt.toFixed(3)}|${Trail.minDownAlt.toFixed(3)}|${Trail.downStarted}|${Trail.condensed}|${Trail.sumUp}|${Trail.sumDown}`;
    if (key === this.lastKey) return;
    this.lastKey = key;
    // 앞선 여정 요약(회색 점선) — 직접 관측하지 않은 구간
    const su = Trail.sumUp > 0 ? upSeg(0, Trail.sumUp) : null, sd = Trail.sumDown ? downSeg(0) : null;
    $('mgSumT').setAttribute('d', (su ? this.d(su.T) : '') + (sd ? ' ' + this.d(sd.T) : ''));
    $('mgSumTd').setAttribute('d', (su ? this.d(su.Td) : '') + (sd ? ' ' + this.d(sd.Td) : ''));
    // 직접 관측한 상승 구간
    const a = Math.min(Trail.sumUp, Trail.maxUpAlt), up = Trail.maxUpAlt > a + 1e-6 ? upSeg(a, Trail.maxUpAlt) : null;
    $('mgUpT').setAttribute('d', up ? this.d(up.T) : '');
    $('mgUpTd').setAttribute('d', up ? this.d(up.Td) : '');
    if (Trail.downStarted && !Trail.sumDown && Trail.minDownAlt < SCENARIO.TOP - 1e-6) {
      const dn = downSeg(Trail.minDownAlt);
      $('mgDnT').setAttribute('d', this.d(dn.T));
      $('mgDnTd').setAttribute('d', this.d(dn.Td));
    } else { $('mgDnT').setAttribute('d', ''); $('mgDnTd').setAttribute('d', ''); }
    $('mgSpark').setAttribute('visibility', Trail.condensed ? 'visible' : 'hidden');
  },
  // 현재 위치 점 갱신 — 뭉게 드래그를 실시간으로 따라감
  tick(h, phase) {
    h = clamp(h, 0, SCENARIO.TOP);
    const st = phase === 'down' ? descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, h) : riseState(SCENARIO.T0, SCENARIO.Td0, h);
    $('mgDotT').setAttribute('cx', this.X(clamp(st.T, 0, 30))); $('mgDotT').setAttribute('cy', this.Y(h));
    $('mgDotTd').setAttribute('cx', this.X(clamp(st.Td, 0, 30))); $('mgDotTd').setAttribute('cy', this.Y(h));
    this.updatePaths();
  },
};

/* ============================================================
   입력 (pointer events — 터치/마우스 공용)
   ============================================================ */
let activePointer = null;
cv.addEventListener('pointerdown', e => {
  AudioSys.ensure();
  if (S.paused || S.dialogActive) return;
  activePointer = e.pointerId;
  cv.setPointerCapture(e.pointerId);
  if (scene && scene.pd) scene.pd(e.clientX, e.clientY);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointer) return;
  if (S.paused || S.dialogActive) return;
  if (scene && scene.pm) scene.pm(e.clientX, e.clientY);
});
function endPointer(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  if (scene && scene.pu) scene.pu(e.clientX, e.clientY);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

// 버튼·키보드 조작 — 드래그가 어려운 학생용. 씬이 Ctrl.x / Ctrl.y(−1~1)를 읽어 뭉게를 옮김
const Ctrl = { x: 0, y: 0, held: new Set() };
function ctrlSync() {
  let x = 0, y = 0;
  Ctrl.held.forEach(k => { const [dx, dy] = k.split(',').map(Number); x += dx; y += dy; });
  Ctrl.x = clamp(x, -1, 1); Ctrl.y = clamp(y, -1, 1);
}
document.querySelectorAll('#moveBtns button').forEach(b => {
  const key = b.dataset.dx + ',' + b.dataset.dy;
  const on = e => { e.preventDefault(); e.stopPropagation(); AudioSys.ensure(); Ctrl.held.add(key); b.classList.add('down'); ctrlSync(); };
  const off = () => { Ctrl.held.delete(key); b.classList.remove('down'); ctrlSync(); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, off));
});
const KEYDIR = { ArrowUp: '0,-1', ArrowDown: '0,1', ArrowLeft: '-1,0', ArrowRight: '1,0' };
document.addEventListener('keydown', e => {
  if (S.dialogActive) {                     // 대사: Enter·Space·→ 다음, ← 앞 대사
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); Dialog.tap(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); Dialog.back(); }
    return;
  }
  if ($('overlay').classList.contains('on')) { // 선택지: 숫자 키 1~6
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 6) {
      const b = document.querySelector(`#overlay [data-key="${n}"]`);
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
    return;
  }
  if (KEYDIR[e.key] && $('moveBtns').classList.contains('on')) { e.preventDefault(); Ctrl.held.add(KEYDIR[e.key]); ctrlSync(); }
});
document.addEventListener('keyup', e => { if (KEYDIR[e.key]) { Ctrl.held.delete(KEYDIR[e.key]); ctrlSync(); } });
// 버튼·키 조작으로 목표 위치 옮기기 (속도 px/s, 범위 안에서)
function moveByCtrl(dt, pxPerSec, minX, maxX, minY, maxY) {
  if (!Ctrl.x && !Ctrl.y) return false;
  M.tx = clamp(M.tx + Ctrl.x * pxPerSec * dt, minX, maxX);
  M.ty = clamp(M.ty + Ctrl.y * pxPerSec * dt, minY, maxY);
  return true;
}
document.addEventListener('contextmenu', e => e.preventDefault());

// 뭉게 드래그 공통 로직
function tryGrab(x, y) {
  const d = Math.hypot(x - M.x, y - M.y);
  if (d < TUNING.grabRadius) {
    M.held = true; M.grabDX = M.x - x; M.grabDY = M.y - y;
    return true;
  }
  return false;
}
function dragTo(x, y, minX, maxX, minY, maxY) {
  if (!M.held) return;
  M.tx = clamp(x + M.grabDX, minX, maxX);
  M.ty = clamp(y + M.grabDY, minY, maxY);
}

/* ============================================================
   배경 그리기 도우미
   ============================================================ */
function skyGrad(c, top, bottom) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function drawSun(c, x, y, r, t) {
  c.fillStyle = 'rgba(255,224,166,.9)';
  blobPath(c, x, y, r, 21, t, 0.05, 10); c.fill();
  c.fillStyle = 'rgba(255,238,200,.5)';
  blobPath(c, x, y, r * 1.5, 22, t, 0.06, 10); c.fill();
}
function drawCloudBlob(c, x, y, s, seed, t, alpha = 0.9) {
  c.save(); c.globalAlpha = alpha;
  c.fillStyle = '#FFFFFF'; c.strokeStyle = 'rgba(214,228,240,.8)'; c.lineWidth = 3;
  [[0, 0, 1], [-0.9, 0.15, 0.7], [0.9, 0.15, 0.72], [-0.4, -0.35, 0.65], [0.45, -0.32, 0.6]].forEach(([dx, dy, rr], i) => {
    blobPath(c, x + dx * s, y + dy * s, s * rr, seed + i * 3, t, 0.1, 8); c.fill();
  });
  c.restore();
}
// 고도 눈금 (왼쪽)
function drawAltRuler(c, kmToY, maxKm, marks) {
  c.strokeStyle = 'rgba(160,130,105,.35)'; c.fillStyle = 'rgba(140,110,88,.75)';
  c.lineWidth = 2; c.font = '15px Jua'; c.textAlign = 'left';
  for (let h = 0; h <= maxKm + 0.001; h += 0.5) {
    const y = kmToY(h);
    c.beginPath(); c.moveTo(10, y); c.lineTo(h % 1 === 0 ? 46 : 30, y); c.stroke();
    if (h % 1 === 0) c.fillText(h.toFixed(1) + ' km', 52, y + 5);
  }
  (marks || []).forEach(mk => {
    const y = kmToY(mk.h);
    c.save(); c.strokeStyle = mk.color || 'rgba(120,150,220,.5)'; c.setLineDash([8, 8]); c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); c.restore();
    if (mk.label) { c.fillStyle = mk.color || 'rgba(120,150,220,.9)'; c.font = '16px Jua'; c.fillText(mk.label, 100, y - 8); }
  });
}

</script>
<script>
'use strict';
/* ============================================================
   「뭉게의 하늘 여행」 v2 — 이야기 · 장면 · 학습 흐름
   1부 · 산을 건너는 뭉게  : 산을 넘은 뒤 왜 더 따뜻하고 건조해졌을까?
   2부 · 놓아주면 어디로 갈까? : 같은 공기를 올렸다 놓았는데 왜 다르게 움직일까?
   각 장의 흐름: 상황 → 예상 → 조작·관측 → 멈춤 → 근거로 판단 → 개념 연결 → 기록
   ============================================================ */
const H0 = lclHeight(SCENARIO.T0, SCENARIO.Td0);    // 기본 조건의 상승 응결 고도 = 1.0 km

/* ---------- 장 목록 ---------- */
const CHS = [
  { part: 1, name: '프롤로그 · 관측소의 부탁',        goal: '뭉게를 움직이고 출발 상태 기록' },
  { part: 1, name: '첫 관측 · 어느 값이 더 내려갈까?', goal: '0 km와 0.5 km의 기온·이슬점 비교' },
  { part: 1, name: '구름이 시작되는 곳',              goal: '두 값이 처음 같아지는 높이 찾기' },
  { part: 1, name: '정상으로 · 똑같이 식을까?',        goal: '포화 전후의 기온 변화 비교' },
  { part: 1, name: '구름 속 관찰 · 비가 내리면?',      goal: '응결과 강수, 수분의 변화' },
  { part: 1, name: '산 너머로 · 도착하면 몇 ℃?',       goal: '하강 중 기온·이슬점 변화' },
  { part: 1, name: '관측소 보고',                     goal: '출발·도착 비교와 근거' },
  { part: 1, name: '다른 조건의 여행',                goal: '한 조건씩 바꾸어 비교' },
  { part: 2, name: '대기 A · 올렸다 놓으면?',          goal: '같은 높이의 두 기온 비교' },
  { part: 2, name: '대기 C · 같은 높이, 다른 결과',     goal: '주위 기온 분포가 다를 때' },
  { part: 2, name: '대기 B · 두 높이에서',             goal: '구름이 생기는 높이와 스스로 오르는 높이' },
  { part: 2, name: '이름 붙이기와 구름',              goal: '대기 안정도와 구름 발달' },
  { part: 2, name: '새로운 하늘',                    goal: '새 조건에서 운동 예상' },
];
const PART = {
  1: { first: 0, last: 7, title: '1부 · 산을 건너는 뭉게', q: '산을 넘은 뒤 왜 더 따뜻하고 건조해졌을까?' },
  2: { first: 8, last: 12, title: '2부 · 놓아주면 어디로 갈까?', q: '같은 공기를 올렸다 놓았는데 왜 다르게 움직일까?' },
};
const partOf = ch => CHS[ch].part;
const chTitle = ch => `${partOf(ch)}부 · ${CHS[ch].name}`;

/* ---------- 숫자 표시 ---------- */
const nf = v => { const r = Math.round(v * 10) / 10; return Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(1); };
const kf = v => { const r = Math.round(v * 100) / 100; return Math.abs(r * 10 - Math.round(r * 10)) < 1e-9 ? r.toFixed(1) : r.toFixed(2); };

/* ---------- 진행 표시 ---------- */
function renderProgress() {
  const p = partOf(S.chapter), P = PART[p];
  let dots = '';
  for (let i = P.first; i <= P.last; i++)
    dots += `<div class="pdot ${S.rec.done[i] ? 'done' : ''} ${i === S.chapter ? 'cur' : ''}"></div>`;
  $('progressDots').innerHTML = dots;
  $('chapterName').textContent = `${p}부 · ${CHS[S.chapter].name}`;
  const tag = $('partTag');
  tag.textContent = P.title;
  tag.classList.toggle('on', S.screen === 'play' && !$('hearts').classList.contains('on'));
}

/* ============================================================
   씬 관리 · 화면 도우미
   ============================================================ */
let scene = null;
function setScene(s) {
  if (scene && scene.exit) scene.exit();
  scene = s;
  if (s.resize) s.resize();
  if (s.enter) s.enter();
  if (s.update) s.update(0);   // 인트로 대사 동안 계기판이 이전 값으로 남지 않게
}
function vertMap(maxKm) {
  const topPad = 112, groundY = H * 0.80;   // 아래쪽 행동 막대와 뭉게가 겹치지 않게
  const pxPerKm = (groundY - topPad) / maxKm;
  return { kmToY: h => groundY - h * pxPerKm, yToKm: y => (groundY - y) / pxPerKm, pxPerKm, groundY };
}
// 장면 속 행동 막대 (여기에 표시 · 놓아주기 · 다음 관찰 …)
function setAct(html) {
  const b = $('actBar');
  if (!html) { b.classList.remove('on'); b.innerHTML = ''; return; }
  b.innerHTML = html; b.classList.add('on');
  const f = b.querySelector('.btn');   // 키보드: Enter로 바로 누를 수 있게
  if (f) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }, 30);
}
// 버튼 조작 표시 (vertOnly: ▲▼만)
function showMove(on, vertOnly) {
  $('moveBtns').classList.toggle('on', !!on);
  $('moveBtns').classList.toggle('vert', !!vertOnly);
  if (!on) { Ctrl.held.clear(); ctrlSync(); document.querySelectorAll('#moveBtns button').forEach(b => b.classList.remove('down')); }
}
function panel(html, cls = '') {
  S.paused = true;
  showOverlay(`<div class="panel ${cls}">${html}</div>`);
  const f = document.querySelector('#overlay [data-focus]') || document.querySelector('#overlay .btn:not([disabled])');
  if (f) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }, 30);
}
function closePanel() { hideOverlay(); S.paused = false; }
function onClick(id, fn) {
  const el = $(id);
  if (el) el.addEventListener('click', e => { e.stopPropagation(); AudioSys.ensure(); fn(e); });
}

/* ============================================================
   학습 흐름 도우미 (Promise) — 장이 바뀌면(runId) 이전 흐름은 멈춤
   ============================================================ */
function guard(p) { const id = S.runId; return p.then(v => (S.runId === id ? v : new Promise(() => {}))); }
const say = lines => guard(new Promise(res => Dialog.run(lines, res)));
let actWait = null;
function waitAct(name) { return guard(new Promise(res => { actWait = { name, res }; })); }
function actDone(name, data) { if (actWait && actWait.name === name) { const w = actWait; actWait = null; w.res(data); } }
function waitClick(id) { return guard(new Promise(res => onClick(id, () => res()))); }

// 관측 카드 (장면을 멈추고 필요한 수치만 강조)
function observe(html, btn = '계속 ➜', opt = {}) {
  return guard(new Promise(res => {
    if (opt.bar) {   // 장면 속 관측 카드: 아래쪽 막대에 띄워 뭉게·그래프가 가려지지 않게 (장면은 멈춤)
      S.paused = true;
      setAct(html + `<div><button class="btn" id="obNext">${btn}</button></div>`);
      onClick('obNext', () => { setAct(null); S.paused = false; res(); });
      return;
    }
    panel(html + `<div class="row2"><button class="btn" id="obNext" data-key="1">${btn}</button></div>`, 'top');
    onClick('obNext', () => { closePanel(); res(); });
  }));
}
function obsTable(rows, opt = {}) {
  const head = `<tr><th>${opt.first || '높이'}</th><th>기온</th><th>이슬점</th>${opt.diff ? '<th>두 값의 차이</th>' : ''}${opt.rh ? '<th>상대 습도</th>' : ''}</tr>`;
  const body = rows.map(r => {
    const hi = k => ((r.hi || []).includes(k) ? ' hi' : '');
    return `<tr><td>${r.label || kf(r.h) + ' km'}</td><td class="T${hi('T')}">${nf(r.T)}℃</td><td class="Td${hi('Td')}">${nf(r.Td)}℃</td>`
      + `${opt.diff ? `<td class="${hi('d').trim()}">${nf(r.T - r.Td)}℃</td>` : ''}`
      + `${opt.rh ? `<td class="${hi('rh').trim()}">${Math.round(relHumidity(r.T, r.Td))}%</td>` : ''}</tr>`;
  }).join('');
  return `<table class="obsT">${head}${body}</table>`;
}

/* ---------- 예상 (정답을 바로 알려 주지 않음 · 틀려도 감점 없음) ---------- */
function predict(key, P) {
  return guard(new Promise(res => {
    panel(`<span class="tag">🔮 먼저 예상해 보자</span><p class="q">${P.q}</p>
      <div class="opts">${P.opts.map((o, i) => `<button class="btn sub" data-key="${i + 1}" data-i="${i}"><span class="k">${i + 1}</span>${o}</button>`).join('')}</div>
      <p style="font-size:14px;margin-top:10px;color:#B49A85">정답은 직접 확인한 뒤에 함께 볼 거야. 틀려도 괜찮아!</p>`, 'top');
    document.querySelectorAll('#overlay .opts .btn').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation(); AudioSys.ensure(); AudioSys.sPop();
      const i = Number(b.dataset.i);
      const prev = S.rec.pred[key];
      S.rec.pred[key] = { ch: S.chapter, q: P.short || P.q, pick: i, text: P.opts[i], ok: i === P.ans, revised: false, real: P.real, first: prev ? (prev.first || prev.text) : P.opts[i], firstOk: prev ? prev.firstOk : i === P.ans };
      closePanel(); toast('좋아, 직접 확인해 보자! 🔍', true, 1500); res(i);
    }));
  }));
}
// 관찰 뒤 예상 돌아보기 — 고른 답에 따라 다시 확인할 근거를 안내
function reviewPredict(key, P) {
  const r = S.rec.pred[key];
  if (!r) return Promise.resolve();

/* ============================================================

function trailSeries() {
  const out = [], SUM = { color: '#C9BEB2', dash: '3 6', w: 3, sum: true };
  if (Trail.sumUp > 0) { const u = upSeg(0, Trail.sumUp); out.push({ ...SUM, pts: u.T }, { ...SUM, pts: u.Td }); }
  if (Trail.sumDown) { const d = downSeg(0); out.push({ ...SUM, pts: d.T }, { ...SUM, pts: d.Td }); }
  const a = Math.min(Trail.sumUp, Trail.maxUpAlt);
  if (Trail.maxUpAlt > a + 1e-6) {
    const u = upSeg(a, Trail.maxUpAlt);
    out.push({ pts: u.T, color: '#E8926C' }, { pts: u.Td, color: '#6E86B8', dash: '8 6', w: 3 });
  }
  if (Trail.downStarted && !Trail.sumDown && Trail.minDownAlt < SCENARIO.TOP - 1e-6) {
    const d = downSeg(Trail.minDownAlt);
    out.push({ pts: d.T, color: '#E88AA8' }, { pts: d.Td, color: '#6E86B8', dash: '8 6', w: 3 });
  }
  return out;
}
function bigGraph(o = {}) {
  const tMin = o.tMin ?? 0, tMax = o.tMax ?? 30, hMax = o.hMax ?? 2.2;
  const L = 66, R = 540, T = 24, B = 322;
  const X = t => L + (t - tMin) / (tMax - tMin) * (R - L), Y = h => B - h / hMax * (B - T);
  const P = pts => pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  let g = '';
  for (let t = Math.ceil(tMin / 5) * 5; t <= tMax + 1e-9; t += 5)
    g += `<line x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${B}" stroke="#EFE0CC"/>`
      + (t % 10 === 0 ? `<text x="${X(t)}" y="${B + 20}" text-anchor="middle" font-size="14" fill="#A98D77">${t}℃</text>` : '');
  for (let h = 0; h <= hMax + 1e-9; h += 0.5)
    g += `<line x1="${L}" y1="${Y(h)}" x2="${R}" y2="${Y(h)}" stroke="#EFE0CC"/><text x="${L - 8}" y="${Y(h) + 5}" text-anchor="end" font-size="14" fill="#A98D77">${h.toFixed(1)}km</text>`;
  g += `<line x1="${L}" y1="${T - 6}" x2="${L}" y2="${B}" stroke="#C9B49A" stroke-width="2"/><line x1="${L}" y1="${B}" x2="${R + 6}" y2="${B}" stroke="#C9B49A" stroke-width="2"/>`;
  (o.hl || []).forEach(hh => {
    if (hh.b) g += `<path d="${P([hh.a, hh.b])}" stroke="${hh.color || '#F5C86E'}" stroke-width="18" opacity=".45" stroke-linecap="round" fill="none"/>`;
    else g += `<circle cx="${X(hh.a[0])}" cy="${Y(hh.a[1])}" r="14" fill="${hh.color || '#F5C86E'}" opacity=".55"/>`;
  });
  (o.series || trailSeries()).forEach(sr => {
    g += `<path d="${P(sr.pts)}" fill="none" stroke="${sr.color}" stroke-width="${sr.w || 4}" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''} stroke-linecap="round"/>`;
  });
  (o.marks || []).forEach(m => {
    g += `<circle cx="${X(m.a[0])}" cy="${Y(m.a[1])}" r="5" fill="${m.color || '#8A7263'}"/>`
      + (m.label ? `<text x="${X(m.a[0]) + (m.dx ?? 8)}" y="${Y(m.a[1]) + (m.dy ?? -8)}" font-size="13" fill="${m.color || '#8A7263'}" text-anchor="${m.anchor || 'start'}">${m.label}</text>` : '');
  });
  (o.cands || []).forEach(cd => {
    const on = cd.id === o.sel;
    if (cd.kind === 'seg')
      g += `<path class="cand" data-id="${cd.id}" d="${P([cd.a, cd.b])}" stroke="${on ? 'rgba(240,169,126,.75)' : 'rgba(240,169,126,.16)'}" stroke-width="22" stroke-linecap="round" fill="none"/>`;
    else
      g += `<circle class="cand" data-id="${cd.id}" cx="${X(cd.a[0])}" cy="${Y(cd.a[1])}" r="${on ? 12 : 9}" fill="${on ? '#F0A97E' : '#FFFFFF'}" stroke="${cd.color || '#B8977C'}" stroke-width="3"/>`;
  });
  const leg = o.legend || [['#E8926C', '', '기온(오를 때)'], ['#E88AA8', '', '기온(내려올 때)'], ['#6E86B8', '8 6', '이슬점'], ['#C9BEB2', '3 6', '앞선 여정 요약']];
  leg.forEach(([col, dash, txt], i) => {
    const x = L + 10 + i * 118;
    g += `<line x1="${x}" y1="${T + 2}" x2="${x + 22}" y2="${T + 2}" stroke="${col}" stroke-width="4" ${dash ? `stroke-dasharray="${dash}"` : ''}/><text x="${x + 27}" y="${T + 7}" font-size="13" fill="#8A7263">${txt}</text>`;
  });
  return { svg: `<svg class="bg" viewBox="0 0 560 345" role="img" aria-label="${o.aria || '높이-온도 그래프'}">${g}</svg>`, X, Y };
}
// 작은 장면: 그래프에서 고른 지점이 여행의 어디인지 함께 강조
function miniSceneSVG(h, side) {
  const gy = 140, px = 132, py = 36, x0 = 44, x1 = 224;
  const hy = hh => gy - hh / 2 * (gy - py);
  const posX = (hh, sd) => (sd === 'down' ? px + (1 - hh / 2) * (x1 - px) : x0 + hh / 2 * (px - x0));

      <text x="4" y="${hy(h) - 5}" font-size="12" fill="#C96A4E">${kf(h)} km</text>

    <rect width="260" height="175" rx="14" fill="#F3FAFF"/>
    <rect x="0" y="${gy}" width="${x0 + 6}" height="${175 - gy}" fill="#BFE3F2"/>
    <path d="M${x0} ${gy} L${px} ${py} L${x1} ${gy} Z" fill="#CBE7D2" stroke="#A5D2B4" stroke-width="3" stroke-linejoin="round"/>
    <rect x="${x1 - 6}" y="${gy}" width="${260 - x1 + 6}" height="${175 - gy}" fill="#F6E7C8"/>
    <rect x="${x0}" y="${gy}" width="${x1 - x0}" height="${175 - gy}" fill="#E4EFD9"/>
    <text x="6" y="168" font-size="12" fill="#5D7FB8">영동</text><text x="226" y="168" font-size="12" fill="#C96A4E">영서</text>
    ${m}</svg>`;
}
function segDist(p, a, b) {
  const vx = b.x - a.x, vy = b.y - a.y, wx = p.x - a.x, wy = p.y - a.y;
  const t = clamp((vx * wx + vy * wy) / (vx * vx + vy * vy || 1), 0, 1);
  return Math.hypot(p.x - (a.x + vx * t), p.y - (a.y + vy * t));
}
// 그래프 판단: 점·구간 고르기 (터치 오차는 가장 가까운 후보로 보정, 표시 수치는 실제 데이터 값)
function graphPick(key, G) {
  return guard(new Promise(res => {
    let sel = null, rec = null, fbHtml = '', done = false;
    const render = () => {
      const bg = bigGraph({ ...(G.graph || {}), cands: G.cands, sel, hl: G.hl || [] });
      const c = G.cands.find(x => x.id === sel);
      panel(`<span class="tag">📈 ${G.tag || '발자국 그래프로 판단하기'}</span><p class="q">${G.q}</p>
        <div class="bgWrap"><div>${bg.svg}</div>
          <div class="bgSide">${G.side === false ? '' : miniSceneSVG(c ? c.h : null, c ? c.side : null)}
            <div class="pickInfo">${c ? c.info : '그래프의 점(또는 구간)을 눌러 골라 봐'}</div></div></div>
        <div class="pickList">${G.cands.map((x, i) => `<button data-key="${i + 1}" data-id="${x.id}" class="${x.id === sel ? 'sel' : ''}">${i + 1}. ${x.label}</button>`).join('')}</div>
        ${done ? '' : `<div class="row2"><button class="btn" id="gpOk" ${sel ? '' : 'disabled'}>이걸로 정하기</button></div>`}
        ${fbHtml}`, 'wide');
      const svgEl = document.querySelector('#overlay svg.bg');
      svgEl.addEventListener('click', e => {
        if (done) return;
        const pt = svgEl.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
        const p = pt.matrixTransform(svgEl.getScreenCTM().inverse());
        let best = null, bd = 1e9;
        G.cands.forEach(x => {
          const A = { x: bg.X(x.a[0]), y: bg.Y(x.a[1]) };
          const d = x.kind === 'seg' ? segDist(p, A, { x: bg.X(x.b[0]), y: bg.Y(x.b[1]) }) : Math.hypot(p.x - A.x, p.y - A.y);
          if (d < bd) { bd = d; best = x; }
        });
        if (best && bd < 70) { sel = best.id; AudioSys.sTick(); fbHtml = ''; render(); }
      });
