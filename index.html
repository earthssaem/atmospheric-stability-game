        e.stopPropagation(); if (done) return; sel = b.dataset.id; AudioSys.sTick(); fbHtml = ''; render();
      }));
      onClick('gpOk', () => decide());
      onClick('gpEvi', () => { if (rec) rec.help++; G.evidence(render); });
      onClick('gpNext', () => { closePanel(); res(sel); });
      const nb = $('gpNext') || $('gpOk'); if (nb && !nb.disabled) nb.focus();
    };
    const decide = () => {
      const c = G.cands.find(x => x.id === sel);
      const ok = Array.isArray(G.answer) ? G.answer.includes(sel) : G.answer === sel;
      if (!rec) { const pv = S.rec.judge[key]; rec = S.rec.judge[key] = { ch: S.chapter, q: G.short || G.q, first: pv ? pv.first : sel, firstText: pv ? pv.firstText : c.label, firstOk: pv ? pv.firstOk : ok, tries: pv ? pv.tries : 0, help: pv ? pv.help : 0, graph: true }; }
      rec.tries++; rec.final = sel; rec.finalText = c.label; rec.ok = ok;

        done = true; AudioSys.sSparkle();

      } else {
        AudioSys.sMiss();
        fbHtml = `<div class="fb no">🔎 ${(G.fb && G.fb[sel]) || G.noFb}</div>${G.evidence ? '<div class="row2"><button class="btn sub" id="gpEvi">근거 다시 보기</button></div>' : ''}`;
      }
      render();
    };
    render();
  }));
}

  2: [['상승 응결 고도', '기온 = 이슬점이 되어 응결이 시작되는 높이. H(km) = (T₀ − Td₀) / 8'], ['포화 상태', '기온 = 이슬점, 상대 습도 100%']],
  3: [['응결열', '수증기가 물방울로 응결할 때 나오는 열'], ['습윤 단열 감률', '포화 공기: 1 km에 약 5℃ (이슬점도 함께 5℃)']],
  4: [['응결 ≠ 강수', '응결: 수증기 → 물방울 / 강수: 커진 물방울이 떨어짐']],
  5: [['단열 압축', '하강 → 주위 기압이 높아 부피 압축 → 기온 상승'], ['하강(불포화)', '기온 1 km에 +10℃, 이슬점 +2℃']],
};
const MAP_CAPTIONS = {
  0: '출발! 기온 20℃ · 이슬점 12℃ · 상대 습도 약 60%',
  1: '0.5 km: 기온 −5℃, 이슬점 −1℃ → 두 값의 차이가 8℃에서 4℃로',
  2: '두 발자국이 만났어요 ✨ 1.0 km에서 기온 = 이슬점 = 10℃',
  3: '구름 속에서는 1 km에 5℃씩 — 기온 선의 기울기가 달라졌어요',
  4: '영동 쪽 비탈에 비 — 공기와 함께 넘어가는 수분이 줄었어요',
  5: '내려올 땐 1 km에 10℃씩 — 기온과 이슬점의 두 선이 벌어져요',
};
function journeyGraphSVG(ch) {
  const L = 48, R = 306, T = 22, B = 252;
  const gx = t => L + (t / 30) * (R - L), gy = h => B - (h / 2) * (B - T);
  const d = pts => pts.map((p, i) => (i ? 'L' : 'M') + gx(p[0]).toFixed(1) + ' ' + gy(p[1]).toFixed(1)).join(' ');
  let grid = '';
  for (let t = 0; t <= 30; t += 5)
    grid += `<line x1="${gx(t)}" y1="${T}" x2="${gx(t)}" y2="${B}" stroke="#EFE0CC" stroke-width="1.1"/>` + (t % 10 === 0 ? `<text class="mapLabel" x="${gx(t)}" y="${B + 18}" text-anchor="middle">${t}℃</text>` : '');
  for (let h = 0; h <= 2; h += 0.5)
    grid += `<line x1="${L}" y1="${gy(h)}" x2="${R}" y2="${gy(h)}" stroke="#EFE0CC" stroke-width="1.1"/><text class="mapLabel" x="${L - 7}" y="${gy(h) + 4}" text-anchor="end">${h.toFixed(1)}km</text>`;
  let lines = '';
  trailSeries().forEach(sr => { lines += `<path d="${d(sr.pts)}" fill="none" stroke="${sr.color}" stroke-width="${sr.sum ? 2.5 : (sr.w || 4)}" ${sr.dash ? `stroke-dasharray="${sr.dash}"` : ''} stroke-linecap="round"/>`; });
  let pulse = '';
  if (ch === 1) pulse = `<path class="jgPulse" stroke="#E8926C" d="${d([PT.T0, PT.T05])}"/><path class="jgPulse" stroke="#6E86B8" d="${d([PT.Td0, PT.Td05])}"/>`;
  else if (ch === 2) pulse = `<circle class="jgPulseDot" cx="${gx(10)}" cy="${gy(1)}" r="15" fill="#9FB4DC"/>`;
  else if (ch === 3) pulse = `<path class="jgPulse" stroke="#E8926C" d="${d([PT.LCL, PT.TOP])}"/>`;
  else if (ch === 5) pulse = `<path class="jgPulse" stroke="#E88AA8" d="${d([PT.TOP, PT.ARR])}"/>`;
  const hasSum = Trail.sumUp > 0 || Trail.sumDown;
  return `<svg class="jgSvg" viewBox="0 0 330 300">
    <rect width="330" height="300" rx="16" fill="#FFFDF8" stroke="#EAD3BC" stroke-width="2.5"/>
    ${grid}
    <line x1="${L}" y1="${T - 6}" x2="${L}" y2="${B}" stroke="#C9B49A" stroke-width="2"/><line x1="${L}" y1="${B}" x2="${R + 6}" y2="${B}" stroke="#C9B49A" stroke-width="2"/>
    ${pulse}${lines}
    ${Trail.condensed ? `<text x="${gx(10) - 9}" y="${gy(1) - 9}" font-size="17">✨</text>` : ''}
    <text x="56" y="${T + 14}" font-size="13" fill="#E8926C">━ 기온</text><text x="108" y="${T + 14}" font-size="13" fill="#6E86B8">┅ 이슬점</text>
    ${hasSum ? `<text x="170" y="${T + 14}" font-size="12" fill="#A9988A">⋯ 앞선 여정 요약</text>` : ''}
  </svg>`;
}
// 여정 지도 (막간 — 교사 설명 타이밍). 이 장에서 새로 남긴 관측 기록과 교과서 용어를 함께
function showMap() {
  return guard(new Promise(res => {
    S.rec.done[S.chapter] = true; renderProgress();
    MiniGraph.setVisible(false);
    const ch = S.chapter;
    const recs = S.newObs.map(o => `<span class="recNew">📒 ${o.label}: 기온 ${nf(o.T)}℃ · 이슬점 ${nf(o.Td)}℃ · 상대 습도 ${Math.round(o.rh)}%${o.note ? ' · ' + o.note : ''}</span>`).join('');
    const terms = (TERM_CARDS[ch] || []).map(([t, dd]) => `<div class="termCard"><b>${t}</b><br>${dd}</div>`).join('');
    panel(`<h2>🗺 뭉게의 여정 지도 &amp; 발자국</h2>
      <div class="mapRow">${journeyMapSVG(ch)}${journeyGraphSVG(ch)}</div>
      ${MAP_CAPTIONS[ch] ? `<p class="trailCap">${MAP_CAPTIONS[ch]}</p>` : ''}
      ${recs ? `<div>${recs}</div>` : ''}
      ${terms ? `<div class="termRow">${terms}</div>` : ''}
      <div><button class="btn" id="mapNextBtn" data-key="1">다음 여정으로 ➜</button></div>`, 'wide');
    onClick('mapNextBtn', () => { AudioSys.sPop(); closePanel(); res(); });
  }));
}

const st0sat = h => riseState(SCENARIO.T0, SCENARIO.Td0, h).saturated;
// 1·2장: 위로 오르는 장면 (영동 해안). 관측 지점 자동 정지 · 응결 예상 높이 표시
const RiseScene = {
  map: null, cfg: {}, playing: false, stopped: false, markMode: false, markH: 1.2, markSet: null, dragMark: false, ringT: 0,
  setup(cfg) { this.cfg = Object.assign({ start: 0, max: 1.6, stopAt: null, flags: [], diff: false }, cfg); this.markSet = null; },
  enter() {
    this.map = vertMap(1.9);
    M.visible = true; M.coat = false; M.droplets = 0; M.baseFace = 'normal';
    M.maxStep = TUNING.move.maxKmPerSec * this.map.pxPerKm;
    M.place(W * 0.42, this.map.kmToY(this.cfg.start));
    this.playing = false; this.stopped = false; this.markMode = false; this.ringT = 0;
  },
  exit() { M.maxStep = 0; },
  resize(oldW) { refitVert(this, 1.9, oldW); if (this.map) M.maxStep = TUNING.move.maxKmPerSec * this.map.pxPerKm; },
  alt() { return clamp(this.map.yToKm(M.y), 0, 2.4); },
  bounds() { return [this.map.kmToY(this.cfg.max), this.map.kmToY(this.cfg.start)]; },
  update(dt) {
    const [minY, maxY] = this.bounds();
    if (this.playing) moveByCtrl(dt, TUNING.move.btnKmPerSec * this.map.pxPerKm, 80, W - 80, minY, maxY);
    M.ty = clamp(M.ty, minY, maxY);
    M.update(dt, 0, this.map.pxPerKm);
    let h = this.alt();
    // 관측 지점 자동 정지: stopAt을 지나면 정확히 그 높이에 멈춤 (설명 수치 = 실제 위치)
    if (this.playing && this.cfg.stopAt != null && h >= this.cfg.stopAt - 0.004) {
      h = this.cfg.stopAt; M.y = M.ty = this.map.kmToY(h); M.held = false;
      this.playing = false; this.stopped = true; this.ringT = st0sat(h) ? 2.5 : 0;
      actDone('reach', h);
    }
    const st = riseState(SCENARIO.T0, SCENARIO.Td0, h);
    setMeters(h, st.T, st.Td);
    if (this.playing || this.stopped) Trail.up(h);
    MiniGraph.tick(h, 'up');
    M.altKm = h;
    // 물방울·구름 표현은 실제 물리 상태(기온 = 이슬점)와 일치할 때만
    M.droplets = st.saturated ? 1 : 0; M.coat = st.saturated;
    M.baseFace = st.saturated ? 'cloud' : h > 0.6 ? 'cold' : 'normal';
    if (this.playing) M.breathFace();
    if (this.ringT > 0) this.ringT -= dt;
  },
  pd(x, y) {
    if (this.markMode) { this.dragMark = true; this.setMark(this.map.yToKm(y)); return; }
    if (this.playing) tryGrab(x, y);
  },
  pm(x, y) {
    if (this.markMode && this.dragMark) { this.setMark(this.map.yToKm(y)); return; }
    if (this.playing) { const [minY, maxY] = this.bounds(); dragTo(x, y, 80, W - 80, minY, maxY); }
  },
  pu() { M.held = false; this.dragMark = false; },
  setMark(h) {
    this.markH = clamp(Math.round(h * 20) / 20, 0.55, 1.6);
    const v = $('mkVal'); if (v) v.textContent = `${kf(this.markH)} km`;
  },
  onKey(e) {
    if (!this.markMode) return false;
    if (e.key === 'ArrowUp') { this.setMark(this.markH + 0.05); return true; }
    if (e.key === 'ArrowDown') { this.setMark(this.markH - 0.05); return true; }
    return false;
  },
  flagLine(c, h, label, col, t, pulse) {
    const y = this.map.kmToY(h);
    c.save(); c.strokeStyle = col; c.lineWidth = 3; c.setLineDash([12, 9]);
    c.globalAlpha = pulse ? 0.65 + Math.sin(t * 4) * 0.3 : 0.9;
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); c.restore();
    c.fillStyle = col; c.font = '18px Jua'; c.textAlign = 'right'; c.fillText(label, W - 24, y - 10); c.textAlign = 'left';
  },
  draw(c, t) {
    skyGrad(c, '#BFE0F5', '#EAF6F0');
    drawSun(c, W * 0.85, H * 0.18, 38, t);
    const gY = this.map.groundY;
    c.fillStyle = '#AEDCEF'; c.fillRect(0, gY, W, H - gY);
    c.fillStyle = '#F2E3C4';
    c.beginPath(); c.moveTo(W * 0.5, gY); c.quadraticCurveTo(W * 0.75, gY - 16, W, gY - 8); c.lineTo(W, H); c.lineTo(W * 0.5, H); c.fill();
    drawAltRuler(c, this.map.kmToY, 1.5, []);
    this.cfg.flags.forEach(f => this.flagLine(c, f.h, f.label, f.col || '#4E9A6E', t, this.playing));
    if (this.markMode) this.flagLine(c, this.markH, `🚩 내 예상: ${kf(this.markH)} km`, '#E0864F', t, true);
    else if (this.markSet != null) this.flagLine(c, this.markSet, `🚩 내 예상 ${kf(this.markSet)} km`, 'rgba(224,134,79,.75)', t, false);
    if (this.cfg.diff) {
      const h = this.alt(), st = riseState(SCENARIO.T0, SCENARIO.Td0, h), gap = st.T - st.Td;
      const cx = W * 0.5, cy = 150;
      c.save(); c.fillStyle = 'rgba(255,251,243,.9)'; c.strokeStyle = '#E9CDB4'; c.lineWidth = 3;
      c.beginPath(); c.roundRect(cx - 170, cy - 36, 340, 100, 20); c.fill(); c.stroke();
      c.font = '25px Jua'; c.textAlign = 'center';
      c.fillStyle = '#D97F62'; c.fillText(`기온 ${fmt1(st.T)}℃`, cx - 82, cy);
      c.fillStyle = '#6E86B8'; c.fillText(`이슬점 ${fmt1(st.Td)}℃`, cx + 82, cy);
      c.font = '21px Jua'; c.fillStyle = gap < 0.05 ? '#4E9A6E' : '#8A6A52';
      c.fillText(gap < 0.05 ? '두 값이 같아요 = 포화' : `두 값의 차이 ${fmt1(gap)}℃`, cx, cy + 44);
      c.restore();
    }
    if (this.ringT > 0) { // 응결 순간: 뭉게 안 물방울 + 그래프 교점을 함께 강조
      c.save(); c.strokeStyle = `rgba(127,159,216,${clamp(this.ringT / 2.5, 0, 1)})`; c.lineWidth = 6;
      c.beginPath(); c.arc(M.x, M.y, M.r + 22 + (2.5 - this.ringT) * 10, 0, TAU); c.stroke(); c.restore();
    }
    M.draw(c, t);
  },
};

// 3장: 산비탈을 따라 정상으로 — 바람길을 벗어나면 감점 없이 부드럽게 되돌림
const SlopeScene = {
  playing: false, camX: 0, camY: 0, pxX: 0, pxY: 0, worldTopKm: 2.6, worldWKm: 4.3, drops: [], dropAcc: 0, hintT: 0,
  bandCenter(x) { return 1.0 + 1.0 * smooth(clamp(x / 3.6, 0, 1)); },
  terrain(x) {
    const base = this.bandCenter(x) - 0.34;
    const bump = 0.05 * Math.sin(x * 4.1) * (1 - smooth(clamp((x - 3.1) / 0.5, 0, 1)));
    return Math.max(0.1, base + bump);
  },
  enter() {
    this.pxX = W / 2.2; this.pxY = H / 1.55;
    M.visible = true; M.coat = true; M.droplets = 1; M.baseFace = 'cloud';
    this.camX = 0; this.camY = (this.worldTopKm - 1.3) * this.pxY - H * 0.55; this.clampCam();
    const sp = this.w2s(0.05, this.bandCenter(0.05)); M.place(sp.x, sp.y);
    M.maxStep = TUNING.move.maxKmPerSec * this.pxY;
    this.playing = false; this.drops = []; this.dropAcc = 0; this.hintT = 0;
  },
  exit() { M.maxStep = 0; },
  resize(oldW) {
    if (oldW > 0) refitWorld(this, 0.52);
    else { this.pxX = W / 2.2; this.pxY = H / 1.55; this.clampCam(); }
    M.maxStep = TUNING.move.maxKmPerSec * this.pxY;
  },
  w2s(xKm, hKm) { return { x: xKm * this.pxX - this.camX, y: (this.worldTopKm - hKm) * this.pxY - this.camY }; },
  mWorld() { return { x: (M.x + this.camX) / this.pxX, h: this.worldTopKm - (M.y + this.camY) / this.pxY }; },
  clampCam() {
    this.camX = clamp(this.camX, 0, this.worldWKm * this.pxX - W);
    this.camY = clamp(this.camY, 0, this.worldTopKm * this.pxY + 120 - H);
  },
  update(dt) {
    if (this.playing) moveByCtrl(dt, TUNING.move.btnKmPerSec * this.pxY, 40, W - 40, 40, H - 40);
    M.update(dt, this.pxX, this.pxY);
    let mw = this.mWorld();
    if (this.playing) {
      const bc = this.bandCenter(mw.x), off = mw.h - bc, half = TUNING.slope.bandHalfKm;
      if (Math.abs(off) > half) {  // 바람길 밖: 잠깐 손을 놓게 하고 가까운 바람길로 부드럽게 복귀
        const ty = this.w2s(mw.x, bc + Math.sign(off) * half * 0.5).y, k = Math.min(1, dt * TUNING.slope.returnRate);
        M.y += (ty - M.y) * k; M.ty += (ty - M.ty) * k;
        this.hintT -= dt;
        if (this.hintT <= 0) { toast('바람길 쪽으로 데려다 줄게 — 노란 길을 따라가요', true, 1500); this.hintT = 3.5; }
      }
      const ter = this.terrain(mw.x);
      if (mw.h < ter + 0.07) { const yy = this.w2s(mw.x, ter + 0.07).y; M.y = Math.min(M.y, yy); M.ty = Math.min(M.ty, yy); }
      mw = this.mWorld();
    }
    const h = clamp(mw.h, 0, SCENARIO.TOP), st = riseState(SCENARIO.T0, SCENARIO.Td0, h);
    setMeters(h, st.T, st.Td);
    Trail.up(h); MiniGraph.tick(h, 'up');
    M.altKm = h;
    M.droplets = st.saturated ? 1 : 0; M.coat = st.saturated;
    M.baseFace = st.saturated ? 'cloud' : 'cold';
    // 구름 속(포화)에서 커진 물방울 일부가 영동 쪽 비탈로 떨어짐
    if (st.saturated) {
      this.dropAcc += dt * 40;
      while (this.dropAcc >= 1) { this.dropAcc -= 1; this.drops.push({ x: mw.x + (Math.random() - 0.5) * 0.3, h: mw.h - 0.06 - Math.random() * 0.06, v: 0.8 + Math.random() * 0.4 }); }
    }
    for (let i = this.drops.length - 1; i >= 0; i--) {
      const d = this.drops[i]; d.h -= d.v * dt; d.x -= 0.08 * dt;
      if (d.h <= this.terrain(d.x)) this.drops.splice(i, 1);
    }
    const dCamX = clamp(mw.x * this.pxX - W * 0.42, 0, Math.max(0, this.worldWKm * this.pxX - W)) - this.camX;
    const dCamY = clamp((this.worldTopKm - mw.h) * this.pxY - H * 0.52, 0, this.worldTopKm * this.pxY + 120 - H) - this.camY;
    const kx = Math.min(1, dt * 3.5);
    this.camX += dCamX * kx; M.x -= dCamX * kx; M.tx -= dCamX * kx;
    this.camY += dCamY * kx; M.y -= dCamY * kx; M.ty -= dCamY * kx;
    if (!this.playing) return;
    M.breathFace();
    if (mw.x >= 3.55 && mw.h >= 1.88) {   // 정상 도착 → 정확히 2.0 km에 멈춤
      this.playing = false; M.held = false;
      const p = this.w2s(3.7, SCENARIO.TOP); M.place(p.x, p.y);
      Trail.up(SCENARIO.TOP);
      setMeters(SCENARIO.TOP, SUMMIT.T, SUMMIT.Td); MiniGraph.tick(SCENARIO.TOP, 'up');   // 멈춘 지점의 정확한 값
      spawnParticles(M.x, M.y, 18, ['#FFFFFF', '#CDEBFF', '#FFEFC2'], 150, 1);
      actDone('summit');
    }
  },
  pd(x, y) { if (this.playing) tryGrab(x, y); },
  pm(x, y) { if (this.playing) dragTo(x, y, 40, W - 40, 40, H - 40); },
  pu() { M.held = false; },
  draw(c, t) {
    skyGrad(c, '#AECBEE', '#E4EEF2');
    c.fillStyle = 'rgba(180,205,190,.5)';
    c.beginPath(); c.moveTo(0, H);
    for (let sx = 0; sx <= W; sx += 30) { const xKm = (sx + this.camX * 0.4) / this.pxX; c.lineTo(sx, this.w2s(0, this.terrain(xKm) * 0.75 + 0.5).y + this.camY * 0.5); }
    c.lineTo(W, H); c.fill();
    const half = TUNING.slope.bandHalfKm;
    c.beginPath();
    for (let sx = -20; sx <= W + 20; sx += 24) { const xKm = (sx + this.camX) / this.pxX, y = this.w2s(0, this.bandCenter(xKm) + half).y; sx === -20 ? c.moveTo(sx, y) : c.lineTo(sx, y); }
    for (let sx = W + 20; sx >= -20; sx -= 24) { const xKm = (sx + this.camX) / this.pxX; c.lineTo(sx, this.w2s(0, this.bandCenter(xKm) - half).y); }
    c.closePath(); c.fillStyle = `rgba(255,235,170,${0.3 + Math.sin(t * 3) * 0.06})`; c.fill();
    // 1 km 선 (구름이 시작된 높이)
    const y1 = this.w2s(0, H0).y;
    c.save(); c.strokeStyle = 'rgba(120,150,220,.55)'; c.setLineDash([10, 8]); c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(0, y1); c.lineTo(W, y1); c.stroke(); c.restore();
    c.fillStyle = '#5D7FB8'; c.font = '16px Jua'; c.fillText('1.0 km — 응결이 시작된 높이', 190, y1 - 8);
    c.fillStyle = '#BFDCC8'; c.strokeStyle = '#9CC4A8'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(-20, H + 20);
    for (let sx = -20; sx <= W + 20; sx += 20) { const xKm = (sx + this.camX) / this.pxX; c.lineTo(sx, this.w2s(0, this.terrain(xKm)).y); }
    c.lineTo(W + 20, H + 20); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#8FBF9C';
    for (let i = 0; i < 14; i++) {
      const xKm = 0.15 + i * 0.31, p = this.w2s(xKm, this.terrain(xKm));
      if (p.x < -30 || p.x > W + 30) continue;
      c.beginPath(); c.moveTo(p.x, p.y - 26); c.lineTo(p.x - 11, p.y + 2); c.lineTo(p.x + 11, p.y + 2); c.closePath(); c.fill();
    }
    const fp = this.w2s(3.85, this.bandCenter(3.85));
    c.strokeStyle = '#A0765C'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(fp.x, fp.y + 10); c.lineTo(fp.x, fp.y - 52); c.stroke();
    c.fillStyle = '#F58C8C';
    c.beginPath(); c.moveTo(fp.x, fp.y - 52); c.lineTo(fp.x + 44 + Math.sin(t * 4) * 4, fp.y - 40); c.lineTo(fp.x, fp.y - 28); c.closePath(); c.fill();
    c.fillStyle = '#7A6152'; c.font = '17px Jua'; c.textAlign = 'center'; c.fillText('정상 2.0 km', fp.x + 10, fp.y - 62); c.textAlign = 'left';
    c.strokeStyle = 'rgba(120,170,225,.75)'; c.lineWidth = 2.5; c.lineCap = 'round';
    this.drops.forEach(d => { const p = this.w2s(d.x, d.h); c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - 2, p.y + 13); c.stroke(); });
    M.draw(c, t);
  },
};

// 4장: 구름 속 관찰 — 응결(물방울+열) → 성장·강수 → 함께 이동하는 수분 비교
const CloudScene = {
  stage: 0, st0: 0,
  enter() {
    M.visible = true; M.coat = true; M.droplets = 1; M.baseFace = 'cloud'; M.altKm = SCENARIO.TOP;
    M.place(W * 0.26, H * 0.44); this.stage = 0; this.st0 = S.time;
  },
  setStage(n) { this.stage = n; this.st0 = S.time; },
  update(dt) { M.tx = W * 0.26 + Math.sin(S.time * 0.8) * 6; M.ty = H * 0.44; M.update(dt, 0, 0); setMeters(SCENARIO.TOP, SUMMIT.T, SUMMIT.Td); },
  // 함께 이동하는 물(수증기 + 물방울)과 빗물 — 개념용 상대량
  water() {
    const s = this.stage;
    if (s <= 0) return { vap: 100, drop: 0, rain: 0 };
    if (s === 1) return { vap: 70, drop: 30, rain: 0 };
    if (s === 2) { const k = clamp((S.time - this.st0) / 4, 0, 1); return { vap: 70, drop: 30 - 20 * k, rain: 20 * k }; }
    return { vap: 70, drop: 10, rain: 20 };
  },
  draw(c, t) {
    skyGrad(c, '#9FB4CE', '#DCE6EC');
    c.fillStyle = '#A9C8B4';
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 30) c.lineTo(x, H * 0.92 - Math.max(0, (W * 0.45 - Math.abs(x - W * 0.3))) * 0.45);
    c.lineTo(W, H); c.fill();
    const s = this.stage;
    if (s >= 2) { // 영동 쪽 비탈로 떨어지는 비
      c.strokeStyle = 'rgba(120,170,225,.8)'; c.lineWidth = 3; c.lineCap = 'round';
      for (let i = 0; i < 16; i++) {
        const x = M.x - 50 + (i * 23) % 100, y = M.y + M.r + ((t * 220 + i * 37) % (H * 0.32));
        c.beginPath(); c.moveTo(x, y); c.lineTo(x - 3, y + 14); c.stroke();
      }
    }
    M.draw(c, t);
    // 돋보기: 뭉게 속 들여다보기
    const R = Math.min(H * 0.26, W * 0.17), cx = W * 0.56, cy = H * 0.46;
    c.save();
    c.strokeStyle = 'rgba(160,130,105,.5)'; c.lineWidth = 3; c.setLineDash([6, 6]);
    c.beginPath(); c.moveTo(M.x + M.r * 0.6, M.y - M.r * 0.3); c.lineTo(cx - R, cy - R * 0.3); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#F6FAFF'; c.strokeStyle = '#C9B49A'; c.lineWidth = 6;
    c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fill(); c.stroke();
    c.beginPath(); c.arc(cx, cy, R - 3, 0, TAU); c.clip();
    for (let i = 0; i < 46; i++) {      // 수증기 (작은 점)
      const a = i * 2.399 + t * 0.3 * ((i % 3) - 1), rr = R * (0.15 + 0.8 * ((i * 53) % 17) / 17);
      c.fillStyle = 'rgba(150,175,205,.55)';
      c.beginPath(); c.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 2.2, 0, TAU); c.fill();
    }
    if (s >= 1) {                       // 응결: 물방울 + 열
      const n = s === 3 ? 6 : 14;
      for (let i = 0; i < n; i++) {
        const a = i * 1.7 + 0.4, rr = R * (0.2 + 0.6 * ((i * 29) % 13) / 13);
        let x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr, r = 5 + (i % 3);
        if (s === 2 && i % 2 === 0) { const fall = ((t - this.st0) * 60 + i * 20) % (R * 2.2); y += fall; r = 9 + (i % 3) * 2; }
        c.fillStyle = 'rgba(95,155,215,.85)'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
        if (s === 1 && i % 3 === 0) { c.fillStyle = `rgba(240,140,90,${0.5 + 0.5 * Math.sin(t * 4 + i)})`; c.font = '14px Jua'; c.fillText('+열', x + 6, y - 6); }
      }
    }
    c.restore();
    c.fillStyle = '#7A6152'; c.font = '17px Jua'; c.textAlign = 'center';
    c.fillText('🔍 뭉게 속 들여다보기', cx, cy - R - 12);
    const lab = ['수증기가 들어 있어요', '응결: 수증기 → 작은 물방울 (+응결열)', '물방울이 커져 떨어져요 (강수)', '떨어진 비는 영동 쪽에 남아요'][s] || '';
    c.fillStyle = '#4E6E9C'; c.fillText(lab, cx, cy + R + 28); c.textAlign = 'left';
    // 함께 이동하는 물 막대
    const w = this.water(), bx = W * 0.8, by = H * 0.76, bh = H * 0.42, bw = 52, k = bh / 100;
    const bar = (x, vap, drop, title) => {
      c.fillStyle = '#E3ECF6'; c.fillRect(x, by - bh, bw, bh);
      c.fillStyle = '#B8D4F0'; c.fillRect(x, by - vap * k, bw, vap * k);
      c.fillStyle = '#5F9BD7'; c.fillRect(x, by - (vap + drop) * k, bw, drop * k);
      c.strokeStyle = '#A8B9CC'; c.lineWidth = 2; c.strokeRect(x, by - bh, bw, bh);
      c.fillStyle = '#6B564C'; c.font = '14px Jua'; c.textAlign = 'center'; c.fillText(title, x + bw / 2, by + 20); c.textAlign = 'left';
    };
    bar(bx - 70, 100, 0, '출발');
    bar(bx + 10, w.vap, w.drop, '지금');
    if (w.rain > 0.5) {
      c.save(); c.setLineDash([5, 4]); c.strokeStyle = '#5F9BD7'; c.lineWidth = 2;
      c.strokeRect(bx + 10, by - (w.vap + w.drop + w.rain) * k, bw, w.rain * k); c.restore();
      c.fillStyle = '#4E6E9C'; c.font = '13px Jua'; c.fillText('비로 빠져나감', bx + 66, by - (w.vap + w.drop + w.rain / 2) * k + 4);
    }
    c.fillStyle = '#6B564C'; c.font = '15px Jua'; c.textAlign = 'center';
    c.fillText('공기와 함께 이동하는 물', bx + 21, by - bh - 30);
    c.font = '13px Jua'; c.fillStyle = '#7F95C4'; c.fillText('■ 수증기  ■ 물방울', bx + 21, by - bh - 12); c.textAlign = 'left';
  },
};

// 5장: 산 너머로 — 1 km에서 멈춰 관찰, 영서 평지 어디든 착지 성공 (속도 보조)
const DescentScene = {
  playing: false, camX: 0, camY: 0, pxX: 0, pxY: 0, worldTopKm: 2.6, worldWKm: 4.4, landed: false, midDone: false,
  terrain(x) { return 2.0 * (1 - smooth(clamp((x - 0.15) / 2.9, 0, 1))); },
  enter() {
    this.pxX = W / 2.2; this.pxY = H / 1.55;
    M.visible = true; M.coat = false; M.droplets = 0; M.baseFace = 'normal';
    this.camX = 0; this.camY = 0; this.clampCam();
    const sp = this.w2s(0.12, SCENARIO.TOP + 0.04); M.place(sp.x, sp.y);
    M.maxStep = TUNING.move.maxKmPerSec * this.pxY;
    this.playing = false; this.landed = false; this.midDone = false;
  },
  exit() { M.maxStep = 0; },
  resize(oldW) {
    if (oldW > 0) refitWorld(this, 0.45);
    else { this.pxX = W / 2.2; this.pxY = H / 1.55; this.clampCam(); }
    M.maxStep = TUNING.move.maxKmPerSec * this.pxY;
  },
  w2s(xKm, hKm) { return { x: xKm * this.pxX - this.camX, y: (this.worldTopKm - hKm) * this.pxY - this.camY }; },
  mWorld() { return { x: (M.x + this.camX) / this.pxX, h: this.worldTopKm - (M.y + this.camY) / this.pxY }; },
  clampCam() {
    this.camX = clamp(this.camX, 0, this.worldWKm * this.pxX - W);
    this.camY = clamp(this.camY, 0, this.worldTopKm * this.pxY + 140 - H);
  },
  update(dt) {
    if (this.playing && !this.landed) {
      if (!M.held && !Ctrl.x && !Ctrl.y) {   // 손을 떼면 바람 따라 천천히 영서 쪽으로
        M.ty += TUNING.descent.sinkKmPerSec * this.pxY * dt;
        M.tx += TUNING.descent.driftKmPerSec * this.pxX * dt;
      }
      moveByCtrl(dt, TUNING.move.btnKmPerSec * this.pxY, 40, W - 40, 40, H - 30);
    }
    M.update(dt, this.pxX, this.pxY);
    let mw = this.mWorld();
    const ter = this.terrain(mw.x);
    // 비탈에 닿으면 감점 없이 비탈 위로만 밀어 올림 (목표점은 그대로 → 비탈을 따라 미끄러지듯 내려감)
    if (mw.h < ter + 0.05) { const yy = this.w2s(mw.x, ter + 0.05).y; M.y = Math.min(M.y, yy); }
    if (mw.h > SCENARIO.TOP + 0.05) { const yy = this.w2s(mw.x, SCENARIO.TOP + 0.05).y; M.y = Math.max(M.y, yy); M.ty = Math.max(M.ty, yy); }
    mw = this.mWorld();
    const h = this.landed ? 0 : clamp(mw.h, 0, SCENARIO.TOP);
    const st = descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, h);
    setMeters(h, st.T, st.Td);
    if (this.playing || this.landed || this.midDone) { Trail.down(h); MiniGraph.tick(h, 'down'); }
    M.altKm = h;
    if (!this.landed) M.baseFace = h < 0.7 ? 'hot' : 'normal';
    const dCamX = clamp(mw.x * this.pxX - W * 0.42, 0, Math.max(0, this.worldWKm * this.pxX - W)) - this.camX;
    const dCamY = clamp((this.worldTopKm - mw.h) * this.pxY - H * 0.45, 0, this.worldTopKm * this.pxY + 140 - H) - this.camY;
    const kx = Math.min(1, dt * 3.5);
    this.camX += dCamX * kx; M.x -= dCamX * kx; M.tx -= dCamX * kx;
    this.camY += dCamY * kx; M.y -= dCamY * kx; M.ty -= dCamY * kx;
    if (!this.playing || this.landed) return;
    M.breathFace();
    // 하강 중 1 km: 장면을 멈추고 두 값이 벌어지는 것 관찰 (비탈에 붙어 내려와도 1 km 지점을 지나면 멈춤)
    if (!this.midDone && (h <= 1.0 + 0.004 || (mw.h <= 1.08 && mw.h <= ter + 0.07))) {
      this.midDone = true; this.playing = false; M.held = false;
      const p = this.w2s(mw.x, 1.0); M.place(p.x, p.y); Trail.down(1.0);
      const s1 = descendFrom(SUMMIT.T, SUMMIT.Td, SCENARIO.TOP, 1.0);
      setMeters(1.0, s1.T, s1.Td); MiniGraph.tick(1.0, 'down');      // 멈춘 지점의 정확한 값
      actDone('mid'); return;
    }
    if (mw.x >= 2.95 && ter < 0.05 && mw.h <= ter + 0.08) {  // 영서 평지 어디든 착지 — 빠르기·위치로 다시 하게 하지 않음
      this.landed = true; this.playing = false; M.held = false;
      const p = this.w2s(mw.x, 0.05); M.place(p.x, p.y); Trail.down(0);
      setMeters(0, ARRIVAL.T, ARRIVAL.Td); MiniGraph.tick(0, 'down');
      M.baseFace = 'hot'; AudioSys.sClear();
      spawnParticles(M.x, M.y + 20, 16, ['#F6E7C8', '#FFD9B0'], 110, 0.8);
      actDone('land');
    }
  },
  pd(x, y) { if (this.playing) tryGrab(x, y); },
  pm(x, y) { if (this.playing) dragTo(x, y, 40, W - 40, 40, H - 30); },
  pu() { M.held = false; },
  draw(c, t) {
    skyGrad(c, '#BFD8EA', '#FFE9CE');
    drawSun(c, W * 0.78, H * 0.14, 40, t);
    // 영동 쪽(왼쪽 뒤)에 남은 구름과 비 — 구름은 풍상측에 남고, 넘어가는 공기는 불포화
    const cl = this.w2s(-0.35, 1.6);
    drawCloudBlob(c, cl.x, cl.y, 46, 7, t, 0.85);
    c.strokeStyle = 'rgba(120,170,225,.55)'; c.lineWidth = 2.5;
    for (let i = 0; i < 6; i++) { const x = cl.x - 40 + i * 16, y = cl.y + 40 + ((t * 120 + i * 23) % 60); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 2, y + 12); c.stroke(); }
    c.fillStyle = '#C9DFC2'; c.strokeStyle = '#A8CBA0'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(-20, H + 20);
    for (let sx = -20; sx <= W + 20; sx += 20) { const xKm = (sx + this.camX) / this.pxX; c.lineTo(sx, this.w2s(0, this.terrain(xKm)).y); }
    c.lineTo(W + 20, H + 20); c.closePath(); c.fill(); c.stroke();
    const y1 = this.w2s(0, 1.0).y;
    c.save(); c.strokeStyle = 'rgba(232,138,168,.6)'; c.setLineDash([10, 8]); c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(0, y1); c.lineTo(W, y1); c.stroke(); c.restore();
    c.fillStyle = '#C96A8A'; c.font = '16px Jua'; c.textAlign = 'right'; c.fillText('📍 1.0 km 관측 지점', W - 16, y1 - 8); c.textAlign = 'left';
    const za = this.w2s(2.95, 0), zb = this.w2s(4.4, 0);
    c.fillStyle = 'rgba(150,210,180,.28)'; c.fillRect(za.x, za.y - 8, zb.x - za.x, 18);
    c.fillStyle = '#4E9A6E'; c.font = '17px Jua'; c.fillText('영서 지방 — 여기 어디든 내려앉아요', za.x + 10, za.y - 16);
    const hp = this.w2s(4.1, 0);
    if (hp.x < W + 80) {
      c.fillStyle = '#F2D8AE'; c.strokeStyle = '#D9B583'; c.lineWidth = 3;
      [[0, 34, 26], [46, 28, 22]].forEach(([dx, w2, h2]) => {
        c.beginPath(); c.roundRect(hp.x + dx, hp.y - h2, w2, h2, 4); c.fill(); c.stroke();
        c.fillStyle = '#E8967A'; c.beginPath(); c.moveTo(hp.x + dx - 5, hp.y - h2); c.lineTo(hp.x + dx + w2 / 2, hp.y - h2 - 16); c.lineTo(hp.x + dx + w2 + 5, hp.y - h2); c.closePath(); c.fill();
        c.fillStyle = '#F2D8AE';
      });
      c.fillStyle = '#7F95C4'; c.font = '15px Jua'; c.fillText('📡 관측소', hp.x, hp.y - 50);
    }
    M.draw(c, t);
  },
};

// 6장: 영서 관측소 앞 (보고)
const ReportScene = {
  enter() { M.visible = true; M.coat = false; M.droplets = 0; M.baseFace = 'hot'; M.altKm = 0; M.place(W * 0.5, H * 0.62); setMeters(0, ARRIVAL.T, ARRIVAL.Td); },
  update(dt) { M.tx = W * 0.5 + Math.sin(S.time * 0.8) * 20; M.ty = H * 0.62 + Math.sin(S.time * 1.6) * 8; M.update(dt, 0, 0); setMeters(0, ARRIVAL.T, ARRIVAL.Td); },
  draw(c, t) {
    skyGrad(c, '#FFDFB8', '#FFF3DC');
    drawSun(c, W * 0.2, H * 0.18, 46, t);
    c.fillStyle = '#F6E7C8'; c.fillRect(0, H * 0.8, W, H * 0.2);
    c.strokeStyle = '#E3C68F'; c.lineWidth = 3;
    for (let i = 0; i < 8; i++) { const x = (i + 0.5) * W / 8; c.beginPath(); c.moveTo(x - 10, H * 0.88); c.quadraticCurveTo(x, H * 0.83, x + 10, H * 0.88); c.stroke(); }
    M.draw(c, t);
  },
};

// 7장: 다른 조건의 여행(푄 실험실) — 출발 기온 20℃ 고정, 이슬점·산 높이를 한 가지씩 바꿔 비교
const LabScene = {
  Td0: SCENARIO.Td0, Mkm: SCENARIO.TOP, u: -1, result: null,
  geom() {
    const gy = H * 0.86, top = 150;
    const x0 = Math.max(W * 0.42, 500), x1 = W - 64;   // 왼쪽 아래 실험판·오른쪽 끝에 뭉게가 가리지 않게
    return { gy, x0, xp: lerp(x0, x1, 0.48), x1, ky: h => gy - h * (gy - top) / 3.2 };
  },
  slope(s) { const g = this.geom(); return s <= 1 ? { x: lerp(g.x0, g.xp, s), h: this.Mkm * s } : { x: lerp(g.xp, g.x1, s - 1), h: this.Mkm * (2 - s) }; },
  trip() { return foehnTrip(SCENARIO.T0, this.Td0, this.Mkm); },
  stateAt(s) { const p = this.slope(s), f = this.trip(); return s <= 1 ? riseState(SCENARIO.T0, this.Td0, p.h) : descendFrom(f.topT, f.topTd, this.Mkm, p.h); },
  enter() { M.visible = true; M.coat = false; M.droplets = 0; M.baseFace = 'normal'; this.u = -1; this.result = null; },
  setCond(Td, Mk) { this.Td0 = Td; this.Mkm = Mk; this.u = -1; this.result = null; },
  send() { this.result = null; this.u = 0; AudioSys.sWhoosh(); return waitAct('labDone'); },
  update(dt) {
    const g = this.geom();
    let s = 0;
    if (this.u >= 0) {
      this.u = Math.min(1, this.u + dt / 3.6); s = this.u * 2;
      if (this.u >= 1) { this.u = -1; s = 2; this.result = this.trip(); actDone('labDone', this.result); }
    } else if (this.result) s = 2;
    const p = this.slope(s), st = this.stateAt(s);
    M.x = M.tx = p.x; M.y = M.ty = g.ky(p.h) - M.r * 0.9;
    M.altKm = p.h;
    M.droplets = s < 1 && st.saturated ? 1 : 0; M.coat = M.droplets > 0;
    M.update(dt, 0, 0);
    setMeters(p.h, st.T, st.Td);
  },
  resize() {},
  draw(c, t) {
    const g = this.geom(), f = this.trip();
    skyGrad(c, '#CFE6F5', '#FFF1DC');
    drawSun(c, W * 0.9, H * 0.2, 34, t);
    c.fillStyle = '#B5DEEF'; c.fillRect(0, g.gy, g.x0, H - g.gy);
    c.fillStyle = '#F6E7C8'; c.fillRect(g.x0, g.gy, W - g.x0, H - g.gy);
    c.strokeStyle = 'rgba(160,130,105,.3)'; c.fillStyle = 'rgba(140,110,88,.7)'; c.font = '14px Jua'; c.lineWidth = 1.5;
    for (let h = 0; h <= 3; h += 1) {
      const y = g.ky(h);
      c.beginPath(); c.moveTo(g.x0 - 30, y); c.lineTo(g.x0 - 12, y); c.stroke();
      c.textAlign = 'right'; c.fillText(`${h} km`, g.x0 - 34, y + 5); c.textAlign = 'left';
    }
    const pk = g.ky(this.Mkm);
    c.fillStyle = '#C9E3CF'; c.strokeStyle = '#9CC4A8'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(g.x0 - 10, g.gy);
    c.lineTo(g.xp - 16, pk + 10); c.quadraticCurveTo(g.xp, pk - 6, g.xp + 16, pk + 10);
    c.lineTo(g.x1 + 10, g.gy); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#7A6152'; c.font = '16px Jua'; c.textAlign = 'center';
    c.fillText(`산 ${fmt1(this.Mkm)} km`, g.xp, pk - 16);
    c.font = '15px Jua'; c.fillText('영동', g.x0, g.gy + 24); c.fillText('영서', g.x1 - 10, g.gy + 24); c.textAlign = 'left';
    const yH = g.ky(f.H);
    c.save(); c.strokeStyle = 'rgba(110,140,210,.8)'; c.setLineDash([8, 7]); c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(g.x0 - 40, yH); c.lineTo(W, yH); c.stroke(); c.restore();
    c.fillStyle = '#5D7FB8'; c.font = '15px Jua'; c.textAlign = 'right';
    c.fillText(`상승 응결 고도 H = ${fmt2(f.H)} km`, g.x1 - 58, yH - 8); c.textAlign = 'left';
    if (f.cloud) {        // 응결 고도~정상 사이 영동 쪽 비탈에 구름·비
      const s0 = f.H / this.Mkm;
      for (let k = 0; k <= 4; k++) {
        const sp = this.slope(lerp(s0, 1, k / 4) * 0.96 + 0.02), y = g.ky(sp.h) - 26;
        c.strokeStyle = 'rgba(120,170,225,.7)'; c.lineWidth = 2.2; c.lineCap = 'round';
        for (let j = 0; j < 3; j++) { const rx = sp.x - 18 + j * 16, ry = y + 18 + ((t * 90 + j * 13 + k * 7) % 22); c.beginPath(); c.moveTo(rx, ry); c.lineTo(rx - 2, ry + 9); c.stroke(); }
        drawCloudBlob(c, sp.x, y, 20, 3 + k * 4, t, 0.92);
      }
    } else if (Math.abs(f.H - this.Mkm) < 1e-6) {   // 정상에서 막 포화: 구름이 생기기 시작 (포화 상승 구간 0 km)
      drawCloudBlob(c, g.xp, pk - 22, 12, 9, t, 0.85);
    }
    if (this.result || this.u >= 0) {
      const sEnd = this.result ? 2 : this.u * 2, sH = f.cloud ? f.H / this.Mkm : 1;
      const seg = (a, b, col) => {
        if (sEnd <= a) return;
        c.strokeStyle = col; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath();
        for (let k = 0; k <= 20; k++) { const sp = this.slope(lerp(a, Math.min(b, sEnd), k / 20)), y = g.ky(sp.h) - 6; k ? c.lineTo(sp.x, y) : c.moveTo(sp.x, y); }
        c.stroke();
      };
      seg(0, sH, '#E8926C'); seg(sH, 1, '#F5C08A'); seg(1, 2, '#E88AA8');
    }
    const card = (x, title, lines, col) => {
      c.fillStyle = 'rgba(255,251,243,.92)'; c.strokeStyle = col; c.lineWidth = 3;
      c.beginPath(); c.roundRect(x, 108, 236, 26 + lines.length * 24, 16); c.fill(); c.stroke();
      c.fillStyle = col; c.font = '17px Jua'; c.fillText(title, x + 14, 132);
      c.fillStyle = '#6B564C'; c.font = '16px Jua';
      lines.forEach((l, i) => c.fillText(l, x + 14, 156 + i * 24));
    };
    card(16, '🌊 영동 (출발)', [`기온 20℃ · 이슬점 ${this.Td0}℃`, `상대 습도 ${Math.round(relHumidity(20, this.Td0))}%`], '#7FA6D6');
    const ax = W - 16 - 236;
    if (this.result) card(ax, '🌾 영서 (도착)', [`기온 ${nf(f.arrT)}℃ · 이슬점 ${nf(f.arrTd)}℃`, `상대 습도 ${Math.round(relHumidity(f.arrT, f.arrTd))}%`], '#E39A6E');
    else card(ax, '🌾 영서 (도착)', ['기온 ?℃'], '#E39A6E');
    M.draw(c, t);
  },
};

// 막간 놀이(선택): 내리는 빗방울의 박자를 따라 연주하기 — 하트는 여기서만, 본편 진행과 무관
const RainSong = {
  playing: false, notes: [], hits: 0, misses: 0, lanes: [0.5, 0.66, 0.82],
  judgeY: 0, t0: 0, firstNote: 0, beatSec: 0.571, lastTap: -9, endT: 0, rains: [], flash: [],
  enter() {
    M.visible = true; M.coat = true; M.droplets = 1; M.baseFace = 'cloud'; M.altKm = SCENARIO.TOP;
    M.place(W * 0.22, H * 0.3);
    this.judgeY = H * 0.68; this.playing = false; this.rains = []; this.flash = [];
    S.hearts = TUNING.hearts; renderHearts(); $('hearts').classList.add('on'); renderProgress();
    setMeters(SCENARIO.TOP, SUMMIT.T, SUMMIT.Td);
  },
  exit() { this.playing = false; AudioSys.cancelScheduled(); $('hearts').classList.remove('on'); renderProgress(); },
  resize() { this.judgeY = H * 0.68; },
  begin() {
    const c4 = TUNING.ch4;
    AudioSys.cancelScheduled();
    S.hearts = TUNING.hearts; renderHearts();
    this.beatSec = 60 / c4.bpm;
    const t0 = AudioSys.now() + 0.35;
    AudioSys.startBgm('rain', t0);
    this.t0 = t0; this.firstNote = t0 + c4.countInBeats * this.beatSec;
    this.notes = c4.pattern.slice(0, c4.totalNotes).map((off, i) => ({ t: this.firstNote + off * this.beatSec, lane: i % 3, hit: false, miss: false }));
    if (AudioSys.ctx) {
      for (let i = 0; i < c4.countInBeats; i++) AudioSys.tickAt(t0 + i * this.beatSec, i === 0);
      this.notes.forEach(n => AudioSys.kickAt(n.t));
      if (DEBUG) console.log(`[빗방울 연주] t0=${t0.toFixed(3)}s beat=${this.beatSec.toFixed(4)}s`);
    }
    this.hits = 0; this.misses = 0; this.endT = 0; this.playing = true;
  },
  finish() { this.playing = false; AudioSys.cancelScheduled(); actDone('songEnd', { hits: this.hits, misses: this.misses }); },
  update(dt) {
    M.tx = W * 0.22 + Math.sin(S.time * 1.2) * 12; M.ty = H * 0.3;
    M.update(dt, 0, 0);
    setMeters(SCENARIO.TOP, SUMMIT.T, SUMMIT.Td);
    for (let i = this.rains.length - 1; i >= 0; i--) { const r = this.rains[i]; r.y += r.v * dt; if (r.y > H) this.rains.splice(i, 1); }
    for (let i = this.flash.length - 1; i >= 0; i--) { this.flash[i].life -= dt; if (this.flash[i].life <= 0) this.flash.splice(i, 1); }
    if (!this.playing) return;
    const now = AudioSys.now() - TUNING.ch4.audioOffset, win = TUNING.ch4.hitWindowMs / 1000;
    this.notes.forEach(n => { if (!n.hit && !n.miss && now > n.t + win) this.addMiss(n); });
    if (this.notes.every(n => n.hit || n.miss)) { this.endT += dt; if (this.endT > 1.0) this.finish(); }
  },
  addMiss(n) {
    if (n) n.miss = true;
    this.misses++; AudioSys.sMiss();
    if (this.misses % TUNING.ch4.missesPerHeart === 0) {
      S.hearts = Math.max(0, S.hearts - 1); renderHearts(); shake(); AudioSys.sHeart();
      if (S.hearts <= 0) this.finish();
    }
  },
  pd() {
    if (!this.playing) return;
    const now = AudioSys.now() - TUNING.ch4.audioOffset;
    if (now - this.lastTap < 0.12) return;
    this.lastTap = now;
    if (now < this.firstNote - TUNING.ch4.hitWindowMs / 1000) return;
    const win = TUNING.ch4.hitWindowMs / 1000;
    let best = null, bd = 1e9;
    this.notes.forEach(n => { if (n.hit || n.miss) return; const d = Math.abs(now - n.t); if (d < bd) { bd = d; best = n; } });
    if (best && bd <= win) {
      best.hit = true; this.hits++; AudioSys.sHit(); M.setFace('happy', 0.5);
      const lx = this.lanes[best.lane] * W;
      spawnParticles(lx, this.judgeY, 10, ['#9FD0F0', '#D3ECFF', '#FFFFFF'], 130, 0.6);
    } else if (TUNING.ch4.emptyTapMiss) {
      const near = best && bd <= win * 2 ? best : null;
      this.addMiss(near);
      this.flash.push({ x: near ? this.lanes[near.lane] * W : W * 0.66, life: 0.5 });
    }
  },
  draw(c, t) {
    skyGrad(c, '#9FB4CE', '#CFDCE4');
    c.fillStyle = '#A9C8B4';
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 40) c.lineTo(x, H * 0.86 + Math.sin(x * 0.01 + 2) * 26 - (x < W * 0.3 ? (W * 0.3 - x) * 0.16 : 0));
    c.lineTo(W, H); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2;
    this.lanes.forEach(l => { c.beginPath(); c.moveTo(l * W, 0); c.lineTo(l * W, this.judgeY + 24); c.stroke(); });
    c.strokeStyle = '#7FA8D8'; c.lineWidth = 5; c.setLineDash([16, 10]);
    c.beginPath(); c.moveTo(this.lanes[0] * W - 70, this.judgeY); c.lineTo(this.lanes[2] * W + 70, this.judgeY); c.stroke(); c.setLineDash([]);
    c.fillStyle = '#57729B'; c.font = '17px Jua';
    c.fillText('판정선 — 빗방울이 닿는 순간 눌러 연주해요', this.lanes[0] * W - 70, this.judgeY + 30);
    const now = AudioSys.now() - TUNING.ch4.audioOffset, fall = TUNING.ch4.fallSec;
    this.notes.forEach(n => {
      if (n.hit) return;
      const dtN = n.t - now;
      if (dtN > fall || dtN < -0.25) return;
      const y = this.judgeY - (dtN / fall) * (this.judgeY + 50), x = this.lanes[n.lane] * W;
      c.fillStyle = n.miss ? 'rgba(200,160,160,.5)' : '#8FC4EC';
      c.strokeStyle = n.miss ? 'rgba(170,130,130,.5)' : '#5D9BD3'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(x, y - 16); c.quadraticCurveTo(x + 13, y + 2, x, y + 13); c.quadraticCurveTo(x - 13, y + 2, x, y - 16); c.fill(); c.stroke();
    });
    c.font = '20px Jua'; c.textAlign = 'center';
    this.flash.forEach(f => { c.fillStyle = `rgba(201,96,60,${clamp(f.life / 0.5, 0, 1)})`; c.fillText('miss', f.x, this.judgeY - 26 - (0.5 - f.life) * 40); });
    c.textAlign = 'left';
    const gw = Math.min(420, W * 0.4), gx = W / 2 - gw / 2, gy = 112;
    c.fillStyle = 'rgba(255,251,243,.85)'; c.strokeStyle = '#E9CDB4'; c.lineWidth = 3;
    c.beginPath(); c.roundRect(gx - 12, gy - 24, gw + 24, 56, 16); c.fill(); c.stroke();
    c.fillStyle = '#9A7E6E'; c.font = '15px Jua'; c.textAlign = 'center';
    c.fillText(`연주 성공 ${this.hits} / ${TUNING.ch4.totalNotes} (miss ${this.misses})`, W / 2, gy - 6); c.textAlign = 'left';
    c.fillStyle = '#F3E3D2'; c.beginPath(); c.roundRect(gx, gy + 2, gw, 16, 8); c.fill();
    c.fillStyle = '#8FC4EC'; c.beginPath(); c.roundRect(gx, gy + 2, gw * clamp(this.hits / TUNING.ch4.totalNotes, 0, 1), 16, 8); c.fill();
    if (this.playing && now < this.firstNote - 0.02 && this.t0) {
      const remain = (this.firstNote - now) / this.beatSec, num = clamp(Math.ceil(remain), 1, TUNING.ch4.countInBeats);
      const frac = remain - Math.floor(remain), scale = 1 + 0.35 * Math.max(0, frac - 0.6) / 0.4;
      c.save(); c.translate(W / 2, H * 0.42); c.scale(scale, scale);
      c.fillStyle = 'rgba(255,251,243,.92)'; c.strokeStyle = '#E9CDB4'; c.lineWidth = 4;
      c.beginPath(); c.arc(0, 0, 56, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = '#D9784F'; c.font = '58px Jua'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(num), 0, 4);
      c.restore(); c.textBaseline = 'alphabetic'; c.textAlign = 'left';
    }
    M.draw(c, t);
  },
};

// 2부: 같은 출발 조건의 뭉게를 들어 올렸다(외부 작용) 놓아줌 → 같은 높이의 두 기온 비교로 운동 예상
const SkyScene = {
  map: null, T0: 20, Td0: 12, gamma: 8, name: 'A', h: 0, v: 0, mode: 'idle', target: 0, watchT: 0, outcome: '', maxH: 0, over: false, nRel: 0,
  setup(o) { Object.assign(this, { T0: 20, Td0: 12, gamma: 8, name: 'A' }, o); },
  enter() {
    this.map = vertMap(3.0);
    M.visible = true; M.coat = false; M.droplets = 0; M.baseFace = 'normal';
    M.maxStep = TUNING.move.maxKmPerSec * this.map.pxPerKm;
    this.reset();
  },
  exit() { M.maxStep = 0; },
  resize(oldW) {
    refitVert(this, 3.0, oldW);
    if (this.map) { M.maxStep = TUNING.move.maxKmPerSec * this.map.pxPerKm; if (this.mode !== 'lift') { M.x = M.tx = W * 0.4; M.y = M.ty = this.map.kmToY(Math.min(this.h, 3.08)); } }
  },
  Tp(h) { return riseState(this.T0, this.Td0, h).T; },     // 같은 높이에서 공기 덩어리 기온
  Te(h) { return envTemp(this.T0, this.gamma, h); },        // 같은 높이에서 주위 기온
  reset() { this.h = 0; this.v = 0; this.mode = 'idle'; this.maxH = 0; this.over = false; if (this.map) M.place(W * 0.4, this.map.kmToY(0)); },
  startLift(target) { this.reset(); this.target = target; this.mode = 'lift'; },
  holdAt(h) { this.reset(); this.h = h; this.mode = 'hold'; M.place(W * 0.4, this.map.kmToY(h)); },
  release() {
    this.mode = 'release'; this.v = 0; this.watchT = 0; this.maxH = this.h;
    const b = this.Tp(this.h) - this.Te(this.h);
    this.outcome = b > 0.05 ? 'rise' : b < -0.05 ? 'return' : 'stay';   // 판정 = 같은 높이의 두 기온 비교 (화면 위쪽 도달과 무관)
  },
  update(dt) {
    if (this.mode === 'lift') {
      moveByCtrl(dt, TUNING.move.btnKmPerSec * this.map.pxPerKm, W * 0.4, W * 0.4, this.map.kmToY(this.target), this.map.kmToY(0));
      M.tx = W * 0.4;
      M.ty = clamp(M.ty, this.map.kmToY(this.target), this.map.kmToY(0));
      M.update(dt, 0, this.map.pxPerKm);
      this.h = clamp(this.map.yToKm(M.y), 0, this.target);
      if (this.h >= this.target - 0.004) {
        this.h = this.target; M.y = M.ty = this.map.kmToY(this.h); M.held = false; this.mode = 'hold'; actDone('lifted');
      }
    } else if (this.mode === 'release') {
      const b = this.Tp(this.h) - this.Te(this.h);
      this.v = clamp(this.v + (TUNING.p2.buoyAccel * b - TUNING.p2.damping * this.v) * dt, -1.2, 1.2);   // 화면 연출용 속도 상한
      this.h = Math.max(0, this.h + this.v * dt);
      if (this.h === 0 && this.v < 0) this.v = 0;
      // 화면 표시 범위(약 3 km)를 넘으면 그 위치에 두고 '화면 위로 계속 올라가요'로만 표시 — 판정과 무관
      if (this.h > 3.1) { this.h = 3.1; this.over = true; }
      this.maxH = Math.max(this.maxH, this.h);
      this.watchT += dt;
      const settled = this.h < 0.002 && Math.abs(this.v) < 0.02;
      if (this.watchT >= TUNING.p2.watchSec || (settled && this.watchT > 1.0)) { this.mode = 'done'; this.nRel++; actDone('released', this.outcome); }
      M.x = M.tx = W * 0.4; M.y = M.ty = this.map.kmToY(Math.min(this.h, 3.08));
      M.update(dt, 0, this.map.pxPerKm);
    } else M.update(dt, 0, this.map.pxPerKm);
    const st = riseState(this.T0, this.Td0, this.h);
    setMeters(this.h, st.T, st.Td);
    M.altKm = Math.min(this.h, 2.5);
    M.droplets = st.saturated ? 1 : 0; M.coat = st.saturated;
    M.baseFace = st.saturated ? 'cloud' : 'normal';
  },
  status() {
    if (this.mode === 'lift') return '✋ 손(외부 작용)이 들어 올리는 중';
    if (this.mode === 'hold') return '✋ 이 높이에서 잡고 있어요';
    if (this.mode === 'release' || this.mode === 'done') {
      const b = this.Tp(this.h) - this.Te(this.h), v = this.v;
      if (this.over) return '⬆ 화면 위로 계속 올라가요 — 지금도 주위보다 따뜻해요';
      if (this.h < 0.002 && Math.abs(v) < 0.03) return '⬇ 지표로 돌아왔어요';
      if (v > 0.03) return b >= 0 ? '⬆ 올라가는 중 — 주위보다 따뜻해요' : '⬆ 상승이 느려져요 — 지금은 주위보다 차가워요';
      if (v < -0.03) return b <= 0 ? '⬇ 내려가는 중 — 주위보다 차가워요' : '⬇ 하강이 느려져요 — 지금은 주위보다 따뜻해요';
      return '거의 멈췄어요';
    }
    return '';
  },
  pd(x, y) { if (this.mode === 'lift') tryGrab(x, y); },
  pm(x, y) { if (this.mode === 'lift') dragTo(x, y, W * 0.4, W * 0.4, this.map.kmToY(this.target), this.map.kmToY(0)); },
  pu() { M.held = false; },
  draw(c, t) {
    skyGrad(c, '#C8DCEE', '#F5EFE2');
    const gY = this.map.groundY;
    c.fillStyle = '#D8E8D2'; c.fillRect(0, gY, W, H - gY);
    drawAltRuler(c, this.map.kmToY, 3, []);
    const Hc = lclHeight(this.T0, this.Td0), yH = this.map.kmToY(Hc);
    c.save(); c.strokeStyle = 'rgba(120,150,220,.6)'; c.setLineDash([10, 8]); c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(0, yH); c.lineTo(W * 0.7, yH); c.stroke(); c.restore();
    c.fillStyle = '#5D7FB8'; c.font = '15px Jua'; c.fillText(`${kf(Hc)} km — 구름이 생기기 시작하는 높이`, 110, yH - 8);
    if (this.mode === 'lift') {
      const yt = this.map.kmToY(this.target);
      c.save(); c.strokeStyle = 'rgba(240,169,126,.85)'; c.setLineDash([12, 9]); c.lineWidth = 3;
      c.beginPath(); c.moveTo(0, yt); c.lineTo(W * 0.7, yt); c.stroke(); c.restore();
      c.fillStyle = '#C96A4E'; c.font = '17px Jua'; c.fillText(`📍 ${kf(this.target)} km까지 올리기`, W * 0.46, yt - 10);
    }
    // 주위 기온 (높이별) — 오른쪽 기둥
    const colX = W - 78;
    c.textAlign = 'right';
    for (let h = 0; h <= 3.0 + 1e-9; h += 0.5) {
      const y = this.map.kmToY(h), on = Math.abs(h - this.h) < 0.26 && this.mode !== 'idle';
      c.fillStyle = on ? 'rgba(255,241,226,.95)' : 'rgba(255,251,243,.7)';
      c.beginPath(); c.roundRect(colX - 108, y - 15, 112, 26, 10); c.fill();
      c.fillStyle = on ? '#C96A4E' : '#7A6152'; c.font = '16px Jua';
      c.fillText(`주위 ${nf(this.Te(h))}℃`, colX - 6, y + 5);
    }
    c.fillStyle = '#8A6A52'; c.font = '15px Jua';
    c.fillText(`↑ 대기 ${this.name}의 높이별 주위 기온`, colX, gY + 24);
    c.textAlign = 'left';
    c.fillStyle = '#8A6A52'; c.font = '14px Jua';
    c.fillText(`출발 조건: 지표 ${nf(this.T0)}℃ · 이슬점 ${nf(this.Td0)}℃`, 16, gY + 22);
    // 같은 높이 비교 라벨
    if (this.mode !== 'idle' && !this.over) {
      const y = M.y, Tp = this.Tp(this.h), Te = this.Te(this.h);
      c.save(); c.fillStyle = 'rgba(255,251,243,.92)'; c.strokeStyle = '#E9CDB4'; c.lineWidth = 2.5;
      c.beginPath(); c.roundRect(M.x + M.r + 18, y - 30, 158, 58, 14); c.fill(); c.stroke();
      c.font = '17px Jua'; c.fillStyle = '#D97F62'; c.fillText(`뭉게 ${nf(Tp)}℃`, M.x + M.r + 30, y - 7);
      c.fillStyle = '#5E8C6A'; c.fillText(`주위 ${nf(Te)}℃`, M.x + M.r + 30, y + 18);
      c.restore();
    }
    if (this.mode === 'lift' || this.mode === 'hold') { c.font = '34px Jua'; c.textAlign = 'center'; c.fillText('✋', M.x, M.y - M.r - 12); c.textAlign = 'left'; }
    const st = this.status();
    if (st) {
      c.save(); c.font = '19px Jua'; const w = c.measureText(st).width + 36;
      c.fillStyle = 'rgba(255,251,243,.94)'; c.strokeStyle = '#E4C3A6'; c.lineWidth = 3;
      const sy = gY + 34;   // 땅 띠 위 — 위로 올라가는 뭉게와 겹치지 않게
      c.beginPath(); c.roundRect(W * 0.4 - w / 2, sy, w, 38, 16); c.fill(); c.stroke();
      c.fillStyle = '#6B564C'; c.textAlign = 'center'; c.fillText(st, W * 0.4, sy + 26); c.restore();
    }
    if (this.over) { c.fillStyle = '#C96A4E'; c.font = '40px Jua'; c.textAlign = 'center'; c.fillText('⬆', W * 0.4, this.map.kmToY(3.0) + 10 + Math.sin(t * 6) * 4); c.textAlign = 'left'; }
    else M.draw(c, t);
  },
};

// 2부 구름 장면: ① 안정한 대기에서 넓은 공기층이 강제 상승 ② 상승이 이어지며 수직 발달
const CloudTypeScene = {
  reveal: false,
  enter() { M.visible = false; this.reveal = false; },
  exit() { M.visible = true; },
  update() { setMeters(0, SCENARIO.T0, SCENARIO.Td0); },
  draw(c, t) {
    skyGrad(c, '#C8DCEE', '#F5EFE2');
    const half = W / 2, gY = H * 0.82, yL = H * 0.5;
    c.fillStyle = '#D8E8D2'; c.fillRect(0, gY, W, H - gY);
    c.strokeStyle = '#E4C3A6'; c.lineWidth = 3; c.beginPath(); c.moveTo(half, 100); c.lineTo(half, gY); c.stroke();
    c.save(); c.strokeStyle = 'rgba(120,150,220,.55)'; c.setLineDash([10, 8]); c.lineWidth = 2;
    c.beginPath(); c.moveTo(0, yL); c.lineTo(W, yL); c.stroke(); c.restore();
    c.fillStyle = '#5D7FB8'; c.font = '14px Jua'; c.fillText('상승 응결 고도', 12, yL - 6);
    // ① 완만한 비탈을 따라 넓은 공기층이 밀려 올라감 → 응결 고도 위에 얇고 넓게
    c.fillStyle = '#C9DFC2'; c.beginPath(); c.moveTo(0, gY); c.lineTo(half - 20, gY - H * 0.36); c.lineTo(half - 20, gY); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(232,146,108,.85)'; c.lineWidth = 4;
    for (let i = 0; i < 4; i++) {
      const p = ((t * 0.25 + i / 4) % 1), x = 30 + p * (half - 90), y = gY - 30 - p * H * 0.3;
      c.beginPath(); c.moveTo(x - 30, y + 14); c.lineTo(x, y); c.stroke();
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - 10, y - 2); c.moveTo(x, y); c.lineTo(x - 5, y + 9); c.stroke();
    }
    c.fillStyle = 'rgba(255,255,255,.95)'; c.strokeStyle = '#D5E0E8'; c.lineWidth = 3;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.roundRect(40 + i * 20, yL - 34 + i * 9, half - 120 - i * 40, 16, 8); c.fill(); c.stroke(); }
    // ② 주위보다 따뜻한 공기가 계속 올라가며 수직으로 발달
    const cx = half + half * 0.5;
    for (let i = 0; i < 6; i++) { const p = ((t * 0.35 + i / 6) % 1), y = gY - 10 - p * (gY - yL); c.fillStyle = `rgba(255,236,214,${0.9 - p * 0.5})`; c.beginPath(); c.arc(cx + Math.sin(i * 2 + t) * 14, y, 10, 0, TAU); c.fill(); }
    for (let k = 0; k < 6; k++) drawCloudBlob(c, cx + Math.sin(k * 1.7) * 26, yL - 20 - k * H * 0.055, 34 - k * 2, k * 3 + 1, t, 0.95);
    c.fillStyle = '#6B564C'; c.font = '19px Jua'; c.textAlign = 'center';
    c.fillText(this.reveal ? '① 층운형 — 안정한 대기의 넓은 공기층이 억지로 올라감' : '장면 ①', half / 2, gY + 30);
    c.fillText(this.reveal ? '② 적운형 — 놓아도 계속 오르며 수직으로 발달' : '장면 ②', half + half / 2, gY + 30);
    c.textAlign = 'left';
  },
};

function waterSVG(after) {

    <text x="${x + 23}" y="138" font-size="12" text-anchor="middle" fill="#6B564C">${title}</text>`;
  return `<svg viewBox="0 0 260 150" style="width:260px;height:auto">${bar(30, 100, 0, 0, '출발')}${bar(110, 70, 30, 0, '응결 뒤')}${after ? bar(190, 70, 10, 20, '비 내린 뒤') : ''}

}

// 그림 Ⅲ-13 정리: 핵심 빈칸 4개 (칸마다 관측값으로 근거 확인), 전체 표는 따로 열기
const F13_ROWS = ['공기 상태', '단열 변화', '기온 변화', '이슬점 변화', '상대 습도'];
const F13_COLS = ['① 오를 때 (구름 전)<br><small>0 → 1 km</small>', '② 오를 때 (구름 속)<br><small>1 → 2 km</small>', '③ 내려올 때<br><small>2 → 0 km</small>'];
const F13_ANS = [['불포화', '포화', '불포화'], ['건조 단열 변화', '습윤 단열 변화', '건조 단열 변화'], ['−10℃/km', '−5℃/km', '+10℃/km'], ['−2℃/km', '−5℃/km', '+2℃/km'], ['증가', '일정(100%)', '감소']];
const F13_SEG = ['up1', 'up2', 'down'];
const F13_BLANKS = [
  { r: 0, c: 0, opts: ['불포화', '포화'], why: '0 km에서 기온 20℃, 이슬점 12℃였어. 두 값이 같았는지 볼까?' },

function fig13Table(fill, blankHtml) {
  return `<table class="cmpTbl"><tr><th></th>${F13_COLS.map(c => `<th>${c}</th>`).join('')}</tr>${F13_ROWS.map((rn, r) => `<tr><th>${rn}</th>${F13_COLS.map((_, c) => {

function fig13Check() {
  return guard(new Promise(res => {
    const fill = F13_BLANKS.map(() => false), wrong = F13_BLANKS.map(() => 0);

      const b = F13_BLANKS[act];
      const blankHtml = bi => `<button class="blank" data-bi="${bi}" style="${bi === act ? 'outline:3px solid #F0A97E' : ''}">${bi + 1}번 ?</button>`;
      const all = fill.every(Boolean);

        ${fig13Table(fill, blankHtml)}
        ${all ? '<div class="fb ok">🎉 표 완성! 구간마다 기록한 관측값이 그림 Ⅲ-13의 근거예요.</div>' : `<p class="q">${b.r + 1 > 0 ? `<b>${act + 1}번</b> · ${F13_COLS[b.c].replace(/<br>.*$/, '')}의 ${F13_ROWS[b.r]}은?` : ''}</p>
        <div class="opts">${b.opts.map((o, i) => `<button class="btn sub" data-key="${i + 1}" data-o="${o}">${o}</button>`).join('')}</div>`}
        ${msg}
        <div class="row2">${all ? '<button class="btn" id="f13Done" data-key="1">계속 ➜</button>' : ''}<button class="btn sub" id="f13Full">전체 표 자세히 보기</button></div>
        <p style="font-size:13px;color:#A9988A">회색 글씨 = 앞선 여정 요약(직접 관측하지 않은 구간)</p>`, 'wide');
      document.querySelectorAll('#overlay .blank').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); act = Number(el.dataset.bi); msg = ''; render(); }));
      document.querySelectorAll('#overlay .opts .btn').forEach(el => el.addEventListener('click', e => {
        e.stopPropagation();
        const ok = el.dataset.o === F13_ANS[b.r][b.c];
        const key = `f13_${act}`, prev = S.rec.judge[key];
        S.rec.judge[key] = { ch: 6, q: `그림 Ⅲ-13 ${F13_ROWS[b.r]} (${['구름 전 상승', '구름 속 상승', '하강'][b.c]})`, first: prev ? prev.first : el.dataset.o, firstText: prev ? prev.firstText : el.dataset.o, firstOk: prev ? prev.firstOk : ok, tries: (prev ? prev.tries : 0) + 1, help: wrong[act] >= 2 ? 1 : 0, final: el.dataset.o, finalText: el.dataset.o, ok };
        if (ok) {
          AudioSys.sSparkle(); fill[act] = true; msg = `<div class="fb ok">✅ ${F13_ANS[b.r][b.c]} — 맞아!</div>`;
          const nx = fill.findIndex(f => !f); if (nx >= 0) act = nx;
        } else {
          AudioSys.sMiss(); wrong[act]++;
          msg = `<div class="fb no">🔎 ${b.why}${wrong[act] >= 2 ? ` <button class="btn sub" id="f13Show" style="padding:4px 12px;font-size:15px">이 칸 정답 보기</button>` : ''}</div>`;
        }
        render();
      }));
      onClick('f13Show', () => { fill[act] = true; msg = `<div class="fb info">이 칸은 <b>${F13_ANS[b.r][b.c]}</b>. ${b.why.split('.')[0]}.</div>`; const nx = fill.findIndex(f => !f); if (nx >= 0) act = nx; render(); });
      onClick('f13Full', () => {
        panel(`<span class="tag">📘 전체 표</span>${fig13Table(F13_BLANKS.map(() => true), () => '')}
          <p>${obsTable([{ h: 0, T: 20, Td: 12 }, { h: 1, T: 10, Td: 10 }, { h: 2, T: 5, Td: 5 }, { label: '하강 1 km', T: 15, Td: 7 }, { label: '도착 0 km', T: 25, Td: 9 }], { rh: true })}</p>
          <div class="row2"><button class="btn" id="f13Back" data-key="1">◀ 돌아가기</button></div>`, 'wide');
        onClick('f13Back', () => render());
      });
      onClick('f13Done', () => { closePanel(); res(); });
    };
    render();
  }));
}

function labPanel(html) { const p = $('labPanel'); p.innerHTML = html; p.classList.add('on'); }
function labRow(name, Td, Mk, f) {
  const satLen = Math.max(0, Mk - f.H);
  const eq = Math.abs(Mk - f.H) < 1e-6;
  const note = f.cloud ? `${kf(satLen)} km` : eq ? '0 km (정상에서 막 포화)' : '0 km (응결 고도에 못 미침)';
  return `<tr><td>${name}</td><td>${Td}℃</td><td>${kf(Mk)} km</td><td>${kf(f.H)} km</td><td>${note}</td><td><b>${nf(f.arrT)}℃</b></td><td>${f.dT > 0 ? '+' : ''}${nf(f.dT)}℃</td></tr>`;
}
function labTable(rows) {
  return `<table class="cmpTbl"><tr><th>공기</th><th>출발 이슬점</th><th>산 높이</th><th>상승 응결 고도<br><small>H = (20 − 이슬점)/8</small></th><th>포화 상태로 오른 구간<br><small>산 높이 − H</small></th><th>도착 기온</th><th>출발과의 차<br><small>= 5 × 포화 구간</small></th></tr>${rows.join('')}</table>`;
}
async function labRuns(list) {   // [{ name, Td, M }] 를 차례로 보내고 결과 반환
  const out = [];
  for (const r of list) {
    labPanel(`${LabScene.head}<div class="row"><button class="btn mint" id="labGo" style="margin:4px auto">${r.btn || r.name + ' 보내기'} ▶ <small>(이슬점 ${r.Td}℃ · 산 ${kf(r.M)} km)</small></button></div>
      <div style="font-size:14px;color:#8A7263">${out.map(o => `${o.name}: 도착 ${nf(o.f.arrT)}℃`).join(' · ')}</div>`);
    await waitClick('labGo');
    labPanel(`${LabScene.head}<div class="row" style="color:#8A7263">${r.name}가 산을 넘는 중… 계기판을 봐! 👀</div>`);
    LabScene.setCond(r.Td, r.M);
    const f = await LabScene.send();
    S.rec.lab.runs.push({ name: r.name, Td: r.Td, M: r.M, arrT: f.arrT });
    out.push({ ...r, f });
    toast(`${r.name} 도착: ${nf(f.arrT)}℃`, true, 1600);
  }
  return out;
}

function labControls(goalHtml, guess, Td, Mk) {
  labPanel(`${LabScene.head}${goalHtml}

    <div class="row"><label>도착 기온 예상</label><span class="stepper"><button id="gDn" aria-label="예상 낮추기">−</button><span class="val" id="gV">${guess}℃</span><button id="gUp" aria-label="예상 높이기">+</button></span>
      <button class="btn mint" id="labGo" style="margin:0 0 0 auto;padding:7px 16px;font-size:17px">보내기 ▶</button></div>

function labControlLoop(goal, onResult) {
  return guard(new Promise(res => {
    let Td = LabScene.Td0, Mk = LabScene.Mkm, guess = 20, busy = false;
    const bind = () => {
      $('lTd').addEventListener('input', e => { Td = Number(e.target.value); $('lTdV').textContent = `${Td}℃`; LabScene.setCond(Td, Mk); });
      $('lM').addEventListener('input', e => { Mk = Math.round(Number(e.target.value) * 10) / 10; $('lMV').textContent = `${kf(Mk)} km`; LabScene.setCond(Td, Mk); });
      onClick('gDn', () => { guess = Math.max(10, guess - 1); $('gV').textContent = `${guess}℃`; });
      onClick('gUp', () => { guess = Math.min(40, guess + 1); $('gV').textContent = `${guess}℃`; });
      onClick('labGo', async () => {
        if (busy) return; busy = true;
        LabScene.setCond(Td, Mk);
        const f = await LabScene.send();
        busy = false;
        const ok = Math.abs(guess - f.arrT) <= 1;
        S.rec.lab.runs.push({ name: goal.name, Td, M: Mk, guess, arrT: f.arrT });
        const cond = `${Td}/${Mk}`;
        if (ok && !S.rec.lab.goodConds.includes(cond)) S.rec.lab.goodConds.push(cond);
        const satLen = Math.max(0, Mk - f.H), eq = Math.abs(Mk - f.H) < 1e-6;
        const why = f.cloud ? `H = (20 − ${Td})/8 = ${kf(f.H)} km → 포화 상태로 오른 구간 ${kf(Mk)} − ${kf(f.H)} = <b>${kf(satLen)} km</b> → 도착 = 20 + 5 × ${kf(satLen)} = <b>${nf(f.arrT)}℃</b>`
          : eq ? `H = ${kf(f.H)} km = 산 높이 → 정상에서 막 포화(포화 구간 0 km) → 도착 = <b>20℃</b>`
            : `H = ${kf(f.H)} km > 산 ${kf(Mk)} km → 응결 고도에 도달하지 못해 구름 없음 → 도착 = <b>20℃</b>`;
        const html = `${ok ? '✅ 예상 성공!' : `🤔 예상 ${guess}℃ ↔ 실제 ${nf(f.arrT)}℃`}<br>${why}`;
        const r = onResult(f, { Td, Mk, guess, ok }, html);
        $('labRead').innerHTML = html + (r && r.extra ? '<br>' + r.extra : '');
        if (r && r.done) res(r);
      });
    };
    labControls(goal.html, guess, Td, Mk); bind();
  }));
}

/* ============================================================
   2부 흐름 — 같은 출발 조건(20℃ · 12℃)의 뭉게를 대기 A·C·B에서 올렸다 놓기
   ============================================================ */
const AIR = { A: 4, B: 8, C: 12 };   // 주위 기온 감률(℃/km) — 이름은 관찰 뒤에 붙임
function airGraphOpt(T0, Td0, gamma, hMax = 3) {
  const Hc = lclHeight(T0, Td0), hs = [0, Hc, hMax].filter((h, i, a) => i === 0 || h > a[i - 1]);
  const parcel = hs.map(h => [riseState(T0, Td0, h).T, h]);
  const env = [[envTemp(T0, gamma, 0), 0], [envTemp(T0, gamma, hMax), hMax]];
  return {
    tMin: -10, tMax: 30, hMax, aria: '공기 덩어리와 주위 기온 그래프',
    series: [{ pts: env, color: '#5E9C7A', w: 4 }, { pts: parcel, color: '#E8926C', w: 4 }],
    legend: [['#E8926C', '', '뭉게(공기 덩어리)'], ['#5E9C7A', '', '주위 기온'], ['#9FB4DC', '6 5', '구름이 생기기 시작']],
    marks: [{ a: [riseState(T0, Td0, Hc).T, Hc], label: `구름 시작 ${kf(Hc)} km`, color: '#5D7FB8', dx: 10, dy: 16 }],
  };
}
function evidenceAir(h, back) {
  const S2 = SkyScene, o = airGraphOpt(S2.T0, S2.Td0, S2.gamma);
  o.hl = [{ a: [S2.Tp(h), h] }, { a: [S2.Te(h), h], color: '#BFE3C8' }];
  evidenceGraph(`대기 ${S2.name}: 같은 높이 ${kf(h)} km에서 두 기온`, o, `뭉게 ${nf(S2.Tp(h))}℃ · 주위 ${nf(S2.Te(h))}℃`, back);
}
// 들어 올리기(외부 작용) → 같은 높이 비교 → 운동 예상 → 놓아주기 → 관찰
async function liftTrial(key, h) {
  SkyScene.startLift(h); showMove(true, true);
  setAct(`<div class="msg">뭉게를 위로 끌어 <b>${kf(h)} km</b>까지 들어 올려 줘 (▲ 버튼·화살표 키도 돼)<br><small>지금은 ✋ 손(외부 작용)이 올리는 중이에요</small></div>`);
  await waitAct('lifted');
  showMove(false); setAct(null); AudioSys.sBadge();
  const Tp = SkyScene.Tp(h), Te = SkyScene.Te(h), sat = riseState(SkyScene.T0, SkyScene.Td0, h).saturated;
  const out = Tp - Te > 0.05 ? 'rise' : Tp - Te < -0.05 ? 'return' : 'stay';
  await observe(`<span class="tag">✋ ${kf(h)} km에서 잡고 있어요 — 장면 멈춤</span><p class="q">같은 높이 <b>${kf(h)} km</b>에서 두 기온</p>
    <table class="obsT"><tr><th></th><th>기온</th></tr><tr><td>뭉게 (공기 덩어리)</td><td class="T hi">${nf(Tp)}℃</td></tr><tr><td>주위 공기 (대기 ${SkyScene.name})</td><td class="hi">${nf(Te)}℃</td></tr></table>
    <p>${sat ? '뭉게 안에는 물방울이 생겼어요 — 기온 = 이슬점 (포화).' : '뭉게는 아직 불포화 상태예요 (기온 > 이슬점).'}</p>`, '놓으면 어떻게 될까? ➜', { bar: true });
  const cmp = `${kf(h)} km에서 뭉게는 ${nf(Tp)}℃, 주위는 ${nf(Te)}℃였어.`;
  const PP = {
    q: `${kf(h)} km에서 손을 놓으면 뭉게는 어떻게 움직일까?`, short: `대기 ${SkyScene.name} · ${kf(h)} km에서 놓으면`,
    opts: ['위로 계속 올라간다', '그 자리에 머문다', '아래로 돌아온다'], ans: out === 'rise' ? 0 : out === 'return' ? 2 : 1,
    real: out === 'rise' ? '위로 계속 올라감' : out === 'return' ? '아래로 돌아옴' : '머묾',
    fb: [`위로 계속 올라갈 거라고 예상했구나. ${cmp} 같은 높이에서 어느 쪽이 더 따뜻했는지 다시 볼까?`,
      `그 자리에 머물 거라고 예상했구나. ${cmp} 두 기온이 같았는지 확인해 보자.`,
      `아래로 돌아올 거라고 예상했구나. ${cmp} 주위보다 따뜻한 공기가 어떻게 움직였는지 떠올려 봐.`],
    evidence: back => evidenceAir(h, back),
  };
  await predict(key, PP);
  setAct('<div class="msg">준비됐으면 손을 놓아 줘 — 이제부터는 손이 밀지 않아요</div><button class="btn mint" id="relBtn">🖐 놓아주기</button>');
  await waitClick('relBtn');
  setAct(null);
  SkyScene.release();
  await waitAct('released');
  return { Tp, Te, out, PP, h };
}

    { face: 'happy', text: '마지막 도전! 처음 보는 <b>대기 D</b>야. 이번에는 출발 조건도 달라.' },
    { face: 'normal', text: '같은 높이에서 나와 주위 공기의 기온을 비교하면 움직임을 예상할 수 있을 거야.' },
  ]);
  const rows = await finalCheck();
  await say([{ face: 'happy', text: '정말 그렇게 움직이는지 확인해 보자!' }]);
  for (const r of rows) {
    SkyScene.holdAt(r.h);
    setAct(`<div class="msg">대기 D · ${kf(r.h)} km — 뭉게 ${nf(r.Tp)}℃, 주위 ${nf(r.Te)}℃</div><button class="btn mint" id="relBtn">🖐 놓아주기</button>`);
    await waitClick('relBtn'); setAct(null);
    SkyScene.release();
    await waitAct('released');
  }
  await say([
    { face: 'proud', text: '처음 보는 하늘에서도 <b>같은 높이의 두 기온</b>을 비교해서 움직임을 예상했어!' },
    { face: 'happy', text: '같은 공기라도 주위 기온 분포에 따라 놓은 뒤의 움직임과 구름 모양이 달라져. 함께해 줘서 고마워!' },
  ]);
  S.rec.done[12] = true;
  showResults(2);
}


// 2부 자유 실험(복습): 주위 기온 감률과 놓는 높이를 바꾸며 이름·결과를 바로 확인
function stabName(g) {
  if (g < 5) return '절대 안정';
  if (g === 5) return '경계(5): 포화 공기에 대해 중립';
  if (g < 10) return '조건부 불안정';
  if (g === 10) return '경계(10): 불포화 공기에 대해 중립';
  return '절대 불안정';
}
async function freeSky() {
  S.runId++; S.screen = 'play'; S.chapter = 12; S.paused = false; Dialog.abort(); actWait = null;
  hideOverlay(); setAct(null); showMove(false); MiniGraph.setVisible(false); $('labPanel').classList.remove('on');
  renderProgress();
  AudioSys.startBgm('sea');
  let g = 8, h = 2.0;
  SkyScene.setup({ gamma: g, name: 'X' }); setScene(SkyScene);
  const sp = $('simPanel');
  const render = msg => {
    const lfc = lfcHeight(20, 12, g);
    sp.innerHTML = `<div class="row"><b>🔬 2부 자유 실험</b> <span class="lock">출발 20℃ · 이슬점 12℃</span></div>
      <div class="row"><label>주위 기온 감률</label><input type="range" id="fsG" min="3" max="12" step="0.5" value="${g}"><b>${nf(g)}℃/km</b></div>
      <div class="row" style="font-size:15px">이름: <b>${stabName(g)}</b></div>
      <div class="row" style="font-size:14px;color:#57729B">${lfc === null ? '어느 높이에서도 주위보다 따뜻해지지 않아요' : lfc === 0 ? '지표 근처부터 주위보다 따뜻해져요' : `자유 대류 고도 약 ${kf(lfc)} km (구름은 ${kf(H0)} km부터)`}</div>
      <div class="row"><label>놓을 높이</label><span class="stepper"><button id="fsDn" aria-label="높이 낮추기">−</button><span class="val">${kf(h)}</span><button id="fsUp" aria-label="높이 높이기">+</button></span>km
        <button class="btn mint" id="fsGo" style="margin:0 0 0 auto;padding:6px 14px;font-size:17px">올려서 놓기 ▶</button></div>
      <div id="fsMsg" style="font-size:15px;color:#6B564C;min-height:22px">${msg || ''}</div>
      <div class="row"><button class="btn sub" id="fsEnd" style="margin:2px auto;padding:6px 18px;font-size:16px">자유 실험 마치기</button></div>`;
    sp.classList.add('on');
    $('fsG').addEventListener('input', e => { g = Number(e.target.value); SkyScene.gamma = g; SkyScene.reset(); render(); });
    onClick('fsDn', () => { h = Math.max(0.25, Math.round((h - 0.25) * 100) / 100); render(); });
    onClick('fsUp', () => { h = Math.min(3, Math.round((h + 0.25) * 100) / 100); render(); });
    onClick('fsGo', () => {
      SkyScene.gamma = g; SkyScene.holdAt(h); SkyScene.release();
      const Tp = SkyScene.Tp(h), Te = SkyScene.Te(h), o = SkyScene.outcome;
      render(`${kf(h)} km: 뭉게 ${nf(Tp)}℃ · 주위 ${nf(Te)}℃ → <b>${o === 'rise' ? '계속 올라가요' : o === 'return' ? '아래로 돌아와요' : '그 자리에 머물러요'}</b>`);
    });
    onClick('fsEnd', () => { sp.classList.remove('on'); showResults(2); });
  };
  render();
}

const FLOWS = [flow0, flow1, flow2, flow3, flow4, flow5, flow6, flow7, flow8, flow9, flow10, flow11, flow12];

// 장을 다시 시작할 때, 그 장 이후의 발자국이 섞이지 않게 그 장의 출발 상태로 맞춤
const CH_START_ALT = [0, 0, 0.5, 1.0, 2.0, 2.0, 2.0, 2.0];
function trailAtChapterStart(ch) {
  if (partOf(ch) !== 1) return;
  const up = CH_START_ALT[ch];
  if (Trail.maxUpAlt > up) Trail.maxUpAlt = up;
  Trail.condensed = Trail.maxUpAlt >= H0 - 1e-6 || Trail.sumUp >= H0;
  if (ch <= 5 && !Trail.sumDown) { Trail.downStarted = false; Trail.minDownAlt = SCENARIO.TOP; }
  MiniGraph.lastKey = '';
}
function startChapter(i) {
  S.runId++;
  S.screen = 'play';
  S.chapter = clamp(i, 0, CHS.length - 1);
  S.started = true;
  S.newObs = [];
  Dialog.abort(); Dialog.log = [];
  actWait = null;
  hideOverlay(); S.paused = false;
  setAct(null); showMove(false);
  $('simPanel').classList.remove('on'); $('labPanel').classList.remove('on'); $('hearts').classList.remove('on');
  M.maxStep = 0; M.droplets = 0; M.visible = true;
  trailAtChapterStart(S.chapter);
  renderProgress();
  MiniGraph.setVisible([1, 2, 3, 5].includes(S.chapter));
  FLOWS[S.chapter]();
}
function startFrom(ch) {
  AudioSys.ensure();
  if (ch !== PART[partOf(ch)].first) prefillSummary(ch);
  startChapter(ch);
}
const START_CH = (() => {
  const n = parseInt(PARAMS.get('ch'), 10);
  if (n >= 1 && n <= CHS.length - 1) return n;
  return PARAMS.get('part') === '2' ? 8 : 0;
})();
const FOOTER_HTML = `<footer>© 2026 제작: 김연경(earthssaem@gmail.com) | <a class="hub" href="https://earthssaem-lab.vercel.app/" target="_blank" rel="noopener">연경쌤의 지구과학 실험실 둘러보기 →</a></footer>`;

}

    <div class="partBtns">
      <button class="btn" id="p1Btn" data-key="1">1부 · 산을 건너는 뭉게 ▶<small>${PART[1].q}</small></button>
      <button class="btn sub" id="p2Btn" data-key="2">2부 · 놓아주면 어디로 갈까? ▶<small>${PART[2].q}</small></button>

    <p style="font-size:13px;margin-top:8px;color:#B49A85">※ 기록은 이 화면에만 남아요(새로고침하면 사라져요) · 소리 없이도 진행할 수 있어요<br>키보드: Enter·Space 다음 대사, 숫자 키 선택, 화살표 이동</p>
    ${FOOTER_HTML}`);
  onClick('p1Btn', () => { AudioSys.sClear(); Trail.reset(); startChapter(0); });
  onClick('p2Btn', () => { AudioSys.sClear(); startChapter(8); });

// 📒 관측 기록 · 대사 다시 보기
function showLog() {
  if (S.screen !== 'play' || S.dialogActive || $('overlay').classList.contains('on')) return;
  AudioSys.freeze();
  const obs = S.rec.obs.map(o => `<li>${o.label}: 기온 ${nf(o.T)}℃ · 이슬점 ${nf(o.Td)}℃ · 상대 습도 ${Math.round(o.rh)}%${o.note ? ' · ' + o.note : ''}${o.summary ? '<span class="sumTag">앞선 여정 요약</span>' : ''}</li>`).join('');
  const lines = Dialog.log.map(l => `<li><b>${l.who}</b> · ${l.text}</li>`).join('');
  panel(`<h2>📒 관측 기록 · 대사 다시 보기</h2>
    <h3 style="text-align:left;color:#C96A4E">관측 기록</h3><ul class="recList">${obs || '<li>아직 기록이 없어요</li>'}</ul>
    <h3 style="text-align:left;color:#C96A4E">이 장의 대사</h3><ul class="recList">${lines || '<li>아직 대사가 없어요</li>'}</ul>
    <div class="row2"><button class="btn sub" id="logRes" data-key="2">학습 기록 전체 보기</button><button class="btn" id="logClose" data-key="1">닫기</button></div>`, 'wide');
  onClick('logClose', () => { AudioSys.unfreeze(); closePanel(); });
  onClick('logRes', () => { AudioSys.unfreeze(); showResults(null, true); });
}
// 학습 기록: 처음 예상 → 관측한 값 → 선택한 근거 → 생각 변화 → 다시 볼 장면 (서버·계정 없이 이 화면에서만)
function showResults(donePart, fromLog) {
  if (!fromLog) { resetUiForTitle(); }
  const R = S.rec;
  const rows = [];
  CHS.forEach((c, ch) => {
    const preds = Object.values(R.pred).filter(p => p.ch === ch);
    const judges = Object.values(R.judge).filter(j => j.ch === ch);
    const obs = R.obs.filter(o => o.ch === ch && !o.summary);
    if (!preds.length && !judges.length && !obs.length) return;
    const predTxt = preds.map(p => `${p.q}: <b>${p.first || p.text}</b>${p.ok ? ' ✔' : ''}`).join('<br>') || '—';
    const obsTxt = obs.map(o => `${o.label} ${nf(o.T)}℃/${nf(o.Td)}℃`).join('<br>') || (ch >= 8 && ch <= 10 ? Object.entries(R.p2).filter(([k, v]) => !v.summary && ((ch === 8 && k === 'A') || (ch === 9 && k === 'C') || (ch === 10 && k[0] === 'B'))).map(([k, v]) => `${kf(v.h)} km: 뭉게 ${nf(v.Tp)}℃ · 주위 ${nf(v.Te)}℃`).join('<br>') : '') || '—';
    const judTxt = judges.map(j => `${j.q}: <b>${j.finalText || '—'}</b>${j.ok ? ' ✔' : ''}`).join('<br>') || '—';
    const change = [];
    preds.forEach(p => { if (p.ok) change.push('예상과 관측 일치'); else if (p.revised) change.push('<span class="revised">✍ 관찰 뒤 생각을 고침</span>'); });
    judges.forEach(j => { if (!j.firstOk && j.ok) change.push(`<span class="revised">처음 “${j.firstText}” → 근거를 보고 고침</span>`); });
    rows.push(`<tr><td>${chTitle(ch)}</td><td>${predTxt}</td><td>${obsTxt}</td><td>${judTxt}</td><td>${change.join('<br>') || '—'}</td><td><button data-ch="${ch}">다시 보기 ▶</button></td></tr>`);
  });
  const head = donePart ? `<span class="tag">🎓 ${PART[donePart].title} 완료</span><h2>${donePart === 1 ? '산을 건넌 뭉게의 학습 기록' : '놓아준 뭉게의 학습 기록'}</h2>` : '<h2>📒 학습 기록</h2>';
  panel(`${head}
    <p style="font-size:14px">처음의 예상, 실제로 관측한 값, 내가 고른 근거, 관찰 뒤 바뀐 생각을 함께 보여 줘요. (이 화면에만 있고 저장·전송되지 않아요)</p>
    <div style="max-height:52vh;overflow:auto"><table class="resT"><tr><th>장</th><th>처음 예상</th><th>관측한 값</th><th>내가 고른 근거·판단</th><th>생각 변화</th><th></th></tr>
    ${rows.join('') || '<tr><td colspan="6">아직 기록이 없어요</td></tr>'}</table></div>
    <div class="row2">${donePart === 1 ? '<button class="btn" id="toP2" data-key="1">2부 시작 ▶</button>' : ''}${donePart === 2 ? '<button class="btn mint" id="toFree" data-key="3">🔬 2부 자유 실험</button>' : ''}
      ${fromLog ? '<button class="btn" id="resBack" data-key="1">◀ 돌아가기</button>' : '<button class="btn sub" id="resTitle" data-key="2">처음 화면</button>'}</div>
    ${FOOTER_HTML}`, 'wide');
  document.querySelectorAll('#overlay .resT button[data-ch]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); AudioSys.ensure(); startFrom(Number(b.dataset.ch)); }));
  onClick('toP2', () => startChapter(8));
  onClick('toFree', () => freeSky());
  onClick('resTitle', () => showTitle());
  onClick('resBack', () => { closePanel(); });
}

  AudioSys.ensure();
  AudioSys.setMuted(!AudioSys.muted);
  $('muteBtn').textContent = AudioSys.muted ? '🔇' : '🔊';
});
$('progress').addEventListener('click', e => { e.preventDefault(); askGoHome(); });
$('logBtn').addEventListener('click', e => { e.preventDefault(); showLog(); });
document.addEventListener('keydown', e => {   // 장면별 키 (예: 응결 예상 높이 깃발 ▲▼)
  if (S.dialogActive || $('overlay').classList.contains('on')) return;

// 세로 화면(회전 안내)·다른 탭으로 이동 시 게임을 멈춤 — 안 보이는 동안 진행·소리가 흘러가지 않게
const portraitMQ = window.matchMedia('(orientation: portrait)');
let rotateHold = false, hiddenHold = false;
function syncRotateHold() {
  if (portraitMQ.matches && !rotateHold) { rotateHold = true; AudioSys.freeze(); }
  else if (!portraitMQ.matches && rotateHold) { rotateHold = false; AudioSys.unfreeze(); }
}
if (portraitMQ.addEventListener) portraitMQ.addEventListener('change', syncRotateHold);
else if (portraitMQ.addListener) portraitMQ.addListener(syncRotateHold);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !hiddenHold) { hiddenHold = true; AudioSys.freeze(); }
  else if (!document.hidden && hiddenHold) { hiddenHold = false; AudioSys.unfreeze(); lastFrame = performance.now(); }
});

let lastFrame = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (rotateHold || hiddenHold) { requestAnimationFrame(loop); return; }
  S.time += dt;
  ctx.clearRect(0, 0, W, H);
  if (scene) {
    if (!S.paused && !S.dialogActive && scene.update) scene.update(dt);
    scene.draw(ctx, S.time);
  }
  updateParticles(dt);
  drawParticles(ctx);
  requestAnimationFrame(loop);
}

syncRotateHold();
resize();
renderHearts();
MiniGraph.build();
showTitle();
requestAnimationFrame(loop);
</script>
