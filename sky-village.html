<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>모구모구 하늘마을 — 대기 안정도와 강수 미니게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* ============ 기본 (뭉게 유니버스 공통 스타일) ============ */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#FFF8EF;
    font-family:'Jua','Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    touch-action:none; overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
    color:#6B564C;
  }
  #stage { position:fixed; inset:0; overflow:hidden; }
  #scene { position:absolute; inset:0; }
  #scene svg.full { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #fx { position:absolute; inset:0; width:100%; height:100%; z-index:30; pointer-events:none; }
  #stage.shake { animation:shakeAnim .4s; }
  @keyframes shakeAnim {
    0%,100%{transform:translate(0,0)} 20%{transform:translate(-7px,3px)}
    40%{transform:translate(6px,-4px)} 60%{transform:translate(-5px,-2px)} 80%{transform:translate(4px,3px)}
  }
  /* 은은한 종이 질감 */
  #grain {
    position:absolute; inset:0; pointer-events:none; z-index:40; opacity:.05; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* ============ 공통 애니메이션 ============ */
  .bob   { animation:bobY 2.8s ease-in-out infinite; }
  .bob2  { animation:bobY 3.4s ease-in-out .6s infinite; }
  .drift { animation:driftX 26s linear infinite; }
  @keyframes bobY   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  @keyframes driftX { 0%{transform:translateX(0)} 100%{transform:translateX(220px)} }
  .spinSlow { animation:spinS 14s linear infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes spinS { to{transform:rotate(360deg)} }

  /* ============ HUD ============ */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:50; }
  .hudCard {
    background:rgba(255,251,243,.9); border:3px solid #E9CDB4; border-radius:20px;
    box-shadow:0 3px 0 rgba(214,178,148,.35);
  }
  #hudLeft  { position:absolute; top:10px; left:12px; display:flex; gap:8px; }
  #hudRight { position:absolute; top:10px; right:12px; display:flex; gap:8px; }
  .hudBtn {
    pointer-events:auto; cursor:pointer; font-family:inherit;
    background:rgba(255,251,243,.92); border:3px solid #E9CDB4; border-radius:18px;
    box-shadow:0 3px 0 rgba(214,178,148,.35);
    min-width:52px; height:54px; padding:4px 12px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    font-size:17px; color:#8A6A52;
  }
  .hudBtn:active { transform:translateY(2px); box-shadow:none; }
  .hudBtn svg { width:30px; height:30px; }
  .hudBtn .cnt { font-size:16px; color:#B0703F; font-variant-numeric:tabular-nums; }
  #hintBtn { position:relative; }
  #hintBtn.pulse::after {
    content:''; position:absolute; inset:-7px; border-radius:24px;
    border:3px solid #FFB35C; animation:hintPulse 1.1s ease-out infinite;
  }
  @keyframes hintPulse { 0%{opacity:.9; transform:scale(.9)} 100%{opacity:0; transform:scale(1.18)} }

  /* 스테이지 헤더 (가운데): 동물 이름 + 호감도 + 미션 점 */
  #stageHead {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    padding:6px 18px; display:none; align-items:center; gap:12px; pointer-events:none;
  }
  #stageHead.on { display:flex; }
  #shFace { width:46px; height:46px; }
  #shFace svg { width:100%; height:100%; }
  #shName { font-size:17px; color:#8A5F3E; line-height:1.15; text-align:left; }
  #shName small { display:block; font-size:12px; color:#B49A85; }
  #shHearts { display:flex; gap:3px; }
  #shHearts svg { width:21px; height:19px; }
  #shDots { display:flex; gap:6px; margin-left:4px; }
  .mdot { width:12px; height:12px; border-radius:50%; background:#EBD9C6; border:2px solid #DCC0A6; transition:all .3s; }
  .mdot.done { background:#B7E3C8; border-color:#8FCBA8; }
  .mdot.cur  { background:#FBC9A8; border-color:#F0A97E; transform:scale(1.28); }

  /* 스테이지 계기판 (우상단 아래) */
  #meters {
    position:absolute; top:74px; right:12px; z-index:48; pointer-events:none;
    padding:6px 14px; display:none; gap:14px;
  }
  #meters.on { display:flex; }
  .meter { text-align:center; min-width:62px; }
  .meter .lab { font-size:12px; color:#A98D77; }
  .meter .val { font-size:23px; line-height:1.05; color:#5F4B41; font-variant-numeric:tabular-nums; }
  .meter .val small { font-size:13px; }
  #mTd .val { color:#6E86B8; }
  #mT  .val { color:#D97F62; }

  /* ============ 토스트 / 칭찬 팝업 ============ */
  #toast {
    position:absolute; top:19%; left:50%; transform:translate(-50%,0) scale(.85); z-index:60;
    background:rgba(255,247,236,.96); border:3px solid #F1B9A3; color:#C96A4E;
    padding:11px 24px; border-radius:24px; font-size:21px; opacity:0; pointer-events:none;
    transition:opacity .22s, transform .22s; text-align:center; box-shadow:0 4px 0 rgba(214,150,128,.3);
    max-width:80%;
  }
  #toast.show { opacity:1; transform:translate(-50%,0) scale(1); }
  #toast.good { border-color:#9FD6B4; color:#4E9A6E; box-shadow:0 4px 0 rgba(140,196,164,.35); }
  #praise {
    position:absolute; top:30%; left:50%; z-index:65; pointer-events:none; opacity:0;
    font-size:clamp(34px,7vh,52px); color:#FF8FAB; text-align:center;
    text-shadow:0 3px 0 #FFF, 0 5px 0 rgba(240,150,170,.25); transform:translate(-50%,-50%) scale(0);
  }
  #praise .comboTag {
    display:block; font-size:clamp(16px,3vh,22px); color:#E8A24E; text-shadow:0 2px 0 #FFF; margin-top:2px;
  }
  #praise.pop { animation:praisePop 1.25s ease forwards; }
  @keyframes praisePop {
    0%{opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-7deg)}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1.16) rotate(3deg)}
    40%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    78%{opacity:1}
    100%{opacity:0; transform:translate(-50%,-74%) scale(1)}
  }

  /* ============ 대화창 ============ */
  #dialogWrap { position:absolute; inset:0; z-index:70; display:none; }
  #dialogWrap.on { display:block; }
  #dialogBox {
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    width:min(780px, 93%); min-height:106px;
    background:rgba(255,252,246,.97); border:4px solid #E4C3A6; border-radius:28px;
    box-shadow:0 5px 0 rgba(210,172,140,.35);
    display:flex; align-items:center; gap:14px; padding:14px 20px 16px 12px;
  }
  #dFace { width:84px; height:84px; flex:none; }
  #dFace svg { width:100%; height:100%; }
  #dName { position:absolute; top:-17px; left:26px; background:#FBD3AE; border:3px solid #E8B488;
    border-radius:14px; padding:2px 16px; font-size:15px; color:#8A5F3E; transition:background .2s, border-color .2s; }
  #dText { font-size:clamp(17px, 2.7vh, 22px); line-height:1.5; color:#5F4B41; flex:1; }
  #dText b { color:#D9784F; }
  #dText .kw { color:#5D7FB8; }
  #dNext { position:absolute; right:22px; bottom:8px; font-size:17px; color:#D9A87F; animation:bobArrow 1s infinite; }
  @keyframes bobArrow { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }

  /* ============ 오버레이 패널 ============ */
  #overlay { position:absolute; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(90,70,60,0); transition:background .3s; }
  #overlay.on { display:flex; background:rgba(90,70,60,.18); }
  .panel {
    background:rgba(255,251,243,.98); border:4px solid #E4C3A6; border-radius:32px;
    box-shadow:0 6px 0 rgba(210,172,140,.35); padding:22px 30px; text-align:center;
    max-width:min(880px, 94%); max-height:92%; overflow:hidden auto; touch-action:pan-y;
  }
  .panel h1 { font-size:clamp(30px,6.4vh,48px); color:#D9784F; letter-spacing:1px; }
  .panel h2 { font-size:clamp(21px,4.4vh,29px); color:#C96A4E; margin-bottom:6px; }
  .panel h3 { font-size:clamp(17px,3.2vh,21px); color:#8A6A52; }
  .panel p  { font-size:clamp(15px,2.6vh,19px); color:#8A7263; line-height:1.55; }
  .btn {
    font-family:inherit; font-size:clamp(18px,3vh,23px); color:#7C5A3E; cursor:pointer;
    background:linear-gradient(#FFE3C2,#FBD0A5); border:3px solid #E8B488; border-radius:22px;
    padding:11px 32px; margin:8px 6px 0; box-shadow:0 4px 0 rgba(214,158,110,.5);
  }
  .btn:active { transform:translateY(3px); box-shadow:none; }
  .btn.sub  { background:linear-gradient(#EAF3FF,#D8E7FA); border-color:#AFC8E8; color:#57729B; box-shadow:0 4px 0 rgba(150,178,215,.5); }
  .btn.mint { background:linear-gradient(#E2F7E9,#C8EDD6); border-color:#96D2AE; color:#3E8A62; box-shadow:0 4px 0 rgba(130,190,155,.5); }
  .btn.pink { background:linear-gradient(#FFE4EC,#FBCBD9); border-color:#EFA8BE; color:#B25476; box-shadow:0 4px 0 rgba(226,150,175,.5); }
  .btn:disabled { opacity:.42; box-shadow:none; cursor:default; }
  .titleSub { font-size:clamp(15px,2.8vh,19px); color:#9A7E6E; margin:4px 0 10px; }

  /* ============ 스테이지 내 컨트롤 패널 ============ */
  .ctrl {
    position:absolute; z-index:20; pointer-events:auto;
    background:rgba(255,251,243,.94); border:3px solid #E4C3A6; border-radius:22px;
    padding:10px 16px; box-shadow:0 4px 0 rgba(210,172,140,.3);
    touch-action:manipulation;
  }
  .ctrl .row { display:flex; align-items:center; gap:10px; margin:5px 0; }
  .ctrl label { font-size:15px; color:#8A6A52; min-width:64px; }
  .ctrl .sVal { font-size:20px; min-width:72px; text-align:right; font-variant-numeric:tabular-nums; color:#5F4B41; }
  .sVal.tCol  { color:#D97F62; }
  .sVal.tdCol { color:#6E86B8; }
  .sVal.gCol  { color:#9A78C8; }
  input[type=range] {
    -webkit-appearance:none; appearance:none; flex:1; min-width:130px; height:40px; background:transparent; touch-action:pan-x; cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track { height:10px; border-radius:6px; background:#EFDEC8; border:1.5px solid #E0C6A8; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:31px; height:31px; border-radius:50%;
    background:#F0A97E; border:3.5px solid #FFF; box-shadow:0 2px 4px rgba(160,110,70,.35); margin-top:-12px;
  }
  input[type=range]::-moz-range-track { height:10px; border-radius:6px; background:#EFDEC8; border:1.5px solid #E0C6A8; }
  input[type=range]::-moz-range-thumb { width:26px; height:26px; border-radius:50%; background:#F0A97E; border:3.5px solid #FFF; box-shadow:0 2px 4px rgba(160,110,70,.35); }
  input[type=range].td::-webkit-slider-thumb { background:#7E9AD0; }
  input[type=range].td::-moz-range-thumb { background:#7E9AD0; }
  input[type=range].gm::-webkit-slider-thumb { background:#B48EC8; }
  input[type=range].gm::-moz-range-thumb { background:#B48EC8; }
  .chip { font-family:inherit; font-size:15px; border-radius:14px; border:2.5px solid #CBB49B; background:#FFF3E4;
    color:#8A6A52; padding:6px 13px; cursor:pointer; }
  .chip:active { transform:translateY(2px); }
  .chip.sel { background:#FBD0A5; border-color:#E8A66F; color:#7C4E28; }
  .bigBtn {
    font-family:inherit; font-size:20px; color:#3E8A62; cursor:pointer;
    background:linear-gradient(#E2F7E9,#C8EDD6); border:3px solid #96D2AE; border-radius:20px;
    padding:10px 24px; box-shadow:0 4px 0 rgba(130,190,155,.5);
  }
  .bigBtn:active { transform:translateY(3px); box-shadow:none; }
  .bigBtn:disabled { opacity:.4; box-shadow:none; }
  .bigBtn.orange { color:#B0703F; background:linear-gradient(#FFE3C2,#FBD0A5); border-color:#E8B488; box-shadow:0 4px 0 rgba(214,158,110,.5); }

  /* 의뢰(주문) 카드 */
  .orderCard {
    position:absolute; z-index:20; pointer-events:none;
    background:#FFFDF4; border:3px solid #F0D9A8; border-radius:20px;
    padding:10px 18px; box-shadow:0 4px 0 rgba(216,186,120,.3);
    max-width:330px;
  }
  .orderCard .oTag { font-size:13px; color:#C89A4E; letter-spacing:1px; }
  .orderCard .oTxt { font-size:18px; color:#7A5C38; line-height:1.4; margin-top:2px; }
  .orderCard .oTxt b { color:#D9784F; }

  /* 판정패 / 퀴즈 선택지 */
  .vRow { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .vCard {
    font-family:inherit; cursor:pointer; text-align:center;
    background:#FFFDF6; border:3.5px solid #E4C3A6; border-radius:22px;
    padding:12px 18px; min-width:128px; box-shadow:0 4px 0 rgba(210,172,140,.35);
    font-size:19px; color:#7A5C42;
  }
  .vCard:active { transform:translateY(3px); box-shadow:none; }
  .vCard .vIcon { font-size:15px; display:block; margin-bottom:3px; color:#A98D77; }
  .quizOpt {
    display:block; width:100%; font-family:inherit; text-align:left; cursor:pointer;
    background:#FFFDF6; border:3px solid #E4C3A6; border-radius:18px;
    padding:12px 18px; margin:8px 0; font-size:clamp(15px,2.6vh,19px); color:#6B564C;
    box-shadow:0 3px 0 rgba(210,172,140,.3);
  }
  .quizOpt:active { transform:translateY(2px); box-shadow:none; }
  .quizOpt.right { background:#E2F7E9; border-color:#8FCBA8; color:#3E8A62; }
  .quizOpt.wrong { background:#FFE9E4; border-color:#EFB0A0; color:#C06A52; }

  /* 숨은열 스위치 */
  .lhSwitch { display:flex; align-items:center; gap:10px; }
  .lhSwitch .swLab { font-size:16px; color:#8A6A52; }
  .swTrack { width:92px; height:46px; border-radius:26px; background:#D8DEE8; border:3px solid #B8C4D4;
    position:relative; transition:background .25s, border-color .25s; cursor:pointer; flex:none; }
  .swTrack.on { background:#FFD9A0; border-color:#F0B060; }
  .swKnob { position:absolute; top:3px; left:4px; width:34px; height:34px; border-radius:50%;
    background:#FFF; box-shadow:0 2px 4px rgba(80,60,40,.25); transition:left .25s;
    display:flex; align-items:center; justify-content:center; font-size:17px; }
  .swTrack.on .swKnob { left:48px; }
  .swState { font-size:18px; min-width:96px; }
  .swState.off { color:#7A8AA8; }
  .swState.onn { color:#E08A3C; }

  /* ============ 스탬프 수첩 ============ */
  .sbRow { display:flex; align-items:center; gap:10px; margin:7px 0; }
  .sbName { width:150px; text-align:right; font-size:15px; color:#8A6A52; flex:none; }
  .sbSlots { display:flex; gap:9px; }
  .sbSlot { width:52px; height:52px; border-radius:50%; border:2.5px dashed #D8C4AC; background:#FFFDF6;
    display:flex; align-items:center; justify-content:center; }
  .sbSlot.got { border:3px solid #F0B497; background:#FFF0E4; animation:stampIn .35s ease; }
  .sbSlot svg { width:36px; height:36px; }
  @keyframes stampIn { 0%{transform:scale(1.6) rotate(-14deg); opacity:0} 100%{transform:scale(1) rotate(0); opacity:1} }
  .sbBadge { font-size:12.5px; background:#FFF3D6; border:2px solid #EFD48E; color:#B08A2E;
    border-radius:12px; padding:2px 9px; margin-left:4px; }
  .titleChip { display:inline-block; font-size:14.5px; background:#F3EAFF; border:2.5px solid #CBAEE8; color:#8A5FB8;
    border-radius:14px; padding:3px 13px; margin:3px; }

  /* ============ 도감 ============ */
  .dexGrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:10px; }
  .dexCard { background:#FFFDF6; border:3px solid #EAD6BC; border-radius:22px; padding:10px 8px 12px; position:relative; }
  .dexCard.lockd { opacity:.75; }
  .dexCard .dxImg { width:84px; height:84px; margin:0 auto; }
  .dexCard .dxImg svg { width:100%; height:100%; }
  .dexCard.lockd .dxImg { filter:grayscale(1) brightness(1.05) contrast(.35); opacity:.6; }
  .dexCard h4 { font-size:16px; color:#7A5C42; margin-top:2px; }
  .dexCard .dxLike { font-size:12.5px; color:#B49A85; margin-top:2px; }
  .dexCard .dxCpt { font-size:13px; color:#57729B; line-height:1.45; margin-top:6px;
    background:#F2F7FF; border-radius:12px; padding:6px 8px; text-align:left; font-family:'Gowun Dodum',sans-serif; }
  .dexCard .dxSecret { font-size:12.5px; color:#B0703F; line-height:1.45; margin-top:5px;
    background:#FFF6DE; border-radius:12px; padding:6px 8px; text-align:left; font-family:'Gowun Dodum',sans-serif; }
  .dexCard .dxHearts { margin-top:4px; }
  .dexCard .dxHearts svg { width:15px; height:14px; }
  .panel.gold { border-color:#E8C25A; box-shadow:0 0 0 4px rgba(240,206,100,.35), 0 6px 0 rgba(206,166,80,.4); }
  .panel.gold h2 { color:#C09030; }

  /* 공식 힌트 카드 (뭉게가 들고 있음) */
  .formulaCard {
    position:absolute; z-index:20; pointer-events:none; text-align:center;
    background:#FFFDF0; border:3px solid #F0DCA0; border-radius:18px; padding:8px 16px;
    box-shadow:0 4px 0 rgba(216,190,120,.3); font-size:21px; color:#8A6E2E;
  }
  .formulaCard small { display:block; font-size:12.5px; color:#BCA25E; }

  /* 세로 화면 경고 */
  #rotate {
    position:fixed; inset:0; z-index:999; display:none; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:#FFF3E2; text-align:center;
  }
  #rotate .ph { font-size:64px; animation:rotAni 1.6s ease-in-out infinite; }
  @keyframes rotAni { 0%,20%{transform:rotate(0)} 60%,100%{transform:rotate(90deg)} }
  #rotate p { font-size:22px; color:#8A6A52; }
  @media (orientation: portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="stage">
  <div id="scene"></div>
  <canvas id="fx"></canvas>
  <div id="grain"></div>

  <div id="hud">
    <div id="hudLeft">
      <button class="hudBtn" id="stampBtn" title="스탬프 수첩"></button>
      <button class="hudBtn" id="dexBtn" title="동물 도감"></button>
    </div>
    <div id="stageHead" class="hudCard">
      <div id="shFace"></div>
      <div id="shName"></div>
      <div id="shHearts"></div>
      <div id="shDots"></div>
    </div>
    <div id="hudRight">
      <button class="hudBtn" id="hintBtn" title="뭉게의 힌트"></button>
      <button class="hudBtn" id="muteBtn" title="소리 켜기/끄기">🔊</button>
    </div>
    <div id="meters" class="hudCard">
      <div class="meter" id="mAlt"><div class="lab">고도</div><div class="val">0.00<small> km</small></div></div>
      <div class="meter" id="mT"><div class="lab">기온</div><div class="val">-<small> ℃</small></div></div>
      <div class="meter" id="mTd"><div class="lab">이슬점</div><div class="val">-<small> ℃</small></div></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="praise"></div>

  <div id="dialogWrap">
    <div id="dialogBox">
      <div id="dName">뭉게</div>
      <div id="dFace"></div>
      <div id="dText"></div>
      <div id="dNext">▼ 탭</div>
    </div>
  </div>

  <div id="overlay"></div>
</div>

<div id="rotate">
  <div class="ph">📱</div>

/* ============================================================
   PHYSICS — 순수 계산 함수 (교과서 값. tests/village.test.mjs 가 검증)
   ============================================================ */
// ==PHYSICS-START==
const RATE = {
  DRY: 10,   // 건조 단열 감률 ℃/km (불포화 공기: 상승 -10, 하강 +10)
  DEW: 2,    // 불포화 공기 이슬점 감률 ℃/km
  WET: 5,    // 습윤 단열 감률 ℃/km (포화 공기: 기온·이슬점 모두)
};
// 상승 응결 고도 H(km) = ⅛(T - Td)
function lclHeight(T, Td) { return (T - Td) / 8; }
// 지표 (T0, Td0)의 공기가 h(km)까지 '상승'했을 때의 상태
function riseState(T0, Td0, h) {
  const H = lclHeight(T0, Td0);
  if (h < H) {
    return { T: T0 - RATE.DRY * h, Td: Td0 - RATE.DEW * h, saturated: false, H };
  }
  const Tc = T0 - RATE.DRY * H;            // 응결 고도의 기온(=이슬점)
  const v = Tc - RATE.WET * (h - H);       // 그 위로는 습윤 단열
  return { T: v, Td: v, saturated: true, H };
}
// 가상 세계: 숨은열 스위치 OFF — 응결해도 열이 안 나와 계속 -10℃/km
function riseStateNoLatent(T0, Td0, h) {
  const H = lclHeight(T0, Td0);
  const T = T0 - RATE.DRY * h;
  return { T, Td: h < H ? Td0 - RATE.DEW * h : T, saturated: h >= H, H };
}
// 산꼭대기(hTop, 기온 Ttop, 이슬점 TdTop)에서 h(km)까지 '하강'(불포화)한 상태
function descendFrom(Ttop, TdTop, hTop, h) {
  const dh = hTop - h;
  return { T: Ttop + RATE.DRY * dh, Td: TdTop + RATE.DEW * dh, saturated: false };
}
// 푄: (T0, Td0) 공기가 높이 hTop 산을 넘어 반대쪽 지표(0km)에 도착한 상태
function foehn(T0, Td0, hTop) {
  const H = lclHeight(T0, Td0);
  if (H >= hTop) {   // 응결 없이 넘음 → 오르며 식은 만큼 그대로 데워져 도착 = 출발
    return { H, condensed: false, topT: T0 - RATE.DRY * hTop, topTd: Td0 - RATE.DEW * hTop,
             arriveT: T0, arriveTd: Td0 };
  }
  const top = riseState(T0, Td0, hTop);
  const dn = descendFrom(top.T, top.Td, hTop, 0);
  return { H, condensed: true, topT: top.T, topTd: top.Td, arriveT: dn.T, arriveTd: dn.Td };
}
// 환경 기온 감률 γ(℃/km)에 따른 대기 안정도
function stability(gamma) {
  if (gamma < RATE.WET) return 'stable';        // γ < 5 절대 안정
  if (gamma > RATE.DRY) return 'unstable';      // γ > 10 절대 불안정
  return 'conditional';                          // 5~10 조건부 불안정
}
// 지표 기온 T0, 감률 γ일 때 고도 h의 환경(주위) 기온
function envTemp(T0, gamma, h) { return T0 - gamma * h; }
// 강제 상승한 공기 덩어리가 고도 h에서 주위보다 따뜻한가? (따뜻하면 스스로 상승)
function parcelWarmer(T0, Td0, gamma, h) {
  return riseState(T0, Td0, h).T > envTemp(T0, gamma, h);
}
// 공기 덩어리를 pushTop까지 강제 상승시켰을 때 생기는 구름의 형태
// 'none' = 응결 고도 미달 / 'stratus' = 응결 후 복귀(층운형) / 'cumulus' = 자유 상승(적운형)
function cloudForm(T0, Td0, gamma, pushTop) {
  const H = lclHeight(T0, Td0);
  if (pushTop < H) return 'none';
  return parcelWarmer(T0, Td0, gamma, pushTop) ? 'cumulus' : 'stratus';
}
// ==PHYSICS-END==

/* ============================================================
   유틸
   ============================================================ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const fmt1 = v => (Math.round(v * 10) / 10).toFixed(1);
const fmt2 = v => (Math.round(v * 100) / 100).toFixed(2);
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// 손그림 느낌 blob 경로 (SVG path d 문자열)
function blobD(cx, cy, r, seed, amp = 0.1, pts = 9, ry = 1) {
  const n = [];
  for (let i = 0; i < pts; i++) {
    const a = (i / pts) * TAU;
    const w = 1 + amp * Math.sin(seed * 3.1 + i * 2.7);
    n.push([cx + Math.cos(a) * r * w, cy + Math.sin(a) * r * w * ry]);
  }
  const mid = (p, q) => `${((p[0] + q[0]) / 2).toFixed(1)} ${((p[1] + q[1]) / 2).toFixed(1)}`;
  let d = `M${mid(n[0], n[1])}`;
  for (let i = 1; i <= pts; i++) {
    const p = n[i % pts], nx = n[(i + 1) % pts];
    d += `Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${mid(p, nx)}`;
  }
  return d + 'Z';
}
// 포인터 이벤트 → SVG 좌표 변환
function svgPt(svg, e) {
  const p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  const m = svg.getScreenCTM();
  return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 };
}

/* ============================================================
   사운드 — Web Audio API 로 전부 생성 (음원 파일 없음)
   ============================================================ */
const AudioSys = {
  ctx: null, master: null, muted: false,
  bgmName: null, bgmTimer: null, nextBeat: 0, beatIdx: 0, beatSec: 0.6,

  ensure() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.85;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  now() { return this.ctx ? this.ctx.currentTime : performance.now() / 1000; },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.85, this.now(), 0.05);
  },
  tone(f, t0, dur, { type = 'sine', g = 0.15, f2 = null, attack = 0.01 } = {}) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), gn = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.linearRampToValueAtTime(g, t0 + attack);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  // 오르골(뮤직박스) 음색: 기본음 + 옥타브 + 살짝 어긋난 배음, 짧은 어택·긴 여운
  box(f, t0, dur = 1.15, g = 0.085) {
    this.tone(f, t0, dur, { g, attack: 0.004 });
    this.tone(f * 2, t0, dur * 0.62, { g: g * 0.28, attack: 0.004 });
    this.tone(f * 5.04, t0, 0.16, { g: g * 0.05, attack: 0.002 });
  },
  noiseBuf: null,
  noise(t0, dur, g = 0.1, hp = 3000) {
    if (!this.ctx) return;
    if (!this.noiseBuf) {
      const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.5, this.ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    }
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const gn = this.ctx.createGain();
    gn.gain.setValueAtTime(g, t0);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(gn); gn.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.05);
  },

  /* --- 효과음 --- */
  sTick()    { this.tone(1250, this.now(), 0.03, { type: 'square', g: 0.02 }); },
  sPop()     { this.tone(520, this.now(), 0.1, { type: 'triangle', g: 0.12, f2: 780 }); },
  sSparkle() { const t = this.now(); this.tone(880, t, 0.12, { g: 0.09 }); this.tone(1320, t + 0.07, 0.18, { g: 0.08 }); this.tone(1760, t + 0.14, 0.25, { g: 0.06 }); },
  sHeart()   { const t = this.now(); this.tone(660, t, 0.09, { type: 'triangle', g: 0.11, f2: 990 }); this.tone(1320, t + 0.08, 0.16, { g: 0.07 }); },
  sHeartDown(){ this.tone(392, this.now(), 0.22, { type: 'triangle', g: 0.09, f2: 294 }); },
  sMiss()    { const t = this.now(); this.tone(330, t, 0.16, { type: 'triangle', g: 0.08, f2: 262 }); this.tone(262, t + 0.15, 0.2, { type: 'triangle', g: 0.07, f2: 220 }); },
  sStamp()   { const t = this.now(); this.tone(150, t, 0.16, { type: 'sine', g: 0.26, f2: 60 }); this.noise(t, 0.09, 0.09, 1200); },
  sClear()   { const t = this.now(); [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, t + i * 0.1, 0.4, { type: 'triangle', g: 0.11 })); },
  sFanfare() { const t = this.now();
    [[523,0],[523,.14],[523,.28],[659,.42],[784,.62],[659,.8],[784,.94],[1047,1.1]].forEach(([f,d]) =>
      this.tone(f, t + d, 0.38, { type: 'triangle', g: 0.12 }));
    [262, 330, 392].forEach(f => this.tone(f, t + 1.1, 0.9, { g: 0.06, attack: 0.05 })); },
  sCondense(){ const t = this.now(); [523, 659, 784, 1047].forEach((f, i) => this.tone(f, t + i * 0.09, 0.35, { g: 0.09 })); this.noise(t, 0.5, 0.025, 6000); },
  sWhoosh()  { this.noise(this.now(), 0.4, 0.05, 1500); },
  sBell()    { const t = this.now(); this.box(1047, t, 0.9, 0.1); this.box(1319, t + 0.12, 0.9, 0.08); },
  sWrong()   { this.tone(196, this.now(), 0.3, { type: 'sawtooth', g: 0.05, f2: 147 }); },
  sRain()    { this.noise(this.now(), 0.6, 0.03, 4500); },

  /* --- BGM 패턴 (b: 박 번호, t: 예약 시각) --- */
  PATTERNS: {
    // 마을 지도: 몽글몽글 오르골
    village: { bpm: 150, mel: [659,784,880,1047, 880,784,659,523, 587,659,784,659, 523,0,880,0,
                               659,784,880,1047, 1175,1047,880,784, 880,784,659,587, 523,0,0,0],
      fn(b, t, A) {
        const m = this.mel[b % this.mel.length];
        if (m) A.box(m, t, 1.1, 0.06);
        if (b % 8 === 0) A.box(262, t, 1.8, 0.045);
        if (b % 8 === 4) A.box(196, t, 1.8, 0.04);
      } },
    // 월드1: 가벼운 아르페지오 변주
    w1: { bpm: 96, fn(b, t, A) {
        const seq = [523, 659, 784, 880, 784, 659];
        A.tone(seq[b % 6], t, 0.5, { type: 'triangle', g: 0.045 });
        if (b % 4 === 0) A.tone(131, t, 1.8, { g: 0.05, attack: 0.4 });
      } },
    // 월드2: 산·구름 — 조금 넓은 화음 + 종소리
    w2: { bpm: 84, fn(b, t, A) {
        if (b % 4 === 0) { const root = (b % 8 === 0) ? 174.6 : 196;
          A.tone(root, t, 2.6, { g: 0.05, attack: 0.5 }); A.tone(root * 1.5, t, 2.6, { g: 0.032, attack: 0.5 }); }
        if (b % 2 === 1) A.box(1047, t, 0.6, 0.03);
      } },
    // 월드3: 지혜로운 하늘 — 낮은 오르골
    w3: { bpm: 66, mel: [523, 0, 659, 587, 523, 0, 440, 0],
      fn(b, t, A) {
        const m = this.mel[b % 8];
        if (m) A.box(m, t, 1.4, 0.055);
        if (b % 4 === 0) A.tone(165, t, 3.2, { g: 0.04, attack: 0.7 });
      } },
    // 잔치: 통통 튀는 파티
    party: { bpm: 120, fn(b, t, A) {
        if (b % 2 === 0) A.tone([131, 165, 147, 196][Math.floor(b / 2) % 4], t, 0.35, { type: 'triangle', g: 0.08 });
        A.noise(t + 0.5 * (60 / this.bpm), 0.04, 0.02, 8000);
        const mel = [784, 0, 880, 1047, 0, 880, 784, 659];
        const m = mel[b % 8]; if (m) A.tone(m, t, 0.3, { type: 'triangle', g: 0.055 });
      } },
  },
  startBgm(name) {
    if (this.bgmName === name) return;
    this.stopBgm();
    if (!this.ctx) return;
    const p = this.PATTERNS[name]; if (!p) return;
    this.bgmName = name;
    this.beatSec = 60 / p.bpm;
    this.beatIdx = 0;
    this.nextBeat = this.now() + 0.12;
    this.bgmTimer = setInterval(() => {
      const ahead = this.now() + 0.3;
      while (this.nextBeat < ahead) {
        p.fn.call(p, this.beatIdx, this.nextBeat, this);
        this.beatIdx++; this.nextBeat += this.beatSec;
      }
    }, 60);
  },
  stopBgm() {
    if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; }
    this.bgmName = null;
  },
};
</script>

  const n = Math.max(3, Math.round(w / (h * 0.9)));
  let s = '';
  for (let i = 0; i < n; i++) {
    const cx = -w / 2 + (i + 0.5) * (w / n);

const FX = {
  cv: null, ctx: null, parts: [],
  init() { this.cv = $('fx'); this.ctx = this.cv.getContext('2d'); this.resize(); },
  resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = Math.round(innerWidth * d); this.cv.height = Math.round(innerHeight * d);
    this.ctx.setTransform(d, 0, 0, d, 0, 0);
  },
  add(p) { if (this.parts.length < TUNING.fx.maxParticles) this.parts.push(p); },
  COLORS: ['#F8A8B8', '#F7C154', '#9FD6B4', '#A8C8F0', '#CBAEE8', '#F0A97E'],
  confetti(x = innerWidth / 2, y = innerHeight * 0.3, n = TUNING.fx.confettiN) {
    for (let i = 0; i < n; i++) this.add({
      type: 'conf', x: x + (Math.random() - 0.5) * 140, y: y + (Math.random() - 0.5) * 40,
      vx: (Math.random() - 0.5) * 320, vy: -Math.random() * 300 - 60, g: 520,
      rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 10,
      size: 5 + Math.random() * 6, color: pick(this.COLORS), age: 0, life: 1.7 + Math.random() * 0.9,
    });
  },
  burst(x, y, color = '#F7C154', n = 14) {
    for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = 60 + Math.random() * 160;
      this.add({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 60,
        size: 3 + Math.random() * 4, color, age: 0, life: 0.6 + Math.random() * 0.5 }); }
  },
  hearts(x, y, n = 6) {
    for (let i = 0; i < n; i++) this.add({ type: 'heart', x: x + (Math.random() - 0.5) * 60, y,
      vx: (Math.random() - 0.5) * 40, vy: -60 - Math.random() * 70, g: -20,
      size: 7 + Math.random() * 6, color: '#F58C9C', age: 0, life: 1.1 + Math.random() * 0.5 });
  },
  warm(x, y, n = 3) { // 숨은열 온기 입자
    for (let i = 0; i < n; i++) this.add({ type: 'warm', x: x + (Math.random() - 0.5) * 46, y: y + (Math.random() - 0.5) * 36,
      vx: (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 40, g: -14,
      size: 3.5 + Math.random() * 3, color: pick(['#F7A054', '#F58C8C', '#F7C154']), age: 0, life: 0.8 + Math.random() * 0.4 });
  },
  firework(x, y) {

    for (let i = 0; i < 26; i++) { const a = (i / 26) * TAU, sp = 130 + Math.random() * 110;
      this.add({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 130,
        size: 3 + Math.random() * 3, color: col, age: 0, life: 0.9 + Math.random() * 0.5 }); }
  },
  tick(dt) {
    const c = this.ctx;
    c.clearRect(0, 0, innerWidth, innerHeight);
    if (!this.parts.length) return;
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.age += dt;
      if (p.age >= p.life) { this.parts.splice(i, 1); continue; }
      p.vy += (p.g || 0) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.vr) p.rot += p.vr * dt;
      const k = 1 - p.age / p.life;
      c.globalAlpha = Math.min(1, k * 2);
      c.fillStyle = p.color;
      if (p.type === 'conf') {
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66); c.restore();
      } else if (p.type === 'spark') {
        c.save(); c.translate(p.x, p.y); c.rotate(p.age * 3);
        c.beginPath();
        c.moveTo(0, -p.size); c.lineTo(p.size * 0.36, 0); c.lineTo(0, p.size); c.lineTo(-p.size * 0.36, 0);
        c.closePath(); c.fill(); c.restore();
      } else if (p.type === 'heart') {
        c.save(); c.translate(p.x, p.y); c.scale(p.size / 12, p.size / 12);
        c.beginPath();
        c.moveTo(0, 4); c.bezierCurveTo(-6, -2, -5, -8, 0, -4); c.bezierCurveTo(5, -8, 6, -2, 0, 4);
        c.fill(); c.restore();
      } else { // warm
        c.beginPath(); c.arc(p.x, p.y, p.size * k, 0, TAU); c.fill();
      }
    }
    c.globalAlpha = 1;
  },
};

/* ============================================================
   토스트 · 칭찬 팝업 · 흔들림
   ============================================================ */
let toastTimer = null;
function toast(msg, good = false, ms = 1900) {
  const el = $('toast');
  el.innerHTML = msg; el.classList.toggle('good', good); el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
function shake() {
  const st = $('stage');
  st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake');
}
const PRAISES = ['완벽해!', '대단해!', '천재잖아?!', '짱이야!', '구름도 감동했어!', '반짝반짝 최고!', '하늘이 놀랐어!'];
function praisePop(combo) {
  const el = $('praise');
  el.innerHTML = pick(PRAISES) + (combo >= 2 ? `<span class="comboTag">🔥 ${combo} 콤보!</span>` : '');
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}

/* ============================================================
   오버레이
   ============================================================ */
function showOverlay(html) { const o = $('overlay'); o.innerHTML = html; o.classList.add('on'); }
function hideOverlay() { const o = $('overlay'); o.classList.remove('on'); o.innerHTML = ''; }

/* ============================================================
   대화 시스템 — 말하는 이가 매 줄 바뀔 수 있음
   line: { who:'mungge'|animalId, face, text }
   ============================================================ */
const Dialog = {
  lines: [], idx: 0, charIdx: 0, typing: false, timer: null, onDone: null,
  run(lines, onDone) {
    this.lines = lines; this.idx = 0; this.onDone = onDone;
    G.dialogActive = true;
    $('dialogWrap').classList.add('on');
    this.showLine();
  },
  speakerInfo(who) {
    return animalById(who) || CHAR_TAG[who] || CHAR_TAG.mungge;
  },
  showLine() {
    const L = this.lines[this.idx];
    const info = this.speakerInfo(L.who || 'mungge');
    const nameEl = $('dName');
    nameEl.textContent = info.name;
    nameEl.style.background = info.tag; nameEl.style.borderColor = info.tagLine; nameEl.style.color = info.ink;
    $('dFace').innerHTML = charSVG(L.who || 'mungge', L.face || 'normal');
    const el = $('dText');
    el.innerHTML = '';
    this.typing = true; this.charIdx = 0;
    $('dNext').style.visibility = 'hidden';
    clearInterval(this.timer);
    const plain = L.text;
    this.timer = setInterval(() => {
      this.charIdx++;
      const done = this.charIdx >= this.stripLen(plain);
      el.innerHTML = this.slice(plain, this.charIdx);
      if (this.charIdx % 2 === 0) AudioSys.sTick();
      if (done) this.finishLine();
    }, 32);
  },
  stripLen(html) { return html.replace(/<[^>]*>/g, '').length; },
  slice(html, n) {
    let out = '', cnt = 0, i = 0;
    while (i < html.length && cnt < n) {
      if (html[i] === '<') { const j = html.indexOf('>', i); out += html.slice(i, j + 1); i = j + 1; }
      else { out += html[i]; i++; cnt++; }
    }
    const opens = (out.match(/<b>/g) || []).length - (out.match(/<\/b>/g) || []).length;
    for (let k = 0; k < opens; k++) out += '</b>';
    const so = (out.match(/<span[^>]*>/g) || []).length - (out.match(/<\/span>/g) || []).length;
    for (let k = 0; k < so; k++) out += '</span>';
    return out;
  },
  finishLine() {
    clearInterval(this.timer);
    this.typing = false;
    $('dText').innerHTML = this.lines[this.idx].text;
    $('dNext').style.visibility = 'visible';
  },
  tap() {
    if (!this.lines.length) return;
    if (this.typing) { this.finishLine(); return; }
    this.idx++;
    if (this.idx < this.lines.length) { AudioSys.sPop(); this.showLine(); }
    else this.close();
  },
  close() {
    clearInterval(this.timer);
    $('dialogWrap').classList.remove('on');
    G.dialogActive = false;
    this.lines = [];
    const cb = this.onDone; this.onDone = null;
    if (cb) cb();
  },
  abort() {
    clearInterval(this.timer);
    $('dialogWrap').classList.remove('on');
    G.dialogActive = false;
    this.lines = []; this.onDone = null;
  },
};
</script>

function celebrate(stageIdx, mIdx, next, { big = false } = {}) {
  const st = STAGES[stageIdx], a = animalById(st.animal);

  if (G.aff[stageIdx] >= TUNING.aff.max && !G.secretShown[stageIdx]) {

function pawIcon() { return `<svg viewBox="0 0 40 40" style="width:22px;height:22px;vertical-align:-4px">${pawSVG().replace(/<\/?svg[^>]*>/g, '')}</svg>`; }

function stageComplete(idx) {
  const noMiss = G.run && G.run.failCount === 0;

function rulerSVG(x, groundY, pxPerKm, maxKm) {
  let s = `<line x1="${x}" y1="${groundY}" x2="${x}" y2="${groundY - pxPerKm * maxKm}" stroke="#D9C6AE" stroke-width="3"/>`;
  for (let k = 0; k <= maxKm + 0.001; k += 0.5) {
    const y = groundY - pxPerKm * k, big = Math.abs(k % 1) < 0.01;
    s += `<line x1="${x - (big ? 12 : 7)}" y1="${y}" x2="${x}" y2="${y}" stroke="#D9C6AE" stroke-width="${big ? 3 : 2}"/>`;
    if (big) s += `<text x="${x - 18}" y="${y + 5}" text-anchor="end" font-size="15" fill="#A98D77" font-family="Jua">${k} km</text>`;
  }
  return s;
}

// 세로 드래그 (포인터 이벤트, 터치 최우선)
function attachVDrag(svg, grabEl, state, opts) {
  const move = e => {
    const p = svgPt(svg, e);
    state.targetAlt = clamp((opts.groundY - p.y) / opts.pxPerKm, 0, opts.maxKm);
  };
  grabEl.addEventListener('pointerdown', e => {
    if (G.dialogActive || state.locked) return;
    e.preventDefault(); e.stopPropagation();
    state.held = true;
    grabEl.setPointerCapture(e.pointerId);
    move(e);
  });
  grabEl.addEventListener('pointermove', e => { if (state.held) move(e); });
  const up = () => { state.held = false; };
  grabEl.addEventListener('pointerup', up);
  grabEl.addEventListener('pointercancel', up);
}
function svgToScreen(svg, x, y) {
  const p = svg.createSVGPoint(); p.x = x; p.y = y;

        { who: 'chorong', face: 'puzzled', text: '저기 하늘 위는 시원하다던데, 시원한 공기 좀 부탁해도 될까?' },
        { who: 'mungge', face: 'normal', text: '규칙 하나! 공기 덩어리는 <b>1 km 올라갈 때마다 10 ℃씩</b> 식어. 열을 주고받지 않아도 <span class="kw">팽창</span>하면서 스스로!' },
      ], () => this.startRound(0));
    },
    setChorong(face) { $('s1chorong').innerHTML = charNested('chorong', face, -70, -76, 140, 148); },
    startRound(r) {
      st.round = r; st.hold = 0; st.locked = false; st.done = false;
      const R = C.rounds[r];
      setMission(r, HINTS[r]);
      $('s1RoundTag').textContent = `라운드 ${r + 1} / 3`;
      $('s1Order').innerHTML = `${R.label} 부탁해!`;
      if (R.startAlt != null) {
        st.alt = st.targetAlt = R.startAlt;
        toast('찬 공기가 하늘 위에서 기다리고 있어! 이번엔 아래로~', true, 2200);
      } else { st.alt = st.targetAlt = 0; }
      this.setChorong(r === 2 ? 'puzzled' : 'pant');
      $('s1heat').style.opacity = r === 2 ? 0 : 1;
    },
    inGoal(T) {
      const R = C.rounds[st.round];
      return R.type === 'le' ? T <= R.target : Math.abs(T - R.target) <= R.tol;
    },
    tick(dt) {
      if (st.done && !G.dialogActive) { /* 라운드 사이 대기 */ }
      st.alt += (st.targetAlt - st.alt) * Math.min(1, dt * 8);
      const T = C.T0 - RATE.DRY * st.alt;
      const Td = C.Td0 - RATE.DEW * st.alt;
      setMeters(st.alt, T, Td);
      const g = $('s1pcl'); if (!g) return;
      const scale = 1 + 0.16 * st.alt;   // 단열 팽창: 위로 갈수록 몸집이 커짐
      g.setAttribute('transform', `translate(${X},${GY - 44 - st.alt * PX}) scale(${scale.toFixed(3)})`);
      const body = g.querySelector('path');
      if (body) body.setAttribute('fill', T <= 16 ? 'rgba(224,240,255,.9)' : T >= 26 ? 'rgba(255,236,222,.9)' : 'rgba(255,255,255,.85)');
      if (st.alt > 0.15) $('s1grabTip').style.opacity = 0;
      // 목표 유지 판정
      if (!st.done && !G.dialogActive) {
        if (this.inGoal(T)) {
          st.hold += dt;
          if (st.hold > 0.15 && Math.floor((st.hold - dt) * 6) !== Math.floor(st.hold * 6)) AudioSys.sTick();
        } else st.hold = Math.max(0, st.hold - dt * 2);
        $('s1ring').setAttribute('stroke-dashoffset', 390 * (1 - clamp(st.hold / TUNING.holdSec, 0, 1)));
        if (st.hold >= TUNING.holdSec) this.roundClear(T);
      }
    },
    roundClear(T) {
      st.done = true; st.locked = true; st.held = false;
      $('s1ring').setAttribute('stroke-dashoffset', 390);
      AudioSys.sSparkle();
      // 당근 쑥쑥 + 초롱이 리액션
      [0, 1, 2, 3, 4].forEach((i) => {
        const el = $('s1cr' + i);
        if (el) el.setAttribute('transform', `scale(${0.55 + (st.round + 1) * 0.22})`);
      });
      this.setChorong(st.round === 2 ? 'wow' : 'happy');
      const p = svgToScreen(this.svg, 1050, GY - 60);
      FX.burst(p.x, p.y, '#9FD6B4', 16);
      const r = st.round;
      celebrate(0, r, () => {
        if (r < 2) {
          Dialog.run([{ who: 'chorong', face: r === 0 ? 'happy' : 'wow',
            text: r === 0 ? '와아, 시원해! 당근 잎이 살아났어! <b>더 시원한 것</b>도 될까?'
                          : '굉장해! …앗, 그런데 너무 시원했나? 이번엔 밭이 좀 <b>추워졌어</b>!' }],
            () => this.startRound(r + 1));
        } else {
          Dialog.run([
            { who: 'chorong', face: 'wow', text: '따끈따끈~ 완벽한 온도야! 내려온 공기는 <b>눌리면서 데워지는구나</b>!' },
            { who: 'mungge', face: 'proud', text: '오르면 <b>팽창해서 시원</b>, 내리면 <b>압축돼서 따끈</b>. 이게 <span class="kw">단열 변화</span>야!' },
          ], () => stageComplete(0));
        }
      });
    },
  };
};

        { who: 'gasirong', face: 'puzzled', text: '그럼 문제! 실제 세계의 구름 속 공기가 <b>천천히 식는 이유</b>가 뭐게?' },

        { t: '구름 속 물방울이 햇빛을 가려 온도계가 착각해서', ok: false },
