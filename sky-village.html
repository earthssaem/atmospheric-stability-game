      celebrate(1, 1, () => {
        // 가시롱이 동그랗게 말리는 리액션: 몸을 공처럼
        $('s2gasirong').innerHTML = `<g class="bob">${charNested('gasirong', 'sleep', -66, -72, 132, 140, { prop: true })}</g>`;
        Dialog.run([
          { who: 'gasirong', face: 'wow', text: '그렇구나… 응결할 때 나온 <b>숨은열</b>이 공기를 데워서 <b>−10이 아니라 −5 ℃/km</b>가 되는 거였어!' },
          { who: 'gasirong', face: 'sleep', text: '후아… 궁금증이 풀리니 잠이 솔솔 와. 낙엽 이불 덮고… 이제 편하게 낮잠 잘 수 있겠어… 쿨쿨.' },
          { who: 'mungge', face: 'happy', text: '쉿, 재워 주자~ <span class="kw">숨은열 = 구름 속 보온 히터</span>. 잊지 마!' },
        ], () => stageComplete(1));
      }, { big: true });
    },
  };
};
</script>
<script>
'use strict';
/* ============================================================
   S3 — 몽실이의 구름 침대 (상승 응결 고도 H = ⅛(T − Td))
   ============================================================ */
STAGE_BUILDERS[2] = function () {
  const C = TUNING.s3;
  const GY = 606, TOPY = 100, PX = (GY - TOPY) / C.maxKm, BX = 660;
  const st = { T: C.T.init, Td: C.Td.init, mode: 'idle', alt: 0, round: 0, jump: -1 };
  const HINTS = [
    ['뭉게의 공식 카드를 봐! <b>H = ⅛ × (T − Td)</b>. 침대 높이에 맞는 (T−Td)를 만들면 돼.',
     'H가 1.0 km가 되려면 <b>T − Td = 8</b>! 예를 들면 기온 22 ℃, 이슬점 14 ℃.'],
    ['⅛ × (T − Td) = 2.0이 되려면… (T − Td)는 얼마여야 할까?',
     '<b>T − Td = 16</b>이면 돼! 예: 기온 26 ℃, 이슬점 10 ℃.'],
    ['이제 마지막! 1.5 km면 (T − Td)는?',
     '<b>T − Td = 12</b>! 예: 기온 24 ℃, 이슬점 12 ℃.'],
  ];
  return {
    build() {
      $('scene').innerHTML = `
      <svg class="full" id="s3svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="s3sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#A4CDEE"/><stop offset=".6" stop-color="#DCEDF9"/><stop offset="1" stop-color="#F2E6F4"/>
        </linearGradient></defs>
        <rect width="1280" height="720" fill="url(#s3sky)"/>
        <g class="drift" opacity=".6"><g transform="translate(180,120)">${cloudPuffsSVG(140, 30)}</g></g>
        ${rulerSVG(150, GY, PX, 3)}
        <path d="M0 ${GY + 4} Q320 ${GY - 20} 640 ${GY + 4} Q960 ${GY + 26} 1280 ${GY} L1280 720 L0 720 Z" fill="#CDE0F2"/>
        <g id="s3bed"></g>
        <g id="s3cloud" opacity="0"></g>
        <text id="s3cloudLab" x="${BX + 150}" y="0" font-size="16" fill="#6E86B8" font-family="Jua" opacity="0"></text>
        <g id="s3pcl" transform="translate(${BX},${GY - 44})">${parcelSVG('s3pclInner')}</g>
        <g id="s3mongsil" transform="translate(1080,${GY - 58})"></g>
        <g id="s3mongsilCloud" transform="translate(1080,${GY - 6})">${cloudPuffsSVG(120, 26, '#FFF', '#D8E0F0')}</g>
        <text id="s3zzz" x="0" y="0" font-size="24" fill="#8FA8D0" font-family="Jua" opacity="0">z z Z</text>
      </svg>
      <div class="ctrl" style="left:14px;bottom:14px;width:min(390px,46vw)">
        <div class="row"><label>기온 T</label>
          <input type="range" id="s3T" min="${C.T.min}" max="${C.T.max}" step="1" value="${st.T}">
          <span class="sVal tCol" id="s3Tv">${st.T} ℃</span></div>
        <div class="row"><label>이슬점 Td</label>
          <input type="range" id="s3Td" class="td" min="${C.Td.min}" max="${C.Td.max}" step="1" value="${st.Td}">
          <span class="sVal tdCol" id="s3Tdv">${st.Td} ℃</span></div>
        <div class="row" style="justify-content:center;margin-top:8px">
          <button class="bigBtn" id="s3go">공기 올리기!</button></div>
      </div>
      <div class="formulaCard" style="right:14px;bottom:14px;padding-right:88px">
        H = ⅛ × (T − Td)
        <small>상승 응결 고도(구름이 생기는 높이)</small>
        <div style="position:absolute;right:-4px;bottom:-6px;width:84px;height:88px">${charSVG('mungge', 'proud')}</div>
      </div>
      <div class="orderCard" style="left:14px;top:76px">
        <div class="oTag" id="s3RoundTag">주문 1 / 3</div>
        <div class="oTxt" id="s3Order"></div>
      </div>`;
      this.svg = $('s3svg');
      this.setMongsil('normal');
      const upd = () => {
        st.T = +$('s3T').value;
        st.Td = Math.min(+$('s3Td').value, st.T);
        if (+$('s3Td').value > st.T) $('s3Td').value = st.T;
        $('s3Tv').textContent = `${st.T} ℃`; $('s3Tdv').textContent = `${st.Td} ℃`;
        setMeters(0, st.T, st.Td);
      };
      $('s3T').addEventListener('input', upd);
      $('s3Td').addEventListener('input', upd);
      $('s3go').addEventListener('pointerdown', e => {
        e.stopPropagation();
        if (G.dialogActive || st.mode !== 'idle') return;
        AudioSys.ensure(); AudioSys.sWhoosh();
        st.mode = 'rise'; st.alt = 0;
        $('s3go').disabled = true;
        $('s3cloud').setAttribute('opacity', 0);
        $('s3cloudLab').setAttribute('opacity', 0);
      });
      upd();
      Dialog.run([
        { who: 'mongsil', face: 'normal', text: '냐암… 어서 와. 나는 폭신한 곳에서만 잘 수 있는 몽실이야.' },
        { who: 'mongsil', face: 'puzzled', text: '침대 프레임은 하늘에 놓아 뒀는데 <b>매트리스(구름)</b>가 없지 뭐야. 딱 저 높이에 구름을 깔아 줄래냥?' },
        { who: 'mungge', face: 'normal', text: '구름은 <span class="kw">응결 고도 H = ⅛(T − Td)</span>에서 생겨! 지표의 기온·이슬점을 조절하고 공기를 올려 보자.' },
      ], () => this.startRound(0));
    },
    setMongsil(face) { $('s3mongsil').innerHTML = charNested('mongsil', face, -60, -66, 120, 128); },
    bedY() { return GY - C.targets[st.round] * PX; },
    startRound(r) {
      st.round = r; st.mode = 'idle'; st.jump = -1;
      setMission(r, HINTS[r]);
      const km = C.targets[r];
      $('s3RoundTag').textContent = `주문 ${r + 1} / 3`;
      $('s3Order').innerHTML = `침대 높이 <b>${km.toFixed(1)} km</b>에 폭신 구름 매트리스!`;
      $('s3go').disabled = false;
      const y = this.bedY();
      $('s3bed').innerHTML = `<g transform="translate(${BX},${y})">
        <line x1="-190" y1="10" x2="1280" y2="10" stroke="#C0A8E0" stroke-width="2" stroke-dasharray="6 9" opacity=".55"/>
        <rect x="-128" y="0" width="256" height="13" rx="6.5" fill="#E8CBA8" stroke="#C8A478" stroke-width="3"/>
        <rect x="-140" y="-52" width="14" height="66" rx="7" fill="#E8CBA8" stroke="#C8A478" stroke-width="3"/>
        <rect x="126" y="-36" width="14" height="50" rx="7" fill="#E8CBA8" stroke="#C8A478" stroke-width="3"/>
        <rect x="-118" y="-20" width="56" height="18" rx="9" fill="#F6F2FF" stroke="#CFC4E8" stroke-width="2.5"/>
        <text x="176" y="-18" font-size="15" fill="#8A6FB8" font-family="Jua">↖ ${km.toFixed(1)} km 침대</text>
      </g>`;
      $('s3zzz').setAttribute('opacity', 0);
      this.setMongsil('normal');
      $('s3mongsil').setAttribute('transform', `translate(1080,${GY - 58})`);
      $('s3mongsilCloud').setAttribute('opacity', 1);
      $('s3pcl').setAttribute('opacity', 1);
    },
    tick(dt) {
      const H = lclHeight(st.T, st.Td);
      if (st.mode === 'rise') {
        st.alt += dt * 1.15;
        const capped = Math.min(H, C.maxKm + 0.15);
        if (st.alt >= capped) { st.alt = capped; this.arrive(H); }
      } else if (st.mode === 'idle') {
        st.alt = Math.max(0, st.alt - dt * 2.2);
      }
      const s = riseState(st.T, st.Td, Math.min(st.alt, H));
      if (st.mode === 'rise') setMeters(st.alt, s.T, s.Td);
      const g = $('s3pcl'); if (!g) return;
      g.setAttribute('transform', `translate(${BX},${GY - 44 - st.alt * PX}) scale(${(1 + 0.13 * st.alt).toFixed(3)})`);
      // 몽실이 폴짝 점프 연출
      if (st.jump >= 0) {
        st.jump = Math.min(1, st.jump + dt * 1.1);
        const t = st.jump, y0 = GY - 58, y1 = this.bedY() - 34;
        const x = lerp(1080, BX + 20, t);
        const y = lerp(y0, y1, t) - Math.sin(t * Math.PI) * 130;
        $('s3mongsil').setAttribute('transform', `translate(${x.toFixed(0)},${y.toFixed(0)})`);
        if (st.jump >= 1 && !this.slept) {
          this.slept = true;
          this.setMongsil('sleep');
          $('s3zzz').setAttribute('x', BX + 90); $('s3zzz').setAttribute('y', this.bedY() - 60);
          $('s3zzz').setAttribute('opacity', 1);
          AudioSys.sHeart();
        }
      }
    },
    arrive(H) {
      st.mode = 'judge';
      const target = C.targets[st.round];
      const okHeight = H <= C.maxKm && Math.abs(H - target) <= C.tolKm;
      if (H <= C.maxKm) {
        const y = GY - H * PX;
        $('s3cloud').innerHTML = `<g transform="translate(${BX},${y})">${cloudPuffsSVG(250, 36)}</g>`;
        $('s3cloud').setAttribute('opacity', 1);
        $('s3cloudLab').textContent = `구름 바닥 ${fmt2(H)} km`;
        $('s3cloudLab').setAttribute('y', y - 44);
        $('s3cloudLab').setAttribute('opacity', 1);
        $('s3pcl').setAttribute('opacity', 0);
        AudioSys.sCondense();
      }
      setTimeout(() => {
        if (okHeight) this.success();
        else {
          if (H > C.maxKm) flub(2, '공기가 너무 건조해서 하늘 끝까지 구름이 안 생겼어!');
          else flub(2, `구름이 ${fmt2(H)} km에 생겼네. 주문은 ${target.toFixed(1)} km! ${H > target ? '조금 낮게' : '조금 높게'} 만들어 보자.`);
          this.setMongsil('puzzled');
          setTimeout(() => {
            $('s3cloud').setAttribute('opacity', 0);
            $('s3cloudLab').setAttribute('opacity', 0);
            $('s3pcl').setAttribute('opacity', 1);
            st.mode = 'idle'; $('s3go').disabled = false;
            this.setMongsil('normal');
          }, 900);
        }
      }, 550);
    },
    success() {
      const r = st.round;
      this.slept = false; st.jump = 0;
      $('s3mongsilCloud').setAttribute('opacity', 0);
      this.setMongsil('wow');
      const p = svgToScreen(this.svg, BX, this.bedY());
      FX.burst(p.x, p.y, '#CBAEE8', 18);
      celebrate(2, r, () => {
        if (r < 2) {
          Dialog.run([{ who: 'mongsil', face: 'happy',
            text: r === 0 ? '냐아~ 폭신폭신 완벽해! …그런데 <b>더 높은 곳</b> 침대도 부탁할게. 경치가 좋거든!'
                          : '몽실몽실 최고야! 마지막으로 <b>중간 높이</b> 침대 하나만 더~' }],
            () => this.startRound(r + 1));
        } else {
          Dialog.run([
            { who: 'mongsil', face: 'sleep', text: '쿨쿨… 냐암… (구름 침대에서 세상에서 제일 행복한 얼굴로 잠들었다)' },
            { who: 'mungge', face: 'happy', text: '<span class="kw">T와 Td의 차이 × ⅛ = 구름의 높이</span>. 이제 구름이 어디 생길지 예언할 수 있겠지?' },
          ], () => stageComplete(2));
        }
      });
    },
  };
};

/* ============================================================
   S4 — 도토리의 바람 배달 (푄: 산 넘기 드래그 + 주문 역산)
   ============================================================ */
STAGE_BUILDERS[3] = function () {
  const C = TUNING.s4;
  const GY = 600, PX = 145;
  const XL = 250, XP = 640, XR = 1030;    // 산자락·정상·산자락 x
  const X0 = 150, XD = 1150;              // 출발·배달 완료 x
  const st = { T: C.T.init, Td: C.Td.init, mtn: C.mtn.init,
               x: X0, targetX: X0, held: false, locked: true,
               passedPeak: false, condensed: false, top: null, order: 0, delivered: false };
  const HINTS = [
    ['산을 넘은 바람은 <b>더 따뜻해져</b>! 오를 땐 응결 후 −5 ℃/km로 천천히 식고, 내릴 땐 +10 ℃/km로 데워지니까.',
     '예를 들어 기온 20 ℃ · 이슬점 14 ℃ · 산 2 km면… 도착 온도가 <b>26.25 ℃</b>가 돼!'],
    ['비(구름)는 <b>응결 고도 H</b>부터 생겨. H가 산꼭대기보다 높으면 비가 안 와!',
     '<b>H = ⅛(T−Td) ≥ 산 높이</b>로! T−Td를 크게 벌리거나, 산을 낮게 해 봐.'],
    ['도착 온도가 올라가는 양은 <b>(산 높이 − H)</b>에 비례해. H가 낮을수록, 산이 높을수록 뜨겁고 건조!',
     '산 높이 <b>3 km</b> + 이슬점을 <b>기온 − 1 ℃</b>로! H가 최소가 되어 가장 뜨겁고 건조한 바람이 돼.'],
  ];
  const ORDERS = [
    `친척집에 딱 <b>26 ℃</b> 바람 배달! (±0.5 ℃)`,
    `이번엔 <b>비를 한 방울도 안 뿌리고</b> 넘어와 줘!`,
    `<b>가장 뜨겁고 건조한</b> 바람으로 부탁해! (산 최대 + Td = T−1)`,
  ];
  const terrainAlt = x => {
    if (x <= XL || x >= XR) return 0;
    return x < XP ? (x - XL) / (XP - XL) * st.mtn : (XR - x) / (XR - XP) * st.mtn;
  };
  return {
    build() {
      $('scene').innerHTML = `
      <svg class="full" id="s4svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="s4sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9CC8EC"/><stop offset=".6" stop-color="#D8EAF8"/><stop offset="1" stop-color="#FBEBD8"/>
        </linearGradient></defs>
        <rect width="1280" height="720" fill="url(#s4sky)"/>
        <path d="M0 ${GY} H1280 V720 H0 Z" fill="#C2E0BC"/>
        <line id="s4Hline" x1="60" x2="1220" stroke="#8FB8DC" stroke-width="2.5" stroke-dasharray="8 7"/>
        <text id="s4Hlab" x="66" font-size="14" fill="#6E86B8" font-family="Jua"></text>
        <g id="s4mtn"></g>
        <g transform="translate(120,${GY})">
          <rect x="-34" y="-52" width="68" height="52" rx="10" fill="#FBDBB4" stroke="#E8B478" stroke-width="3"/>
          <path d="M-40 -48 L0 -82 L40 -48 Z" fill="#E8B478" stroke="#D09850" stroke-width="3" stroke-linejoin="round"/>
          <text x="0" y="22" text-anchor="middle" font-size="14" fill="#8A6A52" font-family="Jua">출발 마을</text>
        </g>
        <g transform="translate(1160,${GY})">
          <rect x="-36" y="-56" width="72" height="56" rx="10" fill="#F5D9B8" stroke="#DBAE78" stroke-width="3"/>
          <path d="M-42 -52 L0 -88 L42 -52 Z" fill="#DBAE78" stroke="#C09456" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="0" cy="-30" r="9" fill="#FFFDF6" stroke="#DBAE78" stroke-width="2.5"/>
          <text x="0" y="22" text-anchor="middle" font-size="14" fill="#8A6A52" font-family="Jua">친척집</text>
        </g>
        <g id="s4rain" opacity="0">${[0,1,2,3,4,5].map(i =>
          `<line x1="${-30 + i * 12}" y1="${i % 2 * 14}" x2="${-36 + i * 12}" y2="${26 + i % 2 * 14}" stroke="#7EB2E4" stroke-width="3.4" stroke-linecap="round"/>`).join('')}</g>
        <g id="s4cloud" opacity="0">${cloudPuffsSVG(120, 26)}</g>
        <g id="s4pcl">${parcelSVG('s4pclInner')}</g>
        <g id="s4dotori" transform="translate(1075,${GY - 46})"></g>
        <text id="s4tip" x="${X0}" y="${GY - 120}" text-anchor="middle" font-size="18" fill="#7FA8C8" font-family="Jua" class="bob" style="transform-box:fill-box">◀ 잡고 산 너머로! ▶</text>
      </svg>
      <div class="orderCard" style="left:14px;top:76px">
        <div class="oTag" id="s4OrderTag">주문서 1 / 3</div>
        <div class="oTxt" id="s4Order"></div>
      </div>
      <div class="ctrl" style="left:50%;transform:translateX(-50%);bottom:14px;width:min(430px,46vw)">
        <div class="row"><label>출발 기온</label>
          <input type="range" id="s4T" min="${C.T.min}" max="${C.T.max}" step="1" value="${st.T}">
          <span class="sVal tCol" id="s4Tv">${st.T} ℃</span></div>
        <div class="row"><label>출발 이슬점</label>
          <input type="range" id="s4Td" class="td" min="${C.Td.min}" max="${C.Td.max}" step="1" value="${st.Td}">
          <span class="sVal tdCol" id="s4Tdv">${st.Td} ℃</span></div>
        <div class="row"><label>산 높이</label>
          <input type="range" id="s4M" class="gm" min="${C.mtn.min}" max="${C.mtn.max}" step="${C.mtn.step}" value="${st.mtn}">
          <span class="sVal gCol" id="s4Mv">${st.mtn.toFixed(1)} km</span></div>
        <div class="row" style="justify-content:center">
          <button class="chip" id="s4reset">↺ 출발점으로</button></div>
      </div>`;
      this.svg = $('s4svg');
      this.setDotori('normal');
      const upd = () => {
        st.T = +$('s4T').value;
        st.Td = Math.min(+$('s4Td').value, st.T - 1);
        if (+$('s4Td').value > st.T - 1) $('s4Td').value = st.Td;
        st.mtn = +$('s4M').value;
        $('s4Tv').textContent = `${st.T} ℃`; $('s4Tdv').textContent = `${st.Td} ℃`;
        $('s4Mv').textContent = `${st.mtn.toFixed(1)} km`;
        this.resetParcel();
        this.drawMtn();
      };
      ['s4T', 's4Td', 's4M'].forEach(id => $(id).addEventListener('input', upd));
      $('s4reset').addEventListener('pointerdown', e => { e.stopPropagation(); AudioSys.sPop(); this.resetParcel(); });
      // 가로 드래그 (산 넘기)
      const moveTo = e => {
        const p = svgPt(this.svg, e);
        let nx = clamp(p.x, X0, XD + 20);
        if (st.passedPeak) nx = Math.max(nx, XP);   // 배달은 앞으로만!
        st.targetX = nx;
      };
      const pcl = $('s4pcl');
      pcl.addEventListener('pointerdown', e => {
        if (G.dialogActive || st.locked) return;
        e.preventDefault(); e.stopPropagation();
        st.held = true; pcl.setPointerCapture(e.pointerId); moveTo(e);
      });
      pcl.addEventListener('pointermove', e => { if (st.held) moveTo(e); });
      pcl.addEventListener('pointerup', () => { st.held = false; });
      pcl.addEventListener('pointercancel', () => { st.held = false; });
      this.drawMtn();
      Dialog.run([
        { who: 'dotori', face: 'happy', text: '어서 와! 하늘마을 배달부 도토리야. 오늘은 <b>바람 배달</b> 주문이 밀렸어~' },
        { who: 'dotori', face: 'normal', text: '산 너머 친척집까지 공기를 배달해 줘! 주문서 조건이 좀 까다로울 거야.' },
        { who: 'mungge', face: 'normal', text: '산을 오를 땐 <span class="kw">응결되면 −5 ℃/km</span>, 내려갈 땐 <span class="kw">+10 ℃/km</span>. 그래서 산을 넘으면 바람의 성격이 변해!' },
      ], () => this.startOrder(0));
    },
    setDotori(face) { $('s4dotori').innerHTML = charNested('dotori', face, -64, -70, 128, 136); },
    drawMtn() {
      const py = GY - st.mtn * PX;
      $('s4mtn').innerHTML = `
        <path d="M${XL} ${GY} L${XP} ${py} L${XR} ${GY} Z" fill="#B8D0E8" stroke="#9CB8D8" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M${XP - 62} ${py + 62 * st.mtn * PX / (XP - XL)} L${XP} ${py} L${XP + 62} ${py + 62 * st.mtn * PX / (XR - XP)} L${XP + 30} ${py + 34} Q${XP} ${py + 20} ${XP - 30} ${py + 34} Z" fill="#FFF" opacity=".9"/>
        <text x="${XP}" y="${py - 16}" text-anchor="middle" font-size="15" fill="#7A94B8" font-family="Jua">${st.mtn.toFixed(1)} km</text>`;
      const H = lclHeight(st.T, st.Td);
      const hl = $('s4Hline'), hlab = $('s4Hlab');
      if (H <= 3.5) {
        const y = GY - H * PX;
        hl.setAttribute('y1', y); hl.setAttribute('y2', y); hl.setAttribute('opacity', 1);
        hlab.setAttribute('y', y - 7); hlab.setAttribute('opacity', 1);
        hlab.textContent = `응결 고도 H = ${fmt2(H)} km ${H >= st.mtn ? '(산보다 높음 → 비 없음!)' : ''}`;
      } else { hl.setAttribute('opacity', 0); hlab.setAttribute('opacity', 0); }
    },
    resetParcel() {
      st.x = st.targetX = X0; st.passedPeak = false; st.condensed = false;
      st.top = null; st.delivered = false; st.held = false;
    },
    startOrder(k) {
      st.order = k;
      setMission(k, HINTS[k]);
      $('s4OrderTag').textContent = `주문서 ${k + 1} / 3`;
      $('s4Order').innerHTML = ORDERS[k];
      st.locked = false;
      this.resetParcel();
    },
    // 현재 위치의 공기 상태
    airState() {
      const alt = terrainAlt(st.x);
      if (!st.passedPeak) return Object.assign({ alt }, riseState(st.T, st.Td, alt));
      const d = descendFrom(st.top.T, st.top.Td, st.mtn, alt);
      return { alt, T: d.T, Td: d.Td, saturated: false };
    },
    tick(dt) {
      st.x += (st.targetX - st.x) * Math.min(1, dt * 8);
      if (!st.passedPeak && st.x >= XP - 1) {
        st.passedPeak = true;
        st.top = riseState(st.T, st.Td, st.mtn);
        AudioSys.sWhoosh();
      }
      const s = this.airState();
      if (s.saturated) st.condensed = true;
      setMeters(s.alt, s.T, s.Td);
      const y = GY - s.alt * PX - 42;
      const g = $('s4pcl'); if (!g) return;
      g.setAttribute('transform', `translate(${st.x.toFixed(0)},${y.toFixed(0)}) scale(${(1 + 0.12 * s.alt).toFixed(3)})`);
      $('s4tip').style.opacity = st.x > X0 + 60 ? 0 : 1;
      // 구름 + 비 연출 (풍상측 포화 구간)
      const cloudy = !st.passedPeak && s.saturated;
      $('s4cloud').setAttribute('opacity', cloudy ? 1 : 0);
      $('s4rain').setAttribute('opacity', cloudy ? 1 : 0);
      if (cloudy) {
        $('s4cloud').setAttribute('transform', `translate(${st.x.toFixed(0)},${(y - 54).toFixed(0)})`);
        $('s4rain').setAttribute('transform', `translate(${st.x.toFixed(0)},${(y + 40).toFixed(0)})`);
        if (Math.random() < dt * 2.2) AudioSys.sRain();
      }
      // 배달 완료 판정
      if (!st.delivered && !st.locked && st.x >= XD - 6 && s.alt < 0.02 && !G.dialogActive) {
        st.delivered = true; st.locked = true; st.held = false;
        this.judge(s);
      }
    },
    judge(s) {
      const k = st.order;
      let ok = false, failMsg = '';
      if (k === 0) {
        ok = Math.abs(s.T - C.o1Target) <= C.o1Tol;
        failMsg = `도착 온도 <b>${fmt1(s.T)} ℃</b>… 주문은 26 ℃(±0.5)! 출발 조건을 바꿔서 다시~`;
      } else if (k === 1) {
        ok = !st.condensed;
        failMsg = st.condensed ? '앗, 산을 오르다 비가 주룩주룩 왔어! 응결 고도를 산보다 높게 만들어 봐.'
                               : '';
      } else {
        ok = st.mtn >= C.o3Mtn - 0.01 && (st.T - st.Td) <= C.o3Gap + 0.01 && st.condensed;
        failMsg = `더 뜨겁고 건조하게! 도착 ${fmt1(s.T)} ℃로는 부족해~ 산을 더 높이, 이슬점은 기온 바로 아래로!`;
      }
      if (ok) {
        this.setDotori('wow');
        const p = svgToScreen(this.svg, 1160, GY - 80);
        FX.burst(p.x, p.y, '#F7C154', 18);
        AudioSys.sStamp();
        celebrate(3, k, () => {
          if (k < 2) {
            Dialog.run([{ who: 'dotori', face: 'happy',
              text: k === 0 ? '도장 쾅! 소포를 열어 보니… 딱 좋은 <b>따끈한 바람</b>! 친척이 기뻐하겠다~ 다음 주문!'
                            : '도장 쾅쾅! 뽀송뽀송하게 도착했어. <b>구름 한 점 없이!</b> 자, 마지막 주문은 좀 어려워~' }],
              () => this.startOrder(k + 1));
          } else {
            Dialog.run([
              { who: 'dotori', face: 'wow', text: '도장 쾅쾅쾅!! 후끈후끈 바싹바싹… 이게 바로 전설의 <b>높새바람</b>이구나!' },
              { who: 'mungge', face: 'proud', text: '산을 넘은 바람이 뜨겁고 건조해지는 것, 이게 <span class="kw">푄 현상</span>이야. 배달 완벽했어!' },
            ], () => stageComplete(3));
          }
        });
      } else {
        this.setDotori('puzzled');
        flub(3, failMsg);
        setTimeout(() => { this.resetParcel(); st.locked = false; this.setDotori('normal'); }, 1100);
      }
    },
  };
};
</script>
<script>
'use strict';
/* ============================================================
   S5 — 부엉이 박사의 하늘 감정사 시험 (대기 안정도 · 부력)
   ============================================================ */
STAGE_BUILDERS[4] = function () {
  const C = TUNING.s5;
  const GY = 600, TOPY = 96, PX = (GY - TOPY) / C.topKm, X = 560;
  const H = lclHeight(C.T0, C.Td0);  // 1.0 km
  const st = { gamma: 8, mode: 'idle', alt: 0, v: 0, target: 0, freeT: 0,
               condensed: false, lastPush: 0, exam: 0, streak: 0, skyPlan: [], busy: false, lockG: true };
  const HINTS = [
    ['공기를 살짝 찔러 보고 <b>되돌아오는지, 계속 오르는지</b> 관찰해 봐!',
     '숫자만 봐도 알 수 있어~ <b>γ<5 절대 안정 · γ>10 절대 불안정 · 그 사이 조건부</b>!'],
    ['층운은 <b>안정한 하늘 + 강제 상승</b>에서 생겨. γ를 5보다 작게 해 보자!',
     'γ를 <b>5 미만</b>으로 두고 <b>세게 밀어올리기</b>! 응결된 채 되돌아와 옆으로 퍼지면 층운이야.'],
    ['조건부 불안정(5~10)은 <b>세게 밀어주면</b> 어느 높이부터 스스로 올라가!',
     'γ를 <b>8~10</b>으로 두고 세게 밀어올려 봐. 2 km에서 덩어리가 주위보다 따뜻해지면 자유 상승!'],
  ];
  return {
    build() {
      $('scene').innerHTML = `
      <svg class="full" id="s5svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="s5sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8FB4E0"/><stop offset=".55" stop-color="#CFE2F4"/><stop offset="1" stop-color="#F2E9DC"/>
        </linearGradient></defs>
        <rect width="1280" height="720" fill="url(#s5sky)"/>
        ${rulerSVG(150, GY, PX, 3)}
        ${[0, 1, 2, 3].map(k => `<g transform="translate(238,${GY - k * PX})">
          <rect x="-46" y="-15" width="92" height="30" rx="14" fill="rgba(255,251,243,.85)" stroke="#E9CDB4" stroke-width="2"/>
          <text id="s5e${k}" y="6" text-anchor="middle" font-size="15.5" fill="#7A6152" font-family="Jua"></text></g>`).join('')}
        <text x="238" y="${GY - 3 * PX - 28}" text-anchor="middle" font-size="14" fill="#8898B8" font-family="Jua">주위(환경) 기온</text>
        <line x1="300" y1="${GY - H * PX}" x2="1240" y2="${GY - H * PX}" stroke="#8FB8DC" stroke-width="2.5" stroke-dasharray="8 7" opacity=".7"/>
        <text x="1234" y="${GY - H * PX - 7}" text-anchor="end" font-size="14" fill="#6E86B8" font-family="Jua">응결 고도 1 km</text>
        <path d="M0 ${GY + 2} Q320 ${GY - 18} 640 ${GY + 4} Q960 ${GY + 22} 1280 ${GY - 2} L1280 720 L0 720 Z" fill="#C8D8E8"/>
        <g id="s5cloudS" opacity="0"></g>
        <g id="s5cloudC" opacity="0"></g>
        <g id="s5pcl" transform="translate(${X},${GY - 42})">${parcelSVG('s5pclInner')}</g>
        <g id="s5baksa" transform="translate(1080,${GY - 52})"></g>
      </svg>
      <div class="orderCard" style="left:14px;top:76px;max-width:390px">
        <div class="oTag" id="s5Tag">시험 1 / 3 — 감정 시험</div>
        <div class="oTxt" id="s5Order"></div>
      </div>
      <div class="ctrl" style="left:14px;bottom:14px;width:min(430px,48vw)">
        <div class="row"><label>기온 감률 γ</label>
          <input type="range" id="s5g" class="gm" min="3" max="12" step="0.1" value="8">
          <span class="sVal gCol" id="s5gv">8.0 ℃/km</span></div>
        <div class="row">
          <button class="chip" data-g="4">안정 4</button>
          <button class="chip" data-g="8">중간 8</button>
          <button class="chip" data-g="12">불안정 12</button>
          <span id="s5stab" style="font-size:14px;color:#9A78C8;margin-left:auto"></span></div>
        <div class="row" style="justify-content:center;gap:12px;margin-top:6px">
          <button class="bigBtn" id="s5poke" style="font-size:17px;padding:9px 16px">쿡 찔러보기 (0.5 km)</button>
          <button class="bigBtn orange" id="s5push" style="font-size:17px;padding:9px 16px">세게 밀어올리기 (2 km)</button></div>
      </div>
      <div class="ctrl" style="right:14px;bottom:14px;pointer-events:none;min-width:250px;text-align:center">
        <div style="font-size:13px;color:#A98D77">덩어리 vs 주위 (같은 높이)</div>
        <div id="s5cmp" style="font-size:19px;color:#5F4B41;margin-top:3px">지표에서 대기 중…</div>
      </div>
      <div id="s5cards" class="vRow" style="position:absolute;left:50%;bottom:170px;transform:translateX(-50%);z-index:22;display:none">
        <button class="vCard" data-v="stable"><span class="vIcon">γ &lt; 5</span>절대 안정</button>
        <button class="vCard" data-v="conditional"><span class="vIcon">5 ~ 10</span>조건부 불안정</button>
        <button class="vCard" data-v="unstable"><span class="vIcon">γ &gt; 10</span>절대 불안정</button>
      </div>`;
      this.svg = $('s5svg');
      this.setBaksa('normal');
      const setG = v => {
        st.gamma = clamp(Math.round(v * 10) / 10, 3, 12);
        $('s5g').value = st.gamma;
        $('s5gv').textContent = `${st.gamma.toFixed(1)} ℃/km`;
        const sName = { stable: '절대 안정', conditional: '조건부 불안정', unstable: '절대 불안정' }[stability(st.gamma)];
        $('s5stab').textContent = st.exam === 0 ? '' : sName;   // 감정 시험 중엔 정답 숨김
        this.envLabels();
      };
      this.setG = setG;
      $('s5g').addEventListener('input', () => { if (!st.lockG) setG(+$('s5g').value); else { $('s5g').value = st.gamma; toast('감정 시험 중엔 하늘(γ)이 정해져 있어!', false, 1400); } });
      document.querySelectorAll('#scene .chip[data-g]').forEach(ch =>
        ch.addEventListener('pointerdown', e => { e.stopPropagation(); if (st.lockG) { toast('감정 시험 중엔 하늘(γ)이 정해져 있어!', false, 1400); return; } AudioSys.sPop(); setG(+ch.dataset.g); }));
      $('s5poke').addEventListener('pointerdown', e => { e.stopPropagation(); this.launch(C.pokeKm); });
      $('s5push').addEventListener('pointerdown', e => { e.stopPropagation(); this.launch(C.pushKm); });
      $('s5cards').querySelectorAll('.vCard').forEach(c =>
        c.addEventListener('pointerdown', e => { e.stopPropagation(); this.verdict(c.dataset.v); }));
      setG(8);
      Dialog.run([
        { who: 'baksa', face: 'normal', text: '홋홋, 잘 왔다. 나는 하늘의 성격을 감정하는 부엉이 박사란다.' },
        { who: 'baksa', face: 'proud', text: '오늘 너에게 <b>하늘 감정사 시험</b>을 보게 해 주지. 시험은 세 과목이야.' },
        { who: 'mungge', face: 'normal', text: '핵심 규칙! 공기 덩어리가 <span class="kw">같은 높이의 주위보다 따뜻하면 스스로 상승</span>, 차가우면 되돌아와!' },
      ], () => this.startExam(0));
    },
    setBaksa(face) { $('s5baksa').innerHTML = charNested('baksa', face, -66, -72, 132, 140); },
    envLabels() { [0, 1, 2, 3].forEach(k => { const el = $('s5e' + k); if (el) el.textContent = `${fmt1(envTemp(C.T0, st.gamma, k))} ℃`; }); },
    startExam(n) {
      st.exam = n;
      setMission(n, HINTS[n]);
      this.clearClouds();
      if (n === 0) {
        st.lockG = true; st.streak = 0;
        st.skyPlan = shuffle(['stable', 'conditional', 'unstable']);
        $('s5Tag').textContent = '시험 1 / 3 — 감정 시험';
        $('s5cards').style.display = 'flex';
        this.nextSky();
      } else {
        st.lockG = false;
        $('s5cards').style.display = 'none';
        $('s5Tag').textContent = n === 1 ? '시험 2 / 3 — 설계 시험' : '시험 3 / 3 — 비전(祕傳) 시험';
        $('s5Order').innerHTML = n === 1
          ? 'γ를 조절해 <b>층운형 구름이 생기는 하늘</b>을 만들어 보렴. (만들고 세게 밀어올리기!)'
          : '<b>조건부 불안정</b> 하늘에서 <b>적운</b>을 피워 보렴. (세게 밀어 자유 상승!)';
        this.setG(st.gamma);
      }
    },
    nextSky() {
      const cat = st.skyPlan[st.streak % 3];
      this.setG(pick(C.pools[cat]));
      $('s5Order').innerHTML = `오늘의 하늘 <b>#${st.streak + 1}</b> — γ = <b>${st.gamma.toFixed(1)} ℃/km</b>. 찔러 보고 판정패를 골라라! (연속 ${st.streak}/3)`;
      this.clearClouds();
    },
    launch(h) {
      if (G.dialogActive || st.busy) return;
      AudioSys.ensure(); AudioSys.sWhoosh();
      st.busy = true; st.mode = 'forced'; st.target = h; st.lastPush = h;
      st.condensed = false; st.freeT = 0;
      this.clearClouds();
    },
    clearClouds() {
      $('s5cloudS').setAttribute('opacity', 0);
      $('s5cloudC').setAttribute('opacity', 0);
    },
    verdict(v) {
      if (G.dialogActive || st.exam !== 0) return;
      AudioSys.sPop();
      if (v === stability(st.gamma)) {
        st.streak++;
        AudioSys.sSparkle();
        if (st.streak >= 3) {
          $('s5cards').style.display = 'none';
          this.setBaksa('wow');
          celebrate(4, 0, () => Dialog.run([
            { who: 'baksa', face: 'happy', text: '3연속 정답! 훌륭한 눈썰미다. 다음은 <b>설계 시험</b>이야.' },
          ], () => this.startExam(1)));
        } else {
          toast(`정답! 다음 하늘 감정 (${st.streak}/3)`, true, 1400);
          this.setBaksa('happy');
          setTimeout(() => { this.setBaksa('normal'); this.nextSky(); }, 700);
        }
      } else {
        st.streak = 0;
        st.skyPlan = shuffle(['stable', 'conditional', 'unstable']);
        this.setBaksa('puzzled');
        flub(4, '갸우뚱… γ 숫자를 5와 10에 견주어 보렴. 처음부터 다시!');
        setTimeout(() => { this.setBaksa('normal'); this.nextSky(); }, 900);
      }
    },
    tick(dt) {
      if (st.mode === 'forced') {
        st.alt = Math.min(st.target, st.alt + dt * 1.9);
        if (st.alt >= st.target - 0.001) { st.mode = 'free'; st.v = 0; st.freeT = 0; }
      } else if (st.mode === 'free') {
        const Tp = riseState(C.T0, C.Td0, st.alt).T;
        const Te = envTemp(C.T0, st.gamma, st.alt);
        st.v += C.buoyK * (Tp - Te) * dt;
        st.v *= Math.pow(C.damp, dt * 60);
        st.alt += st.v * dt;
        st.freeT += dt;
        if (st.alt >= H) st.condensed = true;
        if (st.alt >= C.topKm) { st.alt = C.topKm; st.mode = 'idle'; this.outcome('escape'); }
        else if (st.alt <= 0) {
          st.alt = 0;
          if (Math.abs(st.v) < 0.25) { st.mode = 'idle'; this.outcome('ground'); }
          else { st.v = -st.v * 0.3; AudioSys.sPop(); }
        } else if (st.freeT > 8) { st.mode = 'idle'; this.outcome('mid'); }
      }
      const s = riseState(C.T0, C.Td0, st.alt);
      setMeters(st.alt, s.T, s.Td);
      const g = $('s5pcl'); if (!g) return;
      g.setAttribute('transform', `translate(${X},${GY - 42 - st.alt * PX}) scale(${(1 + 0.13 * st.alt).toFixed(3)})`);
      // 실시간 비교 표시
      const Tp = s.T, Te = envTemp(C.T0, st.gamma, st.alt);
      const d = Tp - Te;
      $('s5cmp').innerHTML = st.alt < 0.03 && st.mode === 'idle'
        ? '지표에서 대기 중…'
        : `<b style="color:#D97F62">${fmt1(Tp)} ℃</b> vs <b style="color:#6E86B8">${fmt1(Te)} ℃</b><br>
           <span style="font-size:15px;color:${d > 0.05 ? '#4E9A6E' : d < -0.05 ? '#7A8AA8' : '#A98D77'}">
           ${d > 0.05 ? '덩어리가 더 따뜻해 → 둥실 상승! ↑' : d < -0.05 ? '덩어리가 더 차가워 → 가라앉음 ↓' : '주위와 비슷해 (중립)'}</span>`;
    },
    outcome(kind) {
      st.busy = false;
      if (kind === 'escape') {
        // 적운 뭉게뭉게
        $('s5cloudC').innerHTML = [0, 1, 2, 3].map(i =>
          `<g transform="translate(${X + (i % 2 ? 26 : -20)},${GY - (H + 0.55 + i * 0.55) * PX})">${cloudPuffsSVG(150 + i * 26, 34 + i * 5)}</g>`).join('');
        $('s5cloudC').setAttribute('opacity', 1);
        AudioSys.sCondense();
        setTimeout(() => { st.alt = 0; st.v = 0; }, 600);
      } else if (kind === 'ground' && st.condensed && st.lastPush >= C.pushKm) {
        // 되돌아오며 응결 → 층운이 옆으로 얇게
        $('s5cloudS').innerHTML = `<g transform="translate(640,${GY - H * PX})">${cloudPuffsSVG(600, 26)}</g>`;
        $('s5cloudS').setAttribute('opacity', 1);
      }
      if (G.dialogActive) return;
      if (st.exam === 1 && st.lastPush >= C.pushKm) {
        if (kind === 'ground' && st.condensed && stability(st.gamma) === 'stable') {
          this.setBaksa('wow');
          celebrate(4, 1, () => Dialog.run([
            { who: 'baksa', face: 'happy', text: '보아라, 얇고 넓게 퍼진 <b>층운</b>! 안정한 하늘은 상승을 눌러 되돌리니 옆으로 퍼질 수밖에. 합격!' },
          ], () => this.startExam(2)));
        } else if (kind === 'escape') {
          flub(4, '뭉게뭉게 위로 솟았네? 그건 적운이야! 층운은 안정(γ<5)한 하늘에서~');
        } else if (kind === 'ground') {
          flub(4, '구름이 만들어졌지만… 이 하늘은 절대 안정이 아니었어. γ를 5보다 작게!');
        }
      } else if (st.exam === 2 && st.lastPush >= C.pushKm) {
        if (kind === 'escape') {
          if (stability(st.gamma) === 'conditional') {
            this.setBaksa('wow');
            celebrate(4, 2, () => Dialog.run([
              { who: 'baksa', face: 'wow', text: '오오… <b>조건부 불안정</b> 하늘에서 한 번의 강한 상승으로 적운을 피워 냈구나. 비전 전수 완료!' },
              { who: 'baksa', face: 'proud', text: '그대를 <b>하늘 감정사</b>로 임명한다! 📜 (자격증 수여) 홋홋, 자랑스럽구나.' },
              { who: 'mungge', face: 'happy', text: '조건부 하늘은 <span class="kw">세게 밀어줘야 본색</span>이 나와. 그래서 「조건부」야!' },
            ], () => stageComplete(4)));
          } else {
            flub(4, '자유 상승은 성공! 하지만 이 하늘은 절대 불안정(γ>10)이야. 비전은 조건부(5~10)에서!');
          }
        } else if (kind === 'ground') {
          flub(4, '음~ 되돌아와 버렸네. 조건부라도 γ가 작으면 2 km론 부족해. γ를 8~10으로 키워 볼까?');
        }
      }
    },
  };
};

/* ============================================================
   S6 — 뭉뭉이의 잔치 준비 (γ·T·Td 종합 — 구름 주문 제작)
   ============================================================ */
STAGE_BUILDERS[5] = function () {
  const C = TUNING.s6;
  const GY = 592, TOPY = 96, PX = (GY - TOPY) / 3.2, X = 520;
  const st = { g: C.g.init, T: C.T.init, Td: C.Td.init, mode: 'idle', alt: 0, order: 0, drift: -1 };
  const ORDERS = [
    '주문 ① 얇고 넓은 <b>층운 카펫</b> 부탁!',
    '주문 ② 크고 몽실한 <b>적운 풍선</b>!',
    '주문 ③ (특급) 정확히 <b>2 km 높이에 적운</b>! (구름 바닥 2±0.1 km)',
  ];
  const HINTS = [
    ['S5에서 배운 것! 층운 = <b>안정한 하늘(γ<5) + 강제 상승 + 응결</b>.',
     'γ를 <b>5 미만</b>으로, 그리고 응결되도록 T−Td를 작게(24 미만)! 버튼을 누르면 공기가 밀려 올라가.'],
    ['적운 = 밀어 올린 덩어리가 <b>주위보다 따뜻해져 스스로 오르는</b> 하늘!',
     'γ를 크게! <b>10 초과</b>면 확실해. 응결도 되어야 하니 T−Td는 작게~'],
    ['구름 바닥 높이는 H = ⅛(T−Td). 2 km가 되려면?',
     '<b>T−Td = 16</b> (예: 30 ℃/14 ℃)! 그리고 적운이 되려면 γ를 <b>9 이상</b>으로 크게!'],
  ];
  return {
    build() {
      $('scene').innerHTML = `
      <svg class="full" id="s6svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="s6sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#A2C4E8"/><stop offset=".55" stop-color="#DDEBF8"/><stop offset="1" stop-color="#FDEAD4"/>
        </linearGradient></defs>
        <rect width="1280" height="720" fill="url(#s6sky)"/>
        ${rulerSVG(150, GY, PX, 3)}
        <line id="s6Hline" x1="220" x2="1240" stroke="#8FB8DC" stroke-width="2.5" stroke-dasharray="8 7"/>
        <text id="s6Hlab" x="1234" text-anchor="end" font-size="14" fill="#6E86B8" font-family="Jua"></text>
        <path d="M0 ${GY} Q320 ${GY - 22} 640 ${GY + 2} Q960 ${GY + 24} 1280 ${GY - 4} L1280 720 L0 720 Z" fill="#C2E0BC"/>
        <g transform="translate(1020,${GY - 130})">${[0, 1, 2, 3, 4].map(i =>
          `<path d="M${i * 44 - 88} 0 L${i * 44 - 72} 0 L${i * 44 - 80} 14 Z" fill="${['#F8A8B8', '#F7C154', '#9FD6B4', '#A8C8F0', '#CBAEE8'][i]}"/>`).join('')}
          <path d="M-90 0 H90" stroke="#C8B8A8" stroke-width="2.5"/></g>
        <g transform="translate(1140,${GY})">
          <rect x="-52" y="-30" width="104" height="30" rx="8" fill="#E8CBA8" stroke="#C8A478" stroke-width="3"/>
          <rect x="-58" y="-36" width="116" height="10" rx="5" fill="#F5DEBE" stroke="#C8A478" stroke-width="2.5"/>
          <text x="0" y="20" text-anchor="middle" font-size="14" fill="#8A6A52" font-family="Jua">잔치 준비 테이블</text></g>
        <g id="s6deco"></g>
        <g id="s6cloud" opacity="0"></g>
        <g id="s6pcl" transform="translate(${X},${GY - 42})">${parcelSVG('s6pclInner')}</g>
        <g id="s6mung" transform="translate(1010,${GY - 52})"></g>
      </svg>
      <div class="orderCard" style="left:14px;top:76px;max-width:400px">
        <div class="oTag" id="s6Tag">잔치 주문서 1 / 3</div>
        <div class="oTxt" id="s6Order"></div>
      </div>
      <div class="ctrl" style="left:14px;bottom:14px;width:min(420px,48vw)">
        <div class="row"><label>기온 감률 γ</label>
          <input type="range" id="s6g" class="gm" min="${C.g.min}" max="${C.g.max}" step="0.5" value="${st.g}">
          <span class="sVal gCol" id="s6gv">${st.g.toFixed(1)} ℃/km</span></div>
        <div class="row"><label>지표 기온</label>
          <input type="range" id="s6T" min="${C.T.min}" max="${C.T.max}" step="1" value="${st.T}">
          <span class="sVal tCol" id="s6Tv">${st.T} ℃</span></div>
        <div class="row"><label>지표 이슬점</label>
          <input type="range" id="s6Td" class="td" min="${C.Td.min}" max="${C.Td.max}" step="1" value="${st.Td}">
          <span class="sVal tdCol" id="s6Tdv">${st.Td} ℃</span></div>
        <div class="row" style="justify-content:center;margin-top:6px">
          <button class="bigBtn" id="s6go">구름 만들기! (3 km까지 밀어올리기)</button></div>
      </div>`;
      this.svg = $('s6svg');
      this.setMung('normal');
      const upd = () => {
        st.g = +$('s6g').value;
        st.T = +$('s6T').value;
        st.Td = Math.min(+$('s6Td').value, st.T);
        if (+$('s6Td').value > st.T) $('s6Td').value = st.T;
        $('s6gv').textContent = `${st.g.toFixed(1)} ℃/km`;
        $('s6Tv').textContent = `${st.T} ℃`; $('s6Tdv').textContent = `${st.Td} ℃`;
        const Hn = lclHeight(st.T, st.Td);
        const hl = $('s6Hline'), hlab = $('s6Hlab');
        if (Hn <= 3.3) {
          const y = GY - Hn * PX;
          hl.setAttribute('y1', y); hl.setAttribute('y2', y); hl.setAttribute('opacity', 1);
          hlab.setAttribute('y', y - 7); hlab.setAttribute('opacity', 1);
          hlab.textContent = `응결 고도 H = ${fmt2(Hn)} km`;
        } else { hl.setAttribute('opacity', 0); hlab.setAttribute('opacity', 0); }
        setMeters(0, st.T, st.Td);
      };
      ['s6g', 's6T', 's6Td'].forEach(id => $(id).addEventListener('input', upd));
      $('s6go').addEventListener('pointerdown', e => {
        e.stopPropagation();
        if (G.dialogActive || st.mode !== 'idle') return;
        AudioSys.ensure(); AudioSys.sWhoosh();
        st.mode = 'rise'; st.alt = 0; st.drift = -1;
        $('s6go').disabled = true;
        $('s6cloud').setAttribute('opacity', 0);
      });
      upd();
      Dialog.run([
        { who: 'mungmung', face: 'happy', text: '어서 와~! 드디어 <b>마을 대잔치</b> 날이야. 나는 잔치 준비 담당 뭉뭉이!' },
        { who: 'mungmung', face: 'normal', text: '잔치에 쓸 <b>구름 장식</b> 주문이 밀려 있어. 너 구름 만들 줄 안다며? 부탁해도 될까?' },
        { who: 'mungge', face: 'proud', text: '지금까지 배운 <span class="kw">γ · T · Td</span>를 몽땅 조합하는 마지막 의뢰야! 화이팅!' },
      ], () => this.startOrder(0));
    },
    setMung(face) { $('s6mung').innerHTML = charNested('mungmung', face, -66, -72, 132, 140); },
    startOrder(k) {
      st.order = k;
      setMission(k, HINTS[k]);
      $('s6Tag').textContent = `잔치 주문서 ${k + 1} / 3`;
      $('s6Order').innerHTML = ORDERS[k];
      $('s6go').disabled = false;
      st.mode = 'idle';
    },
    tick(dt) {
      const Hn = lclHeight(st.T, st.Td);
      if (st.mode === 'rise') {
        st.alt += dt * 1.5;
        const stopAt = Math.min(Math.max(Hn, 0.15), C.pushKm + 0.05);
        const s = riseState(st.T, st.Td, Math.min(st.alt, C.pushKm));
        setMeters(Math.min(st.alt, C.pushKm), s.T, s.Td);
        if (st.alt >= (Hn > C.pushKm ? C.pushKm : stopAt)) { st.alt = Math.min(stopAt, C.pushKm); this.formCloud(Hn); }
      } else if (st.mode === 'idle') {
        st.alt = Math.max(0, st.alt - dt * 2.4);
      }
      const g = $('s6pcl'); if (!g) return;
      g.setAttribute('transform', `translate(${X},${GY - 42 - st.alt * PX}) scale(${(1 + 0.13 * st.alt).toFixed(3)})`);
      // 성공한 구름이 잔치 테이블로 스르륵
      if (st.drift >= 0) {
        st.drift = Math.min(1, st.drift + dt * 0.7);
        const cx = lerp(X, 1010, st.drift), cy = lerp(0, 90, st.drift * st.drift);
        $('s6cloud').setAttribute('transform', `translate(${(cx - X).toFixed(0)},${cy.toFixed(0)}) scale(${(1 - st.drift * 0.45).toFixed(2)})`);
      }
    },
    formCloud(Hn) {
      st.mode = 'judge';
      const form = cloudForm(st.T, st.Td, st.g, C.pushKm);
      const y = GY - Math.min(Hn, 3.1) * PX;
      if (form === 'stratus') {
        $('s6cloud').innerHTML = `<g transform="translate(${X},${y})">${cloudPuffsSVG(560, 26)}</g>`;
        $('s6cloud').setAttribute('opacity', 1); AudioSys.sCondense();
      } else if (form === 'cumulus') {
        $('s6cloud').innerHTML = [0, 1, 2, 3].map(i =>
          `<g transform="translate(${X + (i % 2 ? 24 : -18)},${y - i * 0.5 * PX})">${cloudPuffsSVG(140 + i * 24, 32 + i * 5)}</g>`).join('');
        $('s6cloud').setAttribute('opacity', 1); AudioSys.sCondense();
      }
      $('s6cloud').setAttribute('transform', '');
      setTimeout(() => this.judge(form, Hn), 750);
    },
    judge(form, Hn) {
      const k = st.order;
      let ok = false, failMsg = '';
      if (form === 'none') failMsg = '3 km까지 밀었는데 구름이 안 생겼어! T−Td를 줄여서 H를 낮춰 보자.';
      else if (k === 0) { ok = form === 'stratus'; failMsg = '위로 뭉게뭉게? 그건 적운이야! 카펫(층운)은 안정한 하늘(γ<5)에서~'; }
      else if (k === 1) { ok = form === 'cumulus'; failMsg = '옆으로 얇게 퍼졌네. 풍선(적운)은 불안정! γ를 크게 키워 봐.'; }
      else { ok = form === 'cumulus' && Math.abs(Hn - C.targetKm) <= C.tolKm;
             failMsg = form !== 'cumulus' ? '모양은 적운이어야 해! γ를 더 크게~'
                                          : `적운인데 구름 바닥이 ${fmt2(Hn)} km야. 딱 2.0 km가 되게 T−Td를 맞춰 봐!`; }
      if (ok) {
        st.drift = 0;
        this.setMung('wow');
        const p = svgToScreen(this.svg, 1010, GY - 140);
        FX.burst(p.x, p.y, '#A8DEC8', 18);
        // 잔치 장식이 쌓임
        $('s6deco').innerHTML += `<g transform="translate(${960 + k * 70},${GY - 190 - k * 16})">${cloudPuffsSVG(90, 20)}</g>`;
        celebrate(5, k, () => {
          if (k < 2) {
            Dialog.run([{ who: 'mungmung', face: 'happy',
              text: k === 0 ? '와아, 폭신 카펫 완성! 발바닥이 간질간질~ 다음은 <b>적운 풍선</b>이야!'
                            : '몽실몽실 풍선 최고! 마지막은 <b>특급 주문</b>… 실력을 보여 줘!' }],
              () => this.startOrder(k + 1));
          } else {
            Dialog.run([
              { who: 'mungmung', face: 'wow', text: '완벽해!! 장식 전부 완성!! 이제… <b>마을 대잔치</b>를 시작할 시간이야!!' },
            ], () => stageComplete(5));
          }
        });
      } else {
        this.setMung('puzzled');
        flub(5, failMsg);
        setTimeout(() => {
          $('s6cloud').setAttribute('opacity', 0);
          st.mode = 'idle'; $('s6go').disabled = false;
          this.setMung('normal');
        }, 1000);
      }
    },
  };
};

/* ============================================================
   마을 대잔치 엔딩
   ============================================================ */
function showEnding() {
  if (clearedCount() >= 6) grantTitle('마을의 영웅');
  G.run = null; setStageHead(null); hideMeters();
  AudioSys.startBgm('party');
  AudioSys.sFanfare();
  setScene({
    build() {
      const order = ['chorong', 'gasirong', 'mongsil', 'dotori', 'baksa', 'mungmung'];
      $('scene').innerHTML = `
      <svg class="full" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="eSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7FA2D8"/><stop offset=".5" stop-color="#C8A8D8"/><stop offset="1" stop-color="#F8C8A8"/>
        </linearGradient></defs>
        <rect width="1280" height="720" fill="url(#eSky)"/>
        ${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<circle cx="${100 + i * 160}" cy="${70 + (i % 3) * 40}" r="2.5" fill="#FFF" opacity=".8"/>`).join('')}
        <g transform="translate(640,60)">${[0, 1, 2, 3, 4, 5, 6].map(i =>
          `<path d="M${i * 60 - 180} 0 L${i * 60 - 158} 0 L${i * 60 - 169} 18 Z" fill="${['#F8A8B8', '#F7C154', '#9FD6B4', '#A8C8F0', '#CBAEE8', '#F0A97E', '#F8A8B8'][i]}"/>`).join('')}
          <path d="M-182 0 H182" stroke="#FFF" stroke-width="3"/></g>
        <path d="M0 600 Q320 570 640 596 Q960 620 1280 590 L1280 720 L0 720 Z" fill="#B7E3C8"/>
        ${order.map((id, i) => `<g transform="translate(${180 + i * 185},${560 - (i % 2) * 26})"><g class="${i % 2 ? 'bob2' : 'bob'}">
          ${charSVG(id, 'happy', { attrs: `x="-62" y="-66" width="124" height="132"` })}</g></g>`).join('')}
        <g transform="translate(640,300) scale(1.1)"><g class="bob">${charSVG('mungge', 'happy', { attrs: `x="-62" y="-66" width="124" height="132"` })}</g></g>
      </svg>`;
      this.fw = 0.3; this.panelT = 2.2; this.shown = false;
    },
    tick(dt) {
      this.fw -= dt;
      if (this.fw <= 0) {
        this.fw = 0.9 + Math.random() * 0.8;
        FX.firework(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * (0.1 + Math.random() * 0.3));
        FX.confetti(innerWidth * Math.random(), -10, 16);
      }
      this.panelT -= dt;
      if (this.panelT <= 0 && !this.shown) {
        this.shown = true;
        const titles = G.titles.length
          ? G.titles.map(t => `<span class="titleChip">🏅 ${t}</span>`).join('')
          : '<span style="font-size:14px;color:#A98D77">획득한 칭호가 없어요</span>';
        const heartsTotal = G.aff.reduce((a, b) => a + b, 0);
        showOverlay(`<div class="panel gold" style="max-width:640px">
          <h1 style="font-size:clamp(26px,5.6vh,40px)">🎊 마을 대잔치 🎊</h1>
          <p>여섯 친구의 고민이 모두 해결됐어요!<br>
          <b>공기를 다루는 기술</b>을 가진 당신은 이제 하늘마을의 자랑!</p>
          <div style="margin:10px 0 4px;font-size:16px;color:#8A6A52">
            ${pawIcon()} 스탬프 <b style="color:#D9784F">${stampCount()}/${TOTAL_STAMPS}</b> ·
            💗 하트 <b style="color:#D96A6A">${fmt1(heartsTotal)}</b> ·
            🔥 최고 콤보 <b style="color:#E8A24E">${G.bestCombo}</b></div>
          <div style="margin:6px 0">${titles}</div>
          <p style="font-size:13.5px;color:#A98D77;margin-top:6px">뭉게: "언제든 또 놀러 와~ 하늘은 매일 성격이 바뀌니까!"</p>
          <button class="btn mint" id="endMap">마을 구경하기</button>
          <button class="btn sub" id="endRetry">처음부터 다시</button>
        </div>`);
        $('endMap').addEventListener('pointerdown', e => { e.stopPropagation(); AudioSys.sPop(); hideOverlay(); showMap(); });
        $('endRetry').addEventListener('pointerdown', e => { e.stopPropagation(); location.reload(); });
      }
    },
  });
  G.screen = 'ending';
}

   부트스트랩

  FX.init();
  updateHud();
  $('dialogWrap').addEventListener('pointerdown', e => { e.stopPropagation(); Dialog.tap(); });
  $('stampBtn').addEventListener('pointerdown', e => { e.stopPropagation(); AudioSys.ensure(); openStampbook(); });
  $('dexBtn').addEventListener('pointerdown', e => { e.stopPropagation(); AudioSys.ensure(); openDex(); });
  $('hintBtn').addEventListener('pointerdown', e => { e.stopPropagation(); onHintTap(); });
  $('muteBtn').addEventListener('pointerdown', e => {
    e.stopPropagation();
    AudioSys.ensure();
    AudioSys.setMuted(!AudioSys.muted);
    $('muteBtn').textContent = AudioSys.muted ? '🔇' : '🔊';
  });
  // 오디오는 첫 터치에서 깨어남 (모바일 자동재생 정책)
  document.body.addEventListener('pointerdown', () => AudioSys.ensure(), { once: true });
  showTitle();
  requestAnimationFrame(mainLoop);
});
</script>
